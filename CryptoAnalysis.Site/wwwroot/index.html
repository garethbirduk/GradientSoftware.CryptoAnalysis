// Candidates, ghosts, future candles, unbroken protective levels, the cursor line and the selected log entry.
function drawReplayExtras(ex, traces, level) {
  const t = ex.cursor, full = ex.hindsight, r = ex.timeline, now = full.prices.t[t];
  // The cursor is a faint dotted line, so the wick of the candle it stands on shows through it.
  const shapes = [{ type: 'line', xref: 'x', yref: 'paper', x0: now, x1: now, y0: 0, y1: 1, layer: 'below',
    line: { color: withAlpha(css('--accent'), 0.6), width: 1, dash: 'dot' } }];
  const box = (start, end, a, b) => ({ x: [start, end, end, start, start], y: [a, a, b, b, a] });

  if (on('future') && t + 1 < full.prices.t.length) {
    const rest = a => a.slice(t + 1, ex.window ? ex.window.to + 1 + (ex.tour ? TOUR_CONTEXT : 0) : undefined), grey = css('--close');
    traces.push({ type: 'candlestick', name: 'Future', x: rest(full.prices.t), open: rest(full.prices.o), high: rest(full.prices.h), low: rest(full.prices.l), close: rest(full.prices.c),
      opacity: 0.3, increasing: { line: { color: grey, width: 1 }, fillcolor: withAlpha(grey, 0.3) }, decreasing: { line: { color: grey, width: 1 }, fillcolor: withAlpha(grey, 0.6) }, hoverinfo: 'skip' });
  }
  if (!r) return shapes;

  if (on('candidates')) {
    for (const c of ex.candidatesByLevel?.[level] ?? []) {
      const color = css(SWINGS[c.direction].color), up = c.direction === 'Up';
      traces.push({ type: 'scatter', mode: 'lines', fill: 'toself', hoveron: 'fills+points', name: 'Candidate swing',
        ...box(c.start.time, now, c.start.price, c.extreme.price), line: { color, width: 1.5, dash: 'dash' }, fillcolor: withAlpha(color, 0.04),
        hovertemplate: `Candidate ${up ? 'upswing' : 'downswing'} · level ${c.level}<br>${up ? 'high' : 'low'} ${fmtPrice(c.start.price)} · ${up ? 'pullback low' : 'bounce high'} so far ${fmtPrice(c.extreme.price)}` +
          `<br>Becomes a swing on a close ${up ? 'above' : 'below'} ${fmtPrice(c.start.price)}<extra></extra>` });
      traces.push({ type: 'scatter', mode: 'lines', name: 'Level to break', x: [c.start.time, now], y: [c.start.price, c.start.price], hoverinfo: 'skip',
        line: { color: TERMS.get(up ? 'BullishBreakOfStructure' : 'BearishBreakOfStructure').color, width: 1.5, dash: 'dot' } });
    }
  }

  // Protective levels that have not broken yet run on to the cursor, at every level selected.
  const levels = selectedLevels(ex);
  for (const [layer, dir, type] of [['msbLevelDown', 'Up', 'BearishMarketStructureBreak'], ['msbLevelUp', 'Down', 'BullishMarketStructureBreak']]) {
    if (!on(layer)) continue;
    for (const l of levels) {
      const latest = (ex.swingsByLevel?.[l] ?? []).filter(w => w.direction === dir)
        .sort((a, b) => a.breakOfStructure.time.localeCompare(b.breakOfStructure.time)).pop();
      if (!latest || (ex.marketStructureBreaksByLevel?.[l] ?? []).some(m => m.reference.time === latest.extreme.time)) continue;
      referenceLines(traces, 'Protective level', TERMS.get(type).color, 'dot',
        [{ from: latest.breakOfStructure, to: { time: now }, level: latest.extreme.price, what: `level ${l} ${dir === 'Up' ? 'pullback low' : 'bounce high'} not broken yet` }]);
    }
  }

  // Each kind of ghost is a layer of its own, so a ghost swing can be shown without the ghost of something else. A ghost
  // is drawn at the levels its kind is: swings, market structure breaks, points and trends at every level selected,
  // candidates at the finest.
  {
    const grey = css('--close'), removed = e => e.ended === 'Removed' && e.until <= t, gone = e => e.value.level === level && removed(e);
    const when = e => fmtTime(full.prices.t[e.until]);
    for (const e of on('ghostSwings') ? r.swings.filter(e => swingLevels(ex).includes(e.value.level) && removed(e)) : []) {
      const w = e.value;
      traces.push({ type: 'scatter', mode: 'lines', fill: 'toself', hoveron: 'fills+points', name: 'Ghost swing', ...box(w.start.time, w.end.time, w.start.price, w.extreme.price),
        line: { color: grey, width: 1, dash: 'dot' }, fillcolor: withAlpha(grey, 0.08),
        hovertemplate: `Ghost: ${w.direction === 'Up' ? 'upswing' : 'downswing'} from ${fmtPrice(w.start.price)}<br>removed ${when(e)}, when a later new high redrew the levels<extra></extra>` });
    }
    for (const e of on('ghostCandidates') ? r.candidates.filter(gone) : []) {
      const c = e.value;
      traces.push({ type: 'scatter', mode: 'lines', name: 'Ghost candidate', ...box(c.start.time, full.prices.t[e.until - 1], c.start.price, c.extreme.price),
        line: { color: grey, width: 1, dash: 'dash' },
        hovertemplate: `Ghost: abandoned candidate ${c.direction === 'Up' ? 'upswing' : 'downswing'} from ${fmtPrice(c.start.price)}<br>gone ${when(e)}<extra></extra>` });
    }
    // A market structure break that left one level is often found at the next: its ghost is then drawn larger, around the
    // one that is there now.
    const msbs = on('ghostMsbs') ? r.marketStructureBreaks.filter(e => levels.includes(e.value.level) && removed(e)) : [];
    const there = new Set(shownMarketStructureBreaks(ex).map(m => `${m.type}|${m.break.time}`));
    if (msbs.length) traces.push({ type: 'scatter', mode: 'markers', name: 'Ghost MSB', x: msbs.map(e => e.value.break.break.time), y: msbs.map(e => e.value.break.break.price),
      marker: { symbol: msbs.map(e => TERMS.get(e.value.break.type).symbol), size: msbs.map(e => there.has(`${e.value.break.type}|${e.value.break.break.time}`) ? 27 : 15),
        color: grey, line: { width: 1.5, color: grey } },
      hovertemplate: msbs.map(e => `Ghost: ${TERMS.get(e.value.break.type).name} · level ${e.value.level}<br>removed ${when(e)}<extra></extra>`) });
    // Where a point was before it moved: the last position each point held before its current one.
    const moved = new Map(), pointKey = v => `${v.level}|${v.kind}|${v.legStart}`;
    for (const e of on('ghostPoints') ? r.points.filter(e => levels.includes(e.value.level) && e.value.type && e.ended === 'Updated' && e.until <= t) : [])
      moved.set(pointKey(e.value), e);
    const current = new Map(r.points.filter(e => levels.includes(e.value.level) && holdsAt(t)(e)).map(e => [pointKey(e.value), e.value]));
    const was = [...moved].filter(([id, e]) => current.get(id) && current.get(id).time !== e.value.time && on(e.value.type)).map(([, e]) => e);
    if (was.length) traces.push({ type: 'scatter', mode: 'markers', name: 'Ghost point', x: was.map(e => e.value.time), y: was.map(e => e.value.price),
      marker: { symbol: was.map(e => TERMS.get(e.value.type).symbol), size: 10, color: withAlpha(grey, 0.35), line: { width: 1, color: grey } },
      hovertemplate: was.map(e => `Ghost: ${e.value.label} was here until ${when(e)}, then moved<extra></extra>`) });
    // A ghost trend sits in its level's row, as a trend of that level and direction does, with the level's stripe faded.
    for (const row of ['Up', 'Down'].flatMap(direction => trendRows(ex, direction))) {
      for (const e of row.ghosts) {
        const until = full.prices.t[e.until - 1];
        if (row.striped) shapes.push(trendStrip(e.value.start.time, until, row.outer, row.edge, withAlpha(levelColor(row.level), 0.45), { width: 0 }));
        shapes.push(trendStrip(e.value.start.time, until, row.edge, row.inner, withAlpha(grey, 0.15), { color: grey, width: 1, dash: 'dot' }));
      }
    }
    // A range that a later new high redrew away: its box in grey, at every level selected.
    for (const e of on('ghostRanges') ? (r.ranges ?? []).filter(e => levels.includes(e.value.level) && removed(e)) : []) {
      const g = e.value, until = g.end?.time ?? full.prices.t[e.until - 1];
      traces.push({ type: 'scatter', mode: 'lines', fill: 'toself', hoveron: 'fills+points', name: 'Ghost range', ...box(g.identified.time, until, g.low.price, g.high.price),
        line: { color: grey, width: 1, dash: 'dot' }, fillcolor: withAlpha(grey, 0.08),
        hovertemplate: `Ghost: range ${fmtPrice(g.low.price)} to ${fmtPrice(g.high.price)} · level ${g.level}<br>removed ${when(e)}, when a later new high redrew the levels<extra></extra>` });
    }
    // With trend arrows on, a ghost trend keeps its arrow too, in grey, at every level selected.
    for (const e of on('ghostTrends') && on('trendArrows') ? r.trends.filter(e => swingLevels(ex).includes(e.value.level) && removed(e)) : []) {
      const v = e.value, tip = v.parts?.[v.parts.length - 1]?.breakOfStructure, up = v.direction === 'Up';
      if (!tip) continue;
      traces.push({ type: 'scatter', mode: 'lines+markers+text', name: 'Ghost trend', x: [v.start.time, tip.time], y: [v.start.price, tip.price],
        line: { color: grey, width: 1.5, dash: 'dot' }, marker: { size: [0, 9], symbol: up ? 'triangle-up' : 'triangle-down', color: grey },
        text: ['', `${v.swings} · ${v.strength}%`], textposition: up ? 'top center' : 'bottom center', textfont: { size: 10, color: grey },
        hovertemplate: `Ghost: ${up ? 'uptrend' : 'downtrend'} of ${v.swings} swings, strength ${v.strength}%<br>removed ${when(e)}<extra></extra>` });
    }
  }

  shapes.push(...selectedEventShapes(ex));
  return shapes;
}

// The clicked log entry: a vertical line at its time, or at both ends of a swing with the swing's box emphasised.
function selectedEventShapes(ex) {
  const event = replayEvents(ex.hindsight, structureLevel(ex)).find(e => e.key === logSelected.get(ex.id) && e.at <= ex.cursor);
  if (!event) return [];
  const accent = css('--accent');
  const line = time => ({ type: 'line', xref: 'x', yref: 'paper', x0: time, x1: time, y0: 0, y1: 1, layer: 'below', line: { color: accent, width: 1.5, dash: 'dot' } });
  return [...event.times.map(line), ...(event.swing ? swingShapes(ex, event.swing) : [])];
}

// Every annotation as it appeared, at a level: what the event log lists and the event buttons jump to. A long replay only
// knows the events of the batches loaded so far; each batch starts a candle early, so what already held there is not new.
function replayEvents(ex, level) {
  if (ex.replay) return timelineEvents(ex, ex.replay, ex.id, level);
  return continuousBatches(ex).flatMap(b => timelineEvents(ex, b.timeline, `${ex.id}#${b.from}`, level).filter(e => e.at >= b.from && e.at < b.to));
}

// The loaded batches that run without a gap up to (and just past) the cursor's, so a jump does not mix in events from far away.
function continuousBatches(ex) {
  const byStart = new Map(loadedBatches(ex).map(b => [b.from, b]));
  const run = [];
  for (let start = batchStart(cursorOf(ex)); byStart.has(start); start -= REMOTE_BATCH) run.unshift(byStart.get(start));
  for (let start = batchStart(cursorOf(ex)) + REMOTE_BATCH; byStart.has(start); start += REMOTE_BATCH) run.push(byStart.get(start));
  return run;
}

const eventCache = new Map();
function timelineEvents(ex, r, cacheId, level) {
  const cacheKey = `${cacheId}|${level}|${runMin('SuccessiveGreenCandles')}|${runMin('SuccessiveRedCandles')}|${setting('Retracement')}`;
  if (eventCache.has(cacheKey)) return eventCache.get(cacheKey);
  const T = i => ex.prices.t[i], out = [];
  const at = lvl => e => e.value.level === lvl;
  const add = (event, entry) => out.push({ ...event, revisedAt: entry?.ended === 'Removed' ? entry.until : null });
  const tag = type => ({ label: TERMS.get(type).label, color: TERMS.get(type).color });
  const swingName = d => d === 'Up' ? 'upswing' : 'downswing';

  // A point appears on the candle that makes it; a higher close moves an HH forward, and a pullback can turn an HL into an LL.
  const previous = new Map();
  for (const e of r.points.filter(at(level))) {
    const p = e.value, id = `${p.kind}|${p.legStart}`, before = e.continued ? previous.get(id) : null;
    previous.set(id, p);
    if (!p.type) continue;
    const name = TERMS.get(p.type).name;
    if (!before) add({ at: e.from, ...tag(p.type), text: `${name} ${fmtPrice(p.price)}`, times: [p.time] }, e);
    else if (before.label !== p.label) add({ at: e.from, ...tag(p.type), text: `${before.label} became ${p.label}: ${fmtPrice(p.price)}`, times: [before.time, p.time] }, e);
    else if (before.time !== p.time) add({ at: e.from, ...tag(p.type), text: `${p.label} moved to ${fmtPrice(p.price)}`, times: [before.time, p.time] }, e);
  }
  for (const e of r.swings.filter(at(level)).filter(e => !e.continued)) {
    const w = e.value, type = w.direction === 'Up' ? 'BullishBreakOfStructure' : 'BearishBreakOfStructure';
    add({ at: e.from, ...tag(type), text: `${swingName(w.direction)} confirmed: close ${fmtPrice(w.breakOfStructure.price)} ${w.direction === 'Up' ? 'above the high' : 'below the low'} ${fmtPrice(w.start.price)}`,
      times: [w.start.time, w.breakOfStructure.time], swing: w }, e);
    if (e.ended === 'Removed')
      add({ at: e.until, label: '✕', color: css('--muted'), removal: true, text: `${swingName(w.direction)} from ${fmtPrice(w.start.price)} removed: a new high redrew the levels`, times: [w.start.time, w.end.time] });
  }
  for (const e of r.candidates.filter(at(level)).filter(e => e.ended === 'Removed')) {
    const c = e.value;
    add({ at: e.until, label: '✕', color: css('--muted'), removal: true, text: `candidate ${swingName(c.direction)} from ${fmtPrice(c.start.price)} abandoned`, times: [c.start.time] });
  }
  for (const e of r.marketStructureBreaks.filter(at(level)).filter(e => !e.continued)) {
    const m = e.value.break, bullish = m.type === 'BullishMarketStructureBreak';
    add({ at: e.from, ...tag(m.type), text: `close ${fmtPrice(m.break.price)} ${bullish ? 'above the protective high' : 'below the protective low'} ${fmtPrice(m.reference.price)}`, times: [m.break.time] }, e);
  }
  for (const e of r.trends.filter(at(level))) {
    const tr = e.value, type = tr.direction === 'Up' ? 'Uptrend' : 'Downtrend', name = TERMS.get(type).name.toLowerCase();
    if (!e.continued) add({ at: e.from, ...tag(type), text: `${name} confirmed at ${fmtPrice(tr.confirmed.price)}`, times: [tr.start.time, tr.confirmed.time] }, e);
    else if (tr.end && tr.end.time === T(e.from)) add({ at: e.from, ...tag(type), text: `${name} ended: a ${tr.direction === 'Up' ? 'downswing' : 'upswing'} broke structure at ${fmtPrice(tr.end.price)}`, times: [tr.start.time, tr.end.time] }, e);
  }
  for (const e of r.candleRuns) {
    const run = e.value, type = run.green ? 'SuccessiveGreenCandles' : 'SuccessiveRedCandles';
    if (run.length >= runMin(type))
      add({ at: e.from, ...tag(type), text: `${run.length} ${run.green ? 'greens' : 'reds'} in a row`, times: [run.start.time, run.end.time] });
  }
  // A retracement is logged on the candle its reading first reaches the setting.
  const min = setting('Retracement');
  for (const e of (r.retracements ?? []).filter(at(level))) {
    const v = e.value, last = v.steps[v.steps.length - 1];
    if (last.point.time === T(e.from) && last.percent >= min && !v.steps.slice(0, -1).some(s => s.percent >= min))
      add({ at: e.from, ...tag('Retracement'), text: `retracement ${last.percent}%: ${fmtPrice(last.point.price)} is ${last.percent}% of the way back from ${fmtPrice(v.to.price)} to ${fmtPrice(v.from.price)}`, times: [v.to.time, last.point.time] }, e);
  }
  for (const e of (r.ranges ?? []).filter(at(level))) {
    const g = e.value;
    if (!e.continued) add({ at: e.from, ...tag('Range'), text: `range out of ${rangeOrigin(g)}: ${fmtPrice(g.low.price)} to ${fmtPrice(g.high.price)}, after a ${g.retracement}% retracement broke structure`, times: [g.identified.time] }, e);
    else if (g.end && g.end.time === T(e.from)) add({ at: e.from, ...tag('Range'), text: `range ended: close ${fmtPrice(g.end.price)} ${g.endedAbove ? 'above' : 'below'} the band`, times: [g.identified.time, g.end.time] }, e);
  }

  out.sort((a, b) => a.at - b.at || (b.removal ? 1 : 0) - (a.removal ? 1 : 0));
  out.forEach((e, i) => e.key = `${e.at}|${i}`);
  eventCache.set(cacheKey, out);
  return out;
}

// The events panel on the right shows the log of the chart last clicked.
function renderEventLog(ex) {
  const list = document.querySelector('#events .eventlog'), heading = document.querySelector('[data-events-for]');
  if (!list || !on('replay') || (ex && ex.id !== activeId)) return;
  if (!hasReplay(ex)) {
    heading.innerHTML = '<div class="hint">Click a chart to show its events.</div>';
    list.innerHTML = '';
    return;
  }
  heading.innerHTML = `<b>${esc(ex.title || ex.id)}</b><div class="hint">Click another chart to show its events.</div>`;
  const t = cursorOf(ex), view = viewFor(ex);
  if (view.loading) { list.innerHTML = '<li class="empty-log">Loading from the local server…</li>'; return; }
  const events = replayEvents(ex, structureLevel(view)).filter(e => e.at <= t).reverse();
  if (!events.length) { list.innerHTML = '<li class="empty-log">Nothing yet at this level. Step forward to see annotations appear.</li>'; return; }
  // Revisions are flagged once they have happened, or straight away when future candles are shown.
  const revised = e => e.revisedAt != null && (e.revisedAt <= t || on('future'));
  list.innerHTML = events.map(e => `<li tabindex="0" data-key="${e.key}" class="${e.at === t ? 'now' : ''} ${e.removal ? 'removal' : ''} ${logSelected.get(ex.id) === e.key ? 'selected' : ''}">
    <span class="tag" style="color:${e.color}">${esc(e.label)}</span>
    <span>${esc(e.text)}${revised(e) ? ` <span class="revised" title="A later new high redrew the levels and removed this">⚑ revised ${esc(fmtTime(ex.prices.t[e.revisedAt]))}</span>` : ''}</span>
    <time>${esc(fmtTime(ex.prices.t[e.at]))}</time></li>`).join('');
  // A long replay's log starts where its loaded run of batches starts, which after a jump is not the dataset's first candle.
  const first = isRemote(ex) ? continuousBatches(ex)[0]?.from : 0;
  if (first > 0) list.insertAdjacentHTML('beforeend', `<li class="empty-log">Earlier events are not loaded: this log starts at ${esc(fmtTime(ex.prices.t[first]))}.</li>`);
}

function selectLogEntry(ex, keyValue) {
  if (logSelected.get(ex.id) === keyValue) logSelected.delete(ex.id); else logSelected.set(ex.id, keyValue);
  redrawExample(ex);
}

function redrawExample(ex) {
  const el = document.querySelector(`.chart[data-id="${CSS.escape(ex.id)}"]`);
  if (el) draw(el, viewFor(ex), focusOf(currentPage));
  renderEventLog(ex);
  if (ex.id === activeId) updateReplayControls();
}

function moveTo(ex, index) {
  if (!ex) return;
  closeCandleCard();
  cursors.set(ex.id, Math.max(0, Math.min(ex.prices.t.length - 1, index)));
  prefetch(ex, cursorOf(ex));
  setActive(ex.id);
  redrawExample(ex);
}

// Finds the next (or previous) event in a long replay, loading batches until one turns up.
async function seekEvent(ex, from, forward) {
  for (let start = batchStart(from), tries = 0; start >= 0 && start < ex.prices.t.length && tries < 20; start += forward ? REMOTE_BATCH : -REMOTE_BATCH, tries++) {
    await fetchBatch(ex, start);
    const candles = eventCandles(ex);
    const at = forward ? candles.find(a => a > from) : candles.filter(a => a < from).pop();
    if (at != null) return moveTo(ex, at);
  }
}

function indexAtOrBefore(ex, ms) {
  let found = 0;
  ex.prices.t.forEach((t, i) => { if (Date.parse(t) <= ms) found = i; });
  return found;
}

function indexAtOrAfter(ex, ms) {
  const i = ex.prices.t.findIndex(t => Date.parse(t) >= ms);
  return i < 0 ? ex.prices.t.length - 1 : i;
}

function eventCandles(ex) {
  return [...new Set(replayEvents(ex, structureLevel(viewFor(ex))).map(e => e.at))].sort((a, b) => a - b);
}

function go(action) {
  const ex = activeExample();
  if (!hasReplay(ex)) return;
  const i = cursorOf(ex), time = Date.parse(ex.prices.t[i]);
  // The replay's controls, back once an analysis has ended, take the cursor from the player.
  if (playerHere(currentPage)) pauseTour();
  if (action !== 'play') stopPlaying();
  switch (action) {
    case 'start': return moveTo(ex, 0);
    case 'end': return moveTo(ex, ex.prices.t.length - 1);
    case '-hour': return moveTo(ex, Math.min(i - 1, indexAtOrBefore(ex, time - HOUR)));
    case '+hour': return moveTo(ex, Math.max(i + 1, indexAtOrAfter(ex, time + HOUR)));
    case '-day': return moveTo(ex, Math.min(i - 1, indexAtOrBefore(ex, time - DAY)));
    case '+day': return moveTo(ex, Math.max(i + 1, indexAtOrAfter(ex, time + DAY)));
    case '-event': {
      const at = eventCandles(ex).filter(a => a < i).pop();
      return at != null ? moveTo(ex, at) : isRemote(ex) && seekEvent(ex, i, false);
    }
    case '+event': {
      const at = eventCandles(ex).find(a => a > i);
      return at != null ? moveTo(ex, at) : isRemote(ex) && seekEvent(ex, i, true);
    }
    case 'play': return player ? stopPlaying() : play(ex);
  }
}

function play(ex) {
  stopPlaying();
  if (cursorOf(ex) >= ex.prices.t.length - 1) moveTo(ex, 0);
  player = { id: ex.id, timer: setInterval(() => {
    const i = cursorOf(ex);
    if (i >= ex.prices.t.length - 1) return stopPlaying();
    // A long replay waits for the next batch rather than stepping into candles it has not loaded.
    if (!timelineAt(ex, i + 1)) return prefetch(ex, i + 1);
    moveTo(ex, i + 1);
  }, 1000 / speed()) };
  updateReplayControls();
}

function stopPlaying() {
  if (!player) return;
  clearInterval(player.timer);
  player = null;
  updateReplayControls();
}

function setActive(id) {
  if (activeId === id) return;
  activeId = id;
  document.querySelectorAll('.example').forEach(a => a.classList.toggle('replay-active', a.querySelector(`.chart[data-id="${CSS.escape(id)}"]`) != null));
  updateReplayControls();
  renderEventLog(activeExample());
}

function replayControls() {
  const button = (action, text, title, extra = '') => `<button type="button" data-go="${action}" title="${title}" aria-label="${title}" ${extra}>${text}</button>`;
  return `<div class="replay-controls" role="group" aria-label="Replay controls">
    <div class="rp-title" data-rp="title"></div>
    <div class="rp-row">${button('start', '⏮', 'Back to start (Home)')}${button('-day', '−1d', 'Back a day (Shift+←)')}${button('-hour', '−1h', 'Back an hour (←)')}${button('play', '▶', 'Play or pause (Space)', 'class="play"')}${button('+hour', '+1h', 'Forward an hour (→)')}${button('+day', '+1d', 'Forward a day (Shift+→)')}${button('end', '⏭', 'To the end (End)')}</div>
    <div class="rp-row">${button('-event', '◀ event', 'Previous event (,)')}${button('+event', 'event ▶', 'Next event (.)')}
      <select data-speed aria-label="Play speed, candles per second">${SPEEDS.map(s => `<option value="${s}" ${s === speed() ? 'selected' : ''}>${s}/s</option>`).join('')}</select></div>
    <input class="scrub" type="range" min="0" max="0" step="1" aria-label="Replay position">
    <label>Jump to <input type="datetime-local" data-jump step="3600"></label>
    <div class="readout" data-rp="readout" aria-live="polite"></div>
    <div class="keys">Keys: ← → hour · Shift day · , . event · Space play</div>
  </div>`;
}

function wireReplayControls(root) {
  const panel = root.querySelector('.replay-controls');
  if (!panel) return;
  panel.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  panel.querySelector('.scrub').addEventListener('input', e => { stopPlaying(); moveTo(activeExample(), Number(e.target.value)); });
  panel.querySelector('[data-jump]').addEventListener('change', e => {
    const ex = activeExample();
    if (!hasReplay(ex) || !e.target.value) return;
    stopPlaying();
    moveTo(ex, indexAtOrBefore(ex, Date.parse(`${e.target.value}:00Z`)));
  });
  panel.querySelector('[data-speed]').addEventListener('change', e => {
    state.replaySpeed = Number(e.target.value);
    save(state);
    if (player) play(activeExample());
  });
}

function updateReplayControls() {
  const panel = document.querySelector('.replay-controls');
  if (!panel) return;
  const ex = activeExample();
  const title = panel.querySelector('[data-rp="title"]'), readout = panel.querySelector('[data-rp="readout"]');
  const controls = panel.querySelectorAll('button, select, input');
  if (!hasReplay(ex)) {
    title.textContent = 'No snippet to replay on this page.';
    readout.textContent = '';
    controls.forEach(c => c.disabled = true);
    return;
  }
  controls.forEach(c => c.disabled = false);
  const i = cursorOf(ex), n = ex.prices.t.length, time = ex.prices.t[i], events = eventCandles(ex);
  title.innerHTML = `Replaying <b>${esc(ex.title || ex.id)}</b>`;
  title.title = ex.title || ex.id;
  readout.textContent = `${fmtTime(time)} UTC · candle ${i + 1} of ${n}`;
  const scrub = panel.querySelector('.scrub');
  scrub.max = n - 1;
  scrub.value = i;
  const jump = panel.querySelector('[data-jump]');
  jump.min = `${ex.prices.t[0].slice(0, 10)}T00:00`;
  jump.max = `${ex.prices.t[n - 1].slice(0, 10)}T23:00`;
  // Midnight by default, so picking only a date still gives a time.
  if (document.activeElement !== jump) jump.value = `${time.slice(0, 10)}T00:00`;
  const set = (action, disabled) => panel.querySelector(`[data-go="${action}"]`).disabled = disabled;
  for (const a of ['start', '-day', '-hour']) set(a, i === 0);
  for (const a of ['end', '+day', '+hour']) set(a, i === n - 1);
  // A long replay may have events in batches it has not loaded yet, so its event buttons stay on.
  set('-event', isRemote(ex) ? i === 0 : !events.some(a => a < i));
  set('+event', isRemote(ex) ? i === n - 1 : !events.some(a => a > i));
  const playButton = panel.querySelector('[data-go="play"]');
  playButton.textContent = player ? '❚❚' : '▶';
  playButton.setAttribute('aria-label', player ? 'Pause (Space)' : 'Play (Space)');
}

document.addEventListener('keydown', e => {
  const inside = selector => e.target instanceof Element && e.target.closest(selector);
  if (!on('replay') || e.ctrlKey || e.metaKey || e.altKey || inside('input, select, textarea, .menu, dialog')) return;
  // The player has the keys on the Tour page, and on the Analysis page until the analysis has ended, when the replay's
  // come back; Space plays it there either way.
  if (currentPage === 'Tour' || analysisRuns() || (playerHere(currentPage) && e.key === ' ' && !inside('button, li'))) {
    const step = { ArrowLeft: 'prev', ArrowRight: 'next', Home: 'first', End: 'last' }[e.key] ?? (e.key === ' ' && !inside('button') ? 'play' : null);
    if (step) { e.preventDefault(); tourGo(step); }
    return;
  }
  const actions = { ArrowLeft: e.shiftKey ? '-day' : '-hour', ArrowRight: e.shiftKey ? '+day' : '+hour', Home: 'start', End: 'end', ',': '-event', '.': '+event' };
  const action = actions[e.key] ?? (e.key === ' ' && !inside('button, li') ? 'play' : null);
  if (!action) return;
  e.preventDefault();
  go(action);
});

// The replay controls and the events panel follow the chart last clicked, starting with the first on the page.
{
  const list = document.querySelector('#events .eventlog');
  const pick = li => { const ex = activeExample(); if (ex) selectLogEntry(ex, li.dataset.key); };
  list.addEventListener('click', e => { const li = e.target.closest('li[data-key]'); if (li) pick(li); });
  list.addEventListener('keydown', e => { const li = e.target.closest('li[data-key]'); if (li && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(li); } });
}

function wireReplayExamples(main) {
  activeId = null;
  main.querySelectorAll('.chart').forEach(el =>
    el.addEventListener('pointerdown', () => {
      if (el.dataset.id === activeId || !hasReplay(findExample(el.dataset.id))) return;
      stopPlaying();
      setActive(el.dataset.id);
    }));
  const first = [...main.querySelectorAll('.chart')].map(el => findExample(el.dataset.id)).find(hasReplay);
  if (first) setActive(first.id);
}

function withAlpha(hex, a) {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
  return m ? `rgba(${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)},${a})` : hex;
}

function referenceLines(traces, name, color, dash, refs) {
  if (!refs.length) return;
  const x = [], y = [], hover = [];
  for (const r of refs) {
    const h = `${name}: ${r.what}<br>${fmtPrice(r.level)} from ${fmtTime(r.from.time)} to ${fmtTime(r.to.time)}<extra></extra>`;
    x.push(r.from.time, r.to.time, null); y.push(r.level, r.level, null); hover.push(h, h, '');
  }
  traces.push({ type: 'scatter', mode: 'lines', name, x, y, line: { color, width: 1.5, dash }, hovertemplate: hover });
}

// The selected swing as a bold box with its break level, and its interims (to the example's depth) inside it. Fills say up or
// down; borders are each swing's sawtooth level colour.
function swingShapes(ex, w, breakColor) {
  const color = css(SWINGS[w.direction].color);
  const box = (s, style) => ({ type: 'rect', xref: 'x', yref: 'y', layer: 'below', x0: s.start.time, x1: s.end.time,
    y0: Math.min(s.start.price, s.extreme.price), y1: Math.max(s.start.price, s.extreme.price), ...style });
  return [
    box(w, { line: { color: levelColor(w.level), width: 3 }, fillcolor: withAlpha(color, 0.18) }),
    { type: 'line', xref: 'x', yref: 'y', x0: w.start.time, x1: w.breakOfStructure.time, y0: w.start.price, y1: w.start.price,
      line: { color: breakColor ?? color, width: 3 } },
    ...interimsTo(ex, w).map(({ swing: s, depth }) => {
      const c = css(SWINGS[s.direction].color);
      return box(s, { line: { color: levelColor(s.level), width: Math.max(1.25, 2.5 - depth * 0.5) }, fillcolor: withAlpha(c, 0.12 / depth) });
    }),
  ];
}

// Tree rows select a swing by level, direction and start time rather than by annotation.
function highlightSwing(ex, k, labels) {
  const [, level, direction, time] = k.split('|');
  const w = (ex.swingsByLevel?.[Number(level)] ?? []).find(s => s.direction === direction && s.start.time === time);
  if (!w) return [];

  const accent = css('--accent');
  const n = interimsTo(ex, w).length, depth = ex.depth ?? 1;
  labels.push({ x: w.start.time, y: w.start.price, text: `<b>Level ${level} ${direction === 'Up' ? 'upswing' : 'downswing'}</b> · ${n} interim${n === 1 ? '' : 's'}${depth > 1 ? ` (${depth} levels)` : ''}`,
    showarrow: true, arrowcolor: accent, arrowwidth: 1.5, ax: 0, ay: direction === 'Up' ? -60 : 60,
    bgcolor: css('--panel'), bordercolor: accent, borderpad: 4, font: { color: css('--text'), size: 12 } });
  return swingShapes(ex, w);
}

function highlight(ex, traces, labels) {
  const k = selected.get(ex.id);
  if (k?.startsWith('swing|')) return highlightSwing(ex, k, labels);
  const a = k && [...ex.expected, ...ex.annotations].find(x => key(x) === k);
  if (!a) return [];

  const accent = css('--accent');
  const term = TERMS.get(a.type);
  const shapes = [{ type: 'line', xref: 'x', yref: 'paper', x0: a.time, x1: a.time, y0: 0, y1: 1, layer: 'below',
    line: { color: accent, width: 1, dash: 'dot' } }];

  const msb = marketStructureBreaksFor(ex).find(m => m.type === a.type && m.break.time === a.time);
  if (msb) shapes.push({ type: 'line', xref: 'x', yref: 'y', x0: msb.reference.time, x1: msb.break.time, y0: msb.reference.price, y1: msb.reference.price,
    line: { color: term.color, width: 3, dash: 'dot' } });

  const w = owningSwing(ex, a);
  if (w) shapes.push(...swingShapes(ex, w, term.color));

  const trend = TREND_DIRECTION[a.type] && trendsFor(ex).find(t => t.direction === a.direction && t.confirmed.time === a.time);
  if (trend) shapes.push({ type: 'rect', xref: 'x', yref: 'paper', layer: 'below', x0: trend.start.time, x1: trend.end?.time ?? ex.prices.t[ex.prices.t.length - 1],
    y0: 0, y1: 1, line: { color: term.color, width: 1.5, dash: 'dot' }, fillcolor: withAlpha(term.color, 0.08) });

  traces.push({ type: 'scatter', mode: 'markers', name: 'Selected', hoverinfo: 'skip', x: [a.time], y: [a.price],
    marker: { symbol: 'circle-open', size: 26, color: accent, line: { width: 2.5 } } });
  labels.push({ x: a.time, y: a.price, text: `<b>${term.label}</b> ${fmtTime(a.time)} · ${fmtPrice(a.price)}`,
    showarrow: true, arrowcolor: accent, arrowwidth: 1.5, ax: 0, ay: term.position === 'Below' ? 60 : -60,
    bgcolor: css('--panel'), bordercolor: accent, borderpad: 4, font: { color: css('--text'), size: 12 } });
  return shapes;
}

// A level's highs and lows as currently known, labelled in C# (Sawtooth.Points): the latest counts as soon as price makes it.
function pointsFor(ex, level) {
  return ex.pointsByLevel?.[level] ?? [];
}

const PROVISIONAL_NOTE = '<br>so far: moves if price goes further';

function pointsAt(ex, level) {
  return pointsFor(ex, level).filter(p => p.type).map(p => ({ type: p.type, direction: ['HigherHigh', 'HigherLow'].includes(p.type) ? 'Up' : 'Down',
    level, time: p.time, price: p.price, detail: `<br>level ${level}${p.provisional ? PROVISIONAL_NOTE : ''}` }));
}

// Labels at one spot stack away from the candle, each taking the height it needs.
function stackShift(stacks, time, below, height = 14) {
  const k = `${time}|${below}`, base = stacks.get(k) ?? 9;
  stacks.set(k, base + height);
  return (below ? -1 : 1) * (base + height / 2);
}

// A point's label, in a box of its sawtooth level's colour.
function levelBox(stacks, p, below, level, text, font) {
  return { level, time: Date.parse(p.time), label: { x: p.time, y: p.price, text, showarrow: false, yshift: stackShift(stacks, p.time, below, BOX_HEIGHT), font,
    bgcolor: withAlpha(css('--panel'), 0.85), bordercolor: levelColor(level), borderwidth: 1.5, borderpad: 1 } };
}

// Every point in view has its box. Boxes may overlap, and where they do the later point's is in front. Points well out of
// view (more than a view's width away) get none, which keeps down the number Plotly has to draw, so a chart is redrawn
// once a pan or zoom settles if that brought other points near (refitBoxes).
const BOX_HEIGHT = 19;
const boxSets = new Map();
const boxTimers = new WeakMap();
const boxKey = labels => labels.map(l => `${l.x}|${l.yshift}`).join();

function shownBoxes(boxes, x) {
  const [from, to] = x.map(axisTime), width = to - from;
  return boxes.filter(b => b.time >= from - width && b.time <= to + width).sort((a, b) => a.time - b.time || a.level - b.level).map(b => b.label);
}

// Redraws a chart if the boxes its view should have are no longer the ones drawn.
function refitBoxes(el) {
  const id = el.dataset.id, set = boxSets.get(id), view = views.get(id);
  if (!set?.boxes.length || !view || !el.isConnected) return;
  if (boxKey(shownBoxes(set.boxes, shownRanges(zooms.get(id), view).x)) !== set.shown) draw(el, viewFor(findExample(id)), focusOf(currentPage));
}

function refitBoxesSoon(el) {
  clearTimeout(boxTimers.get(el));
  boxTimers.set(el, setTimeout(() => refitBoxes(el), 150));
}

// The sawtooth draws its lines and pivots only: labels belong to the point layers, so the two toggle independently.
function drawSawtooth(ex, traces) {
  if (!on('sawtooth')) return;
  const levels = selectedLevels(ex).filter(l => l < (ex.sawtooth?.length ?? 0));
  if (!levels.length) return;

  const finest = levels[levels.length - 1];
  // Coarsest last, so it is drawn in front: a finer level shows only where its path leaves the coarser ones.
  for (const level of [...levels].reverse()) {
    const color = levelColor(level);
    // Every level is drawn at the same width, with its pivots marked; a pivot shared by several levels shows the coarsest.
    const width = 2;
    const pivots = ex.sawtooth[level];
    const turns = pivots.filter(p => p.kind !== 'Current');
    const current = pivots.find(p => p.kind === 'Current');
    const points = new Map(pointsFor(ex, level).map(p => [`${p.kind}|${p.time}`, p]));
    const name = p => points.get(`${p.kind}|${p.time}`)?.label ?? (p.kind === 'Start' ? 'start' : p.kind.toLowerCase());

    // Pivots are turning points, so the hover says when price turned away; the label does not wait for that.
    traces.push({ type: 'scatter', mode: 'lines+markers', name: `Level ${level}`,
      x: turns.map(p => p.time), y: turns.map(p => p.price),
      line: { color, width }, marker: { color, size: 6 },
      hovertemplate: turns.map(p => `Level ${level} · ${name(p)}<br>${fmtTime(p.time)}<br>${fmtPrice(p.price)}` +
        `<br>${p.confirmedTime ? `turned ${fmtTime(p.confirmedTime)}` : 'price has not turned away yet'}<extra></extra>`) });

    if (current && turns.length) {
      const from = turns[turns.length - 1];
      traces.push({ type: 'scatter', mode: 'lines', name: `Level ${level} incomplete`,
        x: [from.time, current.time], y: [from.price, current.price], line: { color, width, dash: 'dash' },
        hovertemplate: `Incomplete leg, level ${level}<br>${fmtTime(from.time)} → ${fmtTime(current.time)}<br>now ${fmtPrice(current.price)}<extra></extra>` });
    }

    // The incomplete leg's furthest point so far is already a high or low, though not a turning point yet.
    const latest = [...points.values()].filter(p => p.provisional && !turns.some(t => t.time === p.time && t.kind === p.kind));
    if (level === finest && latest.length) {
      traces.push({ type: 'scatter', mode: 'markers', name: `Level ${level} so far`, x: latest.map(p => p.time), y: latest.map(p => p.price),
        marker: { color, size: 8, symbol: 'circle-open', line: { width: 2, color } },
        hovertemplate: latest.map(p => `Level ${level} · ${p.label}<br>${fmtTime(p.time)}<br>${fmtPrice(p.price)}${PROVISIONAL_NOTE}<extra></extra>`) });
    }
  }
}

// Plotly draws each annotation separately, which gets slow in the hundreds, so a chart with many labels or runs draws them
// inside its traces instead: plainer (labels at one spot can overlap), but fast.
const ANNOTATION_LIMIT = 150;

function drawCandleRuns(ex, labels, traces) {
  const shown = [['SuccessiveGreenCandles', true], ['SuccessiveRedCandles', false]].filter(([type]) => on(type))
    .map(([type, green]) => ({ type, green, runs: (ex.candleRuns ?? []).filter(r => r.green === green && r.length >= runMin(type)) }));
  const bulk = shown.reduce((n, s) => n + s.runs.length, 0) * 2 > ANNOTATION_LIMIT;
  for (const { type, green, runs } of shown) {
    const term = TERMS.get(type);
    const hover = r => {
      const change = (r.end.price - r.start.price) / r.start.price * 100;
      return `${r.length} ${green ? 'green' : 'red'} candles<br>${fmtTime(r.start.time)} → ${fmtTime(r.end.time)}<br>open ${fmtPrice(r.start.price)} → close ${fmtPrice(r.end.price)} (${change >= 0 ? '+' : ''}${change.toFixed(2)}%)`;
    };
    if (bulk) {
      if (!runs.length) continue;
      traces.push({ type: 'scatter', mode: 'lines', name: term.name, hoverinfo: 'skip', opacity: 0.9,
        x: runs.flatMap(r => [r.start.time, r.end.time, null]), y: runs.flatMap(r => [r.start.price, r.end.price, null]), line: { color: term.color, width: 2 } });
      traces.push({ type: 'scatter', mode: 'markers+text', name: term.name, x: runs.map(r => r.end.time), y: runs.map(r => r.end.price),
        marker: { symbol: green ? 'triangle-up' : 'triangle-down', size: 8, color: term.color }, text: runs.map(r => `${r.length}`),
        textposition: green ? 'top center' : 'bottom center', textfont: { size: 10, color: css('--text') },
        hovertemplate: runs.map(r => `${hover(r)}<extra></extra>`) });
      continue;
    }
    for (const r of runs) arrowLabels(labels, { from: r.start, to: r.end, color: term.color, text: `${r.length}`, hover: hover(r) });
  }
}

function draw(el, ex, focus) {
  const p = ex.prices;
  const text = css('--text'), muted = css('--muted'), grid = css('--grid');
  const traces = [];
  const swingBox = (w, interim) => {
    const s = SWINGS[w.direction], color = css(s.color);
    const top = Math.max(w.start.price, w.extreme.price), bottom = Math.min(w.start.price, w.extreme.price);
    const [startName, extremeName] = w.direction === 'Up' ? ['high', 'pullback low'] : ['low', 'bounce high'];
    const n = interimsOf(ex, w).length;
    return {
      type: 'scatter', mode: 'lines', fill: 'toself', hoveron: 'fills+points', name: s.name,
      x: [w.start.time, w.end.time, w.end.time, w.start.time, w.start.time], y: [top, top, bottom, bottom, top],
      // The fill says up or down; the border is the swing's sawtooth level colour.
      line: { color: levelColor(w.level), width: interim ? 1.25 : 1.75 }, fillcolor: withAlpha(color, interim ? 0.06 / interim : 0.1),
      hovertemplate: `${interim ? 'Interim ' : ''}${s.name.slice(0, -1).toLowerCase()} ${ARROW[w.direction]} · level ${w.level}<br>${fmtTime(w.start.time)} → ${fmtTime(w.end.time)}` +
        `<br>${startName} ${fmtPrice(w.start.price)} · ${extremeName} ${fmtPrice(w.extreme.price)}${n ? `<br>${n} interim swing${n === 1 ? '' : 's'}` : ''}<extra></extra>`,
    };
  };

  // Every level shown draws its own swings; finer levels are drawn lighter, and under the coarser ones, so a coarser swing's
  // border shows where a finer one shares its edges.
  const levelsShown = [...swingLevels(ex)].sort((a, b) => a - b);
  for (const [depth, level] of [...levelsShown.entries()].reverse())
    for (const w of (ex.swingsByLevel?.[level] ?? []).filter(w => w.confirmed && on(SWINGS[w.direction].layer))) traces.push(swingBox(w, depth || false));
  const allSwings = shownSwings(ex);

  if (on('price')) {
    traces.push({ type: 'candlestick', name: 'Price', x: p.t, open: p.o, high: p.h, low: p.l, close: p.c,
      increasing: { line: { color: css('--up'), width: 1 } }, decreasing: { line: { color: css('--down'), width: 1 } }, hoverinfo: 'x+y' });
  }
  if (on('close')) {
    traces.push({ type: 'scatter', mode: 'lines', name: 'Close', x: p.t, y: p.c, hoverinfo: 'skip',
      line: { color: on('price') ? css('--close') : text, width: on('price') ? 1 : 1.6 } });
  }

  for (const [dir, type] of [['Up', 'BullishBreakOfStructure'], ['Down', 'BearishBreakOfStructure']]) {
    if (!on(`bosLevel${dir}`)) continue;
    referenceLines(traces, 'BoS level', TERMS.get(type).color, 'dash',
      allSwings.filter(w => w.direction === dir && w.breakOfStructure)
        .map(w => ({ from: w.start, to: w.breakOfStructure, level: w.start.price, what: `level ${w.level} ${dir === 'Up' ? 'high' : 'low'} broken` })));
  }

  for (const [layer, type] of [['msbLevelUp', 'BullishMarketStructureBreak'], ['msbLevelDown', 'BearishMarketStructureBreak']]) {
    if (!on(layer)) continue;
    referenceLines(traces, 'MSB level', TERMS.get(type).color, 'dot',
      shownMarketStructureBreaks(ex).filter(m => m.type === type)
        .map(m => ({ from: m.reference, to: m.break, level: m.reference.price, what: `level ${m.level} protective ${type.startsWith('Bullish') ? 'bounce high' : 'pullback low'} broken` })));
  }

  const labels = [], boxes = [];
  const stacks = new Map();
  drawCandleRuns(ex, labels, traces);
  drawTrendArrows(ex, labels);
  drawTourLines(ex, labels);
  drawRanges(ex, traces);
  drawSawtooth(ex, traces);
  drawStrategies(ex, traces);

  const level = structureLevel(ex);
  const BOS_DIRECTION = { BullishBreakOfStructure: 'Up', BearishBreakOfStructure: 'Down' };
  const markerTypes = [...POINT_LAYERS, 'BullishBreakOfStructure', 'BearishBreakOfStructure', 'Uptrend', 'Downtrend', 'BullishMarketStructureBreak', 'BearishMarketStructureBreak', 'Retracement', 'Range'].filter(on);
  // Points are shown for every level selected that exists. A point that is the same at several levels shows once, as the
  // coarsest; where a pivot is a different point at different levels, each level's shows.
  const pointLevels = selectedLevels(ex).filter(l => l < (ex.pointsByLevel?.length ?? 0)).sort((a, b) => a - b);
  const pointsOf = type => {
    const seen = new Set();
    return pointLevels.flatMap(l => pointsAt(ex, l).filter(a => a.type === type && !seen.has(a.time) && seen.add(a.time)));
  };
  const markers = markerTypes.map(type => ({ type, term: TERMS.get(type), items: POINT_LAYERS.includes(type) ? pointsOf(type)
      : BOS_DIRECTION[type] ? allSwings.filter(w => w.direction === BOS_DIRECTION[type]).map(w => ({ type, direction: w.direction, time: w.breakOfStructure.time, price: w.breakOfStructure.price, detail: `<br>level ${w.level}` }))
      : TREND_DIRECTION[type] ? trendsFor(ex).filter(t => t.direction === TREND_DIRECTION[type]).map(t => ({ type, time: t.confirmed.time, price: t.confirmed.price,
          detail: `<br>from ${fmtTime(t.start.time)} · ${t.end ? `ended ${fmtTime(t.end.time)}` : 'ongoing'}<br>${t.swings} swings · strength ${t.strength}% · ${t.marketStructureBreaks} MSB against` }))
      // A retracement is marked where it first read the setting, labelled with that reading; the hover has the deepest.
      : type === 'Retracement' ? shownRetracements(ex).map(r => ({ type, level: r.level, time: r.reached.point.time, price: r.reached.point.price, label: `${r.reached.percent}%`,
          detail: `<br>level ${r.level} · ${r.direction === 'Down' ? 'bounce' : 'pullback'} from ${fmtPrice(r.to.price)} back towards ${fmtPrice(r.from.price)}` +
            `<br>deepest ${r.deepest.percent}% at ${fmtTime(r.deepest.point.time)}${r.confirmed ? '' : ' so far'}` }))
      : type === 'Range' ? shownRangeBoxes(ex).map(g => ({ type, level: g.level, time: g.identified.time, price: g.identified.price, detail: `<br>${rangeHover(g).split('<br>').slice(1).join('<br>')}` }))
      : shownMarketStructureBreaks(ex).filter(m => m.type === type).map(m => ({ type, level: m.level, time: m.break.time, price: m.break.price, detail: `<br>level ${m.level}` })) }));
  const isPointType = type => POINT_LAYERS.includes(type), severalLevels = selectedLevels(ex).length > 1;
  const bulkLabels =markers.filter(m => !isPointType(m.type)).reduce((n, m) => n + m.items.length, 0) > ANNOTATION_LIMIT;
  // Point labels sit in a box of their level's colour, stacked with the coarsest level nearest the candle. The marker is
  // outlined in the level's colour too, so a point still says its level where another box covers its own.
  const points = markers.filter(m => m.term && isPointType(m.type)).flatMap(m => m.items.map(a => ({ a, m }))).sort((p, q) => p.a.level - q.a.level);
  for (const { a, m } of points) {
    const isFocus = m.type === focus;
    boxes.push(levelBox(stacks, a, m.term.position === 'Below', a.level, m.term.label, { size: isFocus ? 12 : 11, color: isFocus ? text : muted }));
  }
  for (const { type, term, items } of markers) {
    if (!term || !items.length) continue;
    const isFocus = type === focus, below = term.position === 'Below', isPoint = isPointType(type), asText = bulkLabels && !isPoint;
    traces.push({
      type: 'scatter', mode: asText ? 'markers+text' : 'markers', name: term.label, x: items.map(a => a.time), y: items.map(a => a.price),
      marker: term.symbol.endsWith('-open')
        ? { color: term.color, symbol: term.symbol, size: isFocus ? 20 : 17, line: { width: 2, color: term.color } }
        : { color: term.color, symbol: term.symbol, size: isFocus ? 13 : 10,
            line: isPoint ? { width: 1.5, color: items.map(a => levelColor(a.level)) } : { width: 1, color: css('--panel') } },
      opacity: isFocus ? 1 : 0.85,
      ...(asText ? { text: items.map(a => a.label ?? term.label), textposition: below ? 'bottom center' : 'top center', textfont: { size: 10, color: muted } } : {}),
      hovertemplate: items.map(a => `${term.name}${TREND_DIRECTION[type] ? ' confirmed' : ''}<br>${fmtTime(a.time)}<br>${fmtPrice(a.price)}${a.detail ?? ''}<extra></extra>`),
    });
    if (bulkLabels || isPoint) continue;
    for (const a of items) {
      // With several levels shown, a market structure break's label is in a box of its level's colour, as a point's is.
      const boxed = severalLevels && a.level != null;
      labels.push({ x: a.time, y: a.price, text: a.label ?? term.label, showarrow: false,
        yshift: stackShift(stacks, a.time, below, boxed ? BOX_HEIGHT : undefined), font: { size: isFocus ? 12 : 11, color: isFocus ? text : muted },
        ...(boxed ? { bgcolor: withAlpha(css('--panel'), 0.85), bordercolor: levelColor(a.level), borderwidth: 1.5, borderpad: 1 } : {}) });
    }
  }

  const detected = new Set(ex.annotations.filter(a => a.type === ex.term).map(key));
  const missing = ex.term && !ex.hindsight ? ex.expected.filter(a => !detected.has(key(a))) : [];
  if (missing.length) {
    traces.push({ type: 'scatter', mode: 'markers', name: 'Expected, not detected', x: missing.map(a => a.time), y: missing.map(a => a.price),
      marker: { symbol: 'circle-open', size: 20, color: css('--bad'), line: { width: 2 } }, hoverinfo: 'x+y' });
  }

  // What could be known on each candle from the prices up to it; events hindsight does not have at this level are ringed.
  if (on('live') && ex.liveByLevel) {
    const events = ex.liveByLevel[level] ?? [];
    const agreed = hindsightKeys(ex.hindsight ?? ex, level);
    for (const [hindsight, name] of [[true, 'Seen live'], [false, 'Seen live, not in hindsight']]) {
      const items = events.filter(e => agreed.has(`${e.type}|${e.time}`) === hindsight);
      if (!items.length) continue;
      traces.push({ type: 'scatter', mode: 'markers', name, x: items.map(e => e.time), y: items.map(e => e.price),
        marker: { symbol: hindsight ? 'x-thin-open' : 'circle-x-open', size: hindsight ? 9 : 15, color: items.map(e => TERMS.get(e.type)?.color),
          line: { width: 2, color: items.map(e => TERMS.get(e.type)?.color) } },
        hovertemplate: items.map(e => `${name}: ${TERMS.get(e.type)?.name}<br>${fmtTime(e.time)} · level ${e.level}<br>${fmtPrice(e.price)}` +
          `${hindsight ? '' : '<br>A later new high redrew the levels,<br>so hindsight does not have it here'}<extra></extra>`) });
    }
  }

  const shapes = [...trendShapes(ex), ...highlight(ex, traces, labels)];
  if (ex.hindsight) shapes.push(...drawReplayExtras(ex, traces, level));
  for (const pin of ex.pins ?? []) labels.push(pinLabel(pin));

  // A fixed default view of the whole snippet, so toggling layers never rescales; a zoom or pan is kept across redraws.
  // While replaying, the view still spans the whole snippet, so the time still to come stays in frame; a long replay instead
  // follows the cursor with a moving window.
  const full = (ex.hindsight ?? ex).prices, w = ex.window;
  const span = a => w ? a.slice(w.from, w.to + 1) : a;
  // A view of one candle is as wide as a candle of the dataset either side of it.
  const oneCandle = full.t.length > 1 ? Date.parse(full.t[1]) - Date.parse(full.t[0]) : 3600000;
  const times = span(full.t).map(Date.parse), first = times[0], last = times[times.length - 1], candle = times.length > 1 ? (last - first) / (times.length - 1) : oneCandle;
  // Room either side is a candle, or for a view of one candle just over half of one, so its neighbours stay out of frame.
  const pad = times.length > 1 ? candle : candle * 0.6;
  const view = { t: times, h: span(full.h), l: span(full.l), candle, x: [new Date(first - pad).toISOString(), new Date(last + pad).toISOString()],
    from: w?.from ?? 0, numbered: !!ex.tour, floor: ex.tour ? 0.01 : 0,
    until: ex.tour && !on('future') ? Date.parse(full.t[ex.cursor]) : undefined, now: ex.tour ? [full.l[ex.cursor], full.h[ex.cursor]] : null,
    pins: (ex.pinRoom ?? []).map(pinRoom), height: el._fullLayout?._size?.h ?? Math.max(100, el.clientHeight - 46) };
  // The price axis fits everything drawn in view, not the candles alone.
  view.series = seriesOf(traces, shapes);
  view.y = fitPrices(view, view.x);
  views.set(ex.id, view);
  const { x: xRange, y: yRange, manual } = shownRanges(zoomedRanges(ex, view), view);
  if (ex.loading) labels.push({ xref: 'paper', yref: 'paper', x: 0.5, y: 0.5, showarrow: false, text: 'Loading from the local server…',
    font: { size: 14, color: muted }, bgcolor: css('--panel') });
  const shown = shownBoxes(boxes, xRange);
  boxSets.set(ex.id, { boxes, shown: boxKey(shown) });

  Plotly.react(el, traces, {
    uirevision: ex.id,
    margin: { t: 10, r: 56, b: 36, l: 10 }, paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    font: { color: muted, family: 'system-ui, sans-serif', size: 12 },
    dragmode: 'pan',
    xaxis: { type: 'date', rangeslider: { visible: false }, gridcolor: grid, linecolor: grid, range: xRange },
    yaxis: { type: 'linear', gridcolor: grid, linecolor: grid, tickformat: ',.0f', side: 'right', range: yRange, fixedrange: !manual },
    annotations: [...shown, ...labels], shapes, hovermode: 'closest', showlegend: false,
  }, { responsive: true, displaylogo: false, doubleClick: false, modeBarButtonsToRemove: ['select2d', 'lasso2d', 'autoScale2d', 'resetScale2d'],
    modeBarButtonsToAdd: [{ name: 'Reset view', icon: Plotly.Icons.home, click: gd => moveView(gd, null) }] });
  wireZoom(el);
}

// Charts navigate like a trading chart: dragging pans, the wheel zooms time around the pointer, and the price axis fits the
// candles in view until it is scaled by hand, by dragging it or turning the wheel over it. Double-clicking the price axis
// goes back to fitting; double-clicking the chart goes back to the default view.
// A zoom or pan is kept across every redraw: layer toggles, level changes and replay steps. Plotly's own way of keeping a
// user's zoom does not survive these redraws reliably, so the page remembers each chart's zoom and supplies it. The view
// only moves when a replay step carries the cursor out of it: then it slides along, keeping its width. Redraws that do not
// move the cursor never move the view.
// A chart's zoom holds x once the time axis has been moved and y once the price axis has been scaled by hand.
const zooms = new Map();
// Each chart's default ranges and the candles it spans, for fitting the price axis.
const views = new Map();
const viewsToMove = new Set();
let movingViews = 0;
const axisTime = v => Date.parse(/[zZ]|[+-]\d\d:?\d\d$/.test(String(v)) ? v : `${String(v).replace(' ', 'T')}Z`);

// Everything a chart draws against its price axis, for fitting it: the candles' highs and lows, and the points of every
// line, marker and box, its traces' and its shapes'. A line counts where it crosses the times in view, not only at its ends.
function seriesOf(traces, shapes) {
  const ms = v => typeof v === 'number' ? v : v instanceof Date ? v.getTime() : v == null ? NaN : axisTime(v);
  const out = [];
  for (const tr of traces) {
    if (tr.visible === false || (tr.yaxis && tr.yaxis !== 'y') || !Array.isArray(tr.x)) continue;
    if (tr.type === 'candlestick') out.push({ x: tr.x.map(ms), low: tr.low, high: tr.high });
    else if ((tr.type ?? 'scatter') === 'scatter' && Array.isArray(tr.y))
      out.push({ x: tr.x.map(ms), y: tr.y, lines: !!tr.fill || /lines/.test(tr.mode ?? 'lines') });
  }
  for (const s of shapes ?? []) {
    if (s.yref !== 'y' || (s.xref ?? 'x') !== 'x' || s.visible === false) continue;
    out.push({ x: [ms(s.x0), ms(s.x1)], y: [s.y0, s.y1], lines: true });
  }
  return out;
}

// The price range of all that is drawn between two times, with a little room above and below; null when there is none.
// A tour fits only what is shown so far (view.until), so the prices still to come do not squash it, and never closer
// than a share of the price (view.floor), so its first few candles do not fill the chart. Where its view has none of
// it, it fits the candle the replay is at (view.now), so there is always a range.
function fitPrices(view, x) {
  const [from, to] = x.map(axisTime), last = Math.min(to, view.until ?? Infinity);
  let low = Infinity, high = -Infinity;
  const take = v => { if (v != null && Number.isFinite(v)) { if (v < low) low = v; if (v > high) high = v; } };
  for (const s of view.series ?? []) {
    if (s.low) {
      for (let i = 0; i < s.x.length; i++) if (s.x[i] >= from && s.x[i] <= last) { take(s.low[i]); take(s.high[i]); }
      continue;
    }
    for (let i = 0; i < s.x.length; i++) {
      const xa = s.x[i], ya = s.y[i];
      if (xa >= from && xa <= last) take(ya);
      // A line from the point before: where it crosses into the times in view.
      if (!s.lines || !i || s.y[i - 1] == null || ya == null || !Number.isFinite(s.x[i - 1]) || !Number.isFinite(xa)) continue;
      const [x0, y0, x1, y1] = s.x[i - 1] <= xa ? [s.x[i - 1], s.y[i - 1], xa, ya] : [xa, ya, s.x[i - 1], s.y[i - 1]];
      if (x1 < from || x0 > last || x0 === x1) continue;
      const at = t => y0 + (y1 - y0) * (Math.min(Math.max(t, x0), x1) - x0) / (x1 - x0);
      take(at(from));
      take(at(last));
    }
  }
  if (low > high && !view.now) return null;
  if (low > high) [low, high] = view.now;
  const least = (high + low) / 2 * (view.floor ?? 0);
  if (high - low < least) [low, high] = [(high + low - least) / 2, (high + low + least) / 2];
  const pad = (high - low) * 0.06 || high * 0.001;
  return roomForPins([low - pad, high + pad], (view.pins ?? []).filter(p => p.time >= from && p.time <= to), view.height);
}

// Widens a price range until each pinned text in view has the room it needs, in pixels of the chart's height, above and
// below its point: its box would otherwise be cut off at the top or bottom of the chart.
function roomForPins([low, high], pins, height) {
  for (let pass = 0; pass < 6; pass++) {
    for (const p of pins) {
      const up = Math.min(0.45, p.up / height), down = Math.min(0.45, p.down / height);
      if (high - p.price < up * (high - low)) high = (p.price - up * low) / (1 - up);
      if (p.price - low < down * (high - low)) low = (p.price - down * high) / (1 - down);
    }
  }
  return [low, high];
}

function shownRanges(zoom, view) {
  const x = zoom?.x ?? view.x;
  return { x, y: zoom?.y ?? fitPrices(view, x) ?? view.y, manual: zoom?.y != null };
}

// Records a chart's zoom (none for the default view) and shows it on the next frame, so a run of wheel or drag events
// costs one redraw. A move that would leave no candles in view keeps the time range as it was.
function moveView(el, zoom, { gliding = false } = {}) {
  const id = el.dataset.id, view = views.get(id);
  // Any other move stops a glide (see glideView).
  if (!gliding) glides.delete(id);
  if (zoom?.x && view && !fitPrices(view, zoom.x)) zoom = { ...zoom, x: zooms.get(id)?.x };
  if (zoom?.x || zoom?.y) zooms.set(id, zoom); else zooms.delete(id);
  if (viewsToMove.has(el)) return;
  viewsToMove.add(el);
  requestAnimationFrame(async () => {
    viewsToMove.delete(el);
    const view = views.get(id);
    if (!view || !el.isConnected || !el._fullLayout) return;
    const { x, y, manual } = shownRanges(zooms.get(id), view);
    movingViews++;
    try { await Plotly.relayout(el, { 'xaxis.range': x, 'yaxis.range': y, 'yaxis.fixedrange': !manual }); }
    finally { movingViews--; }
    refitBoxesSoon(el);
  });
}

// Moves a chart that is not a tour's from the time range it shows to another, the one way views move (see viewPath),
// fitting the prices to each frame. It ends zoomed to the new range, as a pan by hand would leave it; a zoom or pan by
// hand on the way stops it there.
const glides = new Map();
function glideView(el, to) {
  if (!el?._fullLayout) return;
  const id = el.dataset.id, from = el._fullLayout.xaxis.range.map(axisTime), target = to.map(v => typeof v === 'number' ? v : axisTime(v));
  const path = viewPath(from, target), start = performance.now(), mine = {};
  glides.set(id, mine);
  const iso = ms => new Date(ms).toISOString();
  const step = () => {
    if (glides.get(id) !== mine || !el.isConnected) return;
    const elapsed = performance.now() - start, [a, b] = path.at(elapsed);
    moveView(el, { x: [iso(a), iso(b)] }, { gliding: true });
    if (elapsed < path.ms) requestAnimationFrame(step); else glides.delete(id);
  };
  requestAnimationFrame(step);
}

// Where a mouse event is on a chart, in pixels from the top left of the plot area, with the plot area's place and size.
function plotPoint(el, e) {
  const size = el._fullLayout?._size;
  if (!size) return null;
  const box = el.getBoundingClientRect(), x = e.clientX - box.left - size.l, y = e.clientY - box.top - size.t;
  return { x, y, left: size.l, top: size.t, w: size.w, h: size.h, onPrices: x > size.w && y >= 0 && y <= size.h, onPlot: x >= 0 && x <= size.w && y >= 0 && y <= size.h };
}

function wireZoom(el) {
  if (el.dataset.zoomWired) return;
  el.dataset.zoomWired = '1';
  const id = el.dataset.id;
  const iso = v => new Date(v).toISOString();

  // Plotly's own pans and zooms; the page's moves are already recorded.
  el.on('plotly_relayout', e => {
    if (movingViews) return;
    const pick = axis => e[`${axis}.range`] ?? (e[`${axis}.range[0]`] !== undefined ? [e[`${axis}.range[0]`], e[`${axis}.range[1]`]] : null);
    const x = pick('xaxis'), y = pick('yaxis');
    if (!x && !y) return;
    const zoom = { ...zooms.get(id) };
    if (x) zoom.x = x.map(v => iso(axisTime(v)));
    if (y) zoom.y = y.map(Number);
    moveView(el, zoom);
  });
  el.on('plotly_doubleclick', () => moveView(el, null));

  el.addEventListener('wheel', e => {
    const p = plotPoint(el, e), view = views.get(id);
    if (!p || !view || p.y < 0 || p.x < 0 || (p.x > p.w && !p.onPrices)) return;
    e.preventDefault();
    const zoom = { ...zooms.get(id) }, shown = shownRanges(zoom, view), lines = e.deltaMode === 1 ? 33 : 1;
    const k = Math.exp(e.deltaY * lines * 0.0015);
    if (p.onPrices) {
      const [low, high] = shown.y, at = high - (high - low) * p.y / p.h;
      zoom.y = [at - (at - low) * k, at + (high - at) * k];
    } else {
      const [from, to] = shown.x.map(axisTime), width = to - from;
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        const shift = width * e.deltaX * lines / p.w;
        zoom.x = [from + shift, to + shift].map(iso);
      } else {
        const full = view.x.map(axisTime);
        if (k < 1 ? width * k < view.candle * 5 : width * k > (full[1] - full[0]) * 4) return;
        const at = from + width * p.x / p.w;
        zoom.x = [at - (at - from) * k, at + (to - at) * k].map(iso);
      }
    }
    moveView(el, zoom);
  }, { passive: false });

  // Dragging the price axis scales prices about the middle of the view, in place of Plotly's own axis drag.
  el.addEventListener('mousedown', e => {
    cross.hidden = true;
    const view = views.get(id);
    if (e.button !== 0 || !view || !plotPoint(el, e)?.onPrices) return;
    e.preventDefault();
    e.stopPropagation();
    const [low, high] = shownRanges(zooms.get(id), view).y, middle = (low + high) / 2, half = (high - low) / 2;
    const drag = m => {
      const k = Math.exp((m.clientY - e.clientY) * 0.005);
      moveView(el, { ...zooms.get(id), y: [middle - half * k, middle + half * k] });
    };
    const drop = () => { document.removeEventListener('mousemove', drag); document.removeEventListener('mouseup', drop); };
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', drop);
  }, true);
  el.addEventListener('dblclick', e => {
    if (!plotPoint(el, e)?.onPrices) return;
    const { y, ...zoom } = zooms.get(id) ?? {};
    moveView(el, zoom);
  });

  // A crosshair at the pointer, its time snapped to the nearest candle, with the time and price on the axes.
  const cross = document.createElement('div');
  cross.className = 'crosshair';
  cross.hidden = true;
  cross.innerHTML = '<i class="v"></i><i class="h"></i><b class="time"></b><b class="price"></b>';
  el.append(cross);
  const [v, h, timeLabel, priceLabel] = cross.children;
  let mouse = null;
  const aim = () => {
    const p = mouse && plotPoint(el, mouse), view = views.get(id);
    el.style.cursor = p?.onPrices ? 'ns-resize' : '';
    cross.hidden = !p?.onPlot || !view;
    if (cross.hidden) return;
    const [from, to] = el._fullLayout.xaxis.range.map(axisTime), [low, high] = el._fullLayout.yaxis.range;
    const at = from + (to - from) * p.x / p.w, time = view.candle ? view.t[0] + Math.round((at - view.t[0]) / view.candle) * view.candle : at;
    const x = p.left + (time - from) / (to - from) * p.w, y = p.top + p.y;
    v.style.cssText = `left:${x}px;top:${p.top}px;height:${p.h}px`;
    h.style.cssText = `left:${p.left}px;top:${y}px;width:${p.w}px`;
    timeLabel.style.cssText = `left:${x}px;top:${p.top + p.h + 3}px`;
    // A tour numbers its candles from its start, so the crosshair gives the number to write in tour.json.
    const number = view.numbered ? view.t.indexOf(time) : -1;
    timeLabel.textContent = (number < 0 ? '' : `#${view.from + number} · `) + fmtTime(iso(time));
    priceLabel.style.cssText = `left:${p.left + p.w + 3}px;top:${y}px`;
    priceLabel.textContent = Math.floor(high - (high - low) * p.y / p.h).toLocaleString('en-US');
  };
  el.addEventListener('mousemove', e => { mouse = e; aim(); });
  el.addEventListener('mouseleave', () => { mouse = null; aim(); });
  el.on('plotly_afterplot', aim);
}

// The x and y ranges of a chart the user has zoomed; null when not zoomed. While replaying, a step that takes the cursor
// out of view slides the view along; a redraw that leaves the cursor where it was changes nothing.
// A view is never left without candles, as the moving window of a long replay would otherwise leave one that stayed behind:
// it goes back to the cursor, keeping its width, and a price range scaled by hand that misses the candles in view is dropped.
function zoomedRanges(ex, view) {
  const zoom = zooms.get(ex.id);
  if (!zoom) return null;
  if (zoom.x && ex.cursor != null && zoom.cursor !== undefined && zoom.cursor !== ex.cursor) {
    let [from, to] = zoom.x.map(Date.parse);
    const before = Date.parse(ex.hindsight.prices.t[zoom.cursor]), now = Date.parse(ex.hindsight.prices.t[ex.cursor]), width = to - from;
    const wasInView = before >= from && before <= to;
    if (wasInView && (now > to || now < from)) {
      from = now > to ? now + width * 0.1 - width : now - width * 0.1;
      to = from + width;
      zoom.x = [new Date(from).toISOString(), new Date(to).toISOString()];
    }
  }
  if (zoom.x && !fitPrices(view, zoom.x)) {
    const [from, to] = zoom.x.map(Date.parse), width = to - from;
    if (ex.cursor != null) {
      const now = Date.parse(ex.hindsight.prices.t[ex.cursor]);
      zoom.x = [new Date(now - width * 0.9).toISOString(), new Date(now + width * 0.1).toISOString()];
    } else delete zoom.x;
    delete zoom.y;
  }
  const fit = zoom.y && fitPrices(view, zoom.x ?? view.x);
  if (fit && (fit[0] > zoom.y[1] || fit[1] < zoom.y[0])) delete zoom.y;
  zoom.cursor = ex.cursor ?? undefined;
  return { x: zoom.x ?? null, y: zoom.y ?? null };
}

// ---- Replay page -----------------------------------------------------------------------------------------------------
// Whole datasets from the local server, replayed from their first candle. A loaded dataset is shaped like an example, so
// the replay code draws it like any other chart; its structure comes only from the server's batches.
const replayDatasets = [];
let datasetList = null;

async function loadDatasets() {
  datasetList ??= await fetch('api/datasets').then(r => r.json()).catch(() => []);
  return datasetList;
}

async function loadDataset(info) {
  const existing = replayDatasets.find(e => e.dataset === info.id);
  if (existing) return existing;
  const prices = await fetch(`api/prices?dataset=${encodeURIComponent(info.id)}`).then(r => r.json());
  const ex = { id: `Replay/${info.id}`, dataset: info.id, title: info.name, level: 1, prices, expected: [], annotations: [] };
  replayDatasets.push(ex);
  cursors.set(ex.id, 0);
  return ex;
}

// Opened as a file, or from elsewhere, the page cannot replay whole datasets itself; if the local server is running it links
// there, otherwise it says how to start it.
const LOCAL_SERVER = 'http://localhost:5178';

async function checkLocalServer() {
  const box = document.querySelector('[data-server-check]'), page = currentPage;
  if (!box) return;
  const running = await fetch(`${LOCAL_SERVER}/api/health`).then(r => r.ok).catch(() => false);
  if (currentPage !== page) return;
  box.innerHTML = running
    ? `The local server is running. <a href="${LOCAL_SERVER}/#${page}">Open the ${page} page there</a>: this copy of the page is opened as a file, so it cannot load data from it.`
    : `Replaying a whole dataset needs the local server, and it is not running. In the repository folder run <code>./build-site.ps1 -Serve</code>,
       then <button type="button" class="layer text" data-recheck>check again</button> or open <a href="${LOCAL_SERVER}/#${page}">${LOCAL_SERVER}/#${page}</a>.`;
  box.querySelector('[data-recheck]')?.addEventListener('click', () => { box.textContent = 'Checking for the local server…'; checkLocalServer(); });
}

async function renderReplayPage() {
  const main = document.getElementById('main');
  selected.clear();
  currentPage = 'Replay';
  const head = `<section class="term-head"><h2>Replay</h2>
    <p>Step through a whole dataset as it was known at each candle. The sawtooth, points, swings, breaks and trends come only from
    the prices up to the cursor, with the levels anchored at the dataset's first candle.</p>
    <p class="remarks">The local server works it out ${REMOTE_BATCH} candles at a time and fetches ahead while you play. The chart
    follows the cursor, showing the chosen window of history before it. Click a candle for its prices and Analyse, which explains it as the tour would, here on the chart.</p></section>`;
  const show = body => { main.innerHTML = head + body; renderLayers(); wireReplayExamples(main); drawAll(currentPage); };

  if (!serverOn) {
    show(`<div class="empty" data-server-check>Checking for the local server…</div>`);
    return checkLocalServer();
  }
  show('<div class="empty">Loading datasets…</div>');
  const list = await loadDatasets();
  if (currentPage !== 'Replay') return;
  if (!list.length) return show('<div class="empty">The server has no datasets.</div>');

  const info = list.find(d => d.id === state.replayDataset) ?? list[0];
  const ex = await loadDataset(info);
  if (currentPage !== 'Replay') return;
  show(`<div class="replay-setup">
      <label>Dataset<select data-dataset>${list.map(d => `<option value="${esc(d.id)}" ${d.id === info.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></label>
      <label>Window<select data-window>${REPLAY_WINDOWS.map(w => `<option value="${w.candles}" ${w.candles === replayWindow() ? 'selected' : ''}>${w.label}</option>`).join('')}</select></label>
    </div>
    <article class="example replay-big" id="ex-${esc(ex.id)}">
      <header><h3>${esc(info.name)}</h3><span class="id">${info.candles.toLocaleString()} candles · ${esc(fmtTime(info.first))} to ${esc(fmtTime(info.last))} UTC · anchored at the first candle</span></header>
      ${chartRow(ex)}
    </article>`);
  main.querySelector('[data-dataset]').addEventListener('change', e => { state.replayDataset = e.target.value; save(state); stopPlaying(); renderReplayPage(); });
  main.querySelector('[data-window]').addEventListener('change', e => { state.replayWindow = Number(e.target.value); save(state); redrawExample(ex); });
}

// ---- Chart -----------------------------------------------------------------------------------------------------------
// The home page: a whole dataset as if it were complete, its structure worked out once from every candle (api/complete), with
// the filters choosing what is drawn. It opens on the chosen span of the latest candles; drag or zoom for the rest.
const chartDatasets = [];
const CHART_SPANS = [...REPLAY_WINDOWS, { label: 'All', candles: 0 }];
const chartSpan = () => CHART_SPANS.find(w => w.candles === state.chartSpan)?.candles ?? 720;
// How far on from a clicked candle the Chart's Analyse sees it (see the candle card).
const CHART_SEEN = 168;

// The structure at the dataset's last candle, fetched once for each range setting, shaped as a replay at that candle is.
function completeView(ex) {
  const last = ex.prices.t.length - 1, query = rangeQuery();
  if (ex.completeQuery !== query) {
    ex.completeQuery = query;
    ex.replay = null;
    fetch(`api/complete?dataset=${encodeURIComponent(ex.dataset)}${query}`).then(r => r.ok ? r.json() : Promise.reject(new Error(r.statusText))).then(batch => {
      if (ex.completeQuery !== query) return;
      batch.timeline.retracements ??= [];
      batch.timeline.ranges ??= [];
      ex.replay = batch.timeline;
      if (currentPage === 'Chart') redrawExample(ex);
    }).catch(() => { });
  }
  const window = { from: chartSpan() ? Math.max(0, last - chartSpan()) : 0, to: last };
  if (!ex.replay)
    return { ...ex, hindsight: ex, cursor: last, window, loading: true, timeline: null, sawtooth: [], swingsByLevel: [], pointsByLevel: [],
      marketStructureBreaksByLevel: [], trendsByLevel: [], candidatesByLevel: [], retracementsByLevel: [], rangesByLevel: [], candleRuns: [], liveByLevel: null };
  // Candidates are what a replay is waiting on; complete, there is nothing to wait for.
  return { ...liveView(ex, last), window, candidatesByLevel: [] };
}

async function renderChartPage() {
  const main = document.getElementById('main');
  selected.clear();
  currentPage = 'Chart';
  const show = body => { main.innerHTML = body; renderLayers(); drawAll(currentPage); };

  if (!serverOn) {
