<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Structure Terms</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script src="data.js"></script>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c; --border: #e7e5e4;
    --accent: #0f766e; --chip: #f5f5f4; --code: #f1f5f9;
    --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
    --up: #26a69a; --down: #ef5350; --close: #a8a29e; --grid: #eeeceb;
    --upswing: #16a34a; --downswing: #dc2626; --saw: #000000;
    /* Sawtooth levels: level 0 is --saw, then blue, yellow, magenta, sky, violet, pink, brown, slate. No red, green or orange, which would read as the swing fills and candles. Every pair of levels is at least 15 apart (OKLab x100) in both themes. */
    --lv1: #3b82f6; --lv2: #f0b400; --lv3: #f01fd0; --lv4: #38bdf8; --lv5: #5b21b6; --lv6: #ff8fc7; --lv7: #854d0e; --lv8: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e; --border: #292524;
      --accent: #2dd4bf; --chip: #292524; --code: #292524;
      --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --close: #78716c; --grid: #292524;
      --upswing: #4ade80; --downswing: #f87171; --saw: #ffffff;
      --lv1: #60a5fa; --lv2: #facc15; --lv3: #ff5fd8; --lv4: #67e8f9; --lv5: #8b5cf6; --lv6: #ffb3d9; --lv7: #a16207; --lv8: #64748b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .topnav { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    padding: 8px 20px; background: var(--bg); border-bottom: 1px solid var(--border); }
  .topnav h1 { font-size: 15px; margin: 0 14px 0 0; white-space: nowrap; }
  .menu { position: relative; }
  .menu > button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid transparent; background: none; color: var(--text);
    border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .menu > button::after { content: ''; border: 4px solid transparent; border-top-color: currentColor; margin-top: 4px; opacity: .6; }
  .menu > button:hover, .menu.open > button { background: var(--chip); }
  .menu > button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .menu.active > button { color: var(--accent); font-weight: 600; }
  .dropdown { display: none; position: absolute; top: 100%; left: 0; min-width: 250px; padding: 6px; margin-top: 2px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .14); }
  .menu.open .dropdown { display: block; }
  @media (hover: hover) { .menu:hover .dropdown { display: block; } }
  .dropdown a { display: flex; justify-content: space-between; gap: 12px; padding: 6px 10px; border-radius: 6px; color: var(--text); text-decoration: none; }
  .dropdown a:hover, .dropdown a:focus-visible { background: var(--chip); outline: none; }
  .dropdown a.active { color: var(--accent); font-weight: 600; }
  .dropdown .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .navlink { padding: 5px 10px; border-radius: 6px; color: var(--text); text-decoration: none; font-size: 14px; white-space: nowrap; }
  .navlink:hover { background: var(--chip); }
  .navlink.active { color: var(--accent); font-weight: 600; }
  .navlink:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .replay-setup { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .replay-setup select { margin-left: 6px; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
    border-radius: 5px; padding: 3px 6px; }
  .replay-big .chart { height: 600px; }
  .topnav .foot { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .layout { display: grid; grid-template-columns: 72px 230px 1fr; min-height: calc(100vh - var(--nav-h, 50px)); }
  aside { border-right: 1px solid var(--border); padding: 14px 12px 24px; position: sticky; top: var(--nav-h, 50px);
    height: calc(100vh - var(--nav-h, 50px)); overflow-y: auto; }
  #levels { padding: 14px 6px 24px; }
  .centre { display: flex; flex-direction: column; min-width: 0; min-height: calc(100vh - var(--nav-h, 50px)); }
  main { flex: 1; padding: 24px 32px 64px; max-width: 1200px; min-width: 0; }
  #replaybar { position: sticky; bottom: 0; z-index: 10; }
  .term-head h2 { margin: 0; font-size: 26px; }
  .term-head .label { font-family: ui-monospace, Consolas, monospace; font-size: 14px; color: var(--muted); margin-left: 8px; }
  .term-head p { margin: 8px 0 0; max-width: 72ch; }
  .term-head .remarks { color: var(--muted); font-size: 14px; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; background: var(--code); padding: 1px 5px; border-radius: 4px; }
  .layerbar .section + .section { margin-top: 12px; }
  .layerbar .lead { display: flex; align-items: center; gap: 6px; width: 100%; margin: 0 0 3px; padding: 2px 7px; border: 0; border-radius: 5px;
    background: none; color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    text-align: left; cursor: pointer; }
  .layerbar .lead:hover { background: var(--chip); color: var(--text); }
  .layerbar .lead:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .layerbar .lead .state { margin-left: auto; font-size: 10px; font-weight: 500; letter-spacing: 0; text-transform: none; opacity: .8; }
  .layerbar .head { display: flex; align-items: center; margin: 0 0 3px; }
  .layerbar .head .lead { flex: 1; width: auto; min-width: 0; margin: 0; }
  .layerbar .fold { flex: none; width: 18px; height: 20px; padding: 0; border: 0; border-radius: 5px; background: none; color: var(--muted);
    font: inherit; font-size: 11px; line-height: 1; cursor: pointer; }
  .layerbar .fold::before { content: ''; display: inline-block; border: 4px solid transparent; border-top-color: currentColor; margin-top: 4px; }
  .layerbar .section.folded .fold::before { border-top-color: transparent; border-left-color: currentColor; margin: 0 0 0 4px; }
  .layerbar .fold:hover { background: var(--chip); color: var(--text); }
  .layerbar .fold:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .layerbar .section.folded .items { display: none; }
  .layerbar .all-none { display: flex; gap: 4px; margin: 0 0 12px; }
  .layerbar .all-none button { flex: 1; font: inherit; font-size: 12px; color: var(--text); background: var(--panel); border: 1px solid var(--border);
    border-radius: 5px; padding: 3px 0; cursor: pointer; }
  .layerbar .all-none button:hover { background: var(--chip); }
  .layerbar .all-none button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .layerbar .items { display: flex; flex-direction: column; align-items: stretch; }
  .layerbar .items.levels { gap: 2px; }
  .levelbar .lead { flex-direction: column; align-items: flex-start; gap: 0; }
  .levelbar .lead .state { margin-left: 0; }
  .layerbar .item { display: flex; align-items: center; }
  .layerbar .item .layer { flex: 1; }
  .layer { display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; background: none; color: var(--text);
    border-radius: 6px; padding: 3px 7px; font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  .layer svg { min-width: 22px; }
  .layer .name { white-space: nowrap; }
  .layer:hover { background: var(--chip); }
  .layer:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .layer[aria-pressed="false"] { opacity: .38; }
  .layer[aria-pressed="false"] .name { text-decoration: line-through; }
  .layer svg { flex: none; }
  .layer.text { color: var(--muted); font-size: 12px; }
  .runmin { width: 3.4em; margin: 0 0 0 4px; padding: 1px 2px; font: inherit; font-size: 12px; color: var(--text);
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px; }
  .runmin:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .layerbar .unit { margin-left: 2px; font-size: 11px; color: var(--muted); }
  .example { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-top: 18px; }
  .example header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
  .example h3 { margin: 0; font-size: 17px; }
  .example .id { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .badge { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; border: 1px solid currentColor; }
  .badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); }
  .example p { margin: 8px 0 0; max-width: 80ch; }
  .chart { height: 440px; margin-top: 10px; position: relative; }
  .chart .nsewdrag { cursor: crosshair !important; }
  .crosshair { position: absolute; inset: 0; pointer-events: none; font-size: 11px; font-variant-numeric: tabular-nums; }
  .crosshair i { position: absolute; border: 0 dashed var(--muted); opacity: 0.7; }
  .crosshair .v { border-left-width: 1px; }
  .crosshair .h { border-top-width: 1px; }
  .crosshair b { position: absolute; background: var(--text); color: var(--panel); padding: 1px 5px; border-radius: 3px; font-weight: 500; white-space: nowrap; }
  .crosshair .time { transform: translateX(-50%); }
  .crosshair .price { transform: translateY(-50%); }
  details { margin-top: 8px; font-size: 14px; }
  summary { cursor: pointer; color: var(--muted); }
  table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 3px 14px 3px 0; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  td.miss { color: var(--bad); font-weight: 600; }
  tr.pick { cursor: pointer; }
  tr.pick:hover td { background: var(--chip); }
  tr.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  tr.pick.selected td { background: var(--chip); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 600; }
  .replay-controls { display: none; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 32px; font-size: 12px;
    background: var(--bg); border-top: 1px solid var(--border); }
  body.replaying .replay-controls { display: flex; }
  .replay-controls .rp-title { max-width: 220px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .replay-controls .rp-title b { color: var(--text); font-weight: 600; }
  .replay-controls .rp-row { display: flex; gap: 3px; }
  .replay-controls button, .replay-controls select { min-width: 34px; font: inherit; font-size: 12px; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 5px; padding: 3px 7px; cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .replay-controls select { padding: 2px; }
  .replay-controls button:hover:not(:disabled) { background: var(--chip); }
  .replay-controls button:disabled { opacity: .35; cursor: default; }
  .replay-controls button.play { min-width: 42px; font-weight: 700; color: var(--accent); }
  .replay-controls :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .replay-controls .scrub { flex: 1 1 160px; min-width: 120px; margin: 0; accent-color: var(--accent); }
  .replay-controls label { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
  .replay-controls input[type="datetime-local"] { font: inherit; font-size: 12px; color: var(--text);
    background: var(--panel); border: 1px solid var(--border); border-radius: 5px; padding: 2px 4px; color-scheme: light dark; }
  .replay-controls .readout { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .replay-controls .keys { color: var(--muted); font-size: 11px; white-space: nowrap; }
  #events { display: none; border-right: 0; border-left: 1px solid var(--border); padding: 0; flex-direction: column; }
  body.replaying.show-eventlog .layout { grid-template-columns: 72px 230px minmax(0, 1fr) 300px; }
  body.replaying.show-eventlog #events { display: flex; }
  #events h4 { margin: 0; padding: 12px 12px 8px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  #events .for { padding: 0 12px 8px; font-size: 13px; border-bottom: 1px solid var(--border); }
  #events .for b { font-weight: 600; }
  #events .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .eventlog { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; font-size: 12px; }
  .eventlog li { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; padding: 4px 8px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .eventlog li:hover { background: var(--chip); }
  .eventlog li:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .eventlog li.now { background: var(--chip); }
  .eventlog li.selected { box-shadow: inset 3px 0 0 var(--accent); background: var(--chip); font-weight: 600; }
  .eventlog li.removal { color: var(--muted); }
  .eventlog .tag { grid-row: span 2; font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700; min-width: 3.4em; padding-top: 1px; }
  .eventlog time { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .eventlog .revised { color: var(--warn); font-size: 11px; font-weight: 600; }
  .eventlog .empty-log { color: var(--muted); padding: 10px; cursor: default; display: block; }
  body.replaying .example.replay-active { box-shadow: 0 0 0 2px var(--accent); }
  body.replaying .example .chart { cursor: pointer; }
  @media (max-width: 1100px) { body.replaying.show-eventlog .layout { grid-template-columns: 72px 230px minmax(0, 1fr); }
    body.replaying.show-eventlog #events { grid-column: 3; position: static; height: 320px; border-left: 0; border-top: 1px solid var(--border); } }
  .empty { margin-top: 24px; padding: 20px; border: 1px dashed var(--border); border-radius: 12px; color: var(--muted); }
  body.touring .replay-controls, body.analysing .replay-controls { display: none; }
  body.touring .example.replay-active { box-shadow: none; }
  body.touring .replay-big .chart { height: clamp(320px, calc(100vh - 440px), 600px); }
  .tour-chapters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .tour-chapters.in-panel { margin-top: 8px; font-size: 13px; }
  .chapter-pill { display: inline-flex; align-items: center; gap: 2px; padding-left: 7px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); }
  .chapter-pill input { margin: 0; accent-color: var(--accent); cursor: pointer; }
  .tour-chapters .chapter-pill a { border: 0; background: none; padding-left: 5px; }
  /* The chapter on show: a border twice as thick, drawn as a ring outside it so the pills do not shift. */
  .chapter-pill.active { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
  .chapter-pill.explains { background: color-mix(in srgb, #8b5cf6 10%, var(--panel)); border-color: color-mix(in srgb, #8b5cf6 45%, var(--border)); }
  .chapter-pill.explains input { accent-color: #8b5cf6; }
  .chapter-pill.explains.active { border-color: #8b5cf6; box-shadow: 0 0 0 1.5px #8b5cf6; }
  .chapter-pill.off a { color: var(--muted); text-decoration: line-through; }
  .chapter-pill.add { padding: 3px 12px; font: inherit; color: var(--muted); border-style: dashed; cursor: pointer; opacity: .8; }
  .chapter-pill.add:hover { color: var(--accent); border-color: var(--accent); opacity: 1; }
  .tour-chapters a { padding: 3px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); color: var(--text);
    font-size: 13px; text-decoration: none; }
  .tour-chapters a:hover { background: var(--chip); }
  .tour-chapters a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tour-chapters a.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .tour-caption { min-height: 4.4em; margin-top: 12px; max-width: 62ch; font-size: 19px; line-height: 1.45; }
  .tour-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .tour-controls button, .tour-controls a.button, .tour-glossary button { min-width: 38px; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
    border-radius: 5px; padding: 3px 9px; cursor: pointer; text-decoration: none; }
  .tour-controls button:hover, .tour-controls a.button:hover, .tour-glossary button:hover { background: var(--chip); }
  .tour-controls button:focus-visible, .tour-controls a.button:focus-visible, .tour-glossary :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tour-controls button:disabled, .tour-glossary button:disabled { opacity: .45; cursor: default; background: var(--panel); }
  .tour-controls .warn, .tour-glossary .warn { color: var(--warn); }
  .tour-glossary { max-width: 760px; margin-top: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); font-size: 13px; }
  .gl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 12px; color: var(--muted); }
  .gl-head h4 { margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .gl-rows { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .gl-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.4fr) auto; align-items: center; gap: 8px; color: var(--muted); }
  .tour-glossary input { min-width: 0; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; }
  .gl-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .tour-controls button.play { min-width: 46px; font-weight: 700; color: var(--accent); }
  .tour-controls .readout { color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tour-controls .keys { font-size: 11px; white-space: nowrap; }
  .tour-controls .pace { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .tour-controls .pace input { width: 70px; accent-color: var(--accent); }
  .tour-controls .pace span { min-width: 3.6em; color: var(--text); }
  .tour-controls button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--bg); }
  .tour-controls .edit { margin-left: auto; }
  .tour-warning { color: var(--warn); font-size: 13px; }
  .player { margin: 4px 0 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); scroll-margin-top: 64px; }
  .player .tour-caption { min-height: 2.9em; max-width: 80ch; margin-top: 4px; cursor: pointer; }
  .tour-caption .unread { color: var(--muted); opacity: .7; }
  .player-scrub { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .player-scrub input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  .player-scrub input[type=range]:disabled { opacity: .4; }
  .player-scrub label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--text); }
  .analysis-things { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .analysis-things label, .candle-card .things label { display: inline-flex; align-items: center; gap: 4px; color: var(--text); white-space: nowrap; cursor: pointer; }
  .analysis-things label.off, .candle-card .things label.off { color: var(--muted); }
  .analysis-things .write { display: inline-flex; gap: 6px; }
  .analysis-things button, .candle-card .analyse button { padding: 3px 10px; font: inherit; font-weight: 600; color: var(--accent); background: var(--panel); border: 1px solid var(--accent); border-radius: 5px; cursor: pointer; }
  .analysis-things button:hover, .candle-card .analyse button:hover { background: var(--chip); }
  .analysis-things button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  .candle-card .analyse button:disabled { opacity: .45; cursor: default; }
  .analysis-things .warn { color: var(--warn); }
  #similar { width: min(620px, calc(100vw - 32px)); max-height: 80vh; padding: 16px 18px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text); font-size: 13px; }
  #similar::backdrop { background: rgba(0, 0, 0, .35); }
  #similar h4 { margin: 0 0 4px; font-size: 15px; }
  #similar p { margin: 0 0 10px; color: var(--muted); }
  #similar .sim-checks { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 12px; }
  #similar .sim-checks label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  #similar .sim-foot { display: flex; align-items: center; gap: 8px; }
  #similar button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  #similar button:hover { background: var(--chip); }
  #similar button.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  #similar .sim-count { margin: 12px 0 6px; color: var(--muted); }

  .ed-cue.active { border-left-color: var(--accent); }
  .ed-level { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); }
  .ed-cue > .ed-meta { margin-bottom: 2px; white-space: normal; }

  .ed-cue:focus-within .ed-row { display: grid; }
  .ed-row .ed-ops { grid-column: 1 / -1; justify-content: flex-end; }
  .ed-row label.ed-check, .ed-grid label.ed-check { flex-direction: row; align-items: center; gap: 5px; padding-bottom: 4px; font-size: 13px; color: var(--text); cursor: pointer; }

    body.touring.editing #tour-editor { grid-column: 3; position: static; height: auto; border-left: 0; border-top: 1px solid var(--border); } }

    .topnav { padding: 8px 16px; }

    .dropdown { position: fixed; left: 16px; right: 16px; top: var(--nav-h, 50px); min-width: 0; }
    .layout, body.replaying.show-eventlog .layout, body.touring.editing .layout { grid-template-columns: 1fr; }
    body.replaying.show-eventlog #events, body.touring.editing #tour-editor { grid-column: 1; }
    aside, #levels { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 12px 16px; }

</style>
</head>
<body>
<nav class="topnav" id="nav" aria-label="Pages"></nav>
<div class="layout">
  <aside id="levels" aria-label="Sawtooth levels"></aside>
  <aside id="layers" aria-label="Chart layers"></aside>
  <div class="centre">
    <main id="main"></main>
    <div id="replaybar"></div>
  </div>
  <aside id="events" aria-label="Replay events">
    <h4>Events so far</h4>
    <div class="for" data-events-for></div>
    <ol class="eventlog" aria-label="Events up to the replay cursor"></ol>
  </aside>
  <aside id="tour-editor" aria-label="Tour editor"></aside>
</div>
<script>
const DATA = window.SITE_DATA || { terms: [], examples: [] };
// Each example carries its sawtooth, swings, breaks and candles in a structure block; lift them onto the example.
for (const ex of [...DATA.examples, ...(DATA.structure?.examples ?? []), ...(DATA.interims?.examples ?? [])]) Object.assign(ex, ex.structure);
const TERMS = new Map(DATA.terms.map(t => [t.type, t]));
const ARROW = { Up: '↑', Down: '↓' };
const STORE_KEY = 'terms-site:v8';
const LEVELS = 9;
const SWINGS = { Up: { name: 'Upswings', layer: 'Upswing', color: '--upswing' }, Down: { name: 'Downswings', layer: 'Downswing', color: '--downswing' } };
const SWING_DIRECTION = { Upswing: 'Up', Downswing: 'Down' };
const TREND_DIRECTION = { Uptrend: 'Up', Downtrend: 'Down' };
const STRUCTURE_PAGES = ['Sawtooth', 'InterimSwings', 'Replay', 'Analysis', 'Tour'];

// Every layer a chart can show, grouped into sections that appear in the same order on every page.
const SECTIONS = [
  { name: 'Replay', layers: [{ id: 'replay', label: 'Replay' }, { id: 'candidates', label: 'Candidate swings' },
    { id: 'future', label: 'Future candles' }, { id: 'eventlog', label: 'Event log' }, { id: 'live', label: 'Seen live' }] },
  // What a replay once showed and has since taken back, a layer for each kind of thing, so each can be shown on its own.
  { name: 'Ghosts', layers: [{ id: 'ghostSwings', label: 'Ghost swings' }, { id: 'ghostCandidates', label: 'Ghost candidates' }, { id: 'ghostPoints', label: 'Ghost points' },
    { id: 'ghostTrends', label: 'Ghost trends' }, { id: 'ghostMsbs', label: 'Ghost MSBs' }, { id: 'ghostRanges', label: 'Ghost ranges' }] },
  // A filter, not a layer: which sawtooth levels the sawtooth, swings and points are shown at.
  { name: 'Levels', levels: true, layers: Array.from({ length: LEVELS }, (_, l) => ({ id: `level${l}`, label: `${l}`, level: l })) },
  { name: 'Price', layers: [{ id: 'price', label: 'Candles' }, { id: 'close', label: 'Closes' }] },
  { name: 'Candles', layers: [{ id: 'SuccessiveGreenCandles', label: 'Green runs' }, { id: 'SuccessiveRedCandles', label: 'Red runs' }] },
  { name: 'Sawtooth', layers: [{ id: 'sawtooth', label: 'Sawtooth' }] },
  { name: 'Points', layers: ['HigherHigh', 'LowerHigh', 'LowerLow', 'HigherLow'].map(id => ({ id })) },
  { name: 'Upswings', layers: [{ id: 'Upswing', label: 'Upswing' }, { id: 'BullishBreakOfStructure' }, { id: 'bosLevelUp', label: 'BoS level', term: 'BullishBreakOfStructure' }] },
  { name: 'Downswings', layers: [{ id: 'Downswing', label: 'Downswing' }, { id: 'BearishBreakOfStructure' }, { id: 'bosLevelDown', label: 'BoS level', term: 'BearishBreakOfStructure' }] },
  { name: 'Trends', layers: [{ id: 'Uptrend', label: 'Uptrend' }, { id: 'Downtrend', label: 'Downtrend' }, { id: 'trendArrows', label: 'Trend arrows' }] },
  { name: 'Indicators', layers: [{ id: 'BullishMarketStructureBreak' }, { id: 'msbLevelUp', label: 'MSB↑ level', term: 'BullishMarketStructureBreak' },
    { id: 'BearishMarketStructureBreak' }, { id: 'msbLevelDown', label: 'MSB↓ level', term: 'BearishMarketStructureBreak' },
    { id: 'Retracement', label: 'Retracement' }, { id: 'Range', label: 'Range' }, { id: 'rangeBands', label: 'Range bands', term: 'Range' },
    { id: 'rangeZones', label: 'Range zones', term: 'Range' }] },
].map(s => ({ ...s, layers: s.layers.map(l => ({ ...l, label: l.label ?? TERMS.get(l.id)?.label ?? l.id })) }));
// Layers with a number beside them: how long a run must be to show, how far back a retracement must read to be marked (and
// for a range to count), and how far beyond a range the price may close before the range ends. The range settings change
// what the local server computes, so its replays are fetched again when they change.
const SETTINGS = {
  SuccessiveGreenCandles: { key: 'SuccessiveGreenCandles', min: 2, max: 99, fallback: 5, title: 'Minimum run length', unit: '' },
  SuccessiveRedCandles: { key: 'SuccessiveRedCandles', min: 2, max: 99, fallback: 5, title: 'Minimum run length', unit: '' },
  Retracement: { key: 'retracement', min: 1, max: 99, fallback: 75, title: 'Least retracement to mark, as a percentage of the move it comes back along', unit: '%', remote: true },
  Range: { key: 'band', min: 0, max: 99, fallback: 20, title: 'Band either side of a range, as a percentage of its height: a close beyond it ends the range', unit: '%', remote: true },
  rangeZones: { key: 'zone', min: 1, max: 49, fallback: 25, title: 'Depth of the buy-low and sell-high zones from the range\'s edges, as a percentage of its height; each zone reaches out to the band', unit: '%' },
};
const LAYERS = SECTIONS.flatMap(s => s.layers);
const LEVEL_IDS = LAYERS.filter(l => l.level !== undefined).map(l => l.id);
const POINT_LAYERS = ['HigherHigh', 'HigherLow', 'LowerHigh', 'LowerLow'];

// What a page shows before its buttons are touched: candles plus the page's own layers.
const PAGE_DEFAULTS = {
  Upswing: ['price', 'Upswing', 'BullishBreakOfStructure'],
  Downswing: ['price', 'Downswing', 'BearishBreakOfStructure'],
  Uptrend: ['price', 'Upswing', 'Downswing', 'Uptrend'],
  Downtrend: ['price', 'Upswing', 'Downswing', 'Downtrend'],
  BullishBreakOfStructure: ['price', 'Upswing', 'BullishBreakOfStructure', 'bosLevelUp'],
  BearishBreakOfStructure: ['price', 'Downswing', 'BearishBreakOfStructure', 'bosLevelDown'],
  BullishMarketStructureBreak: ['price', 'BullishMarketStructureBreak', 'msbLevelUp'],
  BearishMarketStructureBreak: ['price', 'BearishMarketStructureBreak', 'msbLevelDown'],
  Sawtooth: ['price', 'sawtooth', 'level0', 'level1'],
  InterimSwings: ['price', 'Upswing', 'Downswing', 'level1', 'level2', 'level3'],
  Replay: ['replay', 'price', 'sawtooth', 'level1', 'Upswing', 'Downswing', 'BullishBreakOfStructure', 'BearishBreakOfStructure'],
  Analysis: ['replay', 'price'],
};
// Replay extras are on by default, so switching Replay on shows them; they only draw while replaying.
const GHOST_IDS = SECTIONS.find(s => s.name === 'Ghosts').layers.map(l => l.id);
const REPLAY_DEFAULTS = ['candidates', ...GHOST_IDS, 'eventlog'];
const defaultsFor = page => [...(PAGE_DEFAULTS[page] ?? ['price', page]), ...REPLAY_DEFAULTS];

function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } }
function save(state) { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch { } }
const state = Object.assign({ pages: {} }, load());
// Ghosts was one layer before it was a section: a page remembered with it on has every kind of ghost on.
for (const [page, layers] of Object.entries(state.pages)) if (layers.includes('ghosts')) state.pages[page] = layers.flatMap(id => id === 'ghosts' ? GHOST_IDS : [id]);
let currentPage = null;
// The player (see Tour) sets its own layers section by section, on the Tour page and the Analysis page alike, and it is
// always replaying. Layers set by hand there are not remembered: on the Tour page they go into the section being edited
// when the editor is open, and otherwise they last until the next section.
let tourLayers = ['replay'];
// The page the player is on now has it; the other's is kept, to come back to.
const playerHere = page => (page === 'Tour' || page === 'Analysis') && tour?.page === page;
// Hides the Replay page's candle card (set where the card is made).
let closeCandleCard = () => {};
const layersOf = page => playerHere(page) ? tourLayers : state.pages[page] ?? defaultsFor(page);
const on = id => layersOf(currentPage).includes(id);
const setLayers = layers => {
  if (playerHere(currentPage)) { tourLayers = [...new Set(['replay', ...layers])]; if (currentPage === 'Tour') recordTourLayers(); return; }
  state.pages[currentPage] = layers; save(state);
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const prose = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmtTime = t => String(t).slice(0, 16).replace('T', ' ');
const fmtPrice = p => p.toLocaleString(undefined, { maximumFractionDigits: 2 });
const key = a => `${a.type}|${a.direction}|${a.time}|${a.price}`;
const levelColor = l => css(l === 0 ? '--saw' : `--lv${Math.min(l, 8)}`);

function examplesFor(type) { return DATA.examples.filter(e => e.term === type); }

// Pages grouped into the top bar's menus: the structure pages, then one menu per term category.
function navGroups() {
  const groups = new Map([['Structure', [
    { id: 'Sawtooth', name: 'Sawtooth levels', count: DATA.structure?.examples?.length ?? 0 },
    { id: 'InterimSwings', name: 'Interim swings', count: DATA.interims?.examples?.length ?? 0 },
  ]]]);
  for (const t of DATA.terms)
    (groups.get(t.category) ?? groups.set(t.category, []).get(t.category)).push({ id: t.type, name: t.name, count: examplesFor(t.type).length });
  return groups;
}

function renderNav(active) {
  // A tour written from the prices is opened with a query (?explain=...), which every link drops, so Tour is the tour itself.
  const base = new URLSearchParams(location.search).has('explain') ? location.pathname : '';
  const menu = ([name, pages], i) => {
    const current = pages.some(p => p.id === active);
    return `<div class="menu${current ? ' active' : ''}">
      <button type="button" aria-expanded="false" aria-controls="menu-${i}">${esc(name)}</button>
      <div class="dropdown" id="menu-${i}">${pages.map(p =>
        `<a href="${base}#${p.id}" class="${p.id === active ? 'active' : ''}"${p.id === active ? ' aria-current="page"' : ''}><span>${esc(p.name)}</span><span class="count">${p.count || ''}</span></a>`).join('')}</div>
    </div>`;
  };
  const link = page => `<a class="navlink${active === page ? ' active' : ''}" href="${base}#${page}"${active === page ? ' aria-current="page"' : ''}>${page}</a>`;
  const nav = document.getElementById('nav');
  nav.innerHTML = `<h1>Market structure terms</h1>${[...navGroups()].map(menu).join('')}
    ${link('Replay')}${link('Analysis')}${link('Tour')}
    <span class="foot">Built ${esc(fmtTime(DATA.generated || ''))} UTC · ${DATA.examples.length} examples</span>`;

  nav.querySelectorAll('.menu > button').forEach(b => b.addEventListener('click', () => {
    const open = !b.parentElement.classList.contains('open');
    closeMenus();
    b.parentElement.classList.toggle('open', open);
    b.setAttribute('aria-expanded', open);
    if (open) b.parentElement.querySelector('a')?.focus();
  }));
  document.documentElement.style.setProperty('--nav-h', `${nav.offsetHeight}px`);
}

function closeMenus() {
  document.querySelectorAll('.menu.open').forEach(m => {
    m.classList.remove('open');
    m.querySelector('button').setAttribute('aria-expanded', 'false');
  });
}

document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenus(); });
document.addEventListener('keydown', e => {
  const menu = e.target.closest?.('.menu');
  if (e.key === 'Escape' && menu) { closeMenus(); menu.querySelector('button').focus(); return; }
  if (!menu || !['ArrowDown', 'ArrowUp'].includes(e.key)) return;
  const links = [...menu.querySelectorAll('a')];
  if (!menu.classList.contains('open')) menu.querySelector('button').click();
  else links[(links.indexOf(e.target) + (e.key === 'ArrowDown' ? 1 : links.length - 1)) % links.length]?.focus();
  e.preventDefault();
});
window.addEventListener('resize', () => document.documentElement.style.setProperty('--nav-h', `${document.getElementById('nav').offsetHeight}px`));

function markerSvg(symbol, color) {
  const shapes = {
    'triangle-up': `<polygon points="7,2 12,11 2,11" fill="${color}"/>`,
    'triangle-down': `<polygon points="2,3 12,3 7,12" fill="${color}"/>`,
    'diamond': `<polygon points="7,1 13,7 7,13 1,7" fill="${color}"/>`,
    'x': `<path d="M3 3 L11 11 M11 3 L3 11" stroke="${color}" stroke-width="3"/>`,
    'arrow-up': `<path d="M7 1 L12 7 L9 7 L9 13 L5 13 L5 7 L2 7 Z" fill="${color}"/>`,
    'arrow-down': `<path d="M7 13 L12 7 L9 7 L9 1 L5 1 L5 7 L2 7 Z" fill="${color}"/>`,
    'triangle-up-open': `<polygon points="7,2 12,11 2,11" fill="none" stroke="${color}" stroke-width="1.8"/>`,
    'triangle-down-open': `<polygon points="2,3 12,3 7,12" fill="none" stroke="${color}" stroke-width="1.8"/>`,
  };
  return shapes[symbol] ?? `<circle cx="7" cy="7" r="5" fill="${color}"/>`;
}

function swatch(layer) {
  const svg = inner => `<svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true">${inner}</svg>`;
  if (layer.id === 'price') return svg(`<line x1="6" y1="1" x2="6" y2="13" stroke="${css('--up')}"/><rect x="3.5" y="3" width="5" height="8" fill="${css('--up')}"/>
    <line x1="15" y1="2" x2="15" y2="12" stroke="${css('--down')}"/><rect x="12.5" y="5" width="5" height="5" fill="${css('--down')}"/>`);
  if (layer.id === 'close') return svg(`<path d="M1 10 L7 5 L13 8 L21 3" fill="none" stroke="${css('--close')}" stroke-width="1.5"/>`);
  if (layer.id === 'sawtooth') return svg(`<path d="M1 11 L6 4 L10 8 L15 2 L21 9" fill="none" stroke="${levelColor(1)}" stroke-width="2"/>`);
  if (layer.level !== undefined) return svg(`<line x1="1" y1="7" x2="21" y2="7" stroke="${levelColor(layer.level)}" stroke-width="3"/><circle cx="11" cy="7" r="3" fill="${levelColor(layer.level)}"/>`);
  if (SWING_DIRECTION[layer.id]) { const c = css(SWINGS[SWING_DIRECTION[layer.id]].color); return svg(`<rect x="2" y="2" width="18" height="10" fill="${withAlpha(c, 0.15)}" stroke="${c}"/>`); }
  if (layer.id.startsWith('Successive')) { const c = TERMS.get(layer.id)?.color, up = layer.id.includes('Green'); const [y1, y2] = up ? [12, 2] : [2, 12];
    return svg(`<line x1="2" y1="${y1}" x2="18" y2="${y2}" stroke="${c}" stroke-width="2"/><path d="M${up ? '13 2 L19 1 L17 7' : '13 12 L19 13 L17 7'}" fill="none" stroke="${c}" stroke-width="2"/>`); }
  if (TREND_DIRECTION[layer.id]) { const c = TERMS.get(layer.id)?.color, y = layer.id === 'Uptrend' ? 1 : 9;
    return svg(`<rect x="1" y="${y}" width="20" height="4" fill="${withAlpha(c, 0.5)}"/><polygon points="11,${y - 1} 14,${y + 2} 11,${y + 5} 8,${y + 2}" fill="${c}"/>`); }
  if (layer.id === 'trendArrows') return svg(`<line x1="2" y1="12" x2="18" y2="2" stroke="${levelColor(1)}" stroke-width="2"/><path d="M13 2 L19 1 L17 7" fill="none" stroke="${levelColor(1)}" stroke-width="2"/>
    <rect x="6" y="4" width="8" height="6" fill="${css('--panel')}" stroke="${levelColor(1)}"/>`);
  if (layer.id === 'live') return svg(`<path d="M7 3 L15 11 M15 3 L7 11" stroke="${css('--text')}" stroke-width="1.8"/>`);
  if (layer.id === 'replay') return svg(`<polygon points="7,2 17,7 7,12" fill="${css('--accent')}"/>`);
  if (layer.id === 'candidates') return svg(`<rect x="2" y="2" width="18" height="10" fill="none" stroke="${css('--upswing')}" stroke-dasharray="3 2"/>`);
  if (layer.id === 'ghostSwings') return svg(`<rect x="2" y="2" width="18" height="10" fill="${withAlpha(css('--close'), 0.15)}" stroke="${css('--close')}" stroke-dasharray="1.5 2"/>`);
  if (layer.id === 'ghostCandidates') return svg(`<rect x="2" y="2" width="18" height="10" fill="none" stroke="${css('--close')}" stroke-dasharray="3 2"/>`);
  if (layer.id === 'ghostTrends') return svg(`<rect x="1" y="5" width="20" height="4" fill="${withAlpha(css('--close'), 0.15)}" stroke="${css('--close')}" stroke-dasharray="1.5 2"/>`);
  if (layer.id === 'ghostPoints' || layer.id === 'ghostMsbs') return `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">${
    markerSvg(TERMS.get(layer.id === 'ghostPoints' ? 'HigherHigh' : 'BullishMarketStructureBreak')?.symbol, css('--close'))}</svg>`;
  if (layer.id === 'future') return svg(`<line x1="6" y1="2" x2="6" y2="12" stroke="${css('--close')}" opacity=".5"/><rect x="3.5" y="4" width="5" height="6" fill="${css('--close')}" opacity=".5"/>
    <line x1="15" y1="1" x2="15" y2="13" stroke="${css('--close')}" opacity=".5"/><rect x="12.5" y="3" width="5" height="7" fill="${css('--close')}" opacity=".5"/>`);
  if (layer.id === 'eventlog') return svg(`<path d="M3 3 H19 M3 7 H19 M3 11 H13" stroke="${css('--muted')}" stroke-width="1.6"/>`);
  if (layer.id.startsWith('msbLevel')) return svg(`<line x1="1" y1="7" x2="21" y2="7" stroke="${TERMS.get(layer.term)?.color}" stroke-width="2" stroke-dasharray="1.5 2.5"/>`);
  if (layer.id === 'rangeBands') return svg(`<line x1="1" y1="3" x2="21" y2="3" stroke="${TERMS.get('Range')?.color}" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="1" y1="11" x2="21" y2="11" stroke="${TERMS.get('Range')?.color}" stroke-width="1.5" stroke-dasharray="4 3"/>`);
  if (layer.id === 'rangeZones') return svg(`<rect x="1" y="1" width="20" height="5" fill="${withAlpha(css('--down'), 0.25)}"/><rect x="1" y="8" width="20" height="5" fill="${withAlpha(css('--up'), 0.25)}"/><line x1="1" y1="6" x2="21" y2="6" stroke="${TERMS.get('Range')?.color}" stroke-width="1" stroke-dasharray="3 2"/><line x1="1" y1="8" x2="21" y2="8" stroke="${TERMS.get('Range')?.color}" stroke-width="1" stroke-dasharray="3 2"/>`);
  if (layer.id === 'ghostRanges') return svg(`<rect x="2" y="2" width="18" height="10" fill="${withAlpha(css('--close'), 0.1)}" stroke="${css('--close')}" stroke-dasharray="1.5 2"/>`);
  if (layer.id.startsWith('bosLevel')) return svg(`<line x1="1" y1="7" x2="21" y2="7" stroke="${TERMS.get(layer.term)?.color}" stroke-width="2" stroke-dasharray="4 3"/>`);
  const term = TERMS.get(layer.term ?? layer.id);
  return term ? `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">${markerSvg(term.symbol, term.color)}</svg>` : '';
}

const setting = id => state.runMin?.[SETTINGS[id].key] ?? SETTINGS[id].fallback;
const runMin = setting;
// The range settings the local server is asked for, as part of every replay request.
const rangeQuery = () => `&retracement=${setting('Retracement')}&band=${setting('Range')}`;

// One section of the layer bar. Its heading turns the whole section on, or off when it is all on already; the arrow
// beside it folds the section away, leaving the heading and its count. Folded sections are remembered across pages.
const isFolded = s => (state.folded ?? []).includes(s.name);

function layerSection(s, i, foldable = true) {
  const runInput = l => SETTINGS[l.id]
    ? `<input class="runmin" type="number" min="${SETTINGS[l.id].min}" max="${SETTINGS[l.id].max}" step="1" value="${setting(l.id)}" data-run="${l.id}" title="${esc(SETTINGS[l.id].title)}" aria-label="${esc(SETTINGS[l.id].title)}">${SETTINGS[l.id].unit ? `<span class="unit">${SETTINGS[l.id].unit}</span>` : ''}`
    : '';
  const button = l => `<button class="layer" data-layer="${l.id}" aria-pressed="${on(l.id)}" title="${esc(TERMS.get(l.term ?? l.id)?.name ?? l.label)}">${swatch(l)}<span class="name">${esc(l.label)}</span></button>`;
  const items = s => s.levels
    ? `<div class="items levels"><button class="layer text" data-levels="none">None</button>${s.layers.map(button).join('')}<button class="layer text" data-levels="all">All</button></div>`
    : `<div class="items">${s.layers.map(l => `<div class="item">${button(l)}${runInput(l)}</div>`).join('')}</div>`;
  const lead = `<button type="button" class="lead" data-section="${i}" title="Show all or none of ${esc(s.name.toLowerCase())}">${esc(s.name)}<span class="state"></span></button>`;
  if (!foldable) return `<div class="section" role="group" aria-label="${esc(s.name)}">${lead}${items(s)}</div>`;
  const folded = isFolded(s);
  return `<div class="section${folded ? ' folded' : ''}" role="group" aria-label="${esc(s.name)}">
    <div class="head"><button type="button" class="fold" data-fold="${i}" aria-expanded="${!folded}" title="Fold or unfold ${esc(s.name.toLowerCase())}" aria-label="Fold or unfold ${esc(s.name.toLowerCase())}"></button>${lead}</div>
    ${items(s)}</div>`;
}

function layerBar() {
  return `<div class="layerbar" role="toolbar" aria-orientation="vertical" aria-label="Chart layers">
    <div class="all-none"><button type="button" data-all="all" title="Show every chart layer (the replay settings and the levels stay as they are)">All</button>
      <button type="button" data-all="none" title="Hide every chart layer (the replay settings and the levels stay as they are)">None</button></div>
    ${SECTIONS.map((s, i) => s.levels ? '' : layerSection(s, i)).join('')}</div>`;
}

// The Levels filter has a column of its own, beside the layers.
function levelBar() {
  const i = SECTIONS.findIndex(s => s.levels);
  return `<div class="layerbar levelbar" role="toolbar" aria-orientation="vertical" aria-label="Sawtooth levels">${layerSection(SECTIONS[i], i, false)}</div>`;
}

const sectionIds = s => s.layers.map(l => l.id);
const REPLAY_SECTION_IDS = sectionIds(SECTIONS.find(s => s.name === 'Replay'));

// Shows how much of each section is on: all, some or none.
function updateSectionStates(root) {
  root.querySelectorAll('.lead[data-section]').forEach(lead => {
    const ids = sectionIds(SECTIONS[Number(lead.dataset.section)]), count = ids.filter(on).length;
    lead.querySelector('.state').textContent = count === ids.length ? 'all' : count ? `${count}/${ids.length}` : 'none';
    lead.setAttribute('aria-pressed', count === ids.length ? 'true' : count ? 'mixed' : 'false');
  });
}

// The levels column, the layers beside it and the replay bar under the charts are wired as one bar.
function renderLayers() {
  document.getElementById('levels').innerHTML = levelBar();
  document.getElementById('layers').innerHTML = layerBar();
  document.getElementById('replaybar').innerHTML = replayControls();
  wireLayerBar(document.querySelector('.layout'));
}

// Shows on the buttons which layers are on.
function syncLayerButtons(root = document.querySelector('.layout')) {
  root.querySelectorAll('.layer[data-layer]').forEach(b => b.setAttribute('aria-pressed', on(b.dataset.layer)));
  updateSectionStates(root);
}

function wireLayerBar(root) {
  const sync = layers => {
    setLayers([...new Set(layers)]);
    syncLayerButtons(root);
    drawAll(currentPage);
  };
  updateSectionStates(root);
  root.querySelectorAll('.layer[data-layer]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.layer, layers = layersOf(currentPage);
    sync(on(id) ? layers.filter(x => x !== id) : [...layers, id]);
  }));
  root.querySelectorAll('.lead[data-section]').forEach(lead => lead.addEventListener('click', () => {
    const ids = sectionIds(SECTIONS[Number(lead.dataset.section)]), layers = layersOf(currentPage);
    sync(ids.every(on) ? layers.filter(x => !ids.includes(x)) : [...layers, ...ids]);
  }));
  // All and None leave the Replay section and the Levels filter alone: those are a mode and a filter, not layers.
  root.querySelectorAll('[data-all]').forEach(b => b.addEventListener('click', () => {
    const kept = [...REPLAY_SECTION_IDS, ...LEVEL_IDS];
    const stay = layersOf(currentPage).filter(x => kept.includes(x));
    sync(b.dataset.all === 'all' ? [...stay, ...LAYERS.map(l => l.id).filter(x => !kept.includes(x))] : stay);
  }));
  root.querySelectorAll('.layer[data-levels]').forEach(b => b.addEventListener('click', () => {
    sync([...layersOf(currentPage).filter(x => !LEVEL_IDS.includes(x)), ...(b.dataset.levels === 'all' ? LEVEL_IDS : [])]);
  }));
  root.querySelectorAll('[data-fold]').forEach(b => b.addEventListener('click', () => {
    const s = SECTIONS[Number(b.dataset.fold)], fold = !isFolded(s);
    state.folded = fold ? [...(state.folded ?? []), s.name] : state.folded.filter(name => name !== s.name);
    save(state);
    b.closest('.section').classList.toggle('folded', fold);
    b.setAttribute('aria-expanded', !fold);
  }));
  root.querySelectorAll('.runmin').forEach(input => input.addEventListener('input', () => {
    const s = SETTINGS[input.dataset.run], value = Math.round(Number(input.value));
    if (!Number.isFinite(value) || value < s.min || value > s.max) return;
    state.runMin = { ...state.runMin, [s.key]: value };
    save(state);
    // A setting the server computes with makes every batch fetched so far stale.
    if (s.remote) { remote.clear(); eventCache.clear(); }
    drawAll(currentPage);
  }));
  wireReplayControls(root);
}

function renderTerm(type) {
  const term = TERMS.get(type);
  const main = document.getElementById('main');
  if (!term) { main.innerHTML = '<div class="empty">Unknown term.</div>'; return; }

  const examples = examplesFor(type);
  selected.clear();

  currentPage = type;
  let html = `<section class="term-head">
    <h2>${esc(term.name)}<span class="label">${esc(term.label)}</span></h2>
    ${term.summary ? `<p>${prose(term.summary)}</p>` : ''}
    ${term.remarks ? `<p class="remarks">${prose(term.remarks)}</p>` : ''}
  </section>`;

  if (!examples.length)
    html += `<div class="empty">No examples yet. Add a CSV and sidecar under <code>TestData/Terms/${esc(type)}/</code>.</div>`;

  for (const ex of examples) {
    const badges = [
      ex.reviewed ? '<span class="badge ok">Reviewed</span>' : '<span class="badge warn" title="Expected values were captured from the detector and not yet checked by a human">Unreviewed</span>',
      ex.matches ? '' : '<span class="badge bad">Detector differs from expected</span>',
    ].join('');
    html += `<article class="example" id="ex-${esc(ex.id)}">
      <header><h3>${esc(ex.title || ex.id)}</h3>${badges}<span class="id">${esc(ex.id)} · level ${ex.level ?? 1}</span></header>
      ${ex.description ? `<p>${prose(ex.description)}</p>` : ''}
      ${chartRow(ex)}
      ${expectedTable(ex, term)}
    </article>`;
  }
  main.innerHTML = html;

  renderLayers();
  wireReplayExamples(main);
  main.querySelectorAll('tr.pick').forEach(row => {
    row.addEventListener('click', () => toggleSelection(row, type));
    row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSelection(row, type); } });
  });
  drawAll(type);
}

function expectedTable(ex, term) {
  const detected = new Set(ex.annotations.filter(a => a.type === ex.term).map(key));
  const expected = new Set(ex.expected.map(key));
  const rows = [
    ...ex.expected.map(a => ({ a, status: detected.has(key(a)) ? 'matched' : 'missing' })),
    ...ex.annotations.filter(a => a.type === ex.term && !expected.has(key(a))).map(a => ({ a, status: 'extra' })),
  ].sort((x, y) => x.a.time.localeCompare(y.a.time));
  return `<details ${ex.matches ? '' : 'open'}><summary>Expected ${esc(term.label)} (${ex.expected.length}) · asserted by the example test · click a row to highlight it</summary>
    <table><tr><th>Time (UTC)</th><th>Direction</th><th>Close</th><th>Status</th></tr>
    ${rows.map(r => `<tr class="pick" tabindex="0" data-ex="${esc(ex.id)}" data-key="${esc(key(r.a))}"><td>${esc(fmtTime(r.a.time))}</td><td>${esc(r.a.direction)} ${ARROW[r.a.direction]}</td><td>${fmtPrice(r.a.price)}</td>
      <td class="${r.status === 'matched' ? '' : 'miss'}">${r.status}</td></tr>`).join('')}
    </table></details>`;
}

const selected = new Map();

function toggleSelection(row, type) {
  const id = row.dataset.ex, k = row.dataset.key;
  if (selected.get(id) === k) selected.delete(id); else selected.set(id, k);
  document.querySelectorAll(`tr.pick[data-ex="${CSS.escape(id)}"]`).forEach(r => r.classList.toggle('selected', selected.get(id) === r.dataset.key));
  const el = document.querySelector(`.chart[data-id="${CSS.escape(id)}"]`);
  draw(el, viewFor(findExample(id)), STRUCTURE_PAGES.includes(type) ? null : type);
  if (selected.has(id)) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// The Levels filter says which sawtooth levels are looked at; on its own it draws nothing. The Sawtooth toggle draws the
// sawtooth at those levels and the swing toggles draw their swings there. With no level chosen, a chart uses its own level.
// The choice is kept as it is even where a level does not exist (yet, in a replay): that level simply has nothing to show.
function selectedLevels(ex) {
  const chosen = LAYERS.filter(l => l.level !== undefined && on(l.id)).map(l => l.level);
  return chosen.length ? chosen : [ex.level ?? 1];
}

// Trends, candidates and the event log follow the finest level selected that exists: early in a replay the finer levels are
// not there yet, so these move to them as they appear.
function structureLevel(ex) {
  const levels = selectedLevels(ex), existing = levels.filter(l => l < (ex.sawtooth?.length ?? 0));
  return Math.max(...(existing.length ? existing : levels));
}

// Swings belong to their sawtooth level, so each level selected brings its own swings, coarsest first: selecting level 2 as
// well adds the interims of the level-1 swings rather than replacing them. Level 0 has no swings.
function swingLevels(ex) {
  return selectedLevels(ex).filter(l => l >= 1);
}

function shownSwings(ex) {
  return swingLevels(ex).flatMap(level => ex.swingsByLevel?.[level] ?? []);
}

// A swing's interims are the swings one level finer that start inside it; the data lists them as indexes into that level.
function interimsOf(ex, w) {
  const finer = ex.swingsByLevel?.[w.level + 1] ?? [];
  return (w.interims ?? []).map(i => finer[i]).filter(Boolean);
}

// Interims down to the example's depth, each with how many levels below the swing it sits.
function interimsTo(ex, w, depth = ex.depth ?? 1, d = 1) {
  return d > depth ? [] : interimsOf(ex, w).flatMap(s => [{ swing: s, depth: d }, ...interimsTo(ex, s, depth, d + 1)]);
}

function marketStructureBreaksFor(ex) {
  return ex.marketStructureBreaksByLevel?.[structureLevel(ex)] ?? [];
}

// On the chart, market structure breaks are drawn for every level selected, as swings and points are, each saying its
// level. One that is the same at several levels shows once, as the coarsest. The event log still follows the finest level.
function shownMarketStructureBreaks(ex) {
  const seen = new Set(), key = m => `${m.type}|${m.reference.time}|${m.break.time}`;
  return [...selectedLevels(ex)].sort((a, b) => a - b).flatMap(level =>
    (ex.marketStructureBreaksByLevel?.[level] ?? []).filter(m => !seen.has(key(m)) && seen.add(key(m))).map(m => ({ ...m, level })));
}

function trendsFor(ex) {
  return ex.trendsByLevel?.[structureLevel(ex)] ?? [];
}

// Retracements and ranges are drawn for every level selected, each saying its level, as market structure breaks are. A
// retracement shows once it reads the Retracement setting, marked where it first did.
function shownRetracements(ex) {
  const min = setting('Retracement');
  return [...selectedLevels(ex)].sort((a, b) => a - b).flatMap(level => (ex.retracementsByLevel?.[level] ?? [])
    .map(r => ({ ...r, level, reached: r.steps.find(s => s.percent >= min) })).filter(r => r.reached));
}

function shownRangeBoxes(ex) {
  return [...selectedLevels(ex)].sort((a, b) => a - b).flatMap(level => (ex.rangesByLevel?.[level] ?? []).map(g => ({ ...g, level })));
}

const rangeOrigin = g => g.direction === 'Down' ? 'a downtrend' : 'an uptrend';
const rangeHover = g => `Range · level ${g.level} · out of ${rangeOrigin(g)}<br>${fmtPrice(g.low.price)} to ${fmtPrice(g.high.price)}` +
  `<br>identified ${fmtTime(g.identified.time)} at a ${g.retracement}% retracement of the move from ${fmtPrice(g.from.price)}` +
  `<br>band ${g.band}%: ${fmtPrice(g.bandLow)} to ${fmtPrice(g.bandHigh)}` +
  `<br>${g.end ? `ended ${fmtTime(g.end.time)}, close ${fmtPrice(g.end.price)} ${g.endedAbove ? 'above' : 'below'} the band` : 'holds'}`;

// A range is a box from the candle that identified it to the one that ended it (or the latest candle while it holds),
// between its low and high, with its bands as dashed lines beyond. The zones are the training's discount and premium:
// the buy-low zone from the lower band up to the zone setting above the low, the sell-high zone from as far below the
// high up to the upper band.
function drawRanges(ex, traces) {
  if (!on('Range') && !on('rangeBands') && !on('rangeZones')) return;
  const term = TERMS.get('Range'), last = ex.prices.t[ex.prices.t.length - 1], zone = setting('rangeZones') / 100;
  const box = (g, until, a, b) => ({ x: [g.identified.time, until, until, g.identified.time, g.identified.time], y: [a, a, b, b, a] });
  for (const g of shownRangeBoxes(ex)) {
    const until = g.end?.time ?? last, height = g.high.price - g.low.price;
    if (on('rangeZones')) {
      const buyTop = g.low.price + height * zone, sellBottom = g.high.price - height * zone;
      traces.push({ type: 'scatter', mode: 'lines', fill: 'toself', hoveron: 'fills', name: 'Buy-low zone', ...box(g, until, g.bandLow, buyTop),
        line: { width: 0 }, fillcolor: withAlpha(css('--up'), 0.12), hovertemplate: `Buy-low zone · level ${g.level}<br>${fmtPrice(g.bandLow)} to ${fmtPrice(buyTop)}: from the lower band to ${setting('rangeZones')}% up the range<extra></extra>` });
      traces.push({ type: 'scatter', mode: 'lines', fill: 'toself', hoveron: 'fills', name: 'Sell-high zone', ...box(g, until, sellBottom, g.bandHigh),
        line: { width: 0 }, fillcolor: withAlpha(css('--down'), 0.12), hovertemplate: `Sell-high zone · level ${g.level}<br>${fmtPrice(sellBottom)} to ${fmtPrice(g.bandHigh)}: from ${setting('rangeZones')}% down the range to the upper band<extra></extra>` });
      traces.push({ type: 'scatter', mode: 'lines', name: 'Range zone', x: [g.identified.time, until, null, g.identified.time, until], y: [sellBottom, sellBottom, null, buyTop, buyTop],
        line: { color: term.color, width: 1, dash: 'dash' }, hoverinfo: 'skip' });
    }
    if (on('Range')) {
      traces.push({ type: 'scatter', mode: 'lines', fill: 'toself', hoveron: 'fills+points', name: term.name, ...box(g, until, g.high.price, g.low.price),
        line: { color: term.color, width: 1.5 }, fillcolor: withAlpha(term.color, 0.08), hovertemplate: `${rangeHover(g)}<extra></extra>` });
    }
    if (on('rangeBands') || on('rangeZones')) {
      traces.push({ type: 'scatter', mode: 'lines', name: 'Range band', x: [g.identified.time, until, null, g.identified.time, until], y: [g.bandHigh, g.bandHigh, null, g.bandLow, g.bandLow],
        line: { color: term.color, width: 1, dash: 'dash' }, hovertemplate: `Range band · level ${g.level}<br>${fmtPrice(g.bandLow)} to ${fmtPrice(g.bandHigh)}: a close beyond ends the range<extra></extra>` });
    }
  }
}

// Hindsight events at a level, keyed like live events, so each live event can say whether hindsight agrees.
function hindsightKeys(ex, level) {
  const keys = new Set();
  for (const w of ex.swingsByLevel?.[level] ?? []) keys.add(`${w.direction === 'Up' ? 'BullishBreakOfStructure' : 'BearishBreakOfStructure'}|${w.breakOfStructure.time}`);
  for (const m of ex.marketStructureBreaksByLevel?.[level] ?? []) keys.add(`${m.type}|${m.break.time}`);
  for (const t of ex.trendsByLevel?.[level] ?? []) keys.add(`${t.direction === 'Up' ? 'Uptrend' : 'Downtrend'}|${t.confirmed.time}`);
  return keys;
}

// A trend as a strip along the top (up) or bottom (down) of the chart, from its first swing to the swing that ended it: a
// segment for each of its swings, paler for a weak one, and faint after the last, where no swing has broken structure yet.
// With several levels selected, each level that has a trend that way has a strip of its own, the coarsest at the edge, and
// each strip carries a thin stripe in its level's colour on its outer side. Together they keep within the room the chart
// leaves around the prices, so the strips get thinner as there are more of them.
const TREND_STRIP = 0.035, TREND_ROOM = 0.054, TREND_STRIPE = 0.22;
const trendStrip = (x0, x1, a, b, fillcolor, line) => ({ type: 'rect', xref: 'x', yref: 'paper', x0, x1, y0: Math.min(a, b), y1: Math.max(a, b), line, fillcolor, layer: 'below' });

// The strips for one direction: a row for each selected level that has a trend that way, or in a replay with ghost trends
// on, one that has been taken back. Outer is the row's side at the chart's edge, edge where its stripe ends and its
// segments begin, inner its other side.
function trendRows(ex, direction) {
  const up = direction === 'Up', levels = [...swingLevels(ex)].sort((a, b) => a - b);
  const live = on(up ? 'Uptrend' : 'Downtrend'), ghosts = ex.timeline && on('ghostTrends');
  const rows = levels.map(level => ({ level,
    trends: live ? (ex.trendsByLevel?.[level] ?? []).filter(t => t.direction === direction) : [],
    ghosts: ghosts ? ex.timeline.trends.filter(e => e.value.level === level && e.value.direction === direction && e.ended === 'Removed' && e.until <= ex.cursor) : [],
  })).filter(row => row.trends.length || row.ghosts.length);
  const height = Math.min(TREND_STRIP * rows.length, TREND_ROOM) / Math.max(1, rows.length), stripe = levels.length > 1 ? height * TREND_STRIPE : 0;
  return rows.map((row, i) => {
    const outer = up ? 1 - i * height : i * height;
    return { ...row, outer, edge: up ? outer - stripe : outer + stripe, inner: up ? outer - height : outer + height, striped: stripe > 0 };
  });
}

function trendShapes(ex) {
  const last = ex.prices.t[ex.prices.t.length - 1], gap = css('--panel');
  return ['Up', 'Down'].flatMap(direction => {
    const color = TERMS.get(direction === 'Up' ? 'Uptrend' : 'Downtrend').color;
    return trendRows(ex, direction).flatMap(row => row.trends.flatMap(t => {
      const parts = t.parts ?? [], end = t.end?.time ?? last;
      const from = parts.length ? parts[parts.length - 1].breakOfStructure.time : t.start.time;
      const segment = (x0, x1, alpha) => trendStrip(x0, x1, row.edge, row.inner, withAlpha(color, alpha), { width: 1, color: gap });
      return [...(row.striped ? [trendStrip(t.start.time, end, row.outer, row.edge, levelColor(row.level), { width: 0 })] : []),
        ...parts.map((p, k) => segment(k ? parts[k - 1].breakOfStructure.time : t.start.time, p.breakOfStructure.time, p.strong ? 0.6 : 0.25)),
        ...(Date.parse(from) < Date.parse(end) ? [segment(from, end, 0.1)] : [])];
    }));
  });
}

// A trend as an arrow in its level's colour, from where its first swing starts to its latest break of structure, with its
// count of swings and its strength in a box: the share of its swings that are strong. Drawn at every level selected.
// An arrow from one point to another with a text box along it: how candle runs, trend arrows and the tour's drawn lines
// are shown. A head at either end is optional, the box sits the given way along, and the hover is on both.
function arrowLabels(labels, { from, to, color, text = '', hover = '', along = 0.5, heads = { start: false, end: true }, width = 2, opacity = 0.9, size = 10 }) {
  labels.push({ x: to.time, y: to.price, ax: from.time, ay: from.price, axref: 'x', ayref: 'y', text: '', showarrow: true,
    arrowhead: heads.end ? 2 : 0, startarrowhead: heads.start ? 2 : 0, arrowsize: 1.2, startarrowsize: 1.2, arrowwidth: width, arrowcolor: color, hovertext: hover, opacity });
  if (!text) return;
  const t0 = Date.parse(from.time), at = new Date(t0 + (Date.parse(to.time) - t0) * along).toISOString();
  labels.push({ x: at, y: from.price + (to.price - from.price) * along, text, showarrow: false, hovertext: hover,
    bgcolor: withAlpha(css('--panel'), 0.85), bordercolor: color, borderwidth: 1.5, borderpad: 2, font: { size, color: css('--text') } });
}

function drawTrendArrows(ex, labels) {
  if (!on('trendArrows')) return;
  for (const level of swingLevels(ex)) {
    for (const t of ex.trendsByLevel?.[level] ?? []) {
      const tip = t.parts?.[t.parts.length - 1]?.breakOfStructure;
      if (!tip) continue;
      const hover = `${t.direction === 'Up' ? 'Uptrend' : 'Downtrend'} · level ${level}<br>${t.swings} swings, ${t.strong} strong · strength ${t.strength}%<br>${t.marketStructureBreaks} MSB against`;
      // The box sits towards the arrow's head, where a long trend is usually being looked at.
      arrowLabels(labels, { from: t.start, to: tip, color: levelColor(level), text: `${t.swings} · ${t.strength}%`, hover, along: 0.8, size: 11 });
    }
  }
}

// The lines a tour draws by hand: a cue with "to" is an arrow from its candle to another, with the text in a box along it.
function drawTourLines(ex, labels) {
  for (const line of ex.lines ?? []) {
    const color = { up: css('--up'), down: css('--down'), accent: css('--accent') }[line.color] ?? line.color ?? css('--accent');
    arrowLabels(labels, { from: line.from, to: line.to, color, text: line.text, heads: line.heads, width: 3, opacity: 1, size: 12 });
  }
}

function owningSwing(ex, a) {
  const at = { BullishBreakOfStructure: w => w.breakOfStructure, BearishBreakOfStructure: w => w.breakOfStructure, Upswing: w => w.start, Downswing: w => w.start }[a.type];
  return at && shownSwings(ex).find(w => w.direction === a.direction && at(w)?.time === a.time);
}

let layoutMode = '';

function drawAll(page) {
  document.body.classList.toggle('replaying', on('replay'));
  document.body.classList.toggle('show-eventlog', on('eventlog'));
  if (!on('replay')) stopPlaying();
  // Showing or hiding the event panel changes the chart's width, which Plotly only notices on a window resize.
  const mode = `${on('replay')}|${on('eventlog')}|${page === 'Tour' && editorOn()}`, resized = mode !== layoutMode;
  layoutMode = mode;
  document.querySelectorAll('.chart').forEach(el => {
    draw(el, viewFor(findExample(el.dataset.id)), focusOf(page));
    if (resized) Plotly.Plots.resize(el);
  });
  renderEventLog(activeExample());
  updateReplayControls();
}

const focusOf = page => STRUCTURE_PAGES.includes(page) ? null : page;

// ---- Replay ----------------------------------------------------------------------------------------------------------
// Everything shown while replaying comes from the C# timeline (ex.replay), computed candle by candle from the prices up to
// each candle. The page only picks the entries that hold at the cursor; it adds no structure logic of its own.

const HOUR = 3600e3, DAY = 24 * HOUR;
const SPEEDS = [1, 2, 5, 10];
const cursors = new Map();
const logSelected = new Map();
let activeId = null;
let player = null;

// ---- Local server --------------------------------------------------------------------------------------------------
// Served by build-site.ps1 -Serve, the page can also replay datasets too long to build into it. The server returns the same
// timeline shape in batches of candles; the page caches them, fetches ahead while playing, and shows a moving window.
const REMOTE_BATCH = 50, REMOTE_FUTURE = 48, REMOTE_AHEAD = 25;
// How much history a long replay shows before the cursor; the server keeps up to a month (744 candles) per batch.
const REPLAY_WINDOWS = [{ label: '1 day', candles: 24 }, { label: '1 week', candles: 168 }, { label: '2 weeks', candles: 336 }, { label: '1 month', candles: 720 }];
const replayWindow = () => REPLAY_WINDOWS.find(w => w.candles === state.replayWindow)?.candles ?? 336;
let serverOn = false;
const remote = new Map();
if (location.protocol.startsWith('http'))
  fetch('api/health').then(r => { if (r.ok) { serverOn = true; route(); } }).catch(() => { });

const isRemote = ex => !ex?.replay && serverOn && !!ex?.dataset;
const batchStart = t => Math.floor(t / REMOTE_BATCH) * REMOTE_BATCH;

// The batch holding candle t: returns it when loaded, starts fetching it otherwise.
function fetchBatch(ex, t) {
  const start = batchStart(t);
  if (start < 0 || start >= ex.prices.t.length) return Promise.resolve(null);
  const cache = remote.get(ex.id) ?? remote.set(ex.id, new Map()).get(ex.id);
  if (!cache.has(start)) {
    const anchor = ex.anchor ? `&anchor=${ex.anchor}` : '';
    const request = fetch(`api/replay?dataset=${encodeURIComponent(ex.dataset)}&from=${start}${anchor}${rangeQuery()}`).then(r => r.json()).then(batch => {
      // A server started before anchors existed ignores the anchor: its batch is of other candles, so its structure is dropped.
      if ((batch.anchor ?? 0) !== (ex.anchor ?? 0)) {
        ex.unanchored = true;
        batch.timeline = { pivots: [], swings: [], candidates: [], marketStructureBreaks: [], trends: [], points: [], candleRuns: [] };
      }
      // A server from before retracements and ranges has neither.
      batch.timeline.retracements ??= [];
      batch.timeline.ranges ??= [];
      cache.set(start, batch);
      if (Math.abs(batchStart(cursorOf(ex)) - start) <= REMOTE_BATCH) redrawExample(ex);
      return batch;
    }).catch(() => { cache.delete(start); return null; });
    cache.set(start, request);
  }
  return Promise.resolve(cache.get(start));
}

function loadedBatch(ex, t) {
  const batch = remote.get(ex.id)?.get(batchStart(t));
  return batch && !(batch instanceof Promise) ? batch : null;
}

function loadedBatches(ex) {
  return [...(remote.get(ex.id)?.values() ?? [])].filter(b => !(b instanceof Promise)).sort((a, b) => a.from - b.from);
}

// Keeps the batch at the cursor loaded, and the next one once the cursor is within REMOTE_AHEAD candles of it.
function prefetch(ex, t) {
  if (!isRemote(ex)) return;
  fetchBatch(ex, t);
  const start = batchStart(t);
  if (t - start >= REMOTE_BATCH - REMOTE_AHEAD) fetchBatch(ex, start + REMOTE_BATCH);
  if (t - start < 5 && start > 0) fetchBatch(ex, start - 1);
}

const timelineAt = (ex, t) => ex.replay ?? loadedBatch(ex, t)?.timeline ?? null;

const hasReplay = ex => !!ex?.replay || isRemote(ex);
const cursorOf = ex => cursors.get(ex.id) ?? ex.prices.t.length - 1;
const viewFor = ex => on('replay') && hasReplay(ex) ? liveView(ex, cursorOf(ex)) : ex;
const holdsAt = t => e => e.from <= t && (e.until == null || e.until > t);
const activeExample = () => findExample(activeId);
const speed = () => SPEEDS.includes(state.replaySpeed) ? state.replaySpeed : 2;

function chartRow(ex) {
  return `<div class="chart" data-id="${esc(ex.id)}"></div>`;
}

// The finest level the section on show draws, which its own Swings are at.
const revealLevel = () => Math.max(-Infinity, ...(tour?.sections[tour.index]?.layers ?? []).filter(id => /^level\d+$/.test(id)).map(id => Number(id.slice(5))));

// A Trend as it stood at a time: only its Swings whose BoS has come, with its count and Strength from those. Strength is
// the share of them that are Strong, rounded down, as CryptoAnalysis works it out.
function trendSoFar(tr, time) {
  const parts = (tr.parts ?? []).filter(p => p.breakOfStructure.time <= time);
  if (parts.length === (tr.parts ?? []).length) return tr;
  const strong = parts.filter(p => p.strong).length;
  return { ...tr, parts, swings: parts.length, strong, strength: parts.length ? Math.floor(strong * 100 / parts.length) : 0 };
}

// The structure as known at candle t: the timeline entries that hold there, shaped like the hindsight data so draw() can use it.
// While a tour that has a known candle plays, as an analysis does, the structure is the one its texts are written from (as
// known there), drawn a part at a time: each part once the cursor has reached its candle, so the sawtooth, points and Swings
// come as the run goes.
function liveView(ex, t) {
  const told = tour?.ex === ex && tour.known != null && t <= tour.known && timelineAt(ex, tour.known) ? tour.known : null;
  const reveal = told != null, r = timelineAt(ex, told ?? t), holds = holdsAt(told ?? t), time = ex.prices.t[t];
  // A long replay shows a moving window: recent candles up to the cursor, and a little of what is to come.
  const window = ex.tour ? tourWindow(ex, t)
    : isRemote(ex) ? { from: Math.max(0, t - replayWindow()), to: Math.min(ex.prices.t.length - 1, t + REMOTE_FUTURE) } : null;
  const cut = a => a.slice(window?.from ?? 0, t + 1);
  const prices = { t: cut(ex.prices.t), o: cut(ex.prices.o), h: cut(ex.prices.h), l: cut(ex.prices.l), c: cut(ex.prices.c) };
  if (!r) {
    prefetch(ex, t);
    return { ...ex, hindsight: ex, cursor: t, window, loading: true, timeline: null, prices, sawtooth: [], swingsByLevel: [], pointsByLevel: [],
      marketStructureBreaksByLevel: [], trendsByLevel: [], candidatesByLevel: [], retracementsByLevel: [], rangesByLevel: [], candleRuns: [], liveByLevel: null };
  }
  const byLevel = (entries, value) => {
    const out = [];
    for (const e of entries) if (holds(e)) (out[e.value.level] ??= []).push(value(e.value));
    return out;
  };
  const reached = (list, when) => reveal ? list.filter(v => when(v) <= time) : list;
  const open = v => reveal && v.end && v.end.time > time ? { ...v, end: null } : v;
  const sawtooth = byLevel(r.pivots, v => v.pivot).map(pivots => {
    if (reveal) pivots = pivots.filter(p => p.index <= t);
    if (!pivots.length) return [];
    pivots.sort((a, b) => a.index - b.index);
    const out = pivots.map(p => ({ kind: p.kind, time: p.time, price: p.price, confirmedTime: p.confirmedIndex != null ? ex.prices.t[p.confirmedIndex] : null }));
    // The timeline leaves out the current price: it is this candle's close, unless the level already ends here.
    if (pivots[pivots.length - 1].index < t) out.push({ kind: 'Current', time, price: ex.prices.c[t], confirmedTime: null });
    return out;
  });
  return {
    ...ex, hindsight: ex, cursor: t, window, timeline: reveal ? timelineAt(ex, t) ?? r : r,
    prices,
    sawtooth,
    // A Swing comes at its BoS; one of a coarser level than the section's own, which holds it, as soon as it has begun.
    swingsByLevel: byLevel(r.swings, v => v).map((list, level) => reached(list, w => (level < revealLevel() ? w.start : w.breakOfStructure ?? w.end ?? w.start).time).sort((a, b) => a.start.time.localeCompare(b.start.time))),
    pointsByLevel: byLevel(r.points, v => v).map(list => reached(list, p => p.time).sort((a, b) => a.time.localeCompare(b.time))),
    marketStructureBreaksByLevel: byLevel(r.marketStructureBreaks, v => v.break).map(list => reached(list, m => m.break.time)),
    // A Trend grows as its Swings are reached: the count, Strength and arrow are of the Swings whose BoS the cursor has
    // passed, so it reads two, then three, and so on, rather than what it had by the analysis's cursor.
    trendsByLevel: byLevel(r.trends, v => v).map(list => reached(list, tr => tr.confirmed.time).map(open).map(tr => reveal ? trendSoFar(tr, time) : tr)),
    candidatesByLevel: reveal ? [] : byLevel(r.candidates, v => v),
    retracementsByLevel: byLevel(r.retracements ?? [], v => v).map(list => reveal
      ? list.map(v => ({ ...v, steps: v.steps.filter(s => s.point.time <= time) })).filter(v => v.to.time <= time && v.steps.length) : list),
    rangesByLevel: byLevel(r.ranges ?? [], v => v).map(list => reached(list, g => g.identified.time).map(open)),
    candleRuns: reached(r.candleRuns.filter(holds).map(e => e.value), run => run.end.time),
    liveByLevel: ex.liveByLevel?.map(events => events.filter(e => e.time <= time)),
  };
}

// Candidates, ghosts, future candles, unbroken protective levels, the cursor line and the selected log entry.
function drawReplayExtras(ex, traces, level) {
  const t = ex.cursor, full = ex.hindsight, r = ex.timeline, now = full.prices.t[t];
  // The cursor is a faint dotted line, so the wick of the candle it stands on shows through it.
  const shapes = [{ type: 'line', xref: 'x', yref: 'paper', x0: now, x1: now, y0: 0, y1: 1, layer: 'below',
    line: { color: withAlpha(css('--accent'), 0.6), width: 1, dash: 'dot' } }];
  const box = (start, end, a, b) => ({ x: [start, end, end, start, start], y: [a, a, b, b, a] });

  if (on('future') && t + 1 < full.prices.t.length) {
    const rest = a => a.slice(t + 1, ex.window ? ex.window.to + 1 : undefined), grey = css('--close');
    traces.push({ type: 'candlestick', name: 'Future', x: rest(full.prices.t), open: rest(full.prices.o), high: rest(full.prices.h), low: rest(full.prices.l), close: rest(full.prices.c),
      opacity: 0.3, increasing: { line: { color: grey, width: 1 }, fillcolor: withAlpha(grey, 0.3) }, decreasing: { line: { color: grey, width: 1 }, fillcolor: withAlpha(grey, 0.6) }, hoverinfo: 'skip' });
  }
  if (!r) return shapes;

  if (on('candidates')) {
    for (const c of ex.candidatesByLevel?.[level] ?? []) {
      const color = css(SWINGS[c.direction].color), up = c.direction === 'Up';
      traces.push({ type: 'scatter', mode: 'lines', fill: 'toself', hoveron: 'fills+points', name: 'Candidate swing',
        ...box(c.start.time, now, c.start.price, c.extreme.price), line: { color, width: 1.5, dash: 'dash' }, fillcolor: withAlpha(color, 0.04),
        hovertemplate: `Candidate ${up ? 'upswing' : 'downswing'} · level ${c.level}<br>${up ? 'high' : 'low'} ${fmtPrice(c.start.price)} · ${up ? 'pullback low' : 'bounce high'} so far ${fmtPrice(c.extreme.price)}` +
          `<br>Becomes a swing on a close ${up ? 'above' : 'below'} ${fmtPrice(c.start.price)}<extra></extra>` });
      traces.push({ type: 'scatter', mode: 'lines', name: 'Level to break', x: [c.start.time, now], y: [c.start.price, c.start.price], hoverinfo: 'skip',
        line: { color: TERMS.get(up ? 'BullishBreakOfStructure' : 'BearishBreakOfStructure').color, width: 1.5, dash: 'dot' } });
    }
  }

  // Protective levels that have not broken yet run on to the cursor, at every level selected.
  const levels = selectedLevels(ex);
  for (const [layer, dir, type] of [['msbLevelDown', 'Up', 'BearishMarketStructureBreak'], ['msbLevelUp', 'Down', 'BullishMarketStructureBreak']]) {
    if (!on(layer)) continue;
    for (const l of levels) {
      const latest = (ex.swingsByLevel?.[l] ?? []).filter(w => w.direction === dir)
        .sort((a, b) => a.breakOfStructure.time.localeCompare(b.breakOfStructure.time)).pop();
      if (!latest || (ex.marketStructureBreaksByLevel?.[l] ?? []).some(m => m.reference.time === latest.extreme.time)) continue;
      referenceLines(traces, 'Protective level', TERMS.get(type).color, 'dot',
        [{ from: latest.breakOfStructure, to: { time: now }, level: latest.extreme.price, what: `level ${l} ${dir === 'Up' ? 'pullback low' : 'bounce high'} not broken yet` }]);
    }
  }

  // Each kind of ghost is a layer of its own, so a ghost swing can be shown without the ghost of something else. A ghost
  // is drawn at the levels its kind is: swings, market structure breaks, points and trends at every level selected,
  // candidates at the finest.
  {
    const grey = css('--close'), removed = e => e.ended === 'Removed' && e.until <= t, gone = e => e.value.level === level && removed(e);
    const when = e => fmtTime(full.prices.t[e.until]);
    for (const e of on('ghostSwings') ? r.swings.filter(e => swingLevels(ex).includes(e.value.level) && removed(e)) : []) {
      const w = e.value;
      traces.push({ type: 'scatter', mode: 'lines', fill: 'toself', hoveron: 'fills+points', name: 'Ghost swing', ...box(w.start.time, w.end.time, w.start.price, w.extreme.price),
        line: { color: grey, width: 1, dash: 'dot' }, fillcolor: withAlpha(grey, 0.08),
        hovertemplate: `Ghost: ${w.direction === 'Up' ? 'upswing' : 'downswing'} from ${fmtPrice(w.start.price)}<br>removed ${when(e)}, when a later new high redrew the levels<extra></extra>` });
    }
    for (const e of on('ghostCandidates') ? r.candidates.filter(gone) : []) {
      const c = e.value;
      traces.push({ type: 'scatter', mode: 'lines', name: 'Ghost candidate', ...box(c.start.time, full.prices.t[e.until - 1], c.start.price, c.extreme.price),
        line: { color: grey, width: 1, dash: 'dash' },
        hovertemplate: `Ghost: abandoned candidate ${c.direction === 'Up' ? 'upswing' : 'downswing'} from ${fmtPrice(c.start.price)}<br>gone ${when(e)}<extra></extra>` });
    }
    // A market structure break that left one level is often found at the next: its ghost is then drawn larger, around the
    // one that is there now.
    const msbs = on('ghostMsbs') ? r.marketStructureBreaks.filter(e => levels.includes(e.value.level) && removed(e)) : [];
    const there = new Set(shownMarketStructureBreaks(ex).map(m => `${m.type}|${m.break.time}`));
    if (msbs.length) traces.push({ type: 'scatter', mode: 'markers', name: 'Ghost MSB', x: msbs.map(e => e.value.break.break.time), y: msbs.map(e => e.value.break.break.price),
      marker: { symbol: msbs.map(e => TERMS.get(e.value.break.type).symbol), size: msbs.map(e => there.has(`${e.value.break.type}|${e.value.break.break.time}`) ? 27 : 15),
        color: grey, line: { width: 1.5, color: grey } },
