        <select data-cell-role="${m.group}:${year}" aria-label="Role of ${year}">${Object.entries(ROLE_NAMES).map(([r, name]) => `<option value="${r}" ${r === y.role ? 'selected' : ''}>${name}</option>`).join('')}</select></div>
      <div class="strat-cell-result">${result}</div>
      ${y.role === 'test' ? `<div class="strat-cell-note">Looked at ${y.testRuns}×</div>` : ''}</td>`;
  };
  return `<div class="strat-grid-wrap"><table class="strat-grid">
      <thead><tr><th></th>${markets.map(m => `<th><button type="button" data-tick-market="${m.id}" title="Tick or untick all of this market's periods">${esc(m.name)}</button></th>`).join('')}</tr></thead>
      <tbody>${years.map(year => `<tr><th><button type="button" data-tick-year="${year}" title="Tick or untick this year in every market">${year}</button></th>${markets.map(m => cell(m, year)).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <p class="remarks">A cell is a year of a market: once run, <b>its score</b> (the share of its random runs it beats on Total %) · its total after costs · its trades;
      click one to show its results on the page. Strategies are searched for on <b>Search</b> years, where sweeps run. <b>Test</b> years check what was found: each look is
      counted, as every look makes a good result there a little more likely by luck. <b>Locked</b> years are kept back for a final check, and run on nothing
      until unlocked. Roles are kept at once, and every change is logged.</p>`;
}

// The grid's ticks, roles and clicks: a tick runs on a period, a heading's on all of its row or column, a role is kept at
// once (unlocking only once confirmed, as it spends the period), and a click elsewhere in a cell shows its results.
function wireStrategyGrid(box, s) {
  const grid = box.querySelector('.strat-grid');
  if (!grid) return;
  const toggle = keys => {
    keys = keys.filter(runnable);
    const on = keys.some(k => !strategies.included.has(k));
    keys.forEach(k => on ? strategies.included.add(k) : strategies.included.delete(k));
    syncStrategiesHash();
    renderStrategyRun();
  };
  grid.querySelectorAll('[data-cell-tick]').forEach(el => el.addEventListener('change', () => toggle([el.dataset.cellTick])));
  grid.querySelectorAll('[data-tick-market]').forEach(el => el.addEventListener('click', () =>
    toggle(marketOf(el.dataset.tickMarket).years.map(y => cellKey(el.dataset.tickMarket, y.year)))));
  grid.querySelectorAll('[data-tick-year]').forEach(el => el.addEventListener('click', () =>
    toggle(strategies.markets.map(m => cellKey(m.id, Number(el.dataset.tickYear))).filter(yearOf))));
  grid.querySelectorAll('[data-cell-role]').forEach(el => el.addEventListener('change', async () => {
    const [group, year] = el.dataset.cellRole.split(':'), role = el.value;
    const was = strategies.markets.find(m => m.group === group)?.years.find(y => y.year === Number(year))?.role;
    if (was === 'locked' && !confirm(`Unlock ${year} of ${group}? It was kept back for a final check: once looked at, it can no longer give one. The unlocking is logged.`)) {
      el.value = was;
      return;
    }
    const response = await fetch('api/periods', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ group, year: Number(year), role }) }).catch(() => null);
    if (!response?.ok) alert(`The role was not kept: ${response ? await response.text() : 'the local server did not answer.'}`);
    await loadMarkets();
    [...strategies.included].filter(k => !runnable(k)).forEach(k => strategies.included.delete(k));
    syncStrategiesHash();
    renderStrategyRun();
  }));
  grid.addEventListener('click', e => {
    const td = e.target.closest('[data-cell]');
    if (!td || e.target.closest('input, select, button')) return;
    strategies.cell.set(s.id, td.dataset.cell);
    syncStrategiesHash();
    renderStrategyRun();
  });
}

// Where the strategy's totals sit among the random runs': a row a total, with the share of runs it beat. Beating 95% or
// more, or fewer than 5%, is outside what random entries with the same exits make nine times in ten.
function baselineResults(b) {
  if (b.error) return `<p class="remarks strat-note bad">${esc(b.error)}</p>`;
  const fmt = { 'Win rate': v => `${v.toFixed(1)}%`, 'Profit factor': v => v.toFixed(2), 'Average %': fmtPercent, 'Total %': fmtPercent };
  const show = (name, v) => v == null ? '–' : (fmt[name] ?? (x => x.toFixed(2)))(v);
  const verdict = p => p == null ? ['–', ''] : p >= 95 ? ['above random', 'won'] : p <= 5 ? ['below random', 'lost'] : ['within random', ''];
  const rows = b.measures.map(m => {
    const [says, cls] = verdict(m.percentile);
    return `<tr><td>${esc(m.name)}</td><td class="num">${show(m.name, m.strategy)}</td><td class="num">${show(m.name, m.median)}</td>
      <td class="num">${show(m.name, m.low)} to ${show(m.name, m.high)}</td><td class="num">${m.percentile == null ? '–' : `${Math.round(m.percentile)}%`}</td><td class="${cls}">${says}</td></tr>`;
  }).join('');
  return `<div class="strat-baseline">
    <p class="remarks">Against ${b.runs.toLocaleString()} runs entering at random candles, each tried by the chance the strategy's entry is met at
      (${b.signals.toLocaleString()} of ${b.candles.toLocaleString()} candles), with the strategy's exits. They made ${Math.round(b.averageTrades)} trades
      on average to its ${b.trades}. The table counts every trade; the graph's strategy lines count only those not left out below.${b.saved ? ` Saved to ${esc(b.saved)}.` : ''}</p>
    <table><thead><tr><th></th><th class="num">Strategy</th><th class="num">Random median</th><th class="num">Random 5% to 95%</th><th class="num">Beats</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>
    ${b.curve ? `<p class="remarks">Profit over time, as the sum of each closed trade's %: the strategy against the band nine random runs in ten stay within.
      With costs, the dashed line is the strategy before its fees and slippage, the gap to the solid line what they cost; the random runs pay the same costs.</p>
      <div class="strat-baseline-plot" data-baseline-plot></div>` : ''}</div>`;
}

// A line of a baseline's curve: one of its values at each point, as a % of profit.
const curveLine = (b, name, key, color, extra = {}) => ({ type: 'scatter', mode: 'lines', name, x: b.curve.map(p => p.time), y: b.curve.map(p => p[key]),
  line: { color, width: 2 }, hovertemplate: `${name}: %{y:+.1f}%<extra></extra>`, ...extra });

// The random runs of a baseline's curve: their band, 5% to 95%, with a legend entry of its own, and their median.
function bandTraces(b) {
  const muted = css('--muted');
  return [
    curveLine(b, 'Random 5%', 'low', 'rgba(0,0,0,0)', { showlegend: false }),
    curveLine(b, 'Random 95%', 'high', 'rgba(0,0,0,0)', { fill: 'tonexty', fillcolor: withAlpha(muted, 0.2), showlegend: false }),
    { type: 'scatter', mode: 'lines', name: 'Random 5% to 95%', x: [null], y: [null], line: { color: withAlpha(muted, 0.35), width: 10 }, hoverinfo: 'skip' },
    curveLine(b, 'Random median', 'median', muted, { line: { color: muted, width: 2, dash: 'dash' } }),
  ];
}

// The layout the baseline and sweep charts share, with the axes given.
function resultsLayout(xaxis, yaxis, extra = {}) {
  const muted = css('--muted'), grid = css('--grid') || css('--border');
  return {
    margin: { t: 10, r: 56, b: 36, l: 10 }, paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    font: { color: muted, family: 'system-ui, sans-serif', size: 12 },
    xaxis: { gridcolor: grid, linecolor: grid, ...xaxis }, yaxis: { gridcolor: grid, linecolor: grid, side: 'right', ...yaxis },
    showlegend: true, legend: { orientation: 'h', x: 0, y: 1.02, yanchor: 'bottom' }, ...extra,
  };
}

const RESULTS_CONFIG = { responsive: true, displaylogo: false, modeBarButtonsToRemove: ['select2d', 'lasso2d'] };

// The strategy's profit before fees and slippage, dashed, for the gap to the solid line to show what they cost; none when
// the strategy has no costs, or the baseline was run before there were any.
const grossLine = (b, name = 'Before fees and slippage') => b.curve.some(p => p.gross != null && Math.abs(p.gross - p.strategy) > 1e-9)
  ? [curveLine(b, name, 'gross', css('--accent'), { line: { color: css('--accent'), width: 2, dash: 'dash' } })] : [];

// The baseline's curve with the strategy's lines from the run's trades still counted, when some are left out: each closed
// trade's % added at its exit, after costs and before them. The random runs' band and median are theirs, and stay.
function countedCurve(b, run) {
  const off = run?.leftOut;
  if (!off?.size) return b;
  const closed = run.trades.filter(t => t.outcome !== 'Open' && !off.has(t.entryIndex))
    .map(t => ({ at: Date.parse(t.exitTime), net: t.profitPercent, gross: 100 * (t.profit + (t.fees ?? 0) + (t.slippage ?? 0)) / t.entryPrice }))
    .sort((a, c) => a.at - c.at);
  let k = 0, net = 0, gross = 0;
  const curve = b.curve.map(p => {
    for (const at = Date.parse(p.time); k < closed.length && closed[k].at <= at; k++) {
      net += closed[k].net;
      gross += closed[k].gross;
    }
    return { ...p, strategy: net, gross };
  });
  return { ...b, curve, counted: closed.length, closed: run.trades.filter(t => t.outcome !== 'Open').length };
}

// The baseline's curve: the strategy's profit over time on the band of the random runs', 5% to 95%, and their median, and
// what it would have been before fees and slippage; from the trades counted, when the run is given and some are left out.
function baselinePlot(el, b, run) {
  if (!el) return;
  b = countedCurve(b, run);
  const name = `Strategy, after fees and slippage${b.counted != null ? ` (${b.counted} of ${b.closed} trades)` : ''}`;
  Plotly.react(el, [...bandTraces(b), ...grossLine(b), curveLine(b, name, 'strategy', css('--accent'))],
    resultsLayout({ type: 'date' }, { ticksuffix: '%', zeroline: true, zerolinecolor: css('--muted') }, { hovermode: 'x unified' }), RESULTS_CONFIG);
}

// ---- Sweeps ----------------------------------------------------------------------------------------------------------
// A sweep (POST api/backtest/sweep, see StrategySweep) runs the strategy as it is here once for each combination of the
// numbers given a To and a Step, each against its own random baseline, on the period shown, which must be a Search one. It
// is kept by strategy until the next sweep.
async function runSweep(s) {
  strategies.sweeps ??= new Map();
  const plan = varyPlan(s), key = strategies.cell.get(s.id) ?? [...strategies.included].find(runnable);
  const refused = plan.error ?? (!key ? 'pick a period to sweep on, by clicking it in the grid.'
    : yearOf(key)?.role !== 'search' ? `${cellName(key)} is a ${ROLE_NAMES[yearOf(key)?.role] ?? ''} period, and sweeps search, so they run only on Search periods.` : null);
  if (refused) {
    strategies.sweeps.set(s.id, { error: `Not swept: ${refused}` });
    return renderStrategyRun();
  }
  strategies.sweeping = true;
  renderStrategyRun();
  // The strategy as it was swept, as the page keeps it, for a variation to be extracted from.
  const sent = structuredClone(s);
  const result = await postBacktest('api/backtest/sweep', { dataset: cellOf(key).market, ...cellWindow(key), strategy: sent }, 'sweeps');
  strategies.sweeping = false;
  strategies.sweeps.set(s.id, result.error ? { error: result.error.replace(/^Not run/, 'Not swept') } : { saved: result.saved, ...result.sweep, sent, cell: key });
  if (currentPage === 'Strategies' && selectedStrategy() === s) renderStrategyRun();
}

// A variation as its values: "Stop Loss Target (R) 1.5", or each of them for more than one varied.
const sweepLabel = (sw, v) => Object.entries(v.values).map(([path, value]) => `${varyLabel(sw.strategy, path)} ${value}`).join(' · ') || 'As it is';

// A total as the baseline's table shows it.
const showTotal = (name, v) => v == null ? '–' : name === 'Win rate' ? `${v.toFixed(1)}%` : name === 'Profit factor' ? v.toFixed(2) : fmtPercent(v);

// The sweep's results: where each variation's total beats its own random runs, by the value varied, and every variation's
// profit over time with the selected one on its band. The selected variation starts as the best by the measure shown, and
// a click on a dot or a line selects another; both charts are drawn again for it.
function renderSweep(el, sw) {
  if (!el || !sw) return;
  if (sw.error) { el.innerHTML = `<p class="remarks strat-note bad">${esc(sw.error)}</p>`; return; }
  const ran = sw.variations.map((v, i) => i).filter(i => sw.variations[i].baseline);
  if (!ran.length) { el.innerHTML = `<p class="remarks strat-note bad">No variation could be run: ${esc(sw.variations[0]?.error ?? '')}</p>`; return; }
  const measure = sw.measure ??= 'Total %', best = sw.best.find(b => b.against.name === measure);
  if (!ran.includes(sw.selected)) sw.selected = best?.variation ?? ran[0];
  const failed = sw.variations.filter(v => !v.baseline), data = datasetList?.find(d => d.id === sw.dataset);
  const own = i => sw.variations[i].baseline.measures.find(m => m.name === measure);
  const top = best?.variation != null ? `Best by ${measure}: ${sweepLabel(sw, sw.variations[best.variation])}, at ${showTotal(measure, best.against.strategy)}. It beats
    ${Math.round(own(best.variation).percentile ?? 0)}% of its own random runs, and ${Math.round(best.against.percentile ?? 0)}% of the best of ${ran.length} random runs,
    one from each variation, which is the fair test of a best picked from ${ran.length}.` : '';
  el.innerHTML = `<div class="strat-baseline">
    <p class="remarks">A sweep over ${esc(sw.cell ? cellName(sw.cell) : data?.name ?? sw.dataset)} of ${sw.variations.length} variations, each against its own ${sw.runs.toLocaleString()} random runs:
      ${esc(sw.varied.map(p => varyLabel(sw.strategy, p)).join(', '))}.${failed.length ? ` ${failed.length} could not be run: ${esc(sweepLabel(sw, failed[0]))}, ${esc(failed[0].error)}${failed.length > 1 ? ' and others' : ''}.` : ''}${sw.saved ? ` Saved to ${esc(sw.saved)}.` : ''}</p>
    <div class="strat-run"><label>Measure <select data-sweep-measure>${sw.best.map(b => `<option ${b.against.name === measure ? 'selected' : ''}>${esc(b.against.name)}</option>`).join('')}</select></label></div>
    <p class="remarks">${esc(top)}</p>
    <div class="strat-sweep-beats" data-sweep-beats></div>
    <p class="remarks">Profit over time of every variation, lighter to darker in the order of the values; the selected one bold, on its own random runs' band.
      Click a dot above or a line here to select another.</p>
    <div class="strat-baseline-plot" data-sweep-lines></div></div>
    ${sw.card ? sweepCard(sw, ran, measure) : ''}`;
  // A click on a dot or a line selects its variation and opens its card where the click was.
  const pick = (i, event) => {
    const box = el.getBoundingClientRect();
    sw.selected = i;
    // Kept inside the charts' width; the card is 260px wide and set 12px off the click.
    sw.card = event ? { x: Math.max(0, Math.min(event.clientX - box.left, box.width - 290)), y: event.clientY - box.top } : null;
    renderSweep(el, sw);
  };
  el.querySelector('[data-card-close]')?.addEventListener('click', () => { sw.card = null; renderSweep(el, sw); });
  el.querySelector('[data-extract]')?.addEventListener('click', () => extractVariation(sw, sw.selected));
  el.querySelector('[data-sweep-measure]').addEventListener('change', e => { sw.measure = e.target.value; sw.selected = null; sw.card = null; renderSweep(el, sw); });
  sweepBeatsPlot(el.querySelector('[data-sweep-beats]'), sw, ran, measure, best, pick);
  sweepLinesPlot(el.querySelector('[data-sweep-lines]'), sw, ran, pick);
}

// Each variation's share of its own random runs it beats on the measure, by the value varied (or by the variation, when
// more than one number is varied), with the lines a variation must clear to be promising (90%) or above random (95%), and
// the best variation against the best of the random runs.
function sweepBeatsPlot(el, sw, ran, measure, best, pick) {
  const muted = css('--muted'), accent = css('--accent'), single = sw.varied.length === 1;
  const xOf = i => single ? sw.variations[i].values[sw.varied[0]] : sweepLabel(sw, sw.variations[i]);
  const m = i => sw.variations[i].baseline.measures.find(x => x.name === measure);
  const x = ran.map(xOf), y = ran.map(i => m(i).percentile);
  const text = ran.map(i => `${sweepLabel(sw, sw.variations[i])}<br>${measure} ${showTotal(measure, m(i).strategy)}, random median ${showTotal(measure, m(i).median)}<br>Beats ${Math.round(m(i).percentile ?? 0)}% of its random runs`);
  // The two lines are close, so one's label sits below it on the left and the other's above it on the right.
  const guide = (y, dash, label, side) => ({ shape: { type: 'line', xref: 'paper', x0: 0, x1: 1, y0: y, y1: y, line: { color: muted, width: 1, dash } },
    note: { xref: 'paper', x: side === 'left' ? 0 : 1, y, yanchor: side === 'left' ? 'top' : 'bottom', xanchor: side, showarrow: false, text: label, font: { size: 11, color: muted } } });
  const guides = [guide(90, 'dot', 'Promising, 90%', 'left'), guide(95, 'dash', 'Above random, 95%', 'right')];
  const traces = [
    { type: 'scatter', mode: 'lines+markers', name: 'Beats % of its own random runs', x, y, text, customdata: ran, hovertemplate: '%{text}<extra></extra>',
      line: { color: accent, width: 2 }, marker: { size: 9, color: accent, line: { color: css('--panel'), width: 2 } } },
    { type: 'scatter', mode: 'markers', name: 'Selected', x: [xOf(sw.selected)], y: [m(sw.selected).percentile], hoverinfo: 'skip',
      marker: { size: 17, color: 'rgba(0,0,0,0)', line: { color: css('--text'), width: 2 } } },
  ];
  if (best?.variation != null) traces.push({ type: 'scatter', mode: 'markers', name: `Best against the best of ${ran.length} random`, x: [xOf(best.variation)], y: [best.against.percentile],
    hovertemplate: `Best, ${sweepLabel(sw, sw.variations[best.variation])}: beats ${Math.round(best.against.percentile ?? 0)}% of the best of ${ran.length} random runs<extra></extra>`,
    marker: { symbol: 'diamond-open', size: 13, color: muted, line: { width: 2 } } });
  Plotly.react(el, traces, resultsLayout(
    single ? { title: { text: varyLabel(sw.strategy, sw.varied[0]), font: { size: 12 } } } : { type: 'category', tickangle: -30 },
    { range: [-2, 102], ticksuffix: '%', title: { text: 'Beats', font: { size: 12 } } },
    { hovermode: 'closest', shapes: guides.map(g => g.shape), annotations: guides.map(g => g.note) }), RESULTS_CONFIG);
  el.on('plotly_click', e => { const p = e.points?.[0]; if (p?.curveNumber === 0) pick(p.customdata, e.event); });
}

// Where a variation ranks among those run, by how much of its own random runs it beats on the measure: 1 for the best, a
// tie sharing the better rank, and one with no value for the measure after all that have one.
function sweepRank(sw, ran, measure, i) {
  const beats = j => sw.variations[j].baseline.measures.find(m => m.name === measure)?.percentile ?? -1;
  return 1 + ran.filter(j => beats(j) > beats(i)).length;
}

// The selected variation's card, where it was clicked: its rank of all run, its total and how much of its random runs it
// beats, and Extract, to make it a strategy of its own.
function sweepCard(sw, ran, measure) {
  const v = sw.variations[sw.selected], m = v.baseline.measures.find(x => x.name === measure);
  return `<div class="strat-sweep-card" style="left:${Math.round(sw.card.x)}px;top:${Math.round(sw.card.y)}px" role="dialog" aria-label="${esc(sweepLabel(sw, v))}">
    <button type="button" class="close" data-card-close aria-label="Close">×</button>
    <b>${esc(sweepLabel(sw, v))}</b>
    <div class="rank">${sweepRank(sw, ran, measure, sw.selected)} / ${ran.length}</div>
    <div>Ranked by the share of its random runs it beats on ${esc(measure)}. ${esc(measure)} ${showTotal(measure, m.strategy)}, beating ${Math.round(m.percentile ?? 0)}%.</div>
    <button type="button" data-extract>Extract as a strategy</button>
  </div>`;
}

// Makes a variation a strategy of its own: the strategy as it was swept, with the variation's values and nothing varied,
// added after the one swept and opened, unsaved, as Duplicate does.
function extractVariation(sw, i) {
  const v = sw.variations[i], s = structuredClone(sw.sent);
  delete s.vary;
  for (const [path, value] of Object.entries(v.values)) {
    const parts = path.split('.'), key = parts.pop();
    parts.reduce((o, k) => o[k], s)[key] = value;
  }
  s.name = `${sw.sent.name || sw.sent.id} (${sweepLabel(sw, v)})`;
  // The id names the saved runs' files, so it is the swept one's with the variation's number rather than all its values.
  s.id = newStrategyId(`${sw.sent.id} variation ${i + 1}`);
  const list = strategies.book.strategies, from = list.findIndex(x => x.id === sw.sent.id);
  list.splice(from < 0 ? list.length : from + 1, 0, s);
  strategies.selected = s.id;
  renderStrategyList();
  renderStrategy();
  window.scrollTo(0, 0);
}

// Every variation's profit over time, lighter to darker in order, and the selected one bold on its own band and median.
function sweepLinesPlot(el, sw, ran, pick) {
  const accent = css('--accent'), selected = sw.variations[sw.selected].baseline;
  const lines = ran.filter(i => i !== sw.selected).map(i => {
    const color = withAlpha(accent, 0.15 + 0.5 * (ran.length > 1 ? ran.indexOf(i) / (ran.length - 1) : 1));
    return curveLine(sw.variations[i].baseline, sweepLabel(sw, sw.variations[i]), 'strategy', color, { showlegend: false, meta: i, line: { color, width: 1.5 } });
  });
  Plotly.react(el, [
    ...bandTraces(selected),
    { type: 'scatter', mode: 'lines', name: 'Other variations', x: [null], y: [null], line: { color: withAlpha(accent, 0.4), width: 1.5 }, hoverinfo: 'skip' },
    ...lines,
    ...grossLine(selected, 'Selected, before fees and slippage').map(t => ({ ...t, meta: sw.selected })),
    curveLine(selected, `Selected: ${sweepLabel(sw, sw.variations[sw.selected])}`, 'strategy', accent, { line: { color: accent, width: 3 }, meta: sw.selected }),
  ], resultsLayout({ type: 'date' }, { ticksuffix: '%', zeroline: true, zerolinecolor: css('--muted') }, { hovermode: 'closest' }), RESULTS_CONFIG);
  el.on('plotly_click', e => { const meta = e.points?.[0]?.data?.meta; if (meta != null) pick(meta, e.event); });
}

// Prices as the chart is read: whole numbers, rounded down. Profits are rounded, as they can be small and either side of 0.
const wholePrice = p => String(Math.floor(p));
const fmtProfit = p => `${p > 0 ? '+' : ''}${Math.round(p)}`;
const fmtPercent = p => `${p > 0 ? '+' : ''}${p.toFixed(2)}%`;
const OUTCOMES = { TakeProfit: 'Take Profit', StopLoss: 'Stop Loss', Open: 'Open' };

// A run's totals, its trades in the table, and which are counted: every trade until one is left out with its ● (an outlier,
// say), or the * trades all at once, whose candle reached both exits and so are counted as stopped when they may have won.
function strategyResults(run) {
  const off = run.leftOut ?? new Set(), counted = run.trades.filter(t => !off.has(t.entryIndex));
  const m = off.size ? summariseTrades(counted) : run.summary, data = datasetList?.find(d => d.id === run.dataset);
  const starred = run.trades.filter(t => t.bothTouched), starredIn = starred.filter(t => !off.has(t.entryIndex)).length;
  const stat = (label, value, cls = '') => `<div><span>${label}</span><b class="${cls}">${value}</b></div>`;
  const sign = tradeSign;
  const shown = sortTradeRows(run.trades.map(t => ({ ...tradeRow(t), out: off.has(t.entryIndex) })), run.sort).slice(0, TRADE_SHOWN);
  return `<p class="remarks">${esc(data?.name ?? run.dataset)}: ${run.candles.toLocaleString()} candles, ${esc(fmtTime(run.from))} to ${esc(fmtTime(run.to))} UTC.</p>
    <div class="strat-stats">
      ${stat('Trades', m.trades)}${stat('Won', m.won, 'won')}${stat('Lost', m.lost, 'lost')}${stat('Win rate', `${m.winRate.toFixed(1)}%`)}
      ${stat('Total profit', fmtProfit(m.totalProfit), sign(m.totalProfit))}${stat('Total %', fmtPercent(m.totalProfitPercent), sign(m.totalProfitPercent))}
      ${stat('Average win', fmtProfit(m.averageWin), 'won')}${stat('Average loss', fmtProfit(m.averageLoss), 'lost')}
      ${stat('Largest win', fmtProfit(m.largestWin), 'won')}${stat('Largest loss', fmtProfit(m.largestLoss), 'lost')}
      ${stat('Profit factor', m.profitFactor == null ? '–' : m.profitFactor.toFixed(2))}${stat('Still open', m.stillOpen)}${stat('Reached both', m.bothTouched)}
      ${stat('Fees and slippage', (m.fees ?? 0) + (m.slippage ?? 0) > 0 ? fmtProfit(-(m.fees + m.slippage)) : 'none', (m.fees ?? 0) + (m.slippage ?? 0) > 0 ? 'lost' : '')}
    </div>
    <div class="strat-counted">
      <span>${off.size ? `Counting ${counted.length} of ${run.trades.length} trades: ${off.size} left out.` : `Counting all ${run.trades.length} trades. Click a ● to leave a trade out of the totals.`}</span>
      ${starred.length ? `<button type="button" data-include-both title="Trades whose exit candle reached both the Take Profit and the Stop Loss: counted as stopped, though they may have won">${starredIn ? `Leave out the ${starredIn} * trades` : `Count the ${starred.length} * trades again`}</button>` : ''}
      ${off.size ? '<button type="button" data-include-all>Count them all again</button>' : ''}
    </div>
    ${run.trades.length > TRADE_SHOWN ? `<p class="remarks">The first ${TRADE_SHOWN} of ${run.trades.length} trades; the CSV has them all.</p>` : ''}
    ${tradeTable(shown, { actions: ['analyse'], include: true, sort: run.sort })}`;
}

// ---- The trades table --------------------------------------------------------------------------------------------------
// One table wherever trades are listed: a backtest's results on the Strategies page, and Find similar's candles set against
// the trades. A row is { index, time, trade, status, bad, current }: a candle, the trade entered there when there is one,
// and what Find similar makes of it. A row without a trade leaves the trade's own columns blank. Each place picks the
// columns it shows (all of TRADE_COLUMNS but status by default) and the buttons a row has: 'show' (Show on chart) and
// 'analyse' (Analyse, on a row with a trade other than the current one); their clicks are handled where the table is.
// With include, each row with a trade starts with a ● that counts it in the totals or, clicked, leaves it out (the row's
// "out", drawn greyed and ○).
const tradeSign = v => v > 0 ? 'won' : v < 0 ? 'lost' : '';
const TRADE_COLUMNS = {
  number: { head: '#', num: true, cell: r => r.trade?.number ?? '', sort: r => r.trade?.number },
  candle: { head: 'Candle', num: true, cell: r => `#${r.index}`, sort: r => r.index },
  entry: { head: 'Entry', cell: r => esc(fmtTime(r.time)), sort: r => minuteOf(r.time) },
  entryPrice: { head: 'Price', num: true, cell: r => r.trade ? wholePrice(r.trade.entryPrice) : '', sort: r => r.trade?.entryPrice },
  takeProfit: { head: 'Take Profit', num: true, cell: r => r.trade ? wholePrice(r.trade.takeProfit) : '', sort: r => r.trade?.takeProfit },
  stopLoss: { head: 'Stop Loss', num: true, cell: r => r.trade ? wholePrice(r.trade.stopLoss) : '', sort: r => r.trade?.stopLoss },
  exit: { head: 'Exit', cell: r => r.trade ? esc(fmtTime(r.trade.exitTime)) : '', sort: r => r.trade && minuteOf(r.trade.exitTime) },
  exitPrice: { head: 'Price', num: true, cell: r => r.trade ? wholePrice(r.trade.exitPrice) : '', sort: r => r.trade?.exitPrice },
  outcome: { head: 'Outcome', cell: r => !r.trade ? '' : r.trade.bothTouched
    ? `<span title="The exit candle reached the Take Profit and the Stop Loss alike, so it counts as the Stop Loss">${OUTCOMES[r.trade.outcome] ?? esc(r.trade.outcome)} *</span>`
    : OUTCOMES[r.trade.outcome] ?? esc(r.trade.outcome),
    sort: r => r.trade && `${OUTCOMES[r.trade.outcome] ?? r.trade.outcome}${r.trade.bothTouched ? ' *' : ''}` },
  profit: { head: 'Profit', num: true, cls: r => tradeSign(r.trade?.profit), cell: r => r.trade ? fmtProfit(r.trade.profit) : '', sort: r => r.trade?.profit },
  percent: { head: '%', num: true, cls: r => tradeSign(r.trade?.profit), cell: r => r.trade ? fmtPercent(r.trade.profitPercent) : '', sort: r => r.trade?.profitPercent },
  costs: { head: 'Costs', num: true, cell: r => r.trade && (r.trade.fees || r.trade.slippage) ? fmtProfit(-(r.trade.fees + r.trade.slippage)) : '', sort: r => r.trade && -(r.trade.fees + r.trade.slippage) },
  candles: { head: 'Candles', num: true, cell: r => r.trade?.candles ?? '', sort: r => r.trade?.candles },
  status: { head: 'Found', cell: r => esc(r.status ?? '') + (r.current ? ' · this one' : ''), sort: r => r.status },
};
const TRADE_DEFAULT = Object.keys(TRADE_COLUMNS).filter(k => k !== 'status');
// A backtest's trade as a row of the table.
const tradeRow = t => ({ index: t.entryIndex, time: t.entryTime, trade: t });

// The table's order: { key, dir } by a column, or none for the order the rows came in. A header clicked orders by its
// column, rising; again, falling; a third time, back to as they came. Rows with nothing in the column go last either way.
const nextTradeSort = (sort, key) => sort?.key !== key ? { key, dir: 1 } : sort.dir > 0 ? { key, dir: -1 } : null;
function sortTradeRows(rows, sort) {
  const by = sort && TRADE_COLUMNS[sort.key]?.sort;
  if (!by) return rows;
  const blank = v => v == null || v === '';
  return rows.map((r, i) => ({ r, i, v: by(r) })).sort((a, b) => blank(a.v) - blank(b.v)
    || (blank(a.v) ? 0 : (a.v < b.v ? -1 : a.v > b.v ? 1 : 0) * sort.dir) || a.i - b.i).map(x => x.r);
}

function tradeTable(rows, { columns = TRADE_DEFAULT, actions = [], include = false, sort = null } = {}) {
  const cols = columns.map(k => TRADE_COLUMNS[k]);
  const toggle = r => !r.trade ? '' : `<button type="button" class="inc" data-include="${r.trade.entryIndex}" aria-pressed="${!r.out}"
    title="${r.out ? 'Left out of the totals: click to count it again' : 'Counted in the totals: click to leave it out'}">${r.out ? '○' : '●'}</button>`;
  const buttons = r => actions.map(a => a === 'show' ? `<button type="button" data-show="${r.index}">Show on chart</button>`
    : a === 'analyse' && r.trade && !r.current ? `<button type="button" data-trade-row="${r.trade.entryIndex}" title="An analysis of this trade: its entry, its exits and its outcome">Analyse</button>` : '').join('');
  return `<div class="strat-trades"><table>
    <thead><tr>${include ? '<th class="inc" title="Counted in the totals"></th>' : ''}${columns.map(k => {
      const c = TRADE_COLUMNS[k], on = sort?.key === k, arrow = on ? (sort.dir > 0 ? ' ▲' : ' ▼') : '';
      return `<th${c.num ? ' class="num"' : ''}${on ? ` aria-sort="${sort.dir > 0 ? 'ascending' : 'descending'}"` : ''}><button type="button" class="sort" data-sort="${k}"
        title="Order by ${esc(c.head)}${on ? (sort.dir > 0 ? ', falling' : ', or back to as listed') : ''}">${c.head}${arrow}</button></th>`;
    }).join('')}${actions.length ? '<th></th>' : ''}</tr></thead>
    <tbody>${rows.map(r => `<tr class="${r.bad ? 'bad' : ''}${r.current ? ' current' : ''}${r.out ? ' out' : ''}">${include ? `<td class="inc">${toggle(r)}</td>` : ''}${cols.map(c =>
      `<td class="${c.num ? 'num ' : ''}${c.cls?.(r) ?? ''}">${c.cell(r)}</td>`).join('')}${actions.length ? `<td class="act">${buttons(r)}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;
}

// The address of an analysis of a backtest's trade: its chapters, seen from where it ends, with the page's run settings.
const tradeAnalysisHash = (dataset, strategy, t) => analysisHash({ dataset, at: minuteOf(t.entryTime), seen: minuteOf(t.exitTime), things: ['Trade'],
  greenRuns: runMin('SuccessiveGreenCandles'), redRuns: runMin('SuccessiveRedCandles'), strategy: JSON.stringify(strategy), detail: detailOf('Analysis') });

function downloadTrades(run) {
  const columns = ['number', 'direction', 'entryTime', 'entryPrice', 'takeProfit', 'stopLoss', 'exitTime', 'exitPrice', 'outcome', 'profit', 'profitPercent', 'candles', 'bothTouched'];
  const csv = [columns.join(','), ...run.trades.map(t => columns.map(c => t[c]).join(','))].join('\n') + '\n';
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: `${run.strategy.id}@${run.dataset}.csv` });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---- Strategies on charts --------------------------------------------------------------------------------------------
// A strategy added to the charts is a layer of the Strategies section, under its own name, with a copy of the strategy as
// it was when added, so a variation added under another name stays as it was. They are kept in the browser with the
// page's other settings. On a chart of a server dataset, each one on draws its trades as the replay has reached them:
// an arrow where it enters, its Take Profit and Stop Loss as dashed lines to the exit, and the exit marked by outcome.
// The trades come from the local server (api/backtest, not saved), once for each strategy and dataset.
// The first two are not sawtooth level colours, so a strategy shows apart from the structure.
const STRATEGY_COLOURS = ['--text', '--accent', '--lv5', '--lv3', '--lv7', '--lv6'];
const chartRuns = new Map();
// Find similar's candles, marked on the chart of their dataset until cleared: all of them, or the one shown last.
let similarMarks = null;
let tradeSimilar = null;

// What a strategy does, without its id or name: two on the charts that trade alike are the same.
const strategyRules = s => JSON.stringify({ direction: s.direction, after: s.after ?? [], entry: s.entry, takeProfit: s.takeProfit, stopLoss: s.stopLoss, onePositionAtATime: !!s.onePositionAtATime });
// The strategy on the charts that one being added would repeat: the same rules, or the same name.
const chartStrategyLike = (strategy, label) =>
  (state.chartStrategies ?? []).find(c => strategyRules(c.strategy) === strategyRules(strategy) || c.label.trim().toLowerCase() === label.trim().toLowerCase());
// Repeats added before they were refused are dropped, the first kept.
state.chartStrategies = (state.chartStrategies ?? []).filter((c, i, all) => all.findIndex(o => strategyRules(o.strategy) === strategyRules(c.strategy)) === i);

function syncStrategyLayers() {
  STRATEGY_SECTION.layers = (state.chartStrategies ?? []).map((c, i) => ({ id: `strategy:${c.id}`, label: c.label, chartStrategy: c, colour: STRATEGY_COLOURS[i % STRATEGY_COLOURS.length] }));
  LAYERS.splice(0, LAYERS.length, ...SECTIONS.flatMap(s => s.layers));
}
syncStrategyLayers();

// A short name for a strategy on the charts: its run, its direction and its targets, as "4 Green Long · ±100% body".
function chartStrategyName(s) {
  const target = t => t.type === 'Percent' ? `${t.percent}%` : t.type === 'HighestWick' ? `high of ${t.candles}` : t.type === 'LowestWick' ? `low of ${t.candles}` : t.type === 'RiskRatio' ? `${t.ratio}R target`
    : `${t.percent}% ${String(t.measure ?? 'Body').toLowerCase()}${t.candles !== s.entry?.length ? ` of ${t.candles}` : ''}`;
  const entry = strategySteps(s).map(e => e?.type === 'SuccessiveCandles' ? `${e.length} ${e.colour}` : e?.type ?? '').join(' → ');
  const [tp, sl] = [target(s.takeProfit), target(s.stopLoss)];
  return `${entry} ${s.direction} · ${tp === sl ? `±${tp}` : `+${tp} / −${sl}`}`;
}

// Adds a strategy to the charts; null, adding nothing, when one like it is there already (see chartStrategyLike).
function addChartStrategy(strategy, label) {
  label = label.trim() || chartStrategyName(strategy);
  if (chartStrategyLike(strategy, label)) return null;
  const c = { id: Date.now().toString(36), label, strategy: structuredClone(strategy) };
  state.chartStrategies = [...(state.chartStrategies ?? []), c];
  save(state);
  syncStrategyLayers();
  // It goes on at once on the page it is added from; elsewhere it is there to turn on.
  if (currentPage !== 'Strategies') setLayers([...layersOf(currentPage), `strategy:${c.id}`]);
  return c;
}

// The section's add form and, while Find similar's candles are marked, what is marked with List and Clear.
function strategyLayerExtras() {
  const list = strategies?.book.strategies ?? [];
  const marks = similarMarks ? `<div class="strat-marks">${similarMarks.all ? `${similarMarks.times.length} similar marked` : 'One similar marked'}
    <button type="button" data-marks="list">List</button><button type="button" data-marks="clear">Clear</button></div>` : '';
  return `${STRATEGY_SECTION.layers.length ? '' : '<div class="strat-hint">None on the charts yet.</div>'}
    <details class="strat-add"${STRATEGY_SECTION.layers.length ? '' : ' open'}><summary>Add to strategies</summary>
      <form data-strategy-add><select data-add-strategy aria-label="Strategy">${list.map(s => `<option value="${esc(s.id)}">${esc(s.name || s.id)}</option>`).join('') || '<option value="">Loading…</option>'}</select>
        <input data-add-name aria-label="Name on the charts" value="${esc(list[0] ? chartStrategyName(list[0]) : '')}">
        <button type="submit">Add</button><span class="strat-note" data-add-note aria-live="polite"></span></form></details>${marks}`;
}

function wireStrategyLayers(root) {
  const form = root.querySelector('[data-strategy-add]');
  if (!form) return;
  const pick = form.querySelector('[data-add-strategy]'), name = form.querySelector('[data-add-name]');
  const chosen = () => strategies?.book.strategies.find(s => s.id === pick.value);
  // The strategies are those of strategies.json, read when first wanted.
  if (!strategies && serverOn) loadStrategies().then(() => {
    if (!pick.isConnected) return;
    pick.innerHTML = strategies.book.strategies.map(s => `<option value="${esc(s.id)}">${esc(s.name || s.id)}</option>`).join('');
    name.value = chosen() ? chartStrategyName(chosen()) : '';
  }).catch(() => { });
  const note = form.querySelector('[data-add-note]');
  pick.addEventListener('change', () => { note.textContent = ''; if (chosen()) name.value = chartStrategyName(chosen()); });
  name.addEventListener('input', () => { note.textContent = ''; });
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!chosen()) return;
    const like = chartStrategyLike(chosen(), name.value.trim() || chartStrategyName(chosen()));
    if (like) {
      note.textContent = strategyRules(like.strategy) === strategyRules(chosen()) ? `Already on the charts as "${like.label}".` : `"${like.label}" is already the name of another.`;
      return;
    }
    addChartStrategy(chosen(), name.value);
    renderLayers();
    drawAll(currentPage);
  });
  root.querySelectorAll('[data-strategy-remove]').forEach(b => b.addEventListener('click', () => {
    state.chartStrategies = (state.chartStrategies ?? []).filter(c => c.id !== b.dataset.strategyRemove);
    save(state);
    syncStrategyLayers();
    renderLayers();
    drawAll(currentPage);
  }));
  root.querySelector('[data-marks="clear"]')?.addEventListener('click', () => { similarMarks = null; renderLayers(); drawAll(currentPage); });
  root.querySelector('[data-marks="list"]')?.addEventListener('click', () => tradeSimilar && showTradeSimilar());
}

// The trades of a strategy over a dataset: there when fetched, otherwise fetched and drawn when they come.
function chartTrades(dataset, strategy) {
  const key = `${dataset}|${JSON.stringify(strategy)}`, got = chartRuns.get(key);
  if (got && !(got instanceof Promise)) return got.error ? null : got;
  if (!got) chartRuns.set(key, fetch('api/backtest', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dataset, strategy, save: false }) })
    .then(async r => r.ok ? (await r.json()).run : { error: await r.text() })
    .catch(() => ({ error: 'The local server did not answer.' }))
    .then(run => { chartRuns.set(key, run); if (!run.error) drawAll(currentPage); }));
  return null;
}

const minuteOf = t => String(t).slice(0, 16);


// How many candles before the candle that meets it a step reads (StrategyEntry.Reads): a run's candles before its last.
const entryReads = e => e?.type === 'SuccessiveCandles' ? Math.max(0, e.length - 1) : 0;
// How many candles before its entry a trade's entry condition read (StrategyTrade.FirstRead): from the first candle its first
// step read, the candle that met that step being the first of the trade's "met" when the condition is a chain.
const tradeReads = (strategy, t) => t.entryIndex - Math.max(0, (t.met?.[0]?.index ?? t.entryIndex) - entryReads(strategySteps(strategy)[0]));

// The trades of the strategies on that a candle is part of: entered there, open there, or with the candle among those its
// entry condition read. Those entered there come first.
function tradesAround(dataset, index) {
  if (!dataset) return [];
  return STRATEGY_SECTION.layers.filter(l => on(l.id)).flatMap(layer => {
    const strategy = layer.chartStrategy.strategy;
    return (chartTrades(dataset, strategy)?.trades ?? []).filter(t => t.entryIndex - tradeReads(strategy, t) <= index && index <= t.exitIndex).map(trade => ({ layer, trade }));
  }).sort((a, b) => (b.trade.entryIndex === index) - (a.trade.entryIndex === index));
}

// The trade a candle is part of, as the server reads it for an analysis (see Explain.TradeAt): the one entered there, else
// the one open there, else the one whose entry condition the candle is part of.
function tradeCovering(trades, strategy, time) {
  const at = minuteOf(time), candle = candleHours(trades) * 3600000;
  const before = t => Math.round((Date.parse(`${minuteOf(t.entryTime)}Z`) - Date.parse(`${at}Z`)) / candle);
  return trades.find(t => minuteOf(t.entryTime) === at) ?? trades.find(t => minuteOf(t.entryTime) < at && at <= minuteOf(t.exitTime))
    ?? trades.find(t => minuteOf(t.entryTime) > at && before(t) <= tradeReads(strategy, t));
}
// How long a candle of a backtest's trades is, in hours, from a trade that spans more than one.
const candleHours = trades => {
  const t = trades.find(x => x.candles > 0);
  return t ? (Date.parse(t.exitTime) - Date.parse(t.entryTime)) / 3600000 / t.candles : 1;
};

// The trade an analysis tells of, when its chart is of the analysis's dataset and its "trade" layer is on.
function analysedTrade(dataset) {
  if (!on('trade') || tour?.page !== 'Analysis' || !tour.params?.strategy || tour.params.dataset !== dataset) return null;
  const strategy = JSON.parse(tour.params.strategy), run = chartTrades(dataset, strategy);
  const trade = run && tradeCovering(run.trades, strategy, tour.params.at);
  return trade ? { strategy, trade } : null;
}

function drawStrategies(ex, traces) {
  const dataset = (ex.hindsight ?? ex).dataset, p = ex.prices;
  if (!dataset || !p?.t?.length) return;
  const first = minuteOf(p.t[0]), last = minuteOf(p.t[p.t.length - 1]), up = css('--up'), down = css('--down');
  // A trade the chart has not reached the exit of is open: its exits run a few candles past the last candle shown, so
  // where they are can be seen from the candle it is entered on.
  const whole = (ex.hindsight ?? ex).prices, ahead = whole.t[Math.min(whole.t.length - 1, (ex.cursor ?? whole.t.length - 1) + 3)];
  // The strategies on, and an analysis's own Trade on its "trade" layer: the one trade it tells of, with the run it began.
  const drawn = STRATEGY_SECTION.layers.filter(l => on(l.id)).map(l => ({ name: l.label, colour: css(l.colour), strategy: l.chartStrategy.strategy }));
  const analysed = analysedTrade(dataset);
  if (analysed) drawn.push({ name: 'Trade', colour: css('--text'), strategy: analysed.strategy, at: minuteOf(analysed.trade.entryTime) });
  for (const { name, colour, strategy, at } of drawn) {
    const run = chartTrades(dataset, strategy);
    if (!run) continue;
    const shown = run.trades.filter(t => (!at || minuteOf(t.entryTime) === at) && minuteOf(t.entryTime) <= last && minuteOf(t.exitTime) >= first)
      .map(t => ({ t, done: t.outcome !== 'Open' && minuteOf(t.exitTime) <= last }));
    if (!shown.length) continue;
    const end = s => s.done ? s.t.exitTime : ahead;
    // The run of candles that met each Successive Candles step of the entry condition, boxed from its first candle's low to
    // its highest high: the entry's own run, and those of the steps before it, at the candles the trade says met them.
    const trade = at && shown.find(x => minuteOf(x.t.entryTime) === at)?.t, steps = strategySteps(strategy);
    const metAt = trade ? [...(trade.met ?? []).map(m => minuteOf(m.time)), at] : [];
    steps.forEach((step, k) => {
      if (step?.type !== 'SuccessiveCandles' || !metAt[k]) return;
      const i = whole.t.findIndex(x => minuteOf(x) === metAt[k]), from = Math.max(0, i - step.length + 1);
      if (i < 0) return;
      const hi = Math.max(...whole.h.slice(from, i + 1)), lo = Math.min(...whole.l.slice(from, i + 1)), half = (Date.parse(whole.t[1]) - Date.parse(whole.t[0])) / 2;
      const [x0, x1] = [new Date(Date.parse(whole.t[from]) - half).toISOString(), new Date(Date.parse(whole.t[i]) + half).toISOString()];
      const label = steps.length > 1 ? `Entry condition, step ${k + 1}` : 'Entry condition';
      traces.push({ type: 'scatter', mode: 'lines', fill: 'toself', name: label, x: [x0, x1, x1, x0, x0], y: [lo, lo, hi, hi, lo],
        line: { color: colour, width: 1, dash: 'dot' }, fillcolor: withAlpha(css(step.colour === 'Red' ? '--down' : '--up'), 0.08),
        hovertemplate: `${label}: ${step.length} ${step.colour.toLowerCase()} candles in a row<extra></extra>` });
    });
    const level = (key, color) => traces.push({ type: 'scatter', mode: 'lines', name: `${name} ${key === 'takeProfit' ? 'Take Profit' : 'Stop Loss'}`, hoverinfo: 'skip',
      x: shown.flatMap(s => [s.t.entryTime, end(s), null]), y: shown.flatMap(s => [s.t[key], s.t[key], null]), line: { color, width: 1.25, dash: 'dash' } });
    level('takeProfit', up);
    level('stopLoss', down);
    const done = shown.filter(s => s.done);
    traces.push({ type: 'scatter', mode: 'lines', name, hoverinfo: 'skip', x: done.flatMap(s => [s.t.entryTime, s.t.exitTime, null]),
      y: done.flatMap(s => [s.t.entryPrice, s.t.exitPrice, null]), line: { color: colour, width: 1.5, dash: 'dot' } });
    const what = t => `${esc(name)} · Trade #${t.number} ${t.direction}<br>${fmtTime(t.entryTime)} at ${wholePrice(t.entryPrice)}<br>Take Profit ${wholePrice(t.takeProfit)} · Stop Loss ${wholePrice(t.stopLoss)}`;
    traces.push({ type: 'scatter', mode: 'markers', name, x: shown.map(s => s.t.entryTime), y: shown.map(s => s.t.entryPrice),
      marker: { symbol: shown.map(s => s.t.direction === 'Short' ? 'triangle-down' : 'triangle-up'), size: 11, color: colour, line: { width: 1, color: css('--panel') } },
      hovertemplate: shown.map(s => `${what(s.t)}${s.done ? '' : '<br>open'}<extra></extra>`) });
    if (done.length) traces.push({ type: 'scatter', mode: 'markers', name: `${name} exit`, x: done.map(s => s.t.exitTime), y: done.map(s => s.t.exitPrice),
      marker: { symbol: 'circle', size: 8, color: done.map(s => s.t.profit > 0 ? up : down), line: { width: 1.5, color: colour } },
      hovertemplate: done.map(s => `${what(s.t)}<br>${OUTCOMES[s.t.outcome]} ${fmtTime(s.t.exitTime)} at ${wholePrice(s.t.exitPrice)}${s.t.bothTouched ? ' (reached both)' : ''}` +
        `<br>${fmtProfit(s.t.profit)} · ${fmtPercent(s.t.profitPercent)}<extra></extra>`) });
  }
  // Find similar's candles: rings around the candles of the dataset that are on the chart.
  if (similarMarks?.dataset === dataset) {
    const at = new Map(p.t.map((t, i) => [minuteOf(t), i])), marked = similarMarks.times.map(t => at.get(minuteOf(t))).filter(i => i != null);
    if (marked.length) traces.push({ type: 'scatter', mode: 'markers', name: 'Similar', x: marked.map(i => p.t[i]), y: marked.map(i => (p.h[i] + p.l[i]) / 2),
      marker: { symbol: 'circle-open', size: 24, color: css('--accent'), line: { width: 2.5, color: css('--accent') } },
      hovertemplate: marked.map(i => `Similar: ${fmtTime(p.t[i])}<extra></extra>`) });
  }
}

// ---- Find similar trades -------------------------------------------------------------------------------------------
// From a trade's candle: every candle of the dataset with what the strategy's entry looks for, found by the server from the
// candle runs rather than by the backtest, set against the strategy's trades as a check. Each found candle either is a
// trade, or comes while a trade is still open (with one trade at a time), or comes too early to measure the targets;
// anything else, either way round, is a disagreement and is listed first. Show on chart moves the replay to a candle and
// rings it; Show all rings every one.
async function openTradeSimilar(layer, trade, ex) {
  const dialog = similarDialog(), s = layer.chartStrategy.strategy;
  dialog.innerHTML = `<h4>Find similar</h4><p>Finding the candles…</p>`;
  dialog.showModal();
  const run = await chartTradesLoaded(ex.dataset, s);
  const r = await fetch('api/backtest/similar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dataset: ex.dataset, strategy: s }) }).catch(() => null);
  if (!r?.ok || !run) {
    dialog.innerHTML = `<h4>Find similar</h4><p class="warn">${esc(r?.status === 404 || r?.status === 405 ? 'The local server is older than this page: restart ./build-site.ps1 -Serve.' : r ? await r.text() : 'The local server did not answer.')}</p>
      <div class="sim-foot"><button type="button" data-sim="close">Close</button></div>`;
    return;
  }
  const found = (await r.json()).candles, byEntry = new Map(run.trades.map(t => [t.entryIndex, t])), seen = new Set(found.map(c => c.index));
  // A candle where the targets cannot be set (too early to measure them, or a level not beyond the entry) is passed over.
  const rows = found.map(c => {
    const traded = byEntry.get(c.index), open = !traded && run.trades.find(t => t.entryIndex < c.index && c.index < t.exitIndex);
    return { ...c, trade: traded, traded, open, status: traded ? `Trade #${traded.number}` : open ? `skipped: Trade #${open.number} open` : !c.measurable ? 'skipped: no targets there' : 'not traded', bad: !traded && !open && c.measurable };
  });
  // A trade the candle runs do not have is a disagreement too.
  for (const t of run.trades.filter(t => !seen.has(t.entryIndex)))
    rows.push({ index: t.entryIndex, time: t.entryTime, trade: t, traded: t, status: `Trade #${t.number}, not found from the candle runs`, bad: true });
  rows.sort((a, b) => b.bad - a.bad || a.index - b.index);
  tradeSimilar = { layer, trade, ex, rows, found: found.length, traded: rows.filter(x => x.traded && !x.bad).length, open: rows.filter(x => x.open).length };
  showTradeSimilar();
}

// The trades of a strategy over a dataset, waiting for them when they are still to come.
async function chartTradesLoaded(dataset, strategy) {
  chartTrades(dataset, strategy);
  const got = chartRuns.get(`${dataset}|${JSON.stringify(strategy)}`);
  if (got instanceof Promise) await got;
  return chartTrades(dataset, strategy);
}

// Find similar from an analysis of a trade: the same list, each trade in it a link to an analysis of its own, which opens
// here in place of this one.
async function openAnalysisTradeSimilar() {
  if (tour?.page !== 'Analysis' || !tour.params?.strategy) return;
  const strategy = JSON.parse(tour.params.strategy), dataset = tour.params.dataset;
  const run = await chartTradesLoaded(dataset, strategy), trade = run && tradeCovering(run.trades, strategy, tour.params.at);
  const layer = { id: null, label: strategy.name || chartStrategyName(strategy), chartStrategy: { strategy } };
  return openTradeSimilar(layer, trade ?? { entryIndex: -1 }, { dataset });
}

function similarDialog() {
  let dialog = document.getElementById('similar-trades');
  if (dialog) return dialog;
  dialog = document.createElement('dialog');
  dialog.id = 'similar-trades';
  dialog.setAttribute('aria-label', 'Find similar trades');
  document.body.append(dialog);
  dialog.addEventListener('click', e => {
    if (e.target === dialog || e.target.closest('[data-sim="close"]')) return dialog.close();
    const order = e.target.closest('[data-sort]');
    if (order) {
      tradeSimilar.sort = nextTradeSort(tradeSimilar.sort, order.dataset.sort);
      return showTradeSimilar();
    }
    const analyse = e.target.closest('[data-trade-row]');
    if (analyse) {
      const t = tradeSimilar.rows.find(x => x.traded?.entryIndex === Number(analyse.dataset.tradeRow))?.traded;
      dialog.close();
      if (!t) return;
      // Away from an analysis, it opens in a tab of its own, as the candle card's Analyse trade does.
      if (currentPage !== 'Analysis') return window.open(`./${tradeAnalysisHash(tradeSimilar.ex.dataset, tradeSimilar.layer.chartStrategy.strategy, t)}`, '_blank');
      // The analysis of that trade, seen from where it ends, with the settings of this one.
      const { things, jump, changes, ...p } = tour.params;
      wantedAnalysis = { ...p, at: minuteOf(t.entryTime), seen: minuteOf(t.exitTime), things: ['Trade'], detail: detailOf('Analysis') };
      history.replaceState(null, '', analysisHash(wantedAnalysis));
      return renderAnalysisPage();
    }
    const one = e.target.closest('[data-show]'), all = e.target.closest('[data-sim="all"]');
    if (!one && !all) return;
    const { ex, rows } = tradeSimilar;
    const index = one ? Number(one.dataset.show) : tradeSimilar.trade.entryIndex;
    similarMarks = { dataset: ex.dataset, all: !!all, times: all ? rows.map(x => x.time) : [ex.prices.t[index]] };
    dialog.close();
    const layers = layersOf(currentPage);
    // The Chart has no replay: its view pans to the candle, as wide as it was, with the strategy on to show its trade.
    if (currentPage === 'Chart') {
      setLayers([...layers, tradeSimilar.layer.id].filter((x, i, a) => a.indexOf(x) === i));
      renderLayers();
      drawAll(currentPage);
      const el = document.querySelector(`.chart[data-id="${CSS.escape(ex.id)}"]`);
      if (!one || !el?._fullLayout) return;
      const [from, to] = el._fullLayout.xaxis.range.map(axisTime), width = to - from || 2 * 86400000, at = axisTime(ex.prices.t[index]);
      glideView(el, [at - width / 2, at + width / 2]);
      return;
    }
    if (currentPage !== 'Replay') return;
    // The replay goes to the candle, as it was known there, with the strategy on to show its trade.
    setLayers([...layers, 'replay', tradeSimilar.layer.id].filter((x, i, a) => a.indexOf(x) === i));
    renderLayers();
    moveTo(ex, index);
    drawAll(currentPage);
  });
  return dialog;
}

function showTradeSimilar() {
  const dialog = similarDialog(), { layer, trade, rows, found, traded, open } = tradeSimilar, s = layer.chartStrategy.strategy;
  const what = conditionSays(s), bad = rows.filter(x => x.bad).length;
  const data = datasetList?.find(d => d.id === tradeSimilar.ex.dataset)?.name ?? tradeSimilar.ex.dataset;
  // From an analysis, each trade is analysed in its place rather than shown on a chart.
  const analysing = currentPage === 'Analysis';
  dialog.innerHTML = `<h4>Find similar: ${esc(layer.label)}</h4>
    <p>Every candle in ${esc(data)} that completes ${esc(what)}, found from the candle runs rather than by the backtest, against the strategy's trades.</p>
    <p class="sim-verdict${bad ? ' bad' : ''}">${bad ? `${bad} disagree: listed first.` : `All ${found} agree:`} ${traded} traded${open ? `, ${open} skipped while a trade was open` : ''}${found - traded - open - bad > 0 ? `, ${found - traded - open - bad} with no targets there` : ''}.</p>
    <div class="sim-foot">${analysing ? '' : '<button type="button" class="go" data-sim="all">Show all on chart</button>'}<button type="button" data-sim="close">Close</button></div>
    ${tradeTable(sortTradeRows(rows.map(x => ({ ...x, current: x.index === trade.entryIndex })), tradeSimilar.sort),
      { columns: ['candle', 'entry', 'outcome', 'profit', 'percent', 'status'], actions: analysing ? ['analyse'] : ['show', 'analyse'], sort: tradeSimilar.sort })}`;
  if (!dialog.open) dialog.showModal();
  dialog.querySelector('tr.current')?.scrollIntoView({ block: 'nearest' });
}

// ---- Explore ----------------------------------------------------------------------------------------------------------
// Conditions measured directly, before a strategy is built on one (POST api/explore, see Explorer): for each condition and
// size, after it, how often the price went up by the size before down by it, against after any candle, in each period ticked
// and pooled. Exploring searches, so only Search periods can be ticked; roles are set on the Strategies page.
let explore = null;
const EXPLORE_DEFAULTS = { sizes: '0.5, 1, 2, 3', horizon: '48', cost: '0.3' };
const exploreYear = key => { const { market, year } = cellOf(key); return explore.markets?.find(m => m.id === market)?.years.find(y => y.year === year); };
const explorePct = x => `${(100 * x).toFixed(1)}%`;

async function renderExplorePage(asked = new URLSearchParams()) {
  const main = document.getElementById('main');
  currentPage = 'Explore';
  const head = `<section class="term-head"><h2>Explore</h2>
    <p>Measure conditions directly, before building a strategy on one: after each, how often the price went up by a size before it went down by it, against after any candle.</p>
    <p class="remarks">The score is the share of random samples of candles a condition beats: near 100, up first more often than after any candle; near 0, down first
    more often. Exploring searches, so it runs on Search periods only, and every condition at every size is a test: a * marks a result beyond chance once all of
    them are allowed for. Each condition reads only the candle it is met at and those before it.</p></section>`;
  if (!serverOn) {
    main.innerHTML = head + `<div class="empty" data-server-check>Checking for the local server…</div>`;
    return checkLocalServer();
  }
  explore ??= { ...EXPLORE_DEFAULTS, cells: new Set(), result: null, running: false, condition: null };
  explore.markets = await fetchMarkets();
  if (currentPage !== 'Explore') return;
  const cells = asked.get('cells')?.split(',').filter(k => exploreYear(k)?.role === 'search');
  if (cells?.length) explore.cells = new Set(cells);
  [...explore.cells].filter(k => exploreYear(k)?.role !== 'search').forEach(k => explore.cells.delete(k));
  if (!explore.cells.size) {
    const m = explore.markets[0];
    (m?.years ?? []).filter(y => y.role === 'search').forEach(y => explore.cells.add(cellKey(m.id, y.year)));
  }
  for (const k of Object.keys(EXPLORE_DEFAULTS)) if (asked.get(k)) explore[k] = asked.get(k);
  if (asked.get('condition')) explore.condition = asked.get('condition');
  main.innerHTML = head + '<div class="explore"></div>';
  renderExplore();
}

// The page's address keeps the periods ticked, the settings and the condition shown, as the Strategies page's does.
function exploreHash() {
  const q = new URLSearchParams();
  if (explore.cells.size) q.set('cells', [...explore.cells].join(','));
  for (const [k, v] of Object.entries(EXPLORE_DEFAULTS)) if (String(explore[k]) !== v) q.set(k, explore[k]);
  if (explore.condition) q.set('condition', explore.condition);
  return `#Explore${q.size ? `?${q}` : ''}`;
}

function syncExploreHash() {
  if (currentPage === 'Explore' && location.hash !== exploreHash()) history.replaceState(null, '', exploreHash());
}

function renderExplore() {
  const box = document.querySelector('.explore');
  if (!box) return;
  syncExploreHash();
  const markets = explore.markets ?? [];
  const years = [...new Set(markets.flatMap(m => m.years.map(y => y.year)))].sort((a, b) => a - b);
  const cell = (m, year) => {
    const y = m.years.find(x => x.year === year);
    if (!y) return '<td class="strat-cell none"></td>';
    const key = cellKey(m.id, year), search = y.role === 'search';
    return `<td class="strat-cell role-${y.role}" title="${esc(`${m.name}, ${year}: ${fmtTime(y.first)} to ${fmtTime(y.last)} UTC, ${y.candles.toLocaleString()} candles`)}">
      <label class="strat-cell-top"><input type="checkbox" data-explore-tick="${key}" ${search && explore.cells.has(key) ? 'checked' : ''} ${search ? '' : 'disabled'}>${ROLE_NAMES[y.role]}</label></td>`;
  };
  const r = explore.result;
  box.innerHTML = `<div class="strat-card">
      ${markets.length ? `<div class="strat-grid-wrap"><table class="strat-grid">
        <thead><tr><th></th>${markets.map(m => `<th><button type="button" data-explore-market="${m.id}" title="Tick or untick all of this market's Search periods">${esc(m.name)}</button></th>`).join('')}</tr></thead>
        <tbody>${years.map(year => `<tr><th><button type="button" data-explore-year="${year}" title="Tick or untick this year in every market">${year}</button></th>${markets.map(m => cell(m, year)).join('')}</tr>`).join('')}</tbody>
      </table></div>` : '<p class="remarks strat-note bad">The local server has no markets: restart ./build-site.ps1 -Serve.</p>'}
      <p class="remarks">Only Search periods can be explored. Roles are set on the <a href="#Strategies">Strategies</a> page.</p>
      <div class="strat-fields">
        <label title="How far the price must go either way, as percentages of the close: 0.5, 1, 2, 3">Sizes, % either way<input type="text" data-explore="sizes" value="${esc(explore.sizes)}"></label>
        <label title="The candles after a condition the price has to go a size either way; neither, if it does not">Within (candles)<input type="number" data-explore="horizon" min="1" step="1" value="${esc(explore.horizon)}"></label>
        <label title="Fees and slippage of a trade, in and out, as a percentage: what a lean must clear to pay, marked ▲ (long) or ▼ (short)">Costs, % a round trip<input type="number" data-explore="cost" min="0" step="0.05" value="${esc(explore.cost)}"></label>
      </div>
      <div class="strat-run">
        <button type="button" data-explore-run ${explore.running || !explore.cells.size ? 'disabled' : ''}>${explore.running ? 'Exploring…' : `Explore ${explore.cells.size} period${explore.cells.size === 1 ? '' : 's'}`}</button>
        <span class="strat-note${r?.error ? ' bad' : ''}">${esc(r?.error ?? '')}</span>
      </div>
    </div>
    ${r && !r.error ? exploreResults(r) : ''}`;

  const toggle = keys => {
    keys = keys.filter(k => exploreYear(k)?.role === 'search');
    const on = keys.some(k => !explore.cells.has(k));
    keys.forEach(k => on ? explore.cells.add(k) : explore.cells.delete(k));
    renderExplore();
  };
  box.querySelectorAll('[data-explore-tick]').forEach(el => el.addEventListener('change', () => toggle([el.dataset.exploreTick])));
  box.querySelectorAll('[data-explore-market]').forEach(el => el.addEventListener('click', () =>
    toggle(markets.find(m => m.id === el.dataset.exploreMarket).years.map(y => cellKey(el.dataset.exploreMarket, y.year)))));
  box.querySelectorAll('[data-explore-year]').forEach(el => el.addEventListener('click', () =>
    toggle(markets.map(m => cellKey(m.id, Number(el.dataset.exploreYear))).filter(exploreYear))));
  box.querySelectorAll('[data-explore]').forEach(el => el.addEventListener('change', () => {
    explore[el.dataset.explore] = el.value.trim() || EXPLORE_DEFAULTS[el.dataset.explore];
    if (el.dataset.explore === 'cost') renderExplore();
    else syncExploreHash();
  }));
  box.querySelector('[data-explore-run]').addEventListener('click', runExplore);
  box.querySelectorAll('[data-explore-condition]').forEach(el => el.addEventListener('click', () => {
    explore.condition = explore.condition === el.dataset.exploreCondition ? null : el.dataset.exploreCondition;
    renderExplore();
  }));
}

async function runExplore() {
  const sizes = String(explore.sizes).split(/[\s,]+/).map(Number).filter(x => x > 0);
  explore.running = true;
  renderExplore();
  const cells = [...explore.cells].map(k => ({ dataset: cellOf(k).market, ...cellWindow(k) }));
  explore.result = await postBacktest('api/explore', { cells, sizes, horizon: Number(explore.horizon) }, 'explorations');
  explore.running = false;
  if (currentPage === 'Explore') renderExplore();
}

// The results: a row a condition, a column a size. A cell is the share that went up first after the condition, its lean
// from after any candle in points, tinted by its score (green up first, red down first); * when beyond chance allowing for
// every test, ▲ or ▼ when the lean would pay its costs long or short. A row's click shows it period by period below.
function exploreResults(r) {
  const cost = Number(explore.cost) || 0;
  const tone = score => score >= 97.5 ? ' up2' : score >= 90 ? ' up1' : score <= 2.5 ? ' down2' : score <= 10 ? ' down1' : '';
  const pays = (stat, size) => {
    const hurdle = 0.5 + cost / (2 * size);
    return stat.up + stat.down === 0 ? '' : stat.upRate > hurdle ? ' ▲' : 1 - stat.upRate > hurdle ? ' ▼' : '';
  };
  const lean = stat => `${stat.edge >= 0 ? '+' : ''}${(100 * stat.edge).toFixed(1)}`;
  const tip = (z, stat) => `${stat.events.toLocaleString()} times; up first ${stat.up}, down first ${stat.down}, neither ${stat.neither}, both in a candle ${stat.both}.
Up first ${explorePct(stat.upRate)} against ${explorePct(stat.baseRate)} after any candle: score ${stat.score.toFixed(1)}${z ? `, chance allowing for all ${r.tests} tests ${(100 * z.corrected).toFixed(1)}%` : ''}.`;
  const base = r.conditions[0]?.sizes.map(z => z.pooled) ?? [];
  const rows = [...new Set(r.conditions.map(c => c.group))].map(group => `<tr class="explore-group"><th colspan="${r.sizes.length + 1}">${esc(group)}</th></tr>` +
    r.conditions.filter(c => c.group === group).map(c => `<tr class="${c.id === explore.condition ? 'sel' : ''}" data-explore-condition="${c.id}">
      <th>${esc(c.name)}</th>
      ${c.sizes.map(z => `<td class="num explore-cell${tone(z.pooled.score)}" title="${esc(tip(z, z.pooled))}">${z.pooled.up + z.pooled.down
        ? `${explorePct(z.pooled.upRate)} <small>${lean(z.pooled)}</small>${z.corrected < 0.05 ? ' *' : ''}${pays(z.pooled, z.size)}` : '–'}</td>`).join('')}
    </tr>`).join('')).join('');
  const shown = r.conditions.find(c => c.id === explore.condition);
  const detail = shown ? `<h3 class="strat-cell-head">${esc(shown.name)}, period by period</h3>
    <div class="strat-trades"><table><thead><tr><th>Period</th>${r.sizes.map(s => `<th class="num">${s}%</th>`).join('')}</tr></thead><tbody>
      ${r.cells.map((cell, k) => `<tr><th>${esc(cell.name)}, ${esc(fmtTime(cell.from).slice(0, 4))}</th>
        ${shown.sizes.map(z => { const s = z.cells[k]; return `<td class="num explore-cell${tone(s.score)}" title="${esc(tip(null, s))}">${s.up + s.down ? `${explorePct(s.upRate)} <small>${lean(s)}</small>` : '–'}</td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div>` : '';
  return `<div class="strat-card">
    <p class="remarks">${r.cells.length} period${r.cells.length === 1 ? '' : 's'} pooled, ${r.tests} tests (${r.conditions.length} conditions × ${r.sizes.length} sizes), within ${r.horizon} candles.
      After any candle the price went up first ${base.map((b, k) => `${explorePct(b.baseRate)} of the time at ${r.sizes[k]}%`).join(', ')}.
      A cell is the share up first after the condition, then its lean from that in points. Hover for the counts; click a row for its periods.</p>
    <div class="strat-trades explore-table"><table><thead><tr><th>Condition</th>${r.sizes.map(s => `<th class="num">${s}%</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    ${detail}</div>`;
}

function route() {
  document.body.classList.remove('analysing');
  stopPlaying();
  pauseTour();
  // An analysis has an address of its own: #Analysis?explain=Swing&dataset=...
  const [first, asked] = location.hash.slice(1).split('?');
  document.body.classList.toggle('strategizing', first === 'Strategies' || first === 'Explore');
  if (first === 'Explore') {
    ['touring', 'video', 'editing'].forEach(c => document.body.classList.remove(c));
    renderNav('Explore');
    renderExplorePage(new URLSearchParams(asked ?? ''));
    window.scrollTo(0, 0);
    return;
  }
  if (first === 'Strategies') {
    ['touring', 'video', 'editing'].forEach(c => document.body.classList.remove(c));
    renderNav('Strategies');
    renderStrategiesPage(new URLSearchParams(asked ?? ''));
    window.scrollTo(0, 0);
    return;
  }
  if (first === 'Analysis') {
    ['touring', 'video', 'editing'].forEach(c => document.body.classList.remove(c));
    // Recorded, an analysis is shown as the tour is: the chart and its texts alone.
    document.body.classList.toggle('video', videoMode);
    renderNav('Analysis');
    renderAnalysisPage(new URLSearchParams(asked ?? ''));
    window.scrollTo(0, 0);
    return;
  }
  let type = decodeURIComponent(location.hash.slice(1));
  // The home page is the Chart.
  if (!type || type === 'Chart') {
    ['touring', 'video', 'editing'].forEach(c => document.body.classList.remove(c));
    renderNav('Chart');
    renderChartPage();
    window.scrollTo(0, 0);
    return;
  }
  // The tour's chapters have links of their own: #Tour/<chapter>.
  const [page, chapter] = type.split('/');
  document.body.classList.toggle('touring', page === 'Tour');
  document.body.classList.toggle('video', page === 'Tour' && videoMode);
  document.body.classList.toggle('editing', page === 'Tour' && editorOn());
  if (page === 'Tour') {
    renderNav('Tour');
    renderTourPage(chapter);
    window.scrollTo(0, 0);
    return;
  }
  if (STRUCTURE_PAGES.includes(type)) {
    renderNav(type);
    if (type === 'Sawtooth') renderStructure(); else if (type === 'Replay') renderReplayPage(); else if (type === 'Analysis') renderAnalysisPage(); else renderInterims();
    window.scrollTo(0, 0);
    return;
  }
  if (!TERMS.has(type)) type = (DATA.terms.find(t => examplesFor(t.type).length) || DATA.terms[0] || {}).type;
  renderNav(type);
  renderTerm(type);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => route());
route();
</script>
