    return checkLocalServer();
  }
  show('<div class="empty">Loading datasets…</div>');
  const list = await loadDatasets();
  if (currentPage !== 'Chart') return;
  if (!list.length) return show('<div class="empty">The server has no datasets.</div>');

  const info = list.find(d => d.id === (state.chartDataset ?? state.replayDataset)) ?? list[0];
  let ex = chartDatasets.find(e => e.dataset === info.id);
  if (!ex) {
    const prices = await fetch(`api/prices?dataset=${encodeURIComponent(info.id)}`).then(r => r.json());
    ex = chartDatasets.find(e => e.dataset === info.id)
      ?? chartDatasets[chartDatasets.push({ id: `Chart/${info.id}`, dataset: info.id, title: info.name, level: 1, prices, expected: [], annotations: [], complete: true }) - 1];
  }
  if (currentPage !== 'Chart') return;
  show(`<div class="replay-setup">
      <label>Dataset<select data-dataset>${list.map(d => `<option value="${esc(d.id)}" ${d.id === info.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></label>
      <label>Opens on<select data-span>${CHART_SPANS.map(w => `<option value="${w.candles}" ${w.candles === chartSpan() ? 'selected' : ''}>${w.candles ? `the last ${w.label}` : 'every candle'}</option>`).join('')}</select></label>
    </div>
    <article class="example replay-big" id="ex-${esc(ex.id)}">
      <header><h3>${esc(info.name)}</h3><span class="id">${info.candles.toLocaleString()} candles · ${esc(fmtTime(info.first))} to ${esc(fmtTime(info.last))} UTC · as known at the last candle</span></header>
      ${chartRow(ex)}
    </article>`);
  main.querySelector('[data-dataset]').addEventListener('change', e => { state.chartDataset = e.target.value; save(state); renderChartPage(); });
  main.querySelector('[data-span]').addEventListener('change', e => {
    state.chartSpan = Number(e.target.value); save(state);
    // A new span is a new default view, so a zoom or pan made before it is dropped; the view moves there as views do.
    const el = main.querySelector('.chart'), was = el?._fullLayout?.xaxis.range.slice();
    zooms.delete(ex.id);
    redrawExample(ex);
    if (!was || !el._fullLayout) return;
    const to = el._fullLayout.xaxis.range.slice();
    Plotly.relayout(el, { 'xaxis.range': was }).then(() => glideView(el, to));
  });
}

// A click on a candle of the Replay page opens a card beside it with the candle's prices and Analyse, which opens an
// analysis of what is at that candle as the chart had it at the cursor (see Explain.At in CryptoAnalysis.Site): a chapter
// for each thing the chart shows there, a thing whose layers and level are on. The other things at the candle are on the
// Analysis page, to add. A drag still pans; a click elsewhere closes the card. A replay that is playing stops for it, as
// the candle would move away from under the card.
// The basic building blocks, the candle, its run and its highs and lows: nearly always there to be seen rather than read
// about, so an analysis always has their chapters, off until ticked (see loadAnalysis), whatever the chart shows.
const BASIC_KINDS = new Set(['Candle', 'SuccessiveCandles', 'Point']);
const isBasic = id => BASIC_KINDS.has(String(id ?? '').split(':')[0]);
const thingShown = t => t.kind === 'Candle' || (t.kind === 'SuccessiveCandles' ? on('SuccessiveGreenCandles') || on('SuccessiveRedCandles')
  : on(`level${t.level}`) && (t.kind === 'Point' ? POINT_LAYERS.some(on) : t.kind === 'Swing' ? on('Upswing') || on('Downswing') : on('Uptrend') || on('Downtrend')));
{
  let down = null, asked = 0;
  const card = document.createElement('div');
  card.className = 'candle-card';
  card.hidden = true;
  document.body.append(card);
  const close = () => { card.hidden = true; asked++; };
  window.addEventListener('pointerdown', e => {
    if (!card.hidden && !card.contains(e.target)) close();
    down = (currentPage === 'Replay' || currentPage === 'Chart') && e.target.closest?.('.chart') ? [e.clientX, e.clientY] : null;
  }, true);
  window.addEventListener('pointerup', async e => {
    const chart = document.querySelector('#main .chart'), from = down;
    down = null;
    if (!from || !chart || (currentPage !== 'Replay' && currentPage !== 'Chart') || Math.hypot(e.clientX - from[0], e.clientY - from[1]) > 4) return;
    const ex = findExample(chart.dataset.id), i = ex && candleAt(chart, e), p = ex && (ex.hindsight ?? ex).prices;
    if (i == null || !p?.t[i] || i > cursorOf(ex)) return close();
    const time = p.t[i], up = p.c[i] > p.o[i], colour = p.c[i] === p.o[i] ? 'no body' : up ? 'green' : 'red';
    const money = v => Math.floor(v).toLocaleString('en-US');
    // A trade of a strategy on the chart that this candle is part of has Analyse trade and Find similar, and Analyse tells
    // of it too.
    // A replay only has the trades entered by its cursor.
    card.trades = tradesAround(ex.dataset, i).filter(x => x.trade.entryIndex <= cursorOf(ex));
    // On the Replay page the candle is seen from the cursor. The Chart has no cursor: a trade is seen from where it ends, so
    // its analysis replays it to its outcome; another candle from CHART_SEEN candles on, so what is there can be told to its
    // end. Either is soon enough after the candle for the replay batches to hold it.
    const seenAt = currentPage === 'Replay' ? cursorOf(ex)
      : Math.min(p.t.length - 1, card.trades.length ? Math.max(...card.trades.map(x => x.trade.exitIndex)) : i + CHART_SEEN);
    const seen = p.t[seenAt]?.slice(0, 16);
    const base = { dataset: ex.dataset, at: time.slice(0, 16), ...(seen ? { seen } : {}) };
    card.things = null;
    card.ex = ex;
    card.base = base;
    card.innerHTML = `<b>${esc(fmtTime(time))} UTC</b><span>open ${money(p.o[i])} · close ${money(p.c[i])} · ${colour}</span><span>high ${money(p.h[i])} · low ${money(p.l[i])}</span>
      ${card.trades.map(({ layer, trade }, n) => `<div class="card-trade"><span>${esc(layer.label)}: Trade #${trade.number} ${trade.entryIndex === i
        ? `${trade.direction === 'Short' ? 'sells' : 'buys'} at the close` : trade.entryIndex > i ? `enters at ${esc(fmtTime(trade.entryTime).slice(11))}` : `entered at ${esc(fmtTime(trade.entryTime))}`}</span>
        <button type="button" data-trade-analyse="${n}" title="An analysis of this trade, a chapter each for its entry, its exits and its outcome, read aloud">Analyse trade</button>
        <button type="button" data-trade-similar="${n}" title="Every candle with what this strategy's entry looks for, found from the candle runs, against the strategy's trades">Find similar</button></div>`).join('')}
      <div class="analyse"><button type="button" data-analyse-go disabled title="A chapter for each thing the chart shows at this candle; the others can be added on the Analysis page">Analyse</button></div>
      <span class="hint" data-things>Reading what is at this candle…</span>`;
    stopPlaying();
    card.hidden = false;
    const place = () => {
      const w = card.offsetWidth, h = card.offsetHeight;
      card.style.left = `${Math.min(e.clientX + 12, innerWidth - w - 8)}px`;
      card.style.top = `${Math.max(8, Math.min(e.clientY + 12, innerHeight - h - 8))}px`;
    };
    place();
    const mine = ++asked;
    const list = await fetch(`api/explain/at?${new URLSearchParams({ ...base, greenRuns: runMin('SuccessiveGreenCandles'), redRuns: runMin('SuccessiveRedCandles') })}`, { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null).catch(() => null);
    if (mine !== asked || card.hidden) return;
    // What the chart shows at the candle is what is analysed; the candle itself always is.
    card.things = (list ?? []).filter(t => thingShown(t) || isBasic(t.id)).map(t => t.id);
    if (!card.things.length) card.things = ['Candle'];
    // The analysis is written with the Successive Candles settings the page has now, which its address keeps.
    card.base = { ...base, greenRuns: runMin('SuccessiveGreenCandles'), redRuns: runMin('SuccessiveRedCandles') };
    card.querySelector('[data-things]').textContent = list?.length
      ? `${list.length} things at this candle; ${card.things.length} shown on the chart.`
      : 'The local server could not say what is at this candle.';
    card.querySelector('[data-analyse-go]').disabled = !list?.length;
    place();
  }, true);
  // Analyse opens the Analysis page in a browser tab of its own, which its Close closes: the page opens it itself, as a
  // tab can only be closed from within when a page opened it. It opens with the explanations on or off as they were last.
  card.addEventListener('click', e => {
    // An analysis of the trade opens as Analyse does, in a tab of its own, with the strategy in its address.
    const analyse = e.target.closest('[data-trade-analyse]');
    if (analyse) {
      const { trade, layer } = card.trades[Number(analyse.dataset.tradeAnalyse)];
      close();
      // With the trade come the chapters of what the chart shows at its entry candle, once those are known.
      const things = [...new Set(['Trade', ...(card.things ?? [])])];
      return window.open(`./${analysisHash({ ...card.base, at: minuteOf(trade.entryTime), things, strategy: JSON.stringify(layer.chartStrategy.strategy), detail: detailOf('Analysis') })}`, '_blank');
    }
    const similar = e.target.closest('[data-trade-similar]');
    if (similar) {
      const { layer, trade } = card.trades[Number(similar.dataset.tradeSimilar)];
      close();
      return openTradeSimilar(layer, trade, card.ex);
    }
    const b = e.target.closest('[data-analyse-go]');
    if (!b || b.disabled) return;
    close();
    // A candle that is part of a trade has the trade's chapters too, of the first trade on the card.
    const traded = card.trades[0];
    window.open(`./${analysisHash({ ...card.base, things: traded ? [...new Set(['Trade', ...card.things])] : card.things,
      ...(traded ? { strategy: JSON.stringify(traded.layer.chartStrategy.strategy) } : {}), detail: detailOf('Analysis') })}`, '_blank');
  });
  // The card is beside a candle where that was on the screen, so it goes when the chart moves under it: the cursor moves,
  // the chart is zoomed or the page scrolled, a key is pressed or the window changes.
  closeCandleCard = close;
  // It also goes when the pointer leaves it: once the pointer is well clear of the card.
  window.addEventListener('pointermove', e => {
    if (card.hidden) return;
    const r = card.getBoundingClientRect(), dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right), dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    if (Math.hypot(dx, dy) > 80) close();
  }, { passive: true });
  document.addEventListener('keydown', e => { if (!['Shift', 'Control', 'Alt', 'Meta', 'Tab'].includes(e.key) && !card.contains(e.target)) close(); });
  window.addEventListener('wheel', e => { if (!card.hidden && !card.contains(e.target)) close(); }, { capture: true, passive: true });
  window.addEventListener('scroll', e => { if (!card.contains(e.target)) close(); }, { capture: true, passive: true });
  window.addEventListener('resize', close);
  window.addEventListener('blur', close);
  window.addEventListener('hashchange', close);
}

// ---- Player controls ------------------------------------------------------------------------------------------------
// The Tour and Analysis pages play through the one player (see Tour below), with the same controls above the chart: the
// text on show, Back and On a section at a time, Play, where the cursor is, Voice and Speed; then a slider through the
// section on show and whether the next chapter plays on its own. The Tour page adds its glossary, video and editor; the
// Analysis page Find similar, Close and its checklist.
function playerPanel(page) {
  const tourPage = page === 'Tour';
  return `<div class="player" data-player>
    <div class="tour-caption" data-tour="caption" aria-live="polite" title="Click to move on to the next text"></div>
    <div class="tour-controls" role="group" aria-label="${tourPage ? 'Tour' : 'Analysis'} controls">
      <button type="button" data-tour-go="prev" title="Back to the start of this section, or of the one before (←)" aria-label="Back a section">⏮</button>
      <button type="button" class="play" data-tour-go="play" title="Play or pause (Space)">▶</button>
      <button type="button" data-tour-go="next" title="On to the next section; from the last, to the end (→)" aria-label="On a section">⏭</button>
      <span class="readout" data-tour="readout"></span>
      <button type="button" data-tour-go="voice" title="Read each text aloud from its clip in tour-audio">Voice</button>
      <label class="pace" title="How fast it plays: the candles, the wait after each text, and the voice">Speed
        <input type="range" min="0" max="${TOUR_PACES.length - 1}" step="1" data-tour="pace"><span data-tour="pace-name"></span></label>
      ${tourPage ? `<button type="button" data-tour-go="glossary" title="Show or hide the glossary: what the voice says in place of what is written, such as Break of Structure for BoS">Glossary</button>
        <button type="button" data-tour-go="video" title="Make the video of the tour as saved in tour.json, to download: the texts are read aloud, then the tour is recorded with the clips, which takes as long as the tour">Generate video</button>
        <a class="button" data-tour="download" href="api/video/file" download="tour.mp4" hidden>Download video</a>
        <span data-tour="video" aria-live="polite"></span>`
      : `<button type="button" data-tour-go="analysisVideo" title="Record this analysis as a video, its chapters that are on with their texts read aloud, to download; it takes as long as the analysis plays">Make video</button>
        <a class="button" data-tour="analysis-download" href="api/video/analysis/file" download="analysis.mp4" hidden>Download video</a>
        <span data-tour="video" aria-live="polite"></span>
        <button type="button" data-tour-go="similar" title="Find the other Trends like this one: the same level, direction, count of Swings and Strength, or any of those" hidden>Find similar</button>
        <button type="button" data-tour-go="tradeSimilar" title="Every candle with what this strategy's entry looks for, against the strategy's trades, each traded one to analyse" hidden>Find similar trades</button>
        <button type="button" class="edit" data-tour-go="close" title="Close the analysis and its tab">Close</button>`}
    </div>
    <div class="player-scrub" data-tour="scrub-row">
      <input type="range" min="0" max="0" step="0.1" list="player-marks" data-tour="scrub" aria-label="Where in the chapter" title="Drag to move through the chapter, its texts and its candles; it pauses, and Play carries on from there. The marks are where texts begin">
      <datalist id="player-marks"></datalist>
      <span class="readout" data-tour="where-in"></span>
      <label title="At the end of a chapter, play the next one; unticked, it pauses there"><input type="checkbox" data-tour="autonext">Play the next chapter</label>
    </div>
    ${tourPage ? '<div class="tour-glossary" data-tour="glossary" role="group" aria-label="Glossary" hidden></div>' : ''}

}

function wirePlayerPanel(root) {
  const panel = root.querySelector('[data-player]');
  panel.addEventListener('click', e => {
    const write = e.target.closest('[data-player-write]')?.dataset.playerWrite;
    if (write) return toggleKind(write === 'education');
    const go = e.target.closest('[data-tour-go]')?.dataset.tourGo;
    if (!go) return;
    if (go === 'voice') toggleTourVoice();
    else if (go === 'glossary') toggleTourGlossary();
    else if (go === 'video') generateTour();
    else if (go === 'similar') { pauseTour(); openSimilar(); }
    else if (go === 'tradeSimilar') { pauseTour(); openAnalysisTradeSimilar(); }
    else if (go === 'analysisVideo') makeAnalysisVideo();
    // Close closes the tab the Replay page opened; a tab opened by hand cannot be closed from within, and goes to Replay.
    else if (go === 'close') { pauseTour(); window.close(); setTimeout(() => { location.hash = '#Replay'; }, 300); }
    else tourGo(go);
  });
  panel.querySelector('[data-tour="pace"]').addEventListener('input', e => setTourPace(e.target.value));
  panel.querySelector('[data-tour="caption"]').addEventListener('click', nextText);
  const scrub = panel.querySelector('[data-tour="scrub"]');
  scrub.addEventListener('input', e => scrubTour(Number(e.target.value)));
  // Let go, or a key pressed on it: the player plays on if it was playing.
  scrub.addEventListener('change', () => { if (tour?.playAfterScrub) { tour.playAfterScrub = false; playTour(); } });
  // While it is held, the slider is where the hand puts it, not where the player is.
  scrub.addEventListener('pointerdown', () => { scrubbing = true; });
  panel.querySelector('[data-tour="autonext"]').addEventListener('change', e => { state.tourAutoNext = e.target.checked; save(state); });

  const glossary = panel.querySelector('[data-tour="glossary"]');
  glossary?.addEventListener('input', e => { const row = e.target.closest('.gl-row'); if (row) readGlossary(`glossary|${[...row.parentElement.children].indexOf(row)}|${e.target.dataset.gl}`); });
  glossary?.addEventListener('click', e => { const b = e.target.closest('button[data-gl]'); if (b && !b.disabled) glossaryAction(b.dataset.gl, b); });
}

// Whether a chapter that has ended plays the next one, or the player pauses there.
const autoNext = () => state.tourAutoNext !== false;

// ---- Analysis -------------------------------------------------------------------------------------------------------
// An analysis is a tour the local server writes (see Explain in CryptoAnalysis.Site) of the things ticked at a candle, a
// chapter each from the candle outwards, played by the tour's own player on a chart of the Analysis page's own. A few of
// the tour's options are off: no editor, glossary or video, and no pins, as the layers mark the same places. The chart
// draws the structure as known at the Replay cursor it was seen from, a part at a time as the run reaches it (see
// liveView). Analyse tells what each thing is (Summary); Explain also what a thing of its kind is and how it works
// (Education). Unticking a thing in the checklist leaves its chapter out at once; Analyse or Explain there writes it again.
// The page's address says which analysis it is, so it can be copied and opens the same one: the dataset, the candle, the
// Replay cursor it was seen from, the things told of, the Successive Candles settings it was written with and the detail.
// One analysis has one address: its things are in the order they are told, and the basic building blocks are always
// among them (see loadAnalysis). An older address naming one thing by explain and level opens that thing.
let wantedAnalysis = null;
// The order things are told in, as the server tells them: the candle, its run, then each order's from the finest.
const thingRank = id => { const [kind, level] = String(id).split(':'); return [{ Trade: -1, Candle: 0, SuccessiveCandles: 1 }[kind] ?? 2, -(Number(level) || 0), ['Point', 'Swing', 'Trend'].indexOf(kind)]; };
const byThing = (a, b) => { const x = thingRank(a), y = thingRank(b); return x[0] - y[0] || x[1] - y[1] || x[2] - y[2]; };
const runsOf = p => p.greenRuns != null ? { greenRuns: p.greenRuns, redRuns: p.redRuns } : {};
// What defines an analysis's content: the address without the detail, which only says which of its chapters are on.
// A Trade is a strategy's: the address carries the strategy, as strategies.json has it.
const strategyOf = p => p.strategy ? { strategy: p.strategy } : {};
const analysisKey = p => new URLSearchParams({ dataset: p.dataset, at: p.at, ...(p.seen ? { seen: p.seen } : {}), things: [...p.things].sort(byThing).join(','), ...runsOf(p), ...strategyOf(p) }).toString();
const analysisHash = p => `#Analysis?${analysisKey(p)}&detail=${encodeURIComponent(p.detail)}`;
// What an analysis's own edits are kept against: the candle, as seen from its cursor, with its settings. Not its things,
// as each edit names its thing, so a thing added keeps the edits made before it.
const editsKeyOf = p => new URLSearchParams({ dataset: p.dataset, at: p.at, ...(p.seen ? { seen: p.seen } : {}), ...runsOf(p), ...strategyOf(p) }).toString();
// The level of the Trend an analysis tells of, for Find similar.
const trendLevel = t => Number(t?.params?.things.find(id => id.startsWith('Trend:'))?.split(':')[1]) || null;
// Whether an analysis has the cursor: from when it starts until it has ended. The replay controls are hidden for that long,
// and come back at its end to step on or back from there.
const analysisRuns = () => currentPage === 'Analysis' && tour?.page === 'Analysis' && !tour.ended;

async function renderAnalysisPage(query) {
  const main = document.getElementById('main');
  const explain = query?.get('explain'), things = query?.get('things')?.split(',').filter(Boolean)
    ?? (explain ? [explain === 'Candle' ? 'Candle' : `${explain}:${Number(query.get('level')) || 1}`] : null);
  if (things?.length && query.get('dataset') && query.get('at')) {
    const detail = DETAILS.includes(query.get('detail')) ? query.get('detail') : detailOf('Analysis');
    const runs = Number(query.get('greenRuns')) > 0 ? { greenRuns: Number(query.get('greenRuns')), redRuns: Number(query.get('redRuns')) || Number(query.get('greenRuns')) } : {};
    const asked = { dataset: query.get('dataset'), at: query.get('at'), ...(query.get('seen') ? { seen: query.get('seen') } : {}), things, ...runs, ...(query.get('strategy') ? { strategy: query.get('strategy') } : {}), detail };
    if (!wantedAnalysis || analysisHash(wantedAnalysis) !== analysisHash(asked)) wantedAnalysis = asked;
    if (`#Analysis?${query}` !== analysisHash(asked)) history.replaceState(null, '', analysisHash(asked));
  } else if (wantedAnalysis) history.replaceState(null, '', analysisHash(wantedAnalysis));
  const params = wantedAnalysis;
  selected.clear();
  pauseTour();
  currentPage = 'Analysis';
  const head = `<section class="term-head"><h2>Analysis</h2>
    <p>The things at a candle picked on the Replay page, a chapter each, on a chart of its own. The layers and the view here are this page's; the Replay page keeps its own.</p></section>`;
  const show = body => { main.innerHTML = head + body; renderLayers(); wireReplayExamples(main); drawAll(currentPage); };
  if (!serverOn) {
    show(`<div class="empty" data-server-check>Checking for the local server…</div>`);
    return checkLocalServer();
  }
  if (!params) return show('<div class="empty">Nothing to analyse yet. On the <a href="#Replay">Replay</a> page, click a candle, tick what to tell of, and choose Analyse or Explain.</div>');
  // The same analysis comes back as it was left; another is written afresh.
  if (tours.Analysis?.hash !== analysisHash(params)) {
    show('<div class="empty">Writing the analysis…</div>');
    let loaded;
    try { loaded = await loadAnalysis(params); }
    catch (e) {
      if (currentPage === 'Analysis' && wantedAnalysis === params) show(`<div class="empty warn">The analysis could not be written: ${esc(e.message.replace(/\.$/, ''))}.</div>`);
      return;
    }
    if (currentPage !== 'Analysis' || wantedAnalysis !== params) return;
    tours.Analysis = loaded;
    // Written, the analysis has its one address: every thing it has, in order, and the settings it was written with.
    wantedAnalysis = loaded.params;
    history.replaceState(null, '', loaded.hash);
  }
  tour = tours.Analysis;
  // The mode asked for is the one the next analysis opens in.
  state.detail = { ...state.detail, Analysis: params.detail };
  save(state);
  show(`<article class="example replay-big" id="ex-${esc(tour.ex.id)}">
      <header><h3 data-tour="chapter"></h3><span class="id" data-tour="where"></span></header>
      ${playerPanel('Analysis')}
      ${chartRow(tour.ex)}
    </article>`);
  wirePlayerPanel(main);
  renderContents();
  if (!videoMode) makeAnalysisVideo(false);
  // Written again to add a thing, or at the other detail, it opens at that thing's chapter.
  const jumped = params.jump ? tour.sections.findIndex((s, i) => s.thing === params.jump && sectionOn(i)) : -1;
  const first = jumped >= 0 ? jumped : sectionAfter(-1, 1) ?? 0;
  tour.view = tour.sections[first]?.view ?? tour.view;
  tour.zoom = null;
  seekTour(first);
  main.querySelector('[data-player]').scrollIntoView({ block: 'start' });
  playTour();
}

// The written tour of an analysis, ready to play: the things at the candle for its checklist, the clips read so far, its
// scene on the dataset from its first candle, and the structure as known at the cursor it was seen from, fetched.
async function loadAnalysis(params) {
  // How long a run must be to count: as the address says, else the page's Successive Candles settings.
  const runs = params.greenRuns != null ? runsOf(params) : { greenRuns: runMin('SuccessiveGreenCandles'), redRuns: runMin('SuccessiveRedCandles') };
  const where = { dataset: params.dataset, at: params.at, ...(params.seen ? { seen: params.seen } : {}) };
  const found = await fetch(`api/explain/at?${new URLSearchParams({ ...where, ...runs })}`, { cache: 'no-store' }).then(x => x.ok ? x.json() : null).catch(() => null);
  // A strategy's trade is not one of the things the chart has at the candle, so its chapters are listed with them here.
  const list = found && params.strategy ? [{ id: 'Trade', kind: 'Trade', name: 'Trade' }, ...found] : found;
  // The basic building blocks at the candle are always there to tick, whatever the analysis was asked for with.
  const things = [...new Set([...params.things, ...(list ?? []).map(t => t.id).filter(isBasic)])].sort(byThing);
  // Changes not saved yet, carried from the analysis as it was before a thing was added.
  const { changes: carried, ...asked } = params;
  const written = { ...asked, things, ...runs };
  // The analysis's own changes to its texts, kept against its key (see Analysis edits).
  const editsKey = editsKeyOf(written);
  const [r, audio, stored] = await Promise.all([
    fetch(`api/explain/tour?${new URLSearchParams({ ...where, things: things.join(','), inPlace: true, ...runs, ...strategyOf(params) })}`, { cache: 'no-store' }),
    fetch('tour-audio/index.json', { cache: 'no-store' }).then(x => x.ok ? x.json() : {}).catch(() => ({})),
    fetch(`api/analysis/edits?key=${encodeURIComponent(editsKey)}`, { cache: 'no-store' }).then(x => x.ok ? x.json() : null).catch(() => null),
    definitionsBase ? null : loadDefinitions(),
  ]);
  const text = await r.text();
  if (!r.ok) throw new Error(r.status === 404 ? `the server has no dataset "${params.dataset}"` : text.replace(/^"|"$/g, '') || `the server answered ${r.status}`);
  // The analysis as written from the prices, in the shape of tour.json, and as changed for this analysis alone.
  const writtenDef = splitExplanations(JSON.parse(text)), saved = stored?.sections ?? {}, changes = { ...saved, ...carried };
  // Every text is kept at its own level: an explanation's at Education, an analysis's at Summary.
  const loaded = newPlayer(withChanges(writtenDef, changes), audio, { page: 'Analysis', idPrefix: 'Analysis', detail: 'education', params: written, hash: analysisHash(written), list, missing: writtenDef.missing ?? [],
    writtenDef, changesSaved: canonical(saved), editsKey,
    // A trade's analysis is about its candles and exits: the structure's candidates and ghosts would only hide them.
    pins: false, waitForClips: true, extraLayers: (state.pages.Analysis ?? defaultsFor('Analysis')).filter(id => id !== 'replay' && !/^level\d+$/.test(id)
      && !(params.strategy && (id === 'candidates' || GHOST_IDS.includes(id)))) });
  await loadTourDatasets(loaded);
  anchorTour(loaded);
  recompile(loaded);
  await resolveAll(loaded);
  // A kind of thing with nothing written to explain it has no explanation.
  const empty = new Set(loaded.sections.flatMap((s, i) => s.explains && !s.cues.length ? [i] : []));
  if (empty.size) {
    for (const d of [loaded.writtenDef, loaded.def]) d.sections = d.sections.filter((s, i) => !empty.has(i));
    recompile(loaded);
  }
  // The changes kept for things this analysis does not tell of are kept as they are when it is saved.
  const present = new Set(loaded.writtenDef.sections.map(sectionKey));
  loaded.elsewhere = Object.fromEntries(Object.entries(changes).filter(([k]) => !present.has(k)));
  // The explanations are on when the analysis was asked for with Explain.
  loaded.chapters.forEach((c, i) => { const s = loaded.sections[c.section]; if (s.explains && (params.detail !== 'education' || s.repeat)) loaded.chaptersOff.add(i); });
  // The basic building blocks, the candle and its highs and lows, start off, one tick away, even when the chart shows
  // them: unless one was ticked before the analysis was written again, or they are all there is to tell of.
  const basic = loaded.chapters.flatMap((c, i) => isBasic(loaded.sections[c.section].thing) ? [i] : []);
  const kept = new Set(params.basicOn ?? []);
  if (loaded.chapters.some((c, i) => !basic.includes(i) && !loaded.chaptersOff.has(i)))
    basic.filter(i => !kept.has(loaded.sections[loaded.chapters[i].section].thing)).forEach(i => loaded.chaptersOff.add(i));
  if (!loaded.sections.some(s => s.cues.some(c => !c.skipped))) throw new Error(loaded.errors[0] ?? 'the server wrote no texts for it');
  if (Number.isInteger(writtenDef.known)) { loaded.known = writtenDef.known; await fetchBatch(loaded.ex, loaded.known); }
  return loaded;
}

// ---- Chapters --------------------------------------------------------------------------------------------------------
// The chapters are listed beside the chart, in the Tour or Analysis tab (see Contents): the name goes to the chapter, and
// the tick box beside it turns the chapter on or off, a chapter that is off being skipped by the player and its steps. An
// analysis has a chapter for each thing it tells of, and lists the other things at its candle in their places, to add.

// An analysis's sections, each thing's in two chapters: what a thing of its kind is, told from its texts at Education, then
// what this one is, from its texts at Summary, each a section of tour.json with its "detail". Both run through the same
// candles. A Candle has a third, after its own: whether it is green or red, run on to one of the other colour, and the rule
// (its Colour block), as both kinds are on the chart only then.
const AFTER_CHAPTERS = { Candle: [{ chapter: 'Green and red candles', blocks: ['Colour'] }] };
// The blocks a term is told in, as the server has them (Explain.BlocksOf), for those with chapters after their own.
const BLOCKS = { Candle: ['Shape', 'Colour'] };
function splitExplanations(def) {
  const word = s => s.thing?.startsWith('SuccessiveCandles') ? 'Successive Candles' : (s.chapter ?? '').split(' ').pop();
  const named = s => { if (s.explainChapter) return s.explainChapter; const w = word(s); return w === 'Successive Candles' ? 'What are Successive Candles?' : `What is ${/^[AEIOU]|^(HH|HL|LH|LL|MSB)$/.test(w) ? 'an' : 'a'} ${w}?`; };
  // A kind of thing is explained once: a second Downtrend's explanation is there, but off, one tick away.
  const told = new Set(), explains = (s, name) => { const repeat = told.has(name); told.add(name); return { ...s, chapter: name, detail: 'education', explains: true, ...(repeat ? { repeat } : {}) }; };
  def.sections = (def.sections ?? []).flatMap(s => {
    const after = AFTER_CHAPTERS[s.explain] ?? [], own = after.length ? { blocks: BLOCKS[s.explain].filter(b => !after.some(a => a.blocks.includes(b))) } : {};
    return [explains({ ...s, ...own }, named(s)), { ...s, ...own, detail: 'summary' }, ...after.map(a => explains({ ...s, blocks: a.blocks }, a.chapter))];
  });
  return def;
}

// The things an analysis tells of, as those with a chapter on.
const thingsOn = () => [...new Set(tour.sections.filter((s, i) => s.thing && sectionOn(i)).map(s => s.thing))];
// Whether any explanation is on: the detail the analysis is at, in its address.
const explainsOn = () => tour.chapters.some((c, i) => tour.sections[c.section].explains && !tour.chaptersOff.has(i));

// Analyse turns every analysis chapter on or off, and Explain every explanation, on only for the things whose analysis is
// on. The address then says the detail the explanations make it.
function toggleKind(explains) {
  if (tour?.page !== 'Analysis') return;
  const of = tour.chapters.map((c, i) => ({ i, s: tour.sections[c.section] })).filter(x => x.s.explains === explains);
  const analysed = new Set(tour.chapters.flatMap((c, i) => !tour.sections[c.section].explains && !tour.chaptersOff.has(i) ? [tour.sections[c.section].thing] : []));
  const anyOn = of.some(x => !tour.chaptersOff.has(x.i));
  for (const x of of) {
    if (anyOn) tour.chaptersOff.add(x.i);
    else if (!explains || (analysed.has(x.s.thing) && !x.s.repeat)) tour.chaptersOff.delete(x.i);
  }
  analysisDetailChanged();
  chaptersChanged();
}

// The detail an analysis is at is whether any explanation is on, which its address says and the next analysis opens in.
function analysisDetailChanged() {
  const detail = explainsOn() ? 'education' : 'summary';
  wantedAnalysis = tour.params = { ...tour.params, detail };
  tour.hash = analysisHash(tour.params);
  state.detail = { ...state.detail, Analysis: detail };
  save(state);
  history.replaceState(null, '', tour.hash);
}

// A thing at the candle the analysis does not tell of yet: it is written again with it, and opens at its chapter.
function addThing(id) {
  addThings([id], id);
}

// Things at the candle the analysis does not tell of yet: it is written again with them, and opens at the chapter of the
// thing given, or the one on show.
function addThings(ids, jump = tourSection()?.thing) {
  if (tour?.page !== 'Analysis' || !ids.length) return;
  // The basic building blocks keep their chapters, each off or on as it was.
  wantedAnalysis = { ...tour.params, things: [...new Set([...thingsOn(), ...tour.params.things.filter(isBasic), ...ids])],
    detail: explainsOn() ? 'education' : 'summary', jump, basicOn: [...thingsOn(), ...ids].filter(isBasic), changes: analysisDirty() ? analysisChanges() : undefined };
  history.replaceState(null, '', analysisHash(wantedAnalysis));
  renderAnalysisPage();
}

// The level of a thing, from its id: "Swing:3" is at the 3rd order; a Candle or a run is at none.
const thingLevel = id => Number(id?.split(':')[1]) || null;

// The layers a section shows: the section's own, beside the page's; on the Analysis page, the levels are every order the
// analysis has a chapter on for, so the Levels buttons say which orders it tells of. While a candle is being picked, the
// candles still to come are shown, to pick from.
function sectionLayers(s) {
  const analysis = tour.page === 'Analysis';
  const levels = analysis ? [...new Set(tour.chapters.flatMap((c, i) => tour.chaptersOff.has(i) ? [] : [thingLevel(tour.sections[c.section].thing)]).filter(Boolean))].map(l => `level${l}`) : [];
  return [...new Set(['replay', ...(tour.extraLayers ?? []), ...s.layers.filter(id => !analysis || !/^level\d+$/.test(id)), ...levels, ...(tour.picking ? ['future'] : [])])];
}

// On the Analysis page the Levels buttons say which orders the analysis tells of. A level turned on brings the chapters of
// what is at the candle at that order: those it has, turned on again, and those it has not, written in, with their
// explanations when Explain is on. A level turned off turns its chapters off, where they stay to be turned on again.
function analysisLevelsChanged(before, after) {
  if (tour?.page !== 'Analysis') return;
  const levels = list => new Set(list.filter(id => /^level\d+$/.test(id)).map(id => Number(id.slice(5))));
  const was = levels(before), now = levels(after);
  const added = [...now].filter(l => !was.has(l)), removed = [...was].filter(l => !now.has(l));
  if (!added.length && !removed.length) return;
  const explaining = explainsOn();
  tour.chapters.forEach((c, i) => {
    const s = tour.sections[c.section], level = thingLevel(s.thing);
    if (removed.includes(level)) tour.chaptersOff.add(i);
    else if (added.includes(level) && (!s.explains || (explaining && !s.repeat))) tour.chaptersOff.delete(i);
  });
  const missing = (tour.list ?? []).filter(t => added.includes(t.level) && !tour.sections.some(s => s.thing === t.id)).map(t => t.id);
  if (missing.length) return addThings(missing);
  chaptersChanged();
}

// ---- Contents --------------------------------------------------------------------------------------------------------
// Beside the chart, the Tour or Analysis tab: a row for each chapter (see chapterRow) to tick, go to and, with Edit, open
// to change. A tour's rows are its chapters in order, each opening to its sections in the tour's editor (see
// renderTourEditor), and what is changed there is saved to tour.json. An analysis's rows are grouped as its things are at
// the candle, the candle first and then each order from the finest, each group with Learn more; above them, links to the
// tour's chapter on each kind of thing, and Explain. With Edit, an analysis's chapters open to their sections in the same
// editor as the tour's, and what is changed there is kept for that analysis alone (see Analysis edits).
let analysisEditing = false;
// The chapters opened or folded by hand while editing, on each page: the chapter on show is open unless it was folded,
// and any other chapter is folded unless it was opened.
const chapterFolds = { Tour: { opened: new Set(), folded: new Set() }, Analysis: { opened: new Set(), folded: new Set() } };
const tourChapterOpen = k => { const f = chapterFolds[tour.page]; return k === tourSection()?.chapter ? !f.folded.has(k) : f.opened.has(k); };

function renderContents() {
  if (currentPage === 'Tour') renderTourEditor();
  else if (currentPage === 'Analysis') renderAnalysisContents();
}

// A chapter's sections: from its first to the next chapter's first.
const chapterSections = i => tour.sections.slice(tour.chapters[i].section, tour.chapters[i + 1]?.section ?? tour.sections.length);
const minutes = seconds => { const s = Math.round(seconds); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

// A chapter's row: its tick box, its name, which goes to it, and how long it plays, the one on show marked; while editing,
// a fold that opens it. An explanation is in the explanations' purple.
function chapterRow(i, { number = false, open = null } = {}) {
  const c = tour.chapters[i], on = !tour.chaptersOff.has(i), explains = tour.sections[c.section]?.explains;
  return `<div class="ct-row${explains ? ' explains' : ''}${on ? '' : ' off'}${i === tourSection()?.chapter ? ' active' : ''}" data-chapter-row="${i}">` +
    `<input type="checkbox" data-chapter-on="${i}" ${on ? 'checked' : ''} title="Play this chapter, or leave it out" aria-label="Play ${esc(c.name)}">` +
    `<a href="#Tour/${c.slug}" data-chapter="${i}" title="Go to this chapter">${number ? `${i + 1}. ` : ''}${esc(c.name)}</a>` +
    `<span class="ed-meta" data-chapter-meta></span>` +
    (open == null ? '' : `<button type="button" class="ct-fold" data-ed="chapter-fold" data-chapter-fold="${i}" aria-expanded="${open}" title="${open ? 'Fold this chapter away' : 'Open this chapter to edit it'}">${open ? '▾' : '▸'}</button>`) +
    `</div>`;
}

// The rows as the player has them: which are on, which is on show, and how long each plays.
function syncContents() {
  if (!tour) return;
  document.querySelectorAll('#tour-editor [data-chapter-row]').forEach(row => {
    const i = Number(row.dataset.chapterRow);
    if (!tour.chapters[i]) return;
    const on = !tour.chaptersOff.has(i);
    row.classList.toggle('off', !on);
    row.classList.toggle('active', i === tourSection()?.chapter);
    row.querySelector('[data-chapter-on]').checked = on;
    row.querySelector('[data-chapter-meta]').textContent = minutes(chapterSections(i).reduce((n, s) => n + sectionSeconds(s), 0));
  });
  document.querySelector('#tour-editor [data-ed="explain"]')?.setAttribute('aria-pressed', explainsOn());
}

// What the contents' own buttons do, before the tour editor's: true when it was one of them.
function contentsAction(action, el) {
  switch (action) {
    case 'edit':
      if (currentPage === 'Tour') toggleTourEditor();
      else { analysisEditing = !analysisEditing; drawAll(currentPage); renderAnalysisContents(); }
      return true;
    case 'chapter-fold': {
      const i = Number(el.dataset.chapterFold), f = chapterFolds[tour.page];
      const toggled = i === tourSection()?.chapter ? f.folded : f.opened;
      if (toggled.has(i)) toggled.delete(i); else toggled.add(i);
      editorSection = -1;
      renderContents();
      return true;
    }
    case 'explain': toggleKind(true); return true;
    case 'learn': learnMore(el.dataset.learn.split(',')); return true;
  }
  return false;
}

// The tour's chapter on each kind of thing: the chapter where the tour first turns on the thing's layer.
let termChapters = null;
function loadTermChapters() {
  return termChapters ??= fetch('tour.json', { cache: 'no-store' }).then(r => r.json()).then(def => {
    const found = new Map();
    let chapter = null;
    for (const s of def.sections ?? []) {
      if (s.scene != null) break;
      if (s.chapter) chapter = s.chapter;
      for (const id of [...(s.layers ?? []), ...(s.add ?? [])]) {
        const layer = LAYER_ALIASES[id] ?? id;
        if (chapter && !found.has(layer)) found.set(layer, chapter);
      }
    }
    return found;
  }).catch(() => new Map());
}

// A thing at the candle as a kind of thing to learn about: the word for it and the layer that draws it.
function termOf(t) {
  const last = t.name.split(' ').pop();
  if (t.kind === 'Candle') return { word: 'Candles', layer: 'price' };
  if (t.kind === 'SuccessiveCandles') return { word: 'Successive Candles', layer: t.name.includes('Green') ? 'SuccessiveGreenCandles' : 'SuccessiveRedCandles' };
  if (t.kind === 'Point') return { word: last, layer: { HH: 'HigherHigh', HL: 'HigherLow', LH: 'LowerHigh', LL: 'LowerLow' }[last] };
  return { word: `${last}s`, layer: last };
}

// "Learn more about Candles, LL, Downswings and Downtrends", each a link to its chapter of the tour.
async function fillLearnLinks() {
  const box = document.querySelector('#tour-editor [data-learn-links]');
  if (!box || !tour?.list) return;
  const chapters = await loadTermChapters(), seen = new Set(), links = [];
  // The tour has nothing on trades yet.
  for (const t of tour.list.filter(t => t.kind !== 'Trade')) {
    const { word, layer } = termOf(t);
    if (seen.has(word)) continue;
    seen.add(word);
    const chapter = chapters.get(layer);
    links.push(chapter ? `<a href="#Tour/${slugOf(chapter)}" title="The tour's chapter ${esc(chapter)}">${esc(word)}</a>` : esc(word));
  }
  box.innerHTML = links.length ? `Learn more in the tour about ${links.length > 1 ? `${links.slice(0, -1).join(', ')} and ${links.at(-1)}` : links[0]}.` : '';
}

function renderAnalysisContents() {
  const box = document.getElementById('tour-editor');
  if (!tour || tour.page !== 'Analysis' || currentPage !== 'Analysis') { box.innerHTML = ''; return; }
  const scrolled = box.querySelector('.ed-body')?.scrollTop ?? 0;
  // The things at the candle, grouped: the candle and its run, then each order from the finest.
  const groups = [];
  for (const t of tour.list ?? []) {
    const name = t.kind === 'Trade' ? 'The trade' : t.level ? orderOf(t.level) : 'The candle';
    if (groups.at(-1)?.name !== name) groups.push({ name, things: [] });
    groups.at(-1).things.push(t);
  }
  const chaptersOf = t => tour.chapters.flatMap((c, i) => tour.sections[c.section]?.thing === t.id ? [i] : []);
  // While editing, a chapter opens to its sections in the tour's editor (see editorCards).
  const cards = analysisEditing ? editorCards() : null;
  if (cards) editorSection = tour.index;
  const thing = t => {
    const own = chaptersOf(t);
    if (!own.length) return `<button type="button" class="ct-add" data-add="${esc(t.id)}" title="Add this to the analysis, and go to it">+ ${esc(t.name)}</button>`;
    return own.map(i => {
      const open = cards ? tourChapterOpen(i) : null;
      return chapterRow(i, { open }) + (open ? `<div class="ct-sections">${chapterSections(i).map(s => cards.sectionCard(s.index)).join('')}</div>` : '');
    }).join('');
  };
  const group = g => `<div class="ct-group"><header><span>${esc(g.name)}</span>${g.things.some(t => chaptersOf(t).length)
    ? `<button type="button" data-ed="learn" data-learn="${esc(g.things.map(t => t.id).join(','))}" title="Play what each of these is, then what this one is">Learn more</button>` : ''}</header>${g.things.map(thing).join('')}</div>`;
  box.innerHTML = `<div class="ed-head"><h4>Contents</h4>
      ${analysisEditing ? `<button type="button" data-ed="undo" title="Undo the last change">Undo</button>
        <button type="button" data-ed="revert" title="Back to this analysis as last saved (Undo brings back what was here)">Revert</button>
        <button type="button" data-ed="save" title="Keep these sections for this analysis alone (Ctrl+S)">Save</button>` : ''}
      <button type="button" data-ed="explain" aria-pressed="${explainsOn()}" title="Turn the explanations on or off: what a thing of each kind is and how it works, a chapter before its own">Explain</button>
      <button type="button" data-ed="edit" aria-pressed="${analysisEditing}" title="Open the chapters to edit their sections, for this analysis alone">Edit</button></div>
    ${analysisEditing ? '<div class="ed-status" data-ed-status aria-live="polite"></div>' : ''}
    <div class="ed-body">
      <div class="ct-learn" data-learn-links></div>
      ${tour.missing.length ? `<div class="ct-warn">Not at this candle as the chart had it: ${esc(tour.missing.join(', '))}</div>` : ''}
      ${groups.map(group).join('')}
    </div>`;
  box.querySelector('.ed-body').scrollTop = scrolled;
  syncContents();
  if (cards) updateEditorMeta();
  updateEditorStatus();
  fillLearnLinks();
}

// Learn more on a group: what each thing in it is, a chapter before its own, played from the first. The things are those
// whose chapters are on, or all of the group's when none is.
function learnMore(ids) {
  const of = tour.chapters.map((c, i) => ({ i, s: tour.sections[c.section] })).filter(x => ids.includes(x.s.thing));
  let analysed = of.filter(x => !x.s.explains && !tour.chaptersOff.has(x.i));
  if (!analysed.length) {
    analysed = of.filter(x => !x.s.explains);
    analysed.forEach(x => tour.chaptersOff.delete(x.i));
  }
  const things = new Set(analysed.map(x => x.s.thing));
  of.filter(x => x.s.explains && things.has(x.s.thing)).forEach(x => tour.chaptersOff.delete(x.i));
  analysisDetailChanged();
  const first = of.find(x => !tour.chaptersOff.has(x.i));
  pauseTour();
  if (first) jumpToChapter(first.i);
  playTour();
  syncContents();
}

// ---- Analysis edits --------------------------------------------------------------------------------------------------
// An analysis's sections are edited as the tour's are, in the same editor (see Tour editor), for that analysis alone. Each
// section is known by the thing it tells of and its detail; what is changed in it, its settings, its own texts and its
// written texts' edits (by id), is kept by the local server against the analysis's candle, cursor and settings
// (editsKeyOf), and laid over the sections written from the prices each time the analysis is written, so whatever is not
// changed follows the prices and the definitions as they are.
const sectionKey = s => `${s.thing}|${s.detail}${s.blocks ? `|${s.blocks.join('+')}` : ''}`;
// The settings of a section an analysis writes for itself, which its changes do not keep.
const OWN_KEYS = ['thing', 'detail', 'blocks', 'explains', 'repeat', 'explain', 'at', 'level', 'known', 'runs'];

// The written analysis with its own changes over it, as a copy: a setting changed to nothing is as written, or left out
// when nothing was written for it.
function withChanges(def, changes) {
  const copy = JSON.parse(JSON.stringify(def));
  copy.sections = (copy.sections ?? []).map(s => {
    const own = changes[sectionKey(s)];
    if (!own) return s;
    const changed = { ...s, ...own };
    for (const [k, v] of Object.entries(own)) if (v === null) { if (k in s) changed[k] = s[k]; else delete changed[k]; }
    return changed;
  });
  return copy;
}

// What the analysis on show has changed in its sections, by each section's key, with those kept for things it does not
// tell of.
function analysisChanges(t = tour) {
  const changes = { ...t.elsewhere };
  t.def.sections.forEach((d, i) => {
    const w = t.writtenDef.sections[i], own = {};
    if (!w) return;
    for (const k of new Set([...Object.keys(d), ...Object.keys(w)])) {
      if (OWN_KEYS.includes(k) || JSON.stringify(d[k]) === JSON.stringify(w[k])) continue;
      own[k] = d[k] ?? null;
    }
    if (Object.keys(own).length) changes[sectionKey(w)] = own;
  });
  return changes;
}
// Changes as text with every object's keys in order, so the same changes read the same however they were made.
const canonical = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.entries(x).sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0)) : x);
// An analysis is unsaved while its own changes are, or a definition changed from it.
const analysisDirty = (t = tour) => t?.page === 'Analysis' && (canonical(analysisChanges(t)) !== t.changesSaved || definitionsDirty());

// Saves the analysis's own changes, kept for it alone, and any definition changed from it, to definitions.json.
async function saveAnalysisEdits() {
  if (!analysisDirty()) return;
  const changes = analysisChanges(), saved = canonical(changes), notes = [];
  if (saved !== tour.changesSaved) {
    const response = await fetch(`api/analysis/edits?key=${encodeURIComponent(tour.editsKey)}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sections: changes }) }).catch(() => null);
    if (response?.ok) tour.changesSaved = saved;
    else notes.push(response?.status === 404 || response?.status === 405 || response?.status === 400
      ? 'Not saved: the local server was started before analyses could keep their own sections. Restart ./build-site.ps1 -Serve.'
      : 'Not saved: the local server did not take the changes.');
  }
  const definitions = await saveDefinitions();
  if (definitions) notes.push(definitions);
  tour.note = notes.join(' ');
  updateEditorStatus();
}

// Back to the analysis as last saved; Undo brings back what was here.
function revertAnalysisEdits() {
  rememberTour();
  tour.def = withChanges(tour.writtenDef, JSON.parse(tour.changesSaved));
  DEFINITIONS = JSON.parse(definitionsSaved);
  applyTour({ render: true });
}

// Turning a chapter on or off. The chapter on show, turned off, gives way to the next that is on, playing on if it was.
function toggleChapter(i, on) {
  if (!tour) return;
  if (on) tour.chaptersOff.delete(i); else tour.chaptersOff.add(i);
  chaptersChanged();
}

function chaptersChanged() {
  if (sectionOn(tour.index) || tour.ended) {
    // The levels an analysis shows follow its chapters that are on.
    if (tour.page === 'Analysis' && tourSection()) { tourLayers = sectionLayers(tourSection()); refreshTour(); }
    return updateTourPanel();
  }
  const was = !!tour.timer, next = sectionAfter(tour.index, 1);
  pauseTour();
  if (next == null) return tourGo('end');
  enterSection(next);
  if (was) playTour();
}

// Going to a chapter, which is turned on if it was off, playing on if it was playing.
function jumpToChapter(i) {
  const c = tour?.chapters[i];
  if (!c) return;
  const was = !!tour.timer;
  pauseTour();
  if (tour.journey) endJourney();
  tour.chaptersOff.delete(i);
  enterSection(c.section);
  if (was) playTour();
}

// A section is played while its chapter is on.
const sectionOn = i => !!tour?.sections[i] && !tour.chaptersOff?.has(tour.sections[i].chapter);

// The next section played after i going forward (by 1) or back (by -1), or null when there is none.
function sectionAfter(i, by) {
  for (let j = i + by; j >= 0 && j < (tour?.sections.length ?? 0); j += by) if (sectionOn(j)) return j;
  return null;
}

function findExample(id) {
  return DATA.examples.find(e => e.id === id) ?? DATA.structure?.examples?.find(e => e.id === id) ?? DATA.interims?.examples?.find(e => e.id === id)
    ?? replayDatasets.find(e => e.id === id) ?? chartDatasets.find(e => e.id === id) ?? tour?.scenes?.find(sc => sc.ex?.id === id)?.ex ?? (tour?.ex.id === id ? tour.ex : undefined);
}

// ---- Tour ------------------------------------------------------------------------------------------------------------
// A scripted walk through a dataset, read from tour.json: a start state, then sections that each say which layers are on,
// how far the replay runs and what text appears. A section begins where the one before it ended, so the tour plays as one
// continuous replay. Candles are numbered from the tour's start time (#0), and the structure is anchored there too.
//   start    time (the dataset time of #0), view (the first and last candle the chart shows, as [0, 168]), speed (candles
//            a second) and layers.
//   section  chapter (starts a chapter, which has a link of its own), layers (replaces the layers) or add and remove,
//            from (the candle the section starts at; without it, where the section before ended: an earlier candle takes
//            the replay back), until (the candle the replay runs to; without it the replay stays where it is), view
//            (without it, the view as before), speed, cues. A section can be come to by a journey in place of from:
//            fastForward { to, speed, draw } or rewind { to, speed, erase }. The view eases out to hold the whole way,
//            the replay runs to the candle "to" at that many candles a second, drawing or erasing as it goes, and the view
//            eases in to the section's own. With draw or erase false the replay stays where it is and only the view moves.
//            A section with explain ("Candle", "Swing" or "Trend"), at (the candle) and level (the sawtooth level, 1 unless
//            given) has its view, layers, until and texts written by the local server from the prices (see Explain in
//            CryptoAnalysis.Site); what it says for itself wins, and texts of its own follow the written ones.
//   cue      texts, a text for each level of detail it is written at ({ "summary", "education" }); the one shown is for
//            the highest level at or below the page's Detail setting, and a cue with none that low is left out. Shown
//            under the chart as the section begins; with at, when the replay reaches that candle, which waits
//            there while the text is read; with on as well ('open', 'high', 'low', 'close' or a price), pinned to that
//            point of the candle (place: 'above', 'below', 'left' or 'right'). hold is the seconds the text stays before
//            the next, by default the time it takes to read (0 moves straight on, leaving the caption up while pins show); keep is how long a pin stays: 'section', 'chapter' or 'always'.
const DEFAULT_VIEW = [0, 168];
// Candles a second of a fast forward or rewind that does not say.
const JOURNEY_SPEED = 50;
const LAYER_ALIASES = { candles: 'price', closes: 'close' };
// How the editor writes a layer whose id is not what it is called on the page.
const LAYER_NAMES = { price: 'candles' };
const PIN_PRICES = { open: 'o', high: 'h', low: 'l', close: 'c' };
const PIN_PLACES = { above: [0, -55], below: [0, 55], left: [-70, 0], right: [70, 0] };
const TOUR_TICK = 40;
// The Speed slider's paces: how fast the voice reads (its clips are played that much faster or slower, at the same pitch),
// how fast a text is read without the voice (against about 240 words a minute), how fast the candles run against the
// section's speed, and the seconds a text stays after it has been read.
const TOUR_PACES = [{ name: 'Slowest', voice: 0.8, reading: 0.6, candles: 0.35, gap: 0.8 }, { name: 'Slower', voice: 0.9, reading: 0.8, candles: 0.6, gap: 0.4 },
  { name: 'Normal', voice: 1, reading: 1, candles: 1, gap: 0.15 }, { name: 'Faster', voice: 1.1, reading: 1.3, candles: 1.6, gap: 0.05 },
  { name: 'Fastest', voice: 1.2, reading: 1.7, candles: 2.6, gap: 0 }];
const NORMAL_PACE = TOUR_PACES.find(p => p.name === 'Normal');
// The player on the page shown, and each page's own, kept while another page is shown.
let tour = null, tourLoading = null;
const tours = { Tour: null, Analysis: null };
// Opened with ?video, the page shows the tour alone, for tools/tour-video to record.
const videoMode = new URLSearchParams(location.search).has('video');

// How much a text tells, from least to most, the same names as EnumDetail in CryptoAnalysis.Site. A cue has a text for
// each level it is written at and shows the one for the highest level at or below the page's Detail setting; a cue with
// none that low is left out. The tour always tells at Education; an analysis at the detail it was written with, Analyse
// at Summary and Explain at Education, the last of which the next analysis opens in.
const DETAILS = ['summary', 'education'];
const DETAIL_NAMES = { summary: 'Summary', education: 'Education' };
const detailOf = page => page === 'Analysis' ? state.detail?.Analysis ?? 'summary' : 'education';
const textAt = (texts, detail) => { for (let i = DETAILS.indexOf(detail); i >= 0; i--) if (texts?.[DETAILS[i]]) return texts[DETAILS[i]]; return null; };
// A cue's text at the most detail it has: how the editor names the cue.
const cueText = c => textAt(c?.texts, DETAILS[DETAILS.length - 1]);

// The short hash of a text that names its narration clip in tour-audio (FNV-1a, 32 bits; the same as tools/tour-video).
function textKey(text) {
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}

// What the voice says in place of what is written, from the tour's glossary (the same as tools/tour-video): an entry stands
// for a whole word in the case it is written in, and the longest entry that fits is used. Where an entry starts or ends
// with punctuation, as ":00" does, that side may touch a word.
function spokenText(def) {
  const entries = Object.entries(def.glossary ?? {}).map(([from, to]) => [from.trim(), String(to)]).filter(([from]) => from)
    .sort((a, b) => b[0].length - a[0].length);
  if (!entries.length) return text => text;
  const lookup = new Map(entries), escaped = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const wordy = /[\p{L}\p{N}_]/u, whole = from => `${wordy.test(from[0]) ? '(?<![\\p{L}\\p{N}_])' : ''}${escaped(from)}${wordy.test(from.at(-1)) ? '(?![\\p{L}\\p{N}_])' : ''}`;
  const words = new RegExp(entries.map(([from]) => whole(from)).join('|'), 'gu');
  const said = (match, at, text) => {
    const to = lookup.get(match);
    return to && wordy.test(to[0]) && wordy.test(text[at - 1] ?? '') ? ` ${to}` : to;
  };
  return text => text.replace(words, said).replace(/\s+([.,;:!?])/g, '$1').replace(/ {2,}/g, ' ').trim();

const slugOf = name => name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
// The seconds a text takes to read to oneself at Normal: about 240 words a minute, two seconds at least.
const readingSeconds = text => Math.max(2, text.length / 20);
const tourSection = () => tour.sections[tour.index];

// Every section's full state, worked out from the start state and the sections before it, so any section can be entered
// directly. Whatever the tour gets wrong is listed rather than guessed at.
// A candle in the file is a number, or an event to wait for from a candle on: { "event": "BullishBreakOfStructure",
// "level": 1, "nth": 1 }, the nth time that becomes known at that level. The local server looks those up, one lookup for
// each event and starting candle (see resolveTour), and until it has, the section is listed as waiting.
const eventKey = (spec, from, scene = 0) => `${scene}|${spec.event}|${spec.level ?? 1}|${spec.nth ?? 1}|${from}`;
const eventName = (spec, from) => `${{ 1: 'the first', 2: 'the second', 3: 'the third' }[spec.nth ?? 1] ?? `the ${spec.nth}th`} ${TERMS.get(spec.event)?.name ?? spec.event} at level ${spec.level ?? 1} after #${from}`;

// A text stays for its narration clip's length when there is one (plus a breath), else for the time it takes to read.
// With teachOnce, as the tour is played start to end, what a written section teaches is not taught again by the next.
function compileTour(def, scenes, resolved = new Map(), audio = {}, detail = 'education', { teachOnce = true } = {}) {
  const errors = [], known = new Set([...LAYERS.map(l => l.id), 'trade']), chapters = [], wanted = [];
  // The definitions told so far, cited or taught by a written section: a section that explains something does not teach
  // them again.
  const cited = [];
  // The scene the sections are in, and how many candles it has.
  let scene = 0, candles = scenes[0]?.ex.prices.t.length ?? 0;
  // A candle number as given, or looked up for an event; null when it is not known (yet).
  const candle = (v, from, where, field) => {
    if (v == null || typeof v === 'number') return { index: v ?? null, spec: null };
    if (typeof v !== 'object' || !TERMS.has(v.event)) { errors.push(`${where}: ${field} must be a candle number or a known event`); return { index: null, spec: null }; }
    const key = eventKey(v, from, scene), spec = eventName(v, from);
    if (!resolved.has(key)) { wanted.push({ key, spec: v, from, scene }); errors.push(`${where}: ${field} is being looked up: ${spec}`); return { index: null, spec }; }
    if (resolved.get(key) == null) errors.push(`${where}: ${field} waits for ${spec}, which does not happen`);
    return { index: resolved.get(key), spec: `${spec} → #${resolved.get(key)}` };
  };
  const ids = (list, where) => (list ?? []).map(id => LAYER_ALIASES[id] ?? id).filter(id => known.has(id) || void errors.push(`${where}: unknown layer "${id}"`));
  const range = (v, where) => Array.isArray(v) && v.length === 2 && v.every(Number.isInteger) && v[0] >= 0 && v[1] >= v[0] ? v
    : (errors.push(`${where}: the view is the first and last candle shown, the last at or after the first`), null);
  const renamed = (o, where) => { if (o.window != null) errors.push(`${where}: "window" is now "view", the first and last candle shown`); };
  const rate = (s, where) => s > 0 ? s : (errors.push(`${where}: speed must be more than 0`), 4);
  const start = def.start ?? {}, startLayers = ids(start.layers, 'start');
  const startView = (start.view != null ? range(start.view, 'start') : null) ?? DEFAULT_VIEW;
  let layers = startLayers, view = startView, speed = rate(start.speed ?? 4, 'start'), at = 0;
  renamed(start, 'start');

  const sections = (def.sections ?? []).map((given, i) => {
    const where = `section ${i + 1}`;
    let s = given;
    if (s.chapter) chapters.push({ name: s.chapter, slug: slugOf(s.chapter), section: i });
    // A section that begins a scene starts a replay of its own: the candles count from #0 again and the view starts afresh.
    if (s.scene != null) {
      scene++;
      const sc = scenes[scene];
      if (typeof s.scene !== 'object' || !s.scene.time) errors.push(`${where}: a scene is { "dataset", "time" }, on the tour's dataset unless one is given`);
      else if (!sc) errors.push(`${where}: the scene could not be set up`);
      else if (sc.missing) errors.push(`${where}: the server has no dataset "${sc.dataset}", so the scene plays on the tour's own`);
      else if (sc.ex.prices.t.length < 2) errors.push(`${where}: the scene's time is past the end of its dataset`);
      candles = sc?.ex.prices.t.length ?? candles;
      at = 0;
      view = DEFAULT_VIEW;
    }
    // A section that explains something is written out by the local server from the prices of its scene (see resolveTour),
    // one writing for each section and the candle it starts from; until it has been, the section is listed as waiting.
    // The server writes the section in full, whatever came before it, so each is written once and an edit to one writes
    // only that one again. A written text that teaches what the tour has told already, cited or taught by a written section
    // before, is left out here. Its written texts changed by its "edits" are laid over them here too, so a change to one
    // is not written out again.
    if (s.explain != null) {
      const { edits = {}, ...asked } = s;
      const from = Number.isInteger(s.from) ? s.from : at, key = `explain|${scene}|${from}|${JSON.stringify(asked)}`;
      if (!resolved.has(key)) { wanted.push({ key, explain: asked, from, scene, where }); errors.push(`${where}: the texts explaining ${s.explain} are being written`); }
      else errors.push(...resolved.get(key).errors);
      const got = resolved.get(key)?.section ?? { ...asked, cues: [] }, ownCount = (given.cues ?? []).length;
      const taught = c => { const levels = Object.keys(c.texts ?? {}); return levels.length === 1 && levels[0] === 'education' ? c.texts.education : null; };
      // A written text that is a definition reads as the definition does now, so a change to its wording shows at once.
      const current = c => c.definition && c.definition in DEFINITIONS ? { ...c, texts: { ...c.texts, education: defineText(c.definition, c.direction, c.period) } } : c;
      const written = got.cues.slice(0, got.cues.length - ownCount).map(current).filter(c => !cited.includes(taught(c)));
      // What its written texts teach, as written, is told: the tour teaches a definition once.
      if (teachOnce) for (const c of written) if (taught(c) != null) cited.push(taught(c));
      s = { ...got, cues: [...written.map(c => ({ ...c, written: c.texts, texts: { ...c.texts, ...(c.id != null ? edits[c.id] : null) } })), ...got.cues.slice(got.cues.length - ownCount)] };
    }
    if (s.layers) layers = ids(s.layers, where);
    const removed = ids(s.remove, where);
    layers = [...new Set([...layers, ...ids(s.add, where)])].filter(id => !removed.includes(id));
    const viewBefore = view;
    if (s.view != null) view = range(s.view, where) ?? view;
    renamed(s, where);
    if (s.speed != null) speed = rate(s.speed, where);
    // A journey takes the tour to where the section starts (see journeyTick): one that runs sets the section's first candle.
    const forward = s.fastForward != null, trip = s.fastForward ?? s.rewind ?? null, tripName = forward ? 'fast forward' : 'rewind';
    let journey = null;
    if (s.fastForward != null && s.rewind != null) errors.push(`${where}: a section fast forwards or rewinds, not both`);
    if (trip != null && s.scene != null) errors.push(`${where}: a section that begins a scene has no journey: the scene starts a new replay`);
    if (trip != null && typeof trip !== 'object') errors.push(`${where}: a ${tripName} is { "to", "speed", "${forward ? 'draw' : 'erase'}" }`);
    else if (trip) {
      const runs = trip[forward ? 'draw' : 'erase'] !== false, there = Number.isInteger(trip.to) && trip.to >= 0 && trip.to < candles && (forward ? trip.to > at : trip.to < at);
      if (runs && !there) errors.push(`${where}: the ${tripName} needs "to", a candle ${forward ? 'after' : 'before'} #${at}, where the section before ends`);
      if (runs && s.from != null) errors.push(`${where}: the ${tripName} takes the replay to where the section starts, so the section has no "from"`);
      const run = runs && there, ends = run ? [at, trip.to] : [];
      journey = { forward, run, start: at, to: run ? trip.to : null, speed: trip.speed != null ? rate(trip.speed, where) : JOURNEY_SPEED,
        wide: [Math.min(viewBefore[0], view[0], ...ends), Math.max(viewBefore[1], view[1], ...ends)] };
    }
    const fromGiven = journey?.run ? { index: journey.to, spec: `${tripName} → #${journey.to}` } : candle(s.from, at, where, 'from'), from =Number.isInteger(fromGiven.index) && fromGiven.index >= 0 && fromGiven.index < candles ? fromGiven.index : at;
    if (fromGiven.index != null && fromGiven.index !== from) errors.push(`${where}: from #${fromGiven.index} is not a candle of the tour, which has #0 to #${candles - 1}`);
    const untilGiven = candle(s.until, from, where, 'until'), until = untilGiven.index ?? from;
    if (until < from) errors.push(`${where}: until #${until} is before the section's start, #${from}`);
    if (until >= candles) errors.push(`${where}: until #${until} is past the last candle, #${candles - 1}`);

      const what = `${where}, text ${j + 1}`;
      // A definition, cited by its key, is the text at Education (see definitions.json).
      let texts = c.texts ?? {};
      if (c.define != null) {
        if (!(c.define in DEFINITIONS)) errors.push(`${what}: no definition "${c.define}" in definitions.json`);
        else if (!c.direction && needsDirection(c.define)) errors.push(`${what}: the definition "${c.define}" is told in a direction: "direction": "Up" or "Down"`);
        else { texts = { ...texts, education: defineText(c.define, c.direction) }; cited.push(texts.education); }
      }
      const text = textAt(texts, detail);
      if (c.text != null) errors.push(`${what}: "text" is now "texts", a text for each level of detail: { "summary", "education" }`);
      else if (!Object.values(texts).some(Boolean)) errors.push(`${what}: no text`);
      for (const level of Object.keys(texts)) if (!DETAILS.includes(level)) errors.push(`${what}: unknown detail "${level}": ${DETAILS.join(', ')}`);
      const atGiven = candle(c.at, from, what, 'at');
      if (atGiven.index != null && (atGiven.index < 0 || atGiven.index > at)) errors.push(`${what}: at #${atGiven.index} is not reached, as the section ends at #${at}`);
      if (c.on != null && c.at == null) errors.push(`${what}: a pin needs a candle`);
      if (c.on != null && typeof c.on !== 'number' && !PIN_PRICES[c.on]) errors.push(`${what}: unknown "on" "${c.on}"`);
      if (c.place != null && !PIN_PLACES[c.place]) errors.push(`${what}: unknown place "${c.place}"`);
      if (!['section', 'chapter', 'always'].includes(c.keep ?? 'section')) errors.push(`${what}: unknown keep "${c.keep}"`);
      if (c.voice != null && typeof c.voice !== 'boolean') errors.push(`${what}: voice is true or false`);
      // A line: from the pinned point to another candle's point, shown when the replay reaches the line's end.
      let to = null;
      if (c.to != null) {
        const toGiven = typeof c.to === 'object' ? candle(c.to.at, from, what, 'to') : { index: null, spec: null };
        if (typeof c.to !== 'object' || c.to.at == null || c.on == null) errors.push(`${what}: a line needs a pinned candle and "to": { "at", "on" }, the candle and point it runs to`);
        else if (toGiven.index != null && (toGiven.index < 0 || toGiven.index > at)) errors.push(`${what}: the line's end, #${toGiven.index}, is not reached, as the section ends at #${at}`);
        if (c.to?.on != null && typeof c.to.on !== 'number' && !PIN_PRICES[c.to.on]) errors.push(`${what}: unknown "on" "${c.to.on}" for the line's end`);

      // text at the page's detail is skipped: kept in its place for the editor, never queued.

        to, heads: { start: c.heads?.start === true, end: c.heads?.end !== false }, color: c.color ?? null,
        clip: !(c.hold >= 0) && clip?.seconds > 0 ? clip.seconds : 0, given: c.hold >= 0 ? c.hold : null,
