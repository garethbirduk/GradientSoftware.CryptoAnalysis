}

// A player's definition compiled again, as its page plays it: the tour teaches each definition once from start to end,
// and an analysis, which shows no pins, leaves its pinned texts out, so they do not hold the run for their seconds either.
function recompile(t = tour) {
  Object.assign(t, compileTour(t.def, t.scenes, t.resolved, t.audio, t.detail, { teachOnce: t.page === 'Tour' }));
  if (t.pins === false) for (const s of t.sections) for (const c of s.cues) if (c.on != null) c.skipped = true; else timeCue(c, t.audio, false);
  return t;
}

// A text's time on show: its clip's length when it has one, else the time it takes to read. A hold the text gives itself
// stands, but not a hold of 0 on a player that shows no pins, as that is given to leave the caption up while pins show.
// Called again as clips come in, it changes the text in place, as the player holds it.
function timeCue(c, audio, pins = true) {
  if (c.given != null && !(c.given === 0 && pins === false)) return;
  const clip = !c.silent && c.text ? audio?.[textKey(c.text)] : null;
  c.clip = clip?.seconds > 0 ? clip.seconds : 0;
  c.hold = c.clip ? c.clip + NORMAL_PACE.gap : readingSeconds(c.text ?? '');
}

// What a compiled player is waiting for, looked up: each event, and each section that explains something, which goes to
// the server as the definition has it and comes back with its texts written. A few are asked at a time.
async function lookUp(t) {
  const scenes = t.scenes, jobs = t.wanted.filter(w => !t.resolved.has(w.key));
  let next = 0;
  const one = async ({ key, spec, explain, from, scene, where }) => {
    const ex = scenes[scene ?? 0]?.ex ?? scenes[0].ex;
    if (explain) {
      const body = JSON.stringify({ dataset: ex.dataset, anchor: ex.anchor, from, where, section: explain });
      const got = await fetch('api/explain', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body }).then(r => r.ok ? r.json() : null).catch(() => null);
      t.resolved.set(key, got ? { section: got.section, errors: got.errors ?? [] } : { section: null, errors: [`${where}: the local server could not write the texts explaining ${explain.explain}`] });
      return;
    }
    const query = `dataset=${encodeURIComponent(ex.dataset)}&anchor=${ex.anchor}&from=${from}&type=${encodeURIComponent(spec.event)}&level=${spec.level ?? 1}&nth=${spec.nth ?? 1}`;
    const found = await fetch(`api/event?${query}`).then(r => r.ok ? r.json() : null).catch(() => null);
    t.resolved.set(key, found?.index ?? null);
  };
  await Promise.all(Array.from({ length: Math.min(4, jobs.length) }, async () => { while (next < jobs.length) await one(jobs[next++]); }));
}

// A player looked up and compiled again until nothing is waiting, before it is shown.
async function resolveAll(t) {
  for (let retry = 0; t.wanted.length && retry <= 12; retry++) {
    await lookUp(t);
    recompile(t);
  }
}

// Looks up what the player on show is waiting for, then compiles again, until nothing is waiting: a lookup can move a
// section's start, and with it what the next section waits from.
async function resolveTour(retry = 0) {
  const t = tour, scenes = t.scenes;
  if (!t.wanted.length || retry > 12) return;
  t.resolving = true;
  updateEditorStatus();
  await lookUp(t);
  t.resolving = false;
  // Applied again while it looked up, the tour has looked up for itself; the status still says it is done.
  if (tour !== t || t.scenes !== scenes || currentPage !== t.page) return updateEditorStatus();
  recompile();
  if (tour.wanted.length) return resolveTour(retry + 1);
  editorSection = -1;
  seekTour(tour.index, { t: cursorOf(tour.ex), shown: tour.shown.length });
  updateEditorMeta();
  updateEditorStatus();
}

// tour.json as it is on disk, with the short hash that names that version of it: Save sends the hash of the version the
// page started from, and the local server refuses to write over a file that is no longer that version.
const readTourFile = () => fetch('tour.json', { cache: 'no-store' }).then(r => r.text()).then(text => ({ def: JSON.parse(text), base: textKey(text) }));

// tour.json can change on disk while the page is open, as when it is edited by hand. Coming back to the page, the newer
// file is loaded at once when nothing here is unsaved (Undo brings back what was here); otherwise the editor says so.
async function checkTourFile() {
  if (currentPage !== 'Tour' || tour?.page !== 'Tour' || tour.checking || tour.recording || videoMode) return;
  tour.checking = true;
  const file = await readTourFile().catch(() => null);
  tour.checking = false;
  if (!file || file.base === tour.base) return;
  if (tourDirty()) {
    tour.note = 'tour.json has changed on disk since this page loaded it, so Save will not write over it. Revert loads the newer version.';
    return updateEditorStatus();
  }
  rememberTour();
  Object.assign(tour, { def: file.def, base: file.base, saved: JSON.stringify(file.def) });
  applyTour({ render: true });
}
window.addEventListener('focus', checkTourFile);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkTourFile(); });

// The tour's scenes: the start state is the first, and each section with "scene": { "dataset", "time" } begins another, a
// replay of its own on that dataset (the tour's unless given) from that time, with its candles numbered from #0 again.
function sceneSpecs(def) {
  const own = def.dataset ?? null;
  return [{ dataset: own, time: def.start?.time, section: -1 },
    ...(def.sections ?? []).flatMap((s, i) => s.scene != null ? [{ dataset: (typeof s.scene === 'object' && s.scene.dataset) || own, time: typeof s.scene === 'object' ? s.scene.time : undefined, section: i }] : [])];
}

// The definitions of the terms (see Definitions in CryptoAnalysis.Site), each rule a sentence or two, by key. A tour cue
// with "define" cites one, told in its "direction" when it has slots; they are filled as the server fills them, so the
// text, and with it the key of its clip, is the same either way.
// The editor changes them in place and saves them with the tour, the file's version kept as for tour.json.
let DEFINITIONS = {}, definitionsSaved = '{}', definitionsBase = '';
async function loadDefinitions() {
  const text = await fetch('definitions.json', { cache: 'no-store' }).then(r => r.ok ? r.text() : '{}').catch(() => '{}');
  DEFINITIONS = JSON.parse(text);
  definitionsSaved = JSON.stringify(DEFINITIONS);
  definitionsBase = textKey(text);
}
const definitionsDirty = () => JSON.stringify(DEFINITIONS) !== definitionsSaved;
// definitions.json as text: a line for each definition.
const formatDefinitions = d => `{\n${Object.entries(d).map(([k, v]) => `  ${JSON.stringify(k)}: ${JSON.stringify(v)}`).join(',\n')}\n}\n`;
// Whether a definition has slots for a direction, and so needs one to be told in; {period} is not one.
const needsDirection = key => [...(DEFINITIONS[key] ?? '').matchAll(/\{([a-z ]+)\}/g)].some(m => m[1] !== 'period');
// {period} is what a candle spans, "period" when not given.
function defineText(key, direction, period) {
  const up = direction === 'Up', slots = { 'period': period ?? 'period', ...(direction ? {
    'trend': up ? 'Uptrend' : 'Downtrend', 'a trend': up ? 'an Uptrend' : 'a Downtrend', 'swing': up ? 'Upswing' : 'Downswing', 'a swing': up ? 'an Upswing' : 'a Downswing',
    'other swing': up ? 'Downswing' : 'Upswing', 'a other swing': up ? 'a Downswing' : 'an Upswing', 'turn': up ? 'Swing Low' : 'Swing High', 'beyond': up ? 'below' : 'above',
    'weak turn': up ? 'LL' : 'HH', 'turn labels': up ? 'an HL or an LL' : 'an LH or an HH', 'extreme': up ? 'lowest' : 'highest', 'trends': up ? 'upwards' : 'downwards',
    'start': up ? 'high' : 'low', 'a first leg': up ? 'a Downleg' : 'an Upleg', 'a second leg': up ? 'an Upleg' : 'a Downleg',
  } : {}) };
  return (DEFINITIONS[key] ?? '').replace(/\{([a-z ]+)\}/g, (m, name) => slots[name] ?? m).replace(/(^|[.!?]\s+)([a-z])/g, (m, before, letter) => before + letter.toUpperCase());
}

// The player's state for a tour, on the page it plays on. A tour from tour.json plays on the Tour page at Education; an
// analysis on the Analysis page (see loadAnalysis), with the options that page sets.
function newPlayer(def, audio, options = {}) {
  return { page: 'Tour', detail: 'education', idPrefix: 'Tour', def, base: '', audio, wholes: new Map(), scenes: [], ex: null, saved: JSON.stringify(def), history: [], lastEdit: null,
    picking: null, note: '', resolved: new Map(), resolving: false, index: 0, view: DEFAULT_VIEW, queue: [], shown: [], fired: new Set(), kept: [], active: null, activeUntil: 0,
    nextCandle: 0, timer: null, ended: false, chaptersOff: new Set(), voice: { now: null, waiting: [] }, ...options };
}

async function loadTour() {
  const { def, base } = await readTourFile();
  const list = await loadDatasets();
  if (!list.length) throw new Error('the server has no datasets');
  const audio = await fetch('tour-audio/index.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  await loadDefinitions();
  const loaded = newPlayer(def, audio, { base });
  await loadTourDatasets(loaded);
  anchorTour(loaded);
  return recompile(loaded);
}

// Every dataset the tour's scenes name is loaded once; the tour's own falls back to the server's first dataset.
async function loadTourDatasets(t = tour) {
  const list = await loadDatasets();
  for (const spec of sceneSpecs(t.def)) {
    const key = spec.dataset ?? '', info = list.find(d => d.id === spec.dataset) ?? (spec.dataset === (t.def.dataset ?? null) ? list[0] : null);
    if (info && !t.wholes.has(key)) t.wholes.set(key, await loadDataset(info));
  }
}

// A scene's candles are its dataset's from its start time on, so a candle's number is its place in them. A new start time
// makes them anew, and what the server worked out from the old one is dropped. A scene whose dataset the server does not
// have plays on the tour's own, and the tour says so.
function anchorTour(t = tour) {

    const time = axisTime(spec.time ?? ''), anchor = Number.isNaN(time) ? 0 : indexAtOrAfter(whole, time);
    const was = (t.scenes ?? []).find(sc => sc.ex?.dataset === whole.dataset && sc.ex.anchor === anchor && !ids.has(sc.ex.id));
    if (was) { ids.add(was.ex.id); scenes.push({ ...spec, missing, ex: was.ex }); continue; }
    changed = true;
    let id = scenes.length ? `${t.idPrefix}/${whole.dataset}@${anchor}` : `${t.idPrefix}/${whole.dataset}`;
    while (ids.has(id)) id += '+';
    ids.add(id);
    const cut = a => a.slice(anchor), p = whole.prices;
    remote.delete(id);
    zooms.delete(id);
    cursors.set(id, 0);
    scenes.push({ ...spec, missing, ex: { id, dataset: whole.dataset, anchor, tour: true, title: t.page === 'Tour' ? 'Tour' : t.def.title ?? t.page, level: 1, expected: [], annotations: [],
      prices: { t: cut(p.t), o: cut(p.o), h: cut(p.h), l: cut(p.l), c: cut(p.c) } } });
  }
  // Events were looked up from the old starts, so they are looked up again.
  if (changed || scenes.length !== (t.scenes ?? []).length) { t.resolved?.clear(); eventCache.clear(); }
  t.scenes = scenes;
  if (!scenes.some(sc => sc.ex === t.ex)) t.ex = scenes[0].ex;
}

// The tour shows one scene's chart at a time: moving to a section of another scene swaps the chart's example for that
// scene's, where it was left.
function showScene(ex) {
  if (tour.ex === ex) return;
  const was = tour.ex;
  tour.ex = ex;
  tour.zoom = null;
  const el = document.querySelector(`.chart[data-id="${CSS.escape(was.id)}"]`);
  if (el) { el.dataset.id = ex.id; el.closest('article').id = `ex-${ex.id}`; }
  if (activeId === was.id) activeId = ex.id;
}

// The candles a section shows are its view, which is what the chart shows as the section begins, wherever the replay is.
// A replay that then runs past the end of the view takes the view along with it.
function sectionView(t) {
  const [first, last] = tour.view, moved = Math.max(0, t - Math.max(last, tourSection()?.from ?? 0));
  return [first + moved, last + moved];
}

// A view that is not the one on show is not cut to: the chart eases from the one to the other, so it reads as the same
// chart zooming or moving.
const TOUR_ZOOM_MS = 1500;
// Candles a tour's chart has either side of its view, to pan to.
const TOUR_CONTEXT = 48;

// The one way a view is moved for the reader, on every chart: out to hold both where it is and where it goes, then in to
// where it goes, each leg eased over TOUR_ZOOM_MS. From 500–550 to 100–140, it goes out to 100–550, then in to 100–140.
// A view that holds the new one only goes in; one held by the new one only goes out. A journey (see journeyTick) runs or
// erases the replay between the two legs. Only a zoom or pan made by hand moves a view otherwise, at once.
// Views are pairs of numbers, candles or times alike; the path gives the view at a time since it set off, and how long.
function viewPath(from, to) {
  const wide = [Math.min(from[0], to[0]), Math.max(from[1], to[1])], same = (a, b) => a[0] === b[0] && a[1] === b[1];
  const legs = [...(same(wide, from) ? [] : [[from, wide]]), ...(same(wide, to) ? [] : [[wide, to]])];
  const ease = k => k < 0.5 ? 2 * k * k : 1 - (2 - 2 * k) ** 2 / 2;
  return {
    ms: legs.length * TOUR_ZOOM_MS,
    at: elapsed => {
      if (!legs.length) return to;
      const n = Math.min(legs.length - 1, Math.floor(Math.max(0, elapsed) / TOUR_ZOOM_MS)), k = Math.min(1, (elapsed - n * TOUR_ZOOM_MS) / TOUR_ZOOM_MS);
      const [a, b] = legs[n];
      return a.map((v, i) => v + (b[i] - v) * ease(k));
    },
  };
}

// The view a tour's chart shows: its section's, or on the way there from the one shown before.
function tourView(t) {
  const view = sectionView(t), zoom = tour.zoom;
  if (!zoom) return view;
  return viewPath(zoom.from, view).at(performance.now() - zoom.start).map(Math.round);
}

function tourWindow(ex, t) {
  const [from, to] = tourView(t), last = ex.prices.t.length - 1;
  return { from: Math.min(from, last), to: Math.min(Math.max(to, from), last) };
}

// Sets a tour's view moving from the one shown to its section's (see viewPath).
function zoomTour(from) {
  tour.zoom = { from, start: performance.now() };
  if (tour.zooming) return;
  // The next frame is asked for before this one is drawn, so a frame that fails does not leave the view part way.
  const step = () => {
    const zoom = tour.zoom;
    tour.zooming = !!zoom && performance.now() - zoom.start < viewPath(zoom.from, sectionView(cursorOf(tour.ex))).ms;
    if (tour.zooming) requestAnimationFrame(step); else tour.zoom = null;
    if (playerHere(currentPage)) redrawExample(tour.ex);
  };
  tour.zooming = true;
  requestAnimationFrame(step);
}

// A drawn line: from the cue's pinned point to the point its "to" names, with the text in a box along it.
function lineOf(ex, cue) {
  const point = (at, on) => ({ time: ex.prices.t[at], price: typeof on === 'number' ? on : ex.prices[PIN_PRICES[on]]?.[at] });
  return { from: point(cue.at, cue.on), to: point(cue.to.at, cue.to.on), text: cue.text, heads: cue.heads, color: cue.color };
}

function pinOf(ex, cue) {
  return { time: ex.prices.t[cue.at], price: typeof cue.on === 'number' ? cue.on : ex.prices[PIN_PRICES[cue.on]]?.[cue.at], text: cue.text,
    place: cue.place ?? { high: 'above', low: 'below', open: 'left' }[cue.on] ?? 'right' };
}

// A pinned cue: its text in a box beside the point, with an arrow to it.
const pinLines = text => text.split(' ').reduce((out, word) => {
  if (out.length && `${out[out.length - 1]} ${word}`.length <= 30) out[out.length - 1] += ` ${word}`; else out.push(word);
  return out;
}, []);

// The room a pinned text's box needs above and below its point, in pixels, to be inside the chart.
function pinRoom(pin) {
  const box = pinLines(pin.text).length * 17 + 14, [, ay] = PIN_PLACES[pin.place] ?? PIN_PLACES.above, clear = 8;
  const beside = box / 2 + clear, beyond = Math.abs(ay) + box + clear;
  return { time: Date.parse(pin.time), price: pin.price, up: ay < 0 ? beyond : ay > 0 ? clear : beside, down: ay > 0 ? beyond : ay < 0 ? clear : beside };
}

function pinLabel(pin) {
  const accent = css('--accent'), [ax, ay] = PIN_PLACES[pin.place] ?? PIN_PLACES.above;
  return { x: pin.time, y: pin.price, text: pinLines(pin.text).join('<br>'), showarrow: true, arrowhead: 2, arrowwidth: 1.5, arrowcolor: accent, ax, ay,
    xanchor: { left: 'right', right: 'left' }[pin.place] ?? 'center', yanchor: { above: 'bottom', below: 'top' }[pin.place] ?? 'middle', align: 'left',
    bgcolor: css('--panel'), bordercolor: accent, borderpad: 5, font: { color: css('--text'), size: 13 } };
}

// The candle a cue is reached at: a line's end, a pin's candle, or none for a text shown as the section begins.
const cueAt = c => c.to?.at ?? c.at;

// Moves the replay to a candle and queues the cues it has reached: text with no candle is reached as the section begins.
function advanceTo(t) {
  const s = tourSection(), ex = tour.ex;
  cursors.set(ex.id, t);
  prefetch(ex, t);
  for (const c of s.cues) if (!tour.fired.has(c) && (cueAt(c) ?? s.from) <= t) { tour.fired.add(c); if (!c.skipped) tour.queue.push(c); }
}

// The cues of a section still to come at the page's detail: the ones that stop the replay at their candle.
const pendingCues = s => s.cues.filter(c => !tour.fired.has(c) && !c.skipped);

function showNextCue() {
  const cue = tour.queue.shift();
  if (!cue) return;
  // A clip read since the tour was compiled gives the text its length, as one there from the start does.
  const clip = !cue.silent && cue.clip === 0 && !(cue.given >= 0) ? tour.audio[textKey(cue.text)] : null;
  if (clip?.seconds > 0) Object.assign(cue, { clip: clip.seconds, hold: clip.seconds + NORMAL_PACE.gap });
  Object.assign(tour, { activeAt: performance.now(), pausedElapsed: 0 });
  tour.active = cue;
  tour.activeUntil = performance.now() + holdOf(cue) * 1000;
  tour.shown.push(cue);
  speak(cue);
}

// Reads a text aloud from its clip in tour-audio, when the Voice button is on and the tour is playing. One text is read at
// a time: a text shown while another is being read waits for it rather than cutting it off, and its time on show starts
// as its reading does. A recording makes no sound but keeps the same time, and notes when each reading began, which is
// where tools/tour-video lays the clip.
function speak(cue) {
  if (!tour.timer || !(voiceOn() || tour.recording)) return hush();
  if (cue.silent || !tour.audio[textKey(cue.text)]) return;
  if (tour.voice.now) tour.voice.waiting.push(cue); else readAloud(cue);
}

function readAloud(cue) {
  const clip = tour.audio[textKey(cue.text)], turn = tour.voice.now = { timer: null };
  const done = () => {
    if (tour.voice.now !== turn) return;
    tour.voice.now = null;
    if (tour.voice.waiting.length) readAloud(tour.voice.waiting.shift());
  };
  // Its time on show, at the slider's pace, starts as its reading does.
  if (cue === tour.active) Object.assign(tour, { activeAt: performance.now(), activeUntil: performance.now() + holdOf(cue) * 1000 });
  if (tour.recording) {
    tour.recording.cues.push({ key: textKey(cue.text), at: Date.now() });
    turn.timer = setTimeout(done, clip.seconds * 1000);
    return;
  }
  tour.player = new Audio(`tour-audio/${clip.file}`);
  tour.player.playbackRate = tourPace().voice;
  tour.player.addEventListener('ended', done);
  tour.player.addEventListener('error', done);
  tour.player.play().catch(done);
}

function hush() {
  tour.player?.pause();
  clearTimeout(tour.voice.now?.timer);
  tour.voice = { now: null, waiting: [] };
}

// The voice is on until it is turned off; a page opened for the video tool leaves the voice to the recording.
const voiceOn = () => !videoMode && state.tourVoice !== false;

// The pace the Speed slider is set to. A recording is always made at Normal, as its clips are laid at their own length.
const tourPace = () => tour?.recording || videoMode ? NORMAL_PACE : TOUR_PACES.find(p => p.name === state.tourPaceName) ?? NORMAL_PACE;
// Whether a text is read aloud: Voice is on, or a recording is being made, and it has a clip.
const voiced = cue => !!cue.clip && !cue.silent && (voiceOn() || !!tour?.recording);
// The seconds a text stays at the slider's pace. Read aloud, the length of its clip as played and the gap after it.
// Otherwise its own seconds when the tour gives it some, else the time it takes to read at the slider's reading rate.
const holdOf = cue => {
  const pace = tourPace();
  if (voiced(cue)) return cue.clip / pace.voice + pace.gap;
  return cue.given != null ? cue.given / pace.voice : readingSeconds(cue.text ?? '') / pace.reading;
};

function setTourPace(value) {
  state.tourPaceName = TOUR_PACES[Number(value)]?.name ?? NORMAL_PACE.name;
  save(state);
  if (tour?.player) tour.player.playbackRate = tourPace().voice;
  updateTourPanel();
}

// What tools/tour-video drives: plays the whole tour once and reports when each text and chapter appeared.
window.tourVideo = {
  ready: () => (currentPage === 'Tour' || currentPage === 'Analysis') && tour?.page === currentPage && !!tour.sections.length && !tour.wanted.length && !viewFor(tour.ex).loading,
  play: () => new Promise(resolve => {
    pauseTour();
    tour.recording = { started: Date.now(), cues: [], chapters: [] };
    tour.onEnd = () => { const done = { ...tour.recording, ended: Date.now() }; tour.recording = null; resolve(done); };
    // An analysis plays its chapters that are on, from the first of them.
    enterSection(tour.page === 'Analysis' ? sectionAfter(-1, 1) ?? 0 : 0);
    playTour();
  }),
};

// Sets the tour at the start of a section, with nothing of it shown yet. A section that has a journey is set at the end of
// it, unless the journey is to be played: then the tour is left where the journey starts, with the view easing out.
function openSection(i, { journey = false } = {}) {
  const s = tour.sections[i], switched = (tour.scenes[s.scene] ?? tour.scenes[0]).ex !== tour.ex;
  // Another scene is a cut, not a move: its chart comes up at the section's view with nothing to ease from.
  if (switched) showScene((tour.scenes[s.scene] ?? tour.scenes[0]).ex);
  const ex = tour.ex, shown = switched ? s.view : tourView(cursorOf(ex)), moved = i !== tour.index;
  Object.assign(tour, { index: i, view: s.view, queue: [], shown: [], fired: new Set(), active: null, activeUntil: 0, nextCandle: 0, journey: null, ended: false });
  // Pins kept from earlier sections belong to this scene's chart only.
  tour.kept = tour.sections.slice(0, i).filter(earlier => earlier.scene === s.scene).flatMap(earlier => earlier.cues.filter(c => c.on != null && !c.skipped
    && (c.keep === 'always' || (c.keep === 'chapter' && earlier.chapter === s.chapter))));
  // While a candle is being picked, the candles still to come are shown, to pick from.
  // An analysis keeps the page's own layers on beside the section's, all but its levels.
  tourLayers = sectionLayers(s);
  const chapter = tour.chapters[s.chapter];
  if (chapter?.section === i) tour.recording?.chapters.push({ name: chapter.name, at: Date.now() });
  // The Tour page's address names the chapter; an analysis keeps its own.
  if (tour.page === 'Tour') history.replaceState(null, '', chapter ? `#Tour/${chapter.slug}` : '#Tour');
  if (journey && s.journey) {
    const t = s.journey.run ? s.journey.start : s.from;
    cursors.set(ex.id, t);
    prefetch(ex, t);
    // Only the texts with no candle are read on the way: the others wait for the journey's end.
    for (const c of s.cues) if (c.at == null) { tour.fired.add(c); if (!c.skipped) tour.queue.push(c); }
    Object.assign(tour, { view: s.journey.wide, journey: { ...s.journey, phase: 'out' } });
    zooms.delete(ex.id);
    // A view that already holds the whole way has no easing out to do.
    if (shown[0] !== tour.view[0] || shown[1] !== tour.view[1]) zoomTour(shown);
    return;
  }
  advanceTo(s.from);
  // The section sets the view: the chart eases to it, and a zoom or pan made by hand goes.
  const view = sectionView(s.from), changed = view[0] !== shown[0] || view[1] !== shown[1];
  if (moved || changed) zooms.delete(ex.id);
  if (changed) zoomTour(shown);
}

function enterSection(i, how) {
  openSection(i, how);
  showNextCue();
  refreshTour();
}

// One beat of a journey. The view has eased out to hold the whole way. A journey that runs sets off as the last of the
// section's texts with no candle comes on show, so that text is read over it, and takes as many candles in a beat as its
// speed asks; a journey of the view alone waits for its texts to be read. Then the view eases in to the section's own and
// the section carries on from there.
function journeyTick(s, ex, now, reading) {
  const j = tour.journey, t = cursorOf(ex);
  if (tour.zoom) return;
  if (j.phase === 'in') return endJourney();
  if (j.phase === 'out') Object.assign(j, { phase: 'wide', since: now });
  if (tour.queue.length) return;
  if (j.run && t !== j.to) {
    const step = j.forward ? 1 : -1;
    if (!timelineAt(ex, t + step)) { tour.nextCandle = 0; return prefetch(ex, t + step); }
    if (now < tour.nextCandle) return;
    const gap = 1000 / (j.speed * tourPace().candles), late = now - tour.nextCandle, inStep = tour.nextCandle > 0 && late < 1000;
    const due = Math.min(Math.abs(j.to - t), inStep ? 1 + Math.floor(late / gap) : 1);
    let n = 1;
    while (n < due && timelineAt(ex, t + (n + 1) * step)) n++;
    tour.nextCandle = inStep && n === due ? tour.nextCandle + due * gap : now + gap;
    cursors.set(ex.id, t + n * step);
    prefetch(ex, t + n * step);
    return refreshTour();
  }
  // With nothing to run, the wider view stays for its texts, or for a moment when there are none.
  if (!j.run && (reading || now - j.since < 1000)) return;
  j.phase = 'in';
  tour.view = s.view;
  if (j.wide[0] !== s.view[0] || j.wide[1] !== s.view[1]) zoomTour(j.wide);
}

// The end of a journey, or of one cut short by a step made by hand: the section as it starts.
function endJourney() {
  const s = tourSection();
  Object.assign(tour, { journey: null, view: s.view, nextCandle: 0 });
  advanceTo(s.from);
  refreshTour();
}

// Puts the tour at a place in a section: a candle and how many of the section's texts have been shown, or the point at
// which one of its texts appears. An edit uses this to leave the tour where it was, or to show what was edited.
function seekTour(i, { t = 0, shown = 1, cue = null } = {}) {
  if (!tour.sections.length) {
    Object.assign(tour, { index: 0, queue: [], shown: [], fired: new Set(), kept: [], active: null });
    tourLayers = ['replay', ...tour.startLayers];
    cursors.set(tour.ex.id, 0);
    return refreshTour();
  }
  openSection(Math.max(0, Math.min(i, tour.sections.length - 1)));
  const s = tourSection(), target = cue == null ? null : s.cues[cue];
  const pending = () => pendingCues(s).map(cueAt);
  if (target) {
    while (!tour.shown.includes(target)) {
      if (!tour.queue.length) {
        if (cursorOf(tour.ex) >= s.until) break;
        advanceTo(Math.min(s.until, ...pending()));
      }
      showNextCue();
    }
  } else {
    advanceTo(Math.max(s.from, Math.min(t, s.until)));
    while (tour.queue.length && tour.shown.length < shown) showNextCue();
  }
  refreshTour();
}

function refreshTour() {
  const ex = tour.ex;
  // A cue skipped at the page's detail has no text to pin.
  const pins = cues => cues.filter(c => !c.skipped && c.on != null && c.at != null && c.to == null).map(c => pinOf(ex, c)).filter(p => p.time && Number.isFinite(p.price));
  const lines = cues => cues.filter(c => !c.skipped && c.to != null && c.at != null && c.to.at != null).map(c => lineOf(ex, c)).filter(l => l.from.time && l.to.time && Number.isFinite(l.from.price) && Number.isFinite(l.to.price));
  // An analysis shows no pins: the layers it turns on mark the same places.
  const marks = tour.pins === false ? [] : [...tour.kept, ...tour.shown];
  ex.pins = pins(marks);
  ex.lines = lines(marks);
  // Room is kept for all of the section's pins from its start, so the prices do not move each time one appears.
  ex.pinRoom = tour.pins === false ? [] : pins([...tour.kept, ...(tourSection()?.cues ?? [])]);
  syncLayerButtons();
  if (editorSection !== tour.index && (tour.page === 'Tour' || analysisEditing)) renderContents();
  drawAll(tour.page);
  updateTourPanel();
}

function updateTourPanel() {
  const part = name => document.querySelector(`[data-tour="${name}"]`), go = name => document.querySelector(`[data-tour-go="${name}"]`);
  document.body.classList.toggle('analysing', analysisRuns());
  if (!playerHere(currentPage) || !part('caption')) return;
  const s = tourSection(), ex = tour.ex, t = cursorOf(ex);
  if (part('title')) part('title').textContent = tour.def.title || 'Tour';
  part('chapter').textContent = tour.chapters[s?.chapter]?.name ?? tour.def.title ?? 'Tour';
  const scene = tour.scenes.length > 1 && s ? ` · scene ${s.scene + 1}: ${datasetList?.find(d => d.id === ex.dataset)?.name ?? ex.dataset} from ${fmtTime(ex.prices.t[0])}` : '';
  // An analysis counts its chapters, a section each; a tour its sections, several to a chapter.
  const where = tour.page === 'Analysis' ? `${tour.def.title} · chapter ${(s?.chapter ?? 0) + 1} of ${tour.chapters.length}`
    : `section ${(s?.index ?? 0) + 1} of ${tour.sections.length} · #${s?.from}${s?.until > s?.from ? ` to #${s.until}` : ''}`;
  part('where').textContent = s ? `${where}${tour.ended ? ' · ended' : ''}${scene}` : 'no sections yet';
  showCaption();
  part('readout').textContent = `#${t} · ${fmtTime(ex.prices.t[t])} UTC`;
  const warning = part('warning');
  if (warning) {
    warning.hidden = !ex.unanchored;
    warning.textContent = ex.unanchored ? 'The local server was started before the tour existed, so it cannot work out the structure from the tour\'s start: only candles and closes are shown. Restart ./build-site.ps1 -Serve.' : '';
  }

  // The chapters and the problems change as the tour is edited, so they are redrawn when they differ.
  const fill = (el, html) => { if (el && el.dataset.html !== html) { el.dataset.html = html; el.innerHTML = html; } };
  fill(part('errors'), tour.errors.length ? `<div class="empty tour-errors"><b>The tour has problems</b><ul>${tour.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>` : '');
  syncContents();

  const play = go('play');
  play.textContent = tour.timer ? '❚❚' : '▶';
  play.setAttribute('aria-label', tour.timer ? 'Pause (Space)' : 'Play (Space)');
  go('next').disabled = tour.ended;

  go('glossary')?.setAttribute('aria-pressed', glossaryOn());
  if (go('similar')) go('similar').hidden = !trendLevel(tour);
  if (go('tradeSimilar')) go('tradeSimilar').hidden = !(tour.page === 'Analysis' && tour.params?.strategy);
  const voice = go('voice'), clips = Object.keys(tour.audio ?? {}).length;
  voice.setAttribute('aria-pressed', voiceOn());
  if (!clips) voice.title = 'No clips yet: the local server reads the texts aloud when Voice is on';
  const pace = TOUR_PACES.indexOf(tourPace());
  part('pace').value = pace;
  part('pace-name').textContent = TOUR_PACES[pace].name;
  part('autonext').checked = autoNext();
  showScrub();

  // The editor marks the texts shown so far, and the one on show.
  document.querySelectorAll('#tour-editor .ed-card.open .ed-cue').forEach((el, j) => {
    const cue = s?.cues[j], active = !!cue && cue === tour.active;
    el.classList.toggle('shown', tour.shown.includes(cue));
    if (active && !el.classList.contains('active') && tour.timer) el.scrollIntoView({ block: 'nearest' });
    el.classList.toggle('active', active);
  });
}

// One beat of a playing tour: the next text once the one on show has been read, else the next candle, else the next section.
function tourTick() {
  if (!playerHere(currentPage) || !tour.sections.length) return pauseTour();
  // The slider and the caption move on while a text is read, as well as while the candles run.
  showScrub();
  showCaption();
  const s = tourSection(), ex = tour.ex, now = performance.now(), t = cursorOf(ex);
  // A text still waiting for the voice has not begun its time on show.
  const reading = tour.active && (now < tour.activeUntil || tour.voice.waiting.includes(tour.active));
  if (!reading && tour.queue.length) {
    // An analysis's texts are read aloud by the server as it is written: with Voice on, a text waits for its clip,
    // twenty seconds at most, looking for it again every second.
    const next = tour.queue[0];
    if (tour.waitForClips && voiceOn() && !next.silent && !tour.audio[textKey(next.text)] && now - (tour.waitingSince ??= now) < 20000) {
      if (now - (tour.audioAt ?? 0) > 1000) loadPlayerAudio();
      return;
    }
    tour.waitingSince = null;
    showNextCue();
    return refreshTour();
  }
  if (tour.journey) return journeyTick(s, ex, now, reading);
  if (t < s.until) {
    // The replay waits at a cue that has a candle; text with no candle is read while the replay runs. It also waits for the
    // view to arrive at the section's, so the candles run where they are seen.
    const waiting = (reading && tour.active.at != null) || tour.queue.some(c => c.at != null) || !!tour.zoom;
    if (waiting || !timelineAt(ex, t + 1)) tour.nextCandle = 0;
    if (waiting || now < tour.nextCandle) return;
    if (!timelineAt(ex, t + 1)) return prefetch(ex, t + 1);
    // A beat takes every candle that has come due since the last one, so a section faster than the beat, or than the chart
    // can be redrawn, still keeps its speed: but never past a text's candle, the section's end or what is loaded. After a
    // wait the count starts again, so the replay does not leap to make up the time.
    const gap = 1000 / (s.speed * tourPace().candles), late = now - tour.nextCandle, inStep = tour.nextCandle > 0 && late < 1000;
    const due = inStep ? 1 + Math.floor(late / gap) : 1;
    const stop = Math.min(s.until, t + due, ...pendingCues(s).filter(c => cueAt(c) > t).map(cueAt));
    let to = t + 1;
    while (to < stop && timelineAt(ex, to + 1)) to++;
    tour.nextCandle = inStep && to - t === due ? tour.nextCandle + due * gap : now + gap;
    advanceTo(to);
    return refreshTour();
  }
  if (reading) return;
  // On to the next section played; at the start of a new chapter, only with Play the next chapter ticked.
  const next = sectionAfter(tour.index, 1);
  if (next != null) {
    if (!autoNext() && tour.chapters[tour.sections[next].chapter]?.section === next) return pauseTour();
    return enterSection(next, { journey: true });
  }
  tour.ended = true;
  pauseTour();
  tour.onEnd?.();
  tour.onEnd = null;
}

// The clips the local server has read so far, looked for again while an analysis's texts are still being read.
async function loadPlayerAudio() {
  const mine = tour;
  mine.audioAt = performance.now();
  const audio = await fetch('tour-audio/index.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
  if (!audio) return;
  mine.audio = audio;
  // A text compiled before its clip was read takes the clip's length now, so it stays on show while it is read.
  for (const s of mine.sections) for (const c of s.cues) if (!c.skipped) timeCue(c, audio, mine.pins);
}

// ---- The slider: a chapter in seconds ---------------------------------------------------------------------------------
// The slider spans the chapter on show in the seconds it takes to play at the pace set: the candles run and the texts read.
// Its time line is worked out by the rules tourTick plays by: a journey into a section takes its easing and its run; the
// candles run at the section's speed; a text with no candle is read while they run; the run waits at a text that has a
// candle until it has been read; and a section ends once its candles have run and its texts been read. Where the player
// is, it is placed by the candle it is at or the text on show, whichever is further on, so the voice and the time line
// cannot drift far apart.

// One section's time line from its start: when each text comes on show and for how long, and the candles the run is at,
// as [candle, seconds] points to read between. A journey's texts with no candle are read over it.
function sectionPlan(s) {
  const pace = tourPace(), gap = 1 / (s.speed * pace.candles), j = s.journey;
  const journey = j ? 2 * TOUR_ZOOM_MS / 1000 + (j.run ? Math.abs(j.to - j.start) / (j.speed * pace.candles) : 0) : 0;
  let reader = 0, clock = journey, at = s.from;
  const texts = [], runs = [[s.from, 0], [s.from, journey]];
  const cues = s.cues.map((c, k) => ({ c, k, when: cueAt(c) ?? s.from })).filter(x => !x.c.skipped).sort((a, b) => a.when - b.when || a.k - b.k);
  for (const { c, when } of cues) {
    const hold = holdOf(c);
    if (c.at == null) { texts.push({ cue: c, start: reader, seconds: hold }); reader += hold; continue; }
    if (when > at) { clock += (when - at) * gap; at = when; runs.push([at, clock]); }
    const start = Math.max(clock, reader);
    texts.push({ cue: c, start, seconds: hold });
    reader = clock = start + hold;
    runs.push([at, clock]);
  }
  if (s.until > at) { clock += (s.until - at) * gap; runs.push([s.until, clock]); }
  return { texts, runs, seconds: Math.max(clock, reader) };
}

// The chapter's time line: its sections that are played, one after another. It is worked out again when the pace, the
// sections played, the tour or the clips change.
function chapterPlan() {
  const chapter = tourSection()?.chapter, ids = tour.sections.flatMap((s, i) => s.chapter === chapter && sectionOn(i) ? [i] : []);
  const key = `${chapter}|${tourPace().name}|${voiceOn()}|${ids.join(',')}|${Object.keys(tour.audio ?? {}).length}`;
  if (tour.plan?.key === key && tour.plan.sections === tour.sections) return tour.plan;
  let offset = 0;
  const parts = ids.map(i => { const plan = sectionPlan(tour.sections[i]), part = { i, offset, ...plan }; offset += plan.seconds; return part; });
  return tour.plan = { key, sections: tour.sections, parts, seconds: offset };
}

// The seconds into a section at which the run is at a candle, and the candle it is at a number of seconds in.
function secondsAtCandle(part, t) {
  const runs = part.runs, next = runs.findIndex(([c]) => c >= t);
  if (next < 0) return runs[runs.length - 1][1];
  if (next === 0 || runs[next][0] === t) return runs[next][1];
  const [c0, s0] = runs[next - 1], [c1, s1] = runs[next];
  return s0 + (s1 - s0) * (t - c0) / (c1 - c0);
}

function candleAtSeconds(part, seconds) {
  const runs = part.runs;
  let k = 0;
  while (k + 1 < runs.length && runs[k + 1][1] <= seconds) k++;
  const [c0, s0] = runs[k], [c1, s1] = runs[k + 1] ?? runs[k];
  return c1 > c0 && s1 > s0 ? c0 + Math.floor((c1 - c0) * (seconds - s0) / (s1 - s0)) : c0;
}

// Where the player is in the chapter, in seconds: the candle the run is at, or as far into the text on show as it has
// been read, whichever is further on. Paused, a text is at its start, as Play reads it again from there.
function planPosition(plan) {
  const part = plan.parts.find(p => p.i === tour.index);
  if (!part) return 0;
  let at = secondsAtCandle(part, cursorOf(tour.ex));
  const text = part.texts.find(x => x.cue === tour.active);
  if (text) at = Math.max(at, text.start + Math.min(text.seconds, activeElapsed()));
  return part.offset + Math.min(at, part.seconds);
}

// The seconds the text on show has been read for: while playing, since its reading began; paused, as far as it had got.
const activeElapsed = () => !tour?.active ? 0 : tour.timer ? Math.max(0, (performance.now() - (tour.activeAt ?? performance.now())) / 1000) : tour.pausedElapsed ?? 0;

// How many of a text's characters have been read after a number of seconds. Read aloud, by its clip: sentence by
// sentence where the narration tool says how long each sentence is, and by characters within one; otherwise by
// characters over the clip. Read to oneself, by characters over the time it is given.
function readChars(cue, elapsed) {
  const text = cue.text ?? '', n = text.length, pace = tourPace();
  if (voiced(cue)) {
    const clip = tour.audio[textKey(text)], at = elapsed * pace.voice, parts = clip?.sentences, written = text.split(/(?<=[.!?])\s+/);
    if (parts?.length && parts.length === written.length) {
      const pause = parts.length > 1 ? Math.max(0, (clip.seconds - parts.reduce((a, b) => a + b, 0)) / (parts.length - 1)) : 0;
      let time = 0, chars = 0;
      for (let i = 0; i < parts.length; i++) {
        if (at < time + parts[i]) return chars + Math.round(written[i].length * (at - time) / parts[i]);
        time += parts[i] + pause;
        chars += written[i].length + 1;
      }
      return n;
    }
    return Math.round(n * Math.min(1, at / cue.clip));
  }
  return Math.round(n * Math.min(1, elapsed / holdOf(cue)));
}

// The caption: the last text shown that is not pinned, read up to where the reading has got in black and the rest in
// grey, word by word. A text no longer on show has been read; a recording shows it whole.
function showCaption() {
  const box = document.querySelector('[data-tour="caption"]');
  if (!box) return;
  const cue = [...tour.shown].reverse().find(c => c.on == null), text = cue?.text ?? '';
  let read = cue && cue === tour.active && !videoMode && !tour.recording ? readChars(cue, activeElapsed()) : text.length;
  if (read < text.length) { const space = text.indexOf(' ', read); read = space < 0 ? text.length : space; }
  const key = `${text}|${read}`;
  if (box.dataset.key === key) return;
  box.dataset.key = key;
  box.innerHTML = read >= text.length ? esc(text) : `${esc(text.slice(0, read))}<span class="unread">${esc(text.slice(read))}</span>`;
}

// Clicking the caption moves on to the next text at once, as when it has been read: on to the next candle with a text,
// or the next section when this one has none left. Playing, the voice moves on with it.
function nextText() {
  if (!tour?.sections.length) return;
  if (tour.journey) endJourney();
  const s = tourSection();
  if (!tour.queue.length && cursorOf(tour.ex) >= s.until) {
    const next = sectionAfter(tour.index, 1);
    if (next != null) enterSection(next);
    return;
  }
  hush();
  if (!tour.queue.length) advanceTo(Math.min(s.until, ...pendingCues(s).map(cueAt)));
  showNextCue();
  refreshTour();
}

const clockOf = seconds => `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;
let scrubbing = false;
window.addEventListener('pointerup', () => { scrubbing = false; }, { passive: true });

// The slider and its readout at where the player is, with a mark at each text that is read.
function showScrub() {
  const scrub = document.querySelector('[data-tour="scrub"]');
  if (!scrub || !tourSection()) return;
  const plan = chapterPlan(), at = planPosition(plan);
  scrub.min = 0;
  scrub.max = Math.max(plan.seconds, 0.1);
  scrub.step = 0.1;
  scrub.disabled = plan.seconds <= 0;
  if (!scrubbing) scrub.value = at;
  const marks = document.getElementById('player-marks');
  if (marks && marks.dataset.key !== plan.key) {
    marks.dataset.key = plan.key;
    marks.innerHTML = plan.parts.flatMap(p => p.texts.filter(x => x.cue.on == null).map(x => `<option value="${(p.offset + x.start).toFixed(1)}"></option>`)).join('');
  }
  document.querySelector('[data-tour="where-in"]').textContent = `${clockOf(scrubbing ? Number(scrub.value) : at)} of ${clockOf(plan.seconds)}`;
}

// Moving the slider puts the player at that many seconds into the chapter. On a text it is the start of that text, on
// show; between texts it is the candle the run is at then, with the texts before it taken as read. It holds still while
// the slider moves, and once it is let go it plays on from there if it was playing, and stays paused if it was not.
function scrubTour(seconds) {
  if (!tour?.sections.length) return;
  const plan = chapterPlan(), part = [...plan.parts].reverse().find(p => p.offset <= seconds) ?? plan.parts[0];
  if (!part) return;
  tour.playAfterScrub ||= !!tour.timer;
  pauseTour();
  if (tour.journey) endJourney();
  const local = seconds - part.offset, s = tour.sections[part.i];
  const text = [...part.texts].reverse().find(x => x.start <= local && local < x.start + x.seconds && x.cue.on == null);
  if (text) seekTour(part.i, { cue: s.cues.indexOf(text.cue) });
  else seekTour(part.i, { t: candleAtSeconds(part, local), shown: part.texts.filter(x => x.start <= local).length });
  showScrub();
}

function playTour() {
  if (!tour?.sections.length) return;
  stopPlaying();
  // A section is at its end once its candles have run, its texts have come and the one on show has been read through:
  // one just entered, its first text on show, is not, even when it stays on one candle.
  const read = !tour.active || (tour.pausedElapsed ?? 0) >= holdOf(tour.active) - 0.05;
  const s = tourSection(), atEnd = cursorOf(tour.ex) >= s.until && !tour.queue.length && !tour.journey && read, next = sectionAfter(tour.index, 1);
  // At the end it starts again; at the end of a chapter it is paused at, the next chapter plays; in a section since left
  // out, the next played one does.
  if (tour.ended || (atEnd && next == null)) enterSection(sectionAfter(-1, 1) ?? 0);
  else if ((atEnd || !sectionOn(tour.index)) && next != null) enterSection(next, { journey: true });
  // The text on show gets its reading time again, and is read aloud from its start: it was shown while the tour was not playing.
  if (tour.active) Object.assign(tour, { activeAt: performance.now(), activeUntil: performance.now() + holdOf(tour.active) * 1000, pausedElapsed: 0 });
  tour.nextCandle = 0;
  tour.timer = setInterval(tourTick, TOUR_TICK);
  if (tour.active) speak(tour.active);
  updateTourPanel();
}

function pauseTour() {
  if (!tour?.timer) return;
  // The text on show keeps how far it had been read, to show while paused.
  tour.pausedElapsed = activeElapsed();
  clearInterval(tour.timer);
  tour.timer = null;
  hush();
  updateTourPanel();
}

// Stepping by hand, a section at a time, over the sections left out: back to the start of the section, or of the one before
// when it has not got past its first text; on to the start of the next, or from the last to its end, every text read.
function tourGo(action) {
  if (!tour?.sections.length) return;
  if (action === 'play') return tour.timer ? pauseTour() : playTour();
  // A step keeps the player as it was: playing on from where it lands, or paused there.
  const was = !!tour.timer;
  pauseTour();
  if (tour.journey) endJourney();
  const s = tourSection(), t = cursorOf(tour.ex), first = sectionAfter(-1, 1) ?? 0, last = sectionAfter(tour.sections.length, -1) ?? tour.sections.length - 1;
  const land = i => { enterSection(i); if (was) playTour(); };
  if (action === 'prev') return land((t > s.from || tour.shown.length > 1 || tour.ended) && sectionOn(tour.index) ? tour.index : sectionAfter(tour.index, -1) ?? first);
  if (action === 'first') return land(first);
  if (action === 'last') return land(last);
  const next = sectionAfter(tour.index, 1);
  if (action === 'next' && next != null) return land(next);
  // The end: the last section played, at its last candle, every text read.
  seekTour(last, { t: Infinity, shown: Infinity });
  tour.ended = true;
  updateTourPanel();
}

async function renderTourPage(chapter) {
  const main = document.getElementById('main');
  selected.clear();
  pauseTour();
  currentPage = 'Tour';
  if (tours.Tour) tour = tours.Tour;
  const show = body => {
    main.innerHTML = `<section class="term-head"><h2 data-tour="title">${esc(tours.Tour?.def.title || 'Tour')}</h2>
      <p class="remarks">A scripted replay, read from <code>tour.json</code> and changed with the editor beside the chart. Candles are numbered
      from the tour's start: the crosshair shows a candle's number.</p></section>${body}`;
    renderLayers(); wireReplayExamples(main); drawAll(currentPage);
  };

  if (!serverOn) {
    show(`<div class="empty" data-server-check>Checking for the local server…</div>`);
    return checkLocalServer();
  }
  if (!tours.Tour) {
    show('<div class="empty">Loading the tour…</div>');
    try { tour = tours.Tour = await (tourLoading ??= loadTour()); }
    catch (e) {
      tourLoading = null;
      if (currentPage === 'Tour') show(`<div class="empty">The tour could not be loaded: ${esc(e.message)}.</div>`);
      return;
    }
    if (currentPage !== 'Tour') return;
  }

  const ex = tour.ex;
  show(`<div data-tour="errors"></div>
    <article class="example replay-big" id="ex-${esc(ex.id)}">
      <header><h3 data-tour="chapter"></h3><span class="id" data-tour="where"></span></header>
      ${playerPanel('Tour')}
      ${chartRow(ex)}
      <div class="tour-warning" data-tour="warning" hidden></div>
    </article>`);
  wirePlayerPanel(main);
  renderTourGlossary();
  if (!videoMode) requestNarration();
  editorSection = -1;
  const wanted = tour.chapters.find(c => c.slug === chapter), first = wanted ? wanted.section : tour.index;
  // Opening the page shows its section's view at once, with no zoom to it.
  tour.view = tour.sections[first]?.view ?? tour.view;
  tour.zoom = null;
  seekTour(first);
  if (tour.wanted.length) resolveTour();
}

// The tour's audio and video are made by the local server, which runs tools/tour-video. The texts are read aloud without
// being asked: when the tour is saved, when the Tour page opens and when Voice is turned on, the server reads whichever
// have no clip yet or were changed, which is all that Voice needs. Generate video does that and then records the tour, for
// Download video to fetch. The page asks how it is going until it is done, then loads the clips again.
let tourExport = null, tourExportNote = '', tourExportPoll = null;

async function refreshTourExport(start = false) {
  const response = await fetch('api/video', { method: start ? 'POST' : 'GET' }).catch(() => null), was = tourExport;
  tourExport = response?.ok ? await response.json() : null;
  if (start && !tourExport) tourExportNote = 'The local server was started before it could make the video. Restart ./build-site.ps1 -Serve.';
  clearTimeout(tourExportPoll);
  if (tourExport?.running && currentPage === 'Tour') tourExportPoll = setTimeout(refreshTourExport, 2000);
  // The clips are looked for once a reading is done, whether it was still going at the first asking or already over.
  const finished = tourExport && !tourExport.running && (was?.running || !was);
  updateTourExport();
  if (finished && tour) await reloadTourAudio();
}

// The texts read aloud again have new clips, with new lengths, so the clips are loaded again.
async function reloadTourAudio() {
  const audio = await fetch('tour-audio/index.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
  if (audio && JSON.stringify(audio) !== JSON.stringify(tour.audio)) { tour.audio = audio; applyTour(); }
}

// Has the server read the tour's texts that have no clip yet, then follows the reading. A written tour's texts are read
// as soon as the tour is asked for, so for one only the following is needed.
async function requestNarration() {
  if (videoMode) return;
  await fetch('api/narrate', { method: 'POST' }).catch(() => null);
  tourExport = null;
  refreshTourExport();
}

function generateTour() {
  if (tourExport?.running) return;
  tourExportNote = tourDirty() ? 'Save the tour first: the video is made from tour.json.' : '';
  if (tourExportNote) return updateTourExport();
  refreshTourExport(true);
}

function updateTourExport() {
  const status = document.querySelector('[data-tour="video"]');
  if (!status || currentPage !== 'Tour') return;
  const v = tourExport ?? {}, clock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const made = v.made ? new Date(v.made).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  document.querySelectorAll('[data-tour-go="video"]').forEach(b => { b.disabled = !!v.running; });
  const download = document.querySelector('[data-tour="download"]');
  if (download) download.hidden = !v.made;
  status.classList.toggle('warn', !v.running && !!(tourExportNote || v.error));
  // A written tour's status says only how the reading of its texts is going.
  status.textContent = v.running ? `${v.stage}… ${clock(v.seconds)}`
    : v.error ? `The ${v.audioOnly ? 'texts were not read aloud' : 'video was not made'}: ${v.error}`
    : tourExportNote || (made ? `Video made ${made}${v.stale ? ', before the tour was last saved' : ''}` : '');
}

// An analysis's Make video: the server records the analysis by its address, playing the chapters it has on by its detail,
// once the reading of its texts (begun when it was written) is done. The page asks how it is going until it is done; the
// video is kept until the next is made, and Download video fetches it.
let analysisVideoPoll = null;

async function makeAnalysisVideo(start = true) {
  if (tour?.page !== 'Analysis') return;
  const response = await (start
    ? fetch('api/video/analysis', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address: tour.hash }) })
    : fetch('api/video', { cache: 'no-store' })).catch(() => null);
  const v = response?.ok ? await response.json()
    : { error: response?.status === 404 || response?.status === 405 ? 'the local server was started before it could make one; restart ./build-site.ps1 -Serve' : 'the local server did not answer' };
  clearTimeout(analysisVideoPoll);
  if (v.running && currentPage === 'Analysis') analysisVideoPoll = setTimeout(() => makeAnalysisVideo(false), 2000);
  const status = document.querySelector('[data-tour="video"]');
  if (!status || currentPage !== 'Analysis') return;
  const clock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const made = v.analysisMade ? new Date(v.analysisMade).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  document.querySelector('[data-tour-go="analysisVideo"]').disabled = !!v.running && !!v.analysis;
  document.querySelector('[data-tour="analysis-download"]').hidden = !v.analysisMade;
  status.classList.toggle('warn', !v.running && !!v.error && (start || v.analysis));
  status.textContent = v.running ? (v.analysis ? `${v.stage === 'Waiting' ? 'Waiting for the texts to be read aloud' : v.stage}… ${clock(v.seconds)}` : `Reading the texts aloud… ${clock(v.seconds)}`)
    : v.error && (start || v.analysis) ? `The video was not made: ${v.error}`
    : made ? `Video made ${made}${v.analysisAddress && v.analysisAddress !== tour.hash ? ', of another analysis' : ''}` : '';
}

// ---- Find similar ----------------------------------------------------------------------------------------------------
// The other Trends like the one a written tour explains. The dialog lists what the tour says of its Trend, each a tick:
// its direction, its level, its count of Swings and its Strength. Search lists the Trends of the dataset as a whole that
// match what is ticked, by the candle they begin at, each a link to a written tour of its own, with this one marked.
const SIMILAR_SHOWN = 500;
const orderOf = n => `${n}${n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] ?? 'th'} order`;
const trendName = t => t.direction === 'Up' ? 'Uptrend' : 'Downtrend';
const swingsOf = t => `${t.swings} ${t.direction === 'Up' ? 'Upswings' : 'Downswings'}`;
let similar = null;

async function openSimilar() {
  let dialog = document.getElementById('similar');
  if (!dialog) {
    dialog = document.createElement('dialog');
    dialog.id = 'similar';
    dialog.setAttribute('aria-label', 'Find similar Trends');
    document.body.append(dialog);
    dialog.addEventListener('click', e => {
      if (e.target === dialog || e.target.closest('[data-sim="close"]')) dialog.close();
      else if (e.target.closest('[data-sim="search"]')) searchSimilar(dialog);
      // On the Replay page a Trend found is explained there, in place; on the Tour page its link opens a tour of its own.
      const found = e.target.closest('a[data-sim-at]');
      if (found && currentPage === 'Analysis' && !(e.ctrlKey || e.metaKey || e.shiftKey || e.button)) {
        e.preventDefault();
        dialog.close();
        wantedAnalysis = { dataset: similar.params.dataset, at: found.dataset.simAt, things: [`Trend:${found.dataset.simLevel}`], detail: detailOf('Analysis') };
        history.replaceState(null, '', analysisHash(wantedAnalysis));
        renderAnalysisPage();
      }
    });
  }
  dialog.innerHTML = '<h4>Find similar Trends</h4><p>Reading the Trends…</p>';
  dialog.showModal();
  // The Trend is the one the analysis on show tells of.
  if (tour?.page !== 'Analysis') return dialog.close();
  const p = tour.params, params = { dataset: p.dataset, at: p.at, level: trendLevel(tour), ...(p.seen ? { seen: p.seen } : {}) };
  const wanted = JSON.stringify(params);
  try {
    if (similar?.wanted !== wanted) {
      const r = await fetch(`api/explain/similar?${new URLSearchParams({ dataset: params.dataset, at: params.at, level: params.level, ...(params.seen ? { seen: params.seen } : {}), ...(currentPage === 'Analysis' ? { inPlace: true } : {}) })}`, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status === 404 ? 'the local server is older than this page: restart ./build-site.ps1 -Serve' : await r.text() || `the server answered ${r.status}`);
      similar = { ...await r.json(), params, wanted };
    }
  } catch (e) {
    dialog.innerHTML = `<h4>Find similar Trends</h4><p class="warn">${esc(e.message)}</p><div class="sim-foot"><button type="button" data-sim="close">Close</button></div>`;
    return;
  }
  const s = similar.shown, check = (key, label) => `<label><input type="checkbox" data-sim-check="${key}" checked>${esc(label)}</label>`;
  dialog.innerHTML = `<h4>Find similar Trends</h4><p>Untick what need not be the same, then search.</p>
    <div class="sim-checks">${check('direction', trendName(s))}${check('level', orderOf(s.level))}${check('swings', swingsOf(s))}${check('strength', `${s.strength}% Strength`)}</div>
    <div class="sim-foot"><button type="button" class="go" data-sim="search">Search</button><button type="button" data-sim="close">Close</button></div>
    <div data-sim="results"></div>`;
}

function searchSimilar(dialog) {
  const s = similar.shown, keys = [...dialog.querySelectorAll('[data-sim-check]')].filter(c => c.checked).map(c => c.dataset.simCheck);
  const same = t => t.level === s.level && t.start === s.start && t.direction === s.direction;
  const found = similar.trends.filter(t => keys.every(k => t[k] === s[k]));
  const link = t => `./${analysisHash({ dataset: similar.params.dataset, at: t.at, things: [`Trend:${t.level}`], detail: detailOf('Analysis') })}`;
  // A Trend the chart had otherwise at the time has no tour to open, as a tour shows the chart as it was.
  const row = t => `<li${same(t) ? ' class="current"' : ''}><${t.tour ? `a href="${esc(link(t))}" data-sim-at="${esc(t.at)}" data-sim-level="${t.level}"` :'a title="The chart had this otherwise at the time, so there is no tour of it"'}${same(t) ? ' aria-current="true"' : ''}><span>#${t.index}</span><span>${esc(fmtTime(t.start))}</span>
    <span>${esc(`${orderOf(t.level)} ${trendName(t)} · ${swingsOf(t)} · ${t.strength}%${same(t) ? ' · this one' : ''}${t.tour ? '' : ' · no tour'}`)}</span></a></li>`;
  // The tour shows its Trend as the chart had it where the tour ends; the list has the Trends as the whole dataset does.
  const whole = similar.trends.find(same), differs = whole && (whole.swings !== s.swings || whole.strength !== s.strength);
  const note = !whole ? ' This one is not among them: with the candles since, it is a Ghost.' : differs ? ` With the candles since, this one is ${swingsOf(whole)} at ${whole.strength}%.` : '';
  dialog.querySelector('[data-sim="results"]').innerHTML = `<div class="sim-count">${found.length} Trend${found.length === 1 ? '' : 's'} in the dataset as a whole, by the candle they begin at${found.length > SIMILAR_SHOWN ? `: the first ${SIMILAR_SHOWN} are listed` : ''}.${esc(note)}</div>
    <ol>${found.slice(0, SIMILAR_SHOWN).map(row).join('')}</ol>`;
  dialog.querySelector('li.current')?.scrollIntoView({ block: 'nearest' });
}

// ---- Tour glossary ---------------------------------------------------------------------------------------------------
// What the voice says in place of what is written, edited in a panel of its own under the controls, which the Glossary
// button opens. The boxes are the glossary as it is being written, and the tour's definition follows them: an entry with
// nothing written yet is only in its boxes. The clips are read with it when the audio is next updated.
const glossaryOn = () => state.tourGlossary === true && !videoMode;
const glossaryRow = ([from, to]) => `<div class="gl-row"><input data-gl="from" placeholder="Written, as BoS" aria-label="Written" value="${esc(from)}"><span aria-hidden="true">→</span>` +
  `<input data-gl="to" placeholder="Said, as Break of Structure" aria-label="Said" value="${esc(to)}"><button type="button" data-gl="delete" title="Delete this entry" aria-label="Delete this entry">✕</button></div>`;

function toggleTourGlossary() {
  state.tourGlossary = !glossaryOn();
  save(state);
  renderTourGlossary();
  updateTourPanel();
}

function renderTourGlossary() {
  const box = document.querySelector('[data-tour="glossary"]');
  if (!box || !tour) return;
  box.hidden = !glossaryOn();
  box.innerHTML = box.hidden ? '' : `<div class="gl-head"><h4>Glossary</h4><span>What the voice says in place of what is written. An entry stands for a whole word,
      in the case it is written in, and the longest entry that fits is used.</span></div>
    <div class="gl-rows">${Object.entries(tour.def.glossary ?? {}).map(glossaryRow).join('')}</div>
    <div class="gl-foot"><button type="button" data-gl="add">+ Entry</button><button type="button" data-gl="save" title="Save to tour.json (Ctrl+S)">Save</button>
      <span data-gl-status aria-live="polite"></span></div>`;
  updateGlossaryStatus();
}

// Writes the boxes into the tour's definition. Typing in one box is one change to undo.
function readGlossary(key = null) {
  const entries = [...document.querySelectorAll('[data-tour="glossary"] .gl-row')]
    .map(row => [row.querySelector('[data-gl="from"]').value.trim(), row.querySelector('[data-gl="to"]').value]).filter(([from]) => from);
  rememberTour(key);
  if (entries.length) tour.def.glossary = Object.fromEntries(entries); else delete tour.def.glossary;
  tour.note = '';
  updateEditorStatus();
}

function glossaryAction(action, el) {
  if (action === 'save') return saveTour();
  if (action === 'delete') { el.closest('.gl-row').remove(); return readGlossary(); }
  const rows = document.querySelector('[data-tour="glossary"] .gl-rows');
  rows.insertAdjacentHTML('beforeend', glossaryRow(['', '']));
  rows.lastElementChild.querySelector('input').focus();
}

// Says whether the glossary is saved, and how many of the clips were read before it was as it is now.
function updateGlossaryStatus() {
  const status = document.querySelector('[data-gl-status]');
  if (!status) return;
  const dirty = tourDirty(), said = spokenText(tour.def), old = Object.values(tour.audio ?? {}).filter(c => (c.spoken ?? c.text) !== said(c.text)).length;
  document.querySelector('button[data-gl="save"]').disabled = !dirty;
  status.textContent = tour.note || [dirty ? 'Changes not saved' : 'Saved in tour.json',
    old ? `${old} text${old === 1 ? ' is' : 's are'} still read as before, until the audio is updated` : ''].filter(Boolean).join(' · ');
  status.classList.toggle('warn', !!tour.note);
}

// ---- Tour editor -----------------------------------------------------------------------------------------------------
// Beside the chart, where the event log is on other pages: the tour's definition as a form. It shows the section the tour
// is at, so what is edited is what is on the chart, and every change is applied at once. The layer buttons set the layers
// of that section. Save writes tour.json back through the local server.
// The section the tour is at is open in the editor unless it has been folded away, which lasts until a section is picked.
let editorSection = -1, editorFolded = false;
// The definitions open to their wording under a written text, kept open as the editor is drawn again.
const definitionsOpen = new Set();
const editorOn = () => state.tourEditor !== false && !videoMode;
const tourDirty = () => !!tours.Tour && (JSON.stringify(tours.Tour.def) !== tours.Tour.saved || definitionsDirty());
const TOUR_KEYS = { tour: ['title', 'dataset', 'glossary', 'start', 'sections'], start: ['time', 'view', 'speed', 'layers'],
  section: ['chapter', 'scene', 'layers', 'add', 'remove', 'fastForward', 'rewind', 'from', 'until', 'view', 'speed', 'cues'], cue: ['at', 'on', 'place', 'to', 'heads', 'color', 'define', 'direction', 'texts', 'hold', 'keep', 'voice'] };

// tour.json as text: a line for each text and for each of a section's settings, so a change shows as a small diff.
function formatTour(def) {
  const ordered = (o, keys) => [...keys.filter(k => k in o), ...Object.keys(o).filter(k => !keys.includes(k))].map(k => [k, o[k]]);
  const inline = (v, keys = []) => Array.isArray(v) ? `[${v.map(x => inline(x)).join(', ')}]`
    : v && typeof v === 'object' ? (Object.keys(v).length ? `{ ${ordered(v, keys).map(([k, x]) => `${JSON.stringify(k)}: ${inline(x)}`).join(', ')} }` : '{}')
    : JSON.stringify(v);
  const lines = (entries, pad) => entries.map(([k, text]) => `${pad}${JSON.stringify(k)}: ${text}`).join(',\n');
  const list = (items, pad, each) => items.length ? `[\n${items.map(each).join(',\n')}\n${pad}]` : '[]';
  const section = s => `    {\n${lines(ordered(s, TOUR_KEYS.section).map(([k, v]) =>
    [k, k === 'cues' && Array.isArray(v) ? list(v, '      ', c => `        ${inline(c, TOUR_KEYS.cue)}`) : inline(v)]), '      ')}\n    }`;
  return `{\n${lines(ordered(def, TOUR_KEYS.tour).map(([k, v]) =>
    [k, k === 'sections' && Array.isArray(v) ? list(v, '  ', section) : inline(v, k === 'start' ? TOUR_KEYS.start : [])]), '  ')}\n}\n`;
}

// How long a section takes to play: the replay waits at each text that has a candle, and the rest is read while it runs.
function sectionSeconds(s) {
  const sum = cues => cues.filter(c => !c.skipped).reduce((n, c) => n + c.hold, 0), j = s.journey;
  // A journey is the view easing out and in, and the run between when it has one.
  const journey = j ? 2 * TOUR_ZOOM_MS / 1000 + (j.run ? Math.abs(j.to - j.start) / j.speed : 0) : 0;
  return sum(s.cues.filter(c => c.at != null)) + Math.max(journey + (s.until - s.from) / s.speed, sum(s.cues.filter(c => c.at == null)));
}

// The tour's contents, not being edited: a row for each chapter, in order, with Edit to open them.
function renderTourContents(box) {
  const scrolled = box.querySelector('.ed-body')?.scrollTop ?? 0;
  editorSection = tour.index;
  box.innerHTML = `<div class="ed-head"><h4>Contents</h4>
      <button type="button" data-ed="edit" aria-pressed="false" title="Open the chapters to edit the tour: their sections, texts and settings">Edit</button></div>
    <div class="ed-body"><div class="ct-group">${tour.chapters.map((c, i) => chapterRow(i, { number: true })).join('')}</div></div>`;
  const body = box.querySelector('.ed-body');
  body.scrollTop = scrolled;
  syncContents();
  // The chapter on show is kept in view.
  const row = body.querySelector('.ct-row.active'), at = row?.getBoundingClientRect(), view = body.getBoundingClientRect();
  if (at && (at.top < view.top || at.bottom > view.bottom)) body.scrollTop += at.top - view.top - 40;
}

// The cards the editor shows sections in, for the tour and an analysis alike: the section on show open to its settings and
// texts, its written texts among them, the others a row to go to. An analysis's sections are its own, one to a chapter, so
// it cannot add, move, copy or delete one, begin a scene there, or change a definition's wording, which is the tour's.
function editorCards() {
  const { def, sections } = tour, start = def.start ?? {}, fixed = tour.page !== 'Tour';
  const value = v => esc(v ?? '');
  // A definition's wording, the same wherever it is told, and how it reads here. A change to it is saved to
  // definitions.json, from the tour or an analysis alike: the one change that is not kept to the analysis.
  const definitionBox = (key, readsAs) => `<label class="ed-level">The wording of ${esc(key)}, the same wherever it is told<textarea data-scope="definition" data-field="definition" data-key="${esc(key)}" aria-label="The definition ${esc(key)}">${value(DEFINITIONS[key])}</textarea></label>
    <span class="ed-hint">${needsDirection(key) ? 'Slots for its direction: {trend}, {a trend}, {swing}, {a swing}, {other swing}, {a other swing}, {turn}, {beyond}, {weak turn}, {turn labels}, {extreme}, {trends}, {start}, {a first leg}, {a second leg}. ' : ''}${/\{period\}/.test(DEFINITIONS[key] ?? '') ? '{period} is what a candle spans. ' : ''}Saved to definitions.json: it changes wherever it is told. Here it reads: ${esc(readsAs ?? '')}</span>`;
  const options = (list, current) => list.map(([v, label]) => `<option value="${esc(v)}" ${String(current ?? '') === String(v) ? 'selected' : ''}>${esc(label)}</option>`).join('');
  // The first and last candle shown. Left empty, the view is as before, which the boxes then say.
  const viewBoxes = (scope, view, before, otherwise = 'as before') => [['View from candle', 0], ['View to candle', 1]].map(([label, k]) =>
    `<label>${label}<input type="number" min="0" step="1" data-scope="${scope}" data-field="view${k}" placeholder="#${before[k]}, ${otherwise}" value="${value(view?.[k])}"></label>`).join('');
  const ops = (kind, what) => `<span class="ed-ops">${kind === 'cue' ? `<button type="button" data-ed="cue-copy" title="Add a copy of this text after it">Copy</button>` : ''}` +
    `<button type="button" data-ed="${kind}-up" title="Move this ${what} up" aria-label="Move this ${what} up">↑</button>` +
    `<button type="button" data-ed="${kind}-down" title="Move this ${what} down" aria-label="Move this ${what} down">↓</button>` +
    `<button type="button" data-ed="${kind}-delete" title="Delete this ${what}" aria-label="Delete this ${what}">✕</button></span>`;
  const pick = (field, what) => `<button type="button" data-ed="pick" data-pick="${field}" title="Pick ${what} on the chart">Pick</button>`;
  const head = i => `<span class="ed-num">${i + 1}</span><span class="ed-name" data-ed-name></span><span class="ed-meta" data-ed-meta></span>`;
  const layerName = id => { const l = LAYERS.find(x => x.id === id); return l?.level !== undefined ? `level ${l.level}` : l?.label ?? id; };

  // A candle given as an event shows the candle it was found at, and says so; typing a number replaces the event.
  const numberOr = v => typeof v === 'number' ? v : '';
  const eventBox = spec => spec ? ` class="ed-event" title="${esc(spec)}"` : '';
  const cueCard = (c, j, compiled) => {
    const pinned = c.on != null;
    return `<div class="ed-cue" data-cue="${j}">
      <div class="ed-meta" data-ed-cue></div>
      <label class="ed-level">Text from<select data-scope="cue" data-field="define" data-render>${options([['', 'written here'], ...Object.keys(DEFINITIONS).map(k => [k, `the definition ${k}`])], c.define ?? '')}</select></label>
      ${c.define != null ? `<div class="ed-define">
        ${needsDirection(c.define) ? `<label class="ed-level">Told for<select data-scope="cue" data-field="direction" data-render>${options([['Up', 'up: Uptrend, Upswing'], ['Down', 'down: Downtrend, Downswing']], c.direction ?? '')}</select></label>` : ''}
        ${definitionBox(c.define, compiled?.text)}
      </div>`
      : DETAILS.map(level => `<label class="ed-level">${DETAIL_NAMES[level]}<textarea data-scope="cue" data-field="texts.${level}" placeholder="${level === DETAILS[0] ? 'Shown at every detail' : `Shown at ${DETAIL_NAMES[level]}, in place of the ${DETAIL_NAMES[DETAILS[0]].toLowerCase()}`}" aria-label="${DETAIL_NAMES[level]} ${j + 1}">${value(c.texts?.[level])}</textarea></label>`).join('')}
      <div class="ed-row">
        <label>At candle<span class="ed-pick"><input type="number" min="0" step="1" data-scope="cue" data-field="at" data-type="number" placeholder="${esc(compiled?.atSpec ?? 'start')}" value="${numberOr(c.at)}"${eventBox(compiled?.atSpec)}>${pick('at', 'the candle')}</span></label>
        <label>Pinned to<select data-scope="cue" data-field="on" data-type="auto" data-render>${options([['', 'not pinned'], ['open', 'open'], ['high', 'high'], ['low', 'low'], ['close', 'close'],
          ...(typeof c.on === 'number' ? [[c.on, `price ${c.on}`]] : [])], c.on)}</select></label>
        <label>Side<select data-scope="cue" data-field="place" ${pinned ? '' : 'disabled'}>${options([['', 'auto'], ['above', 'above'], ['below', 'below'], ['left', 'left'], ['right', 'right']], c.place)}</select></label>
        <label>Seconds<input type="number" min="0" step="0.5" data-scope="cue" data-field="hold" data-type="number" placeholder="${readingSeconds(textAt(c.texts, detailOf('Tour')) ?? '').toFixed(1)}" value="${value(c.hold)}"></label>
        <label>Pin stays<select data-scope="cue" data-field="keep" ${pinned ? '' : 'disabled'}>${options([['', 'this section'], ['chapter', 'this chapter'], ['always', 'to the end']], c.keep === 'section' ? '' : c.keep)}</select></label>
        <label class="ed-check" title="Shown but not read aloud by the voice, in the page or in the video"><input type="checkbox" data-scope="cue" data-field="voice" ${c.voice === false ? 'checked' : ''}>Silent</label>
        <label title="Draws a line from the pinned point to a point on another candle, with the text in a box along it; it appears when the replay reaches the line's end">Line to candle<span class="ed-pick"><input type="number" min="0" step="1" data-scope="cue" data-field="lineTo" data-type="number" data-render ${pinned ? '' : 'disabled'} placeholder="${esc(compiled?.to?.atSpec ?? 'no line')}" value="${numberOr(c.to?.at)}"${eventBox(compiled?.to?.atSpec)}></span></label>
        <label>Line ends on<select data-scope="cue" data-field="lineOn" data-type="auto" ${c.to ? '' : 'disabled'}>${options([['', 'same as the pin'], ['open', 'open'], ['high', 'high'], ['low', 'low'], ['close', 'close'],
          ...(typeof c.to?.on === 'number' ? [[c.to.on, `price ${c.to.on}`]] : [])], c.to?.on)}</select></label>
        <label class="ed-check" title="An arrow head where the line starts"><input type="checkbox" data-scope="cue" data-field="headStart" ${c.to ? '' : 'disabled'} ${c.heads?.start === true ? 'checked' : ''}>Head at start</label>
        <label class="ed-check" title="An arrow head where the line ends"><input type="checkbox" data-scope="cue" data-field="headEnd" ${c.to ? '' : 'disabled'} ${c.heads?.end !== false ? 'checked' : ''}>Head at end</label>
        <label title="The line's colour: up (green), down (red), accent, or any CSS colour">Line colour<input data-scope="cue" data-field="color" ${c.to ? '' : 'disabled'} placeholder="accent" value="${value(c.color)}"></label>
        ${ops('cue', 'text')}
        ${j && !fixed ? `<span class="ed-split"><button type="button" data-ed="cue-split" title="Start a new section with this text and those after it, so it can have layers of its own">Split the section here</button></span>` : ''}
      </div>
    </div>`;
  };

  // A text written from the prices: its wording at each level it is written at can be changed, kept in the section's
  // "edits" by the text's id, and the rest of it is as written. Default takes it back to the wording written.
  // A text written from a definition can change the definition itself, wherever it is told: in the tour, every analysis
  // and the term pages. That is kept open while it is being edited.
  const writtenCard = (d, c, k) => {
    const own = c.id != null ? d.edits?.[c.id] : null, levels = Object.keys(c.written ?? {});
    // A change here can be made the definition's wording when the definition has no slots to fill.
    const promote = own?.education != null && c.definition && c.definition in DEFINITIONS && !/\{/.test(DEFINITIONS[c.definition]);
    return `<div class="ed-cue written${own ? ' edited' : ''}" data-written="${k}" data-id="${esc(c.id ?? '')}">
      <div class="ed-meta" data-ed-cue></div>
      ${levels.map(level => `<label class="ed-level">${DETAIL_NAMES[level] ?? level}${own?.[level] != null ? ', changed here' : ', as written'}<textarea data-scope="written" data-field="${esc(level)}" aria-label="${esc(DETAIL_NAMES[level] ?? level)}, written text ${k + 1}" ${c.id == null ? 'disabled title="This text has no id to keep a change by"' : ''}>${value(c.texts?.[level])}</textarea></label>`).join('')}
      ${own || promote ? `<div class="ed-row"><span class="ed-ops">${own ? '<button type="button" data-ed="written-default" title="Back to the wording written from the prices">Default</button>' : ''}${promote
        ? `<button type="button" data-ed="written-promote" data-key="${esc(c.definition)}" title="Make this the wording of ${esc(c.definition)} wherever it is told, saved to definitions.json">Make this the definition</button>` : ''}</span></div>` : ''}
      ${c.definition && c.definition in DEFINITIONS ? `<details class="ed-define" data-definition="${esc(c.definition)}" ${definitionsOpen.has(c.definition) ? 'open' : ''}>
        <summary>The definition ${esc(c.definition)}: change it everywhere</summary>${definitionBox(c.definition, c.texts?.education)}</details>` : ''}
    </div>`;
  };

  const openCard = (d, i) => {
    const s = sections[i], before = i ? sections[i - 1] : null, was = before?.layers ?? tour.startLayers;
    // The texts written for a section that explains something come before any of its own.
    const written = s.cues.slice(0, s.cues.length - (d.cues ?? []).length);
    // A journey to the section: which way, and whether the replay runs there or only the view moves.
    const tripKind = d.fastForward != null ? 'fastForward' : d.rewind != null ? 'rewind' : '', trip = d[tripKind], back = tripKind === 'rewind';
    const runs = !!trip && trip[back ? 'erase' : 'draw'] !== false;
    const chips = [...s.layers.map(id => `<span class="ed-chip${was.includes(id) ? '' : ' added'}">${was.includes(id) ? '' : '+ '}${esc(layerName(id))}</span>`),
      ...was.filter(id => !s.layers.includes(id)).map(id => `<span class="ed-chip removed">${esc(layerName(id))}</span>`)];
    return `<section class="ed-card open" data-section="${i}">
      <header><button type="button" class="ed-fold" data-ed="section-fold" aria-expanded="true" title="Fold this section away">${head(i)}</button>${fixed ? '' : ops('section', 'section')}</header>
      <div class="ed-grid">
        <label class="wide">Chapter<input data-scope="section" data-field="chapter" placeholder="${before ? `continues ${esc(tour.chapters[before.chapter]?.name ?? 'the section before')}` : 'Name a chapter to start one'}" value="${value(d.chapter)}"></label>
        <label>Runs from candle<span class="ed-pick"><input type="number" min="0" step="1" data-scope="section" data-field="from" data-type="number" placeholder="${esc(s.fromSpec ?? `#${before?.until ?? 0}, as before`)}" value="${numberOr(d.from)}"${eventBox(s.fromSpec)}>${pick('from', 'the first candle')}</span></label>
        <label>Runs to candle<span class="ed-pick"><input type="number" min="0" step="1" data-scope="section" data-field="until" data-type="number" placeholder="${esc(s.untilSpec ?? `stays at #${s.from}`)}" value="${numberOr(d.until)}"${eventBox(s.untilSpec)}>${pick('until', 'the last candle')}</span></label>
        ${viewBoxes('section', d.view, before?.view ?? tour.startView)}
