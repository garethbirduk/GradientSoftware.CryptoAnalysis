function findExample(id) {
  return DATA.examples.find(e => e.id === id) ?? DATA.structure?.examples?.find(e => e.id === id) ?? DATA.interims?.examples?.find(e => e.id === id)
    ?? replayDatasets.find(e => e.id === id) ?? (tour?.ex.id === id ? tour.ex : undefined);
}

// ---- Tour ------------------------------------------------------------------------------------------------------------
// A scripted walk through a dataset, read from tour.json: a start state, then sections that each say which layers are on,
// how far the replay runs and what text appears. A section begins where the one before it ended, so the tour plays as one
// continuous replay. Candles are numbered from the tour's start time (#0), and the structure is anchored there too.
//   start    time (the dataset time of #0), view (the first and last candle the chart shows, as [0, 168]), speed (candles
//            a second) and layers.
//   section  chapter (starts a chapter, which has a link of its own), layers (replaces the layers) or add and remove,
//            from (the candle the section starts at; without it, where the section before ended: an earlier candle takes
//            the replay back), until (the candle the replay runs to; without it the replay stays where it is), view
//            (without it, the view as before), speed, cues.
//   cue      text, shown under the chart as the section begins; with at, when the replay reaches that candle, which waits
//            there while the text is read; with on as well ('open', 'high', 'low', 'close' or a price), pinned to that
//            point of the candle (place: 'above', 'below', 'left' or 'right'). hold is the seconds the text stays before
//            the next, by default the time it takes to read (0 moves straight on, leaving the caption up while pins show); keep is how long a pin stays: 'section', 'chapter' or 'always'.
const DEFAULT_VIEW = [0, 168];
const LAYER_ALIASES = { candles: 'price', closes: 'close' };
// How the editor writes a layer whose id is not what it is called on the page.
const LAYER_NAMES = { price: 'candles' };
const PIN_PRICES = { open: 'o', high: 'h', low: 'l', close: 'c' };
const PIN_PLACES = { above: [0, -55], below: [0, 55], left: [-70, 0], right: [70, 0] };
const TOUR_TICK = 40;
let tour = null, tourLoading = null;
// Opened with ?video, the page shows the tour alone, for tools/tour-video to record.
const videoMode = new URLSearchParams(location.search).has('video');

// The short hash of a text that names its narration clip in tour-audio (FNV-1a, 32 bits; the same as tools/tour-video).
function textKey(text) {
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}

const slugOf = name => name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const readingSeconds = text => Math.max(2.5, text.length / 14);
const tourSection = () => tour.sections[tour.index];

// Every section's full state, worked out from the start state and the sections before it, so any section can be entered
// directly. Whatever the tour gets wrong is listed rather than guessed at.
// A candle in the file is a number, or an event to wait for from a candle on: { "event": "BullishBreakOfStructure",
// "level": 1, "nth": 1 }, the nth time that becomes known at that level. The local server looks those up, one lookup for
// each event and starting candle (see resolveTour), and until it has, the section is listed as waiting.
const eventKey = (spec, from) => `${spec.event}|${spec.level ?? 1}|${spec.nth ?? 1}|${from}`;
const eventName = (spec, from) => `${{ 1: 'the first', 2: 'the second', 3: 'the third' }[spec.nth ?? 1] ?? `the ${spec.nth}th`} ${TERMS.get(spec.event)?.name ?? spec.event} at level ${spec.level ?? 1} after #${from}`;

// A text stays for its narration clip's length when there is one (plus a breath), else for the time it takes to read.
function compileTour(def, candles, resolved = new Map(), audio = {}) {
  const errors = [], known = new Set(LAYERS.map(l => l.id)), chapters = [], wanted = [];
  // A candle number as given, or looked up for an event; null when it is not known (yet).
  const candle = (v, from, where, field) => {
    if (v == null || typeof v === 'number') return { index: v ?? null, spec: null };
    if (typeof v !== 'object' || !TERMS.has(v.event)) { errors.push(`${where}: ${field} must be a candle number or a known event`); return { index: null, spec: null }; }
    const key = eventKey(v, from), spec = eventName(v, from);
    if (!resolved.has(key)) { wanted.push({ key, spec: v, from }); errors.push(`${where}: ${field} is being looked up: ${spec}`); return { index: null, spec }; }
    if (resolved.get(key) == null) errors.push(`${where}: ${field} waits for ${spec}, which does not happen`);
    return { index: resolved.get(key), spec: `${spec} → #${resolved.get(key)}` };
  };
  const ids = (list, where) => (list ?? []).map(id => LAYER_ALIASES[id] ?? id).filter(id => known.has(id) || void errors.push(`${where}: unknown layer "${id}"`));
  const range = (v, where) => Array.isArray(v) && v.length === 2 && v.every(Number.isInteger) && v[0] >= 0 && v[1] > v[0] ? v
    : (errors.push(`${where}: the view is the first and last candle shown, the last after the first`), null);
  const renamed = (o, where) => { if (o.window != null) errors.push(`${where}: "window" is now "view", the first and last candle shown`); };
  const rate = (s, where) => s > 0 ? s : (errors.push(`${where}: speed must be more than 0`), 4);
  const start = def.start ?? {}, startLayers = ids(start.layers, 'start');
  const startView = (start.view != null ? range(start.view, 'start') : null) ?? DEFAULT_VIEW;
  let layers = startLayers, view = startView, speed = rate(start.speed ?? 4, 'start'), at = 0;
  renamed(start, 'start');

  const sections = (def.sections ?? []).map((s, i) => {
    const where = `section ${i + 1}`;
    if (s.chapter) chapters.push({ name: s.chapter, slug: slugOf(s.chapter), section: i });
    if (s.layers) layers = ids(s.layers, where);
    const removed = ids(s.remove, where);
    layers = [...new Set([...layers, ...ids(s.add, where)])].filter(id => !removed.includes(id));
    if (s.view != null) view = range(s.view, where) ?? view;
    renamed(s, where);
    if (s.speed != null) speed = rate(s.speed, where);
    const fromGiven = candle(s.from, at, where, 'from'), from = Number.isInteger(fromGiven.index) && fromGiven.index >= 0 && fromGiven.index < candles ? fromGiven.index : at;
    if (fromGiven.index != null && fromGiven.index !== from) errors.push(`${where}: from #${fromGiven.index} is not a candle of the tour, which has #0 to #${candles - 1}`);
    const untilGiven = candle(s.until, from, where, 'until'), until = untilGiven.index ?? from;
    if (until < from) errors.push(`${where}: until #${until} is before the section's start, #${from}`);
    if (until >= candles) errors.push(`${where}: until #${until} is past the last candle, #${candles - 1}`);
    at = Math.max(from, Math.min(until, candles - 1));

    const cues = (s.cues ?? []).map((c, j) => {
      const what = `${where}, text ${j + 1}`, text = c.text ?? '';
      if (!text) errors.push(`${what}: no text`);
      const atGiven = candle(c.at, from, what, 'at');
      if (atGiven.index != null && (atGiven.index < 0 || atGiven.index > at)) errors.push(`${what}: at #${atGiven.index} is not reached, as the section ends at #${at}`);
      if (c.on != null && c.at == null) errors.push(`${what}: a pin needs a candle`);
      if (c.on != null && typeof c.on !== 'number' && !PIN_PRICES[c.on]) errors.push(`${what}: unknown "on" "${c.on}"`);
      if (c.place != null && !PIN_PLACES[c.place]) errors.push(`${what}: unknown place "${c.place}"`);
      if (!['section', 'chapter', 'always'].includes(c.keep ?? 'section')) errors.push(`${what}: unknown keep "${c.keep}"`);
      return { text, at: atGiven.index, atSpec: atGiven.spec, on: c.on ?? null, place: c.place ?? null, keep: c.keep ?? 'section', hold: c.hold >= 0 ? c.hold : audio[textKey(text)]?.seconds > 0 ? audio[textKey(text)].seconds + 0.4 : readingSeconds(text) };
    });
    return { index: i, chapter: chapters.length - 1, layers, view, speed, from, fromSpec: fromGiven.spec, until: at, untilSpec: untilGiven.spec, cues };
  });
  return { chapters, sections, errors, startLayers, startView, wanted };
}

// Looks up the events a compiled tour is waiting for, then compiles again, until nothing is waiting: a lookup can move a
// section's start, and with it what the next section waits from.
async function resolveTour(retry = 0) {
  const ex = tour.ex, pending = tour.wanted;
  if (!pending.length || retry > 12) return;
  tour.resolving = true;
  updateEditorStatus();
  for (const { key, spec, from } of pending) {
    if (tour.resolved.has(key)) continue;
    const query = `dataset=${encodeURIComponent(ex.dataset)}&anchor=${ex.anchor}&from=${from}&type=${encodeURIComponent(spec.event)}&level=${spec.level ?? 1}&nth=${spec.nth ?? 1}`;
    const found = await fetch(`api/event?${query}`).then(r => r.ok ? r.json() : null).catch(() => null);
    tour.resolved.set(key, found?.index ?? null);
  }
  tour.resolving = false;
  if (tour.ex !== ex || currentPage !== 'Tour') return;
  Object.assign(tour, compileTour(tour.def, ex.prices.t.length, tour.resolved, tour.audio));
  if (tour.wanted.length) return resolveTour(retry + 1);
  editorSection = -1;
  seekTour(tour.index, { t: cursorOf(ex), shown: tour.shown.length });
  updateEditorMeta();
  updateEditorStatus();
}

async function loadTour() {
  const def = await fetch('tour.json', { cache: 'no-store' }).then(r => r.json());
  const list = await loadDatasets();
  const info = list.find(d => d.id === def.dataset) ?? list[0];
  if (!info) throw new Error('the server has no datasets');
  const audio = await fetch('tour-audio/index.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  const loaded = { def, audio, whole: await loadDataset(info), ex: null, saved: JSON.stringify(def), history: [], lastEdit: null, picking: null, note: '', resolved: new Map(), resolving: false,
    index: 0, view: DEFAULT_VIEW, queue: [], shown: [], fired: new Set(), kept: [], active: null, activeUntil: 0, nextCandle: 0, timer: null };
  anchorTour(loaded);
  return Object.assign(loaded, compileTour(def, loaded.ex.prices.t.length, loaded.resolved, loaded.audio));
}

// The tour's candles are the dataset's from its start time on, so a candle's number is its place in them. A new start
// time makes them anew, and what the server worked out from the old one is dropped.
function anchorTour(t = tour) {
  const time = axisTime(t.def.start?.time ?? ''), anchor = Number.isNaN(time) ? 0 : indexAtOrAfter(t.whole, time);
  if (t.ex?.anchor === anchor) return;
  const id = `Tour/${t.whole.dataset}`, cut = a => a.slice(anchor), p = t.whole.prices;
  // Events were looked up from the old start, so they are looked up again.
  t.resolved?.clear();
  remote.delete(id);
  eventCache.clear();
  zooms.delete(id);
  cursors.set(id, 0);
  t.ex = { id, dataset: t.whole.dataset, anchor, tour: true, title: 'Tour', level: 1, expected: [], annotations: [],
    prices: { t: cut(p.t), o: cut(p.o), h: cut(p.h), l: cut(p.l), c: cut(p.c) } };
}

// The candles a section shows are its view, which is what the chart shows as the section begins, wherever the replay is.
// A replay that then runs past the end of the view takes the view along with it.
function sectionView(t) {
  const [first, last] = tour.view, moved = Math.max(0, t - Math.max(last, tourSection()?.from ?? 0));
  return [first + moved, last + moved];
}

// A view that is not the one on show is not cut to: the chart eases from the one to the other, so it reads as the same
// chart zooming or moving.
const TOUR_ZOOM_MS = 1500;

function tourView(t) {
  const view = sectionView(t), zoom = tour.zoom;
  if (!zoom) return view;
  const k = Math.min(1, (performance.now() - zoom.start) / TOUR_ZOOM_MS), eased = k < 0.5 ? 2 * k * k : 1 - (2 - 2 * k) ** 2 / 2;
  return view.map((v, i) => Math.round(zoom.from[i] + (v - zoom.from[i]) * eased));
}

function tourWindow(ex, t) {
  const [from, to] = tourView(t), last = ex.prices.t.length - 1;
  return { from: Math.min(from, last - 1), to: Math.min(Math.max(to, from + 1), last) };
}

function zoomTour(from) {
  tour.zoom = { from, start: performance.now() };
  if (tour.zooming) return;
  // The next frame is asked for before this one is drawn, so a frame that fails does not leave the view part way.
  const step = () => {
    tour.zooming = !!tour.zoom && performance.now() - tour.zoom.start < TOUR_ZOOM_MS;
    if (tour.zooming) requestAnimationFrame(step); else tour.zoom = null;
    if (currentPage === 'Tour') redrawExample(tour.ex);
  };
  tour.zooming = true;
  requestAnimationFrame(step);
}

function pinOf(ex, cue) {
  return { time: ex.prices.t[cue.at], price: typeof cue.on === 'number' ? cue.on : ex.prices[PIN_PRICES[cue.on]]?.[cue.at], text: cue.text,
    place: cue.place ?? { high: 'above', low: 'below', open: 'left' }[cue.on] ?? 'right' };
}

// A pinned cue: its text in a box beside the point, with an arrow to it.
const pinLines = text => text.split(' ').reduce((out, word) => {
  if (out.length && `${out[out.length - 1]} ${word}`.length <= 30) out[out.length - 1] += ` ${word}`; else out.push(word);
  return out;
}, []);

// The room a pinned text's box needs above and below its point, in pixels, to be inside the chart.
function pinRoom(pin) {
  const box = pinLines(pin.text).length * 17 + 14, [, ay] = PIN_PLACES[pin.place] ?? PIN_PLACES.above, clear = 8;
  const beside = box / 2 + clear, beyond = Math.abs(ay) + box + clear;
  return { time: Date.parse(pin.time), price: pin.price, up: ay < 0 ? beyond : ay > 0 ? clear : beside, down: ay > 0 ? beyond : ay < 0 ? clear : beside };
}

function pinLabel(pin) {
  const accent = css('--accent'), [ax, ay] = PIN_PLACES[pin.place] ?? PIN_PLACES.above;
  return { x: pin.time, y: pin.price, text: pinLines(pin.text).join('<br>'), showarrow: true, arrowhead: 2, arrowwidth: 1.5, arrowcolor: accent, ax, ay,
    xanchor: { left: 'right', right: 'left' }[pin.place] ?? 'center', yanchor: { above: 'bottom', below: 'top' }[pin.place] ?? 'middle', align: 'left',
    bgcolor: css('--panel'), bordercolor: accent, borderpad: 5, font: { color: css('--text'), size: 13 } };
}

// Moves the replay to a candle and queues the cues it has reached: text with no candle is reached as the section begins.
function advanceTo(t) {
  const s = tourSection(), ex = tour.ex;
  cursors.set(ex.id, t);
  prefetch(ex, t);
  for (const c of s.cues) if (!tour.fired.has(c) && (c.at ?? s.from) <= t) { tour.fired.add(c); tour.queue.push(c); }
}

function showNextCue() {
  const cue = tour.queue.shift();
  if (!cue) return;
  tour.active = cue;
  tour.activeUntil = performance.now() + cue.hold * 1000;
  tour.shown.push(cue);
  tour.recording?.cues.push({ key: textKey(cue.text), at: Date.now() });
  speak(cue);
}

// Reads a text aloud from its clip in tour-audio, when the Voice button is on and the tour is playing.
function speak(cue) {
  tour.player?.pause();
  const clip = tour.audio[textKey(cue.text)];
  if (!voiceOn() || !tour.timer || !clip || tour.recording) return;
  tour.player = new Audio(`tour-audio/${clip.file}`);
  tour.player.play().catch(() => { });
}

const voiceOn = () => state.tourVoice === true;

// What tools/tour-video drives: plays the whole tour once and reports when each text and chapter appeared.
window.tourVideo = {
  ready: () => currentPage === 'Tour' && !!tour?.sections.length && !tour.wanted.length && !viewFor(tour.ex).loading,
  play: () => new Promise(resolve => {
    pauseTour();
    tour.recording = { started: Date.now(), cues: [], chapters: [] };
    tour.onEnd = () => { const done = { ...tour.recording, ended: Date.now() }; tour.recording = null; resolve(done); };
    enterSection(0);
    playTour();
  }),
};

// Sets the tour at the start of a section, with nothing of it shown yet.
function openSection(i) {
  const s = tour.sections[i], ex = tour.ex, shown = tourView(cursorOf(ex)), moved = i !== tour.index;
  Object.assign(tour, { index: i, view: s.view, queue: [], shown: [], fired: new Set(), active: null, activeUntil: 0, nextCandle: 0 });
  tour.kept = tour.sections.slice(0, i).flatMap(earlier => earlier.cues.filter(c => c.on != null
    && (c.keep === 'always' || (c.keep === 'chapter' && earlier.chapter === s.chapter))));
  // While a candle is being picked, the candles still to come are shown, to pick from.
  tourLayers = ['replay', ...s.layers, ...(tour.picking ? ['future'] : [])];
  const chapter = tour.chapters[s.chapter];
  if (chapter?.section === i) tour.recording?.chapters.push({ name: chapter.name, at: Date.now() });
  history.replaceState(null, '', chapter ? `#Tour/${chapter.slug}` : '#Tour');
  advanceTo(s.from);
  // The section sets the view: the chart eases to it, and a zoom or pan made by hand goes.
  const view = sectionView(s.from), changed = view[0] !== shown[0] || view[1] !== shown[1];
  if (moved || changed) zooms.delete(ex.id);
  if (changed) zoomTour(shown);
}

function enterSection(i) {
  openSection(i);
  showNextCue();
  refreshTour();
}

// Puts the tour at a place in a section: a candle and how many of the section's texts have been shown, or the point at
// which one of its texts appears. An edit uses this to leave the tour where it was, or to show what was edited.
function seekTour(i, { t = 0, shown = 1, cue = null } = {}) {
  if (!tour.sections.length) {
    Object.assign(tour, { index: 0, queue: [], shown: [], fired: new Set(), kept: [], active: null });
    tourLayers = ['replay', ...tour.startLayers];
    cursors.set(tour.ex.id, 0);
    return refreshTour();
  }
  openSection(Math.max(0, Math.min(i, tour.sections.length - 1)));
  const s = tourSection(), target = cue == null ? null : s.cues[cue];
  const pending = () => s.cues.filter(c => !tour.fired.has(c)).map(c => c.at);
  if (target) {
    while (!tour.shown.includes(target)) {
      if (!tour.queue.length) {
        if (cursorOf(tour.ex) >= s.until) break;
        advanceTo(Math.min(s.until, ...pending()));
      }
      showNextCue();
    }
  } else {
    advanceTo(Math.max(s.from, Math.min(t, s.until)));
    while (tour.queue.length && tour.shown.length < shown) showNextCue();
  }
  refreshTour();
}

function refreshTour() {
  const ex = tour.ex;
  const pins = cues => cues.filter(c => c.on != null && c.at != null).map(c => pinOf(ex, c)).filter(p => p.time && Number.isFinite(p.price));
  ex.pins = pins([...tour.kept, ...tour.shown]);
  // Room is kept for all of the section's pins from its start, so the prices do not move each time one appears.
  ex.pinRoom = pins([...tour.kept, ...(tourSection()?.cues ?? [])]);
  syncLayerButtons();
  if (editorSection !== tour.index) renderTourEditor();
  drawAll('Tour');
  updateTourPanel();
}

function updateTourPanel() {
  const part = name => document.querySelector(`[data-tour="${name}"]`);
  if (currentPage !== 'Tour' || !part('caption')) return;
  const s = tourSection(), ex = tour.ex, t = cursorOf(ex);
  // Text pinned to a candle is on the chart; the caption keeps the last text that was not.
  const caption = [...tour.shown].reverse().find(c => c.on == null);
  part('title').textContent = tour.def.title || 'Tour';
  part('chapter').textContent = tour.chapters[s?.chapter]?.name ?? tour.def.title ?? 'Tour';
  part('where').textContent = s ? `section ${s.index + 1} of ${tour.sections.length} · #${s.from}${s.until > s.from ? ` to #${s.until}` : ''}` : 'no sections yet';
  part('caption').textContent = caption?.text ?? '';
  part('readout').textContent = `#${t} · ${fmtTime(ex.prices.t[t])} UTC`;
  const warning = part('warning');
  warning.hidden = !ex.unanchored;
  warning.textContent = ex.unanchored ? 'The local server was started before the tour existed, so it cannot work out the structure from the tour\'s start: only candles and closes are shown. Restart ./build-site.ps1 -Serve.' : '';

  // The chapters and the problems change as the tour is edited, so they are redrawn when they differ.
  const fill = (el, html) => { if (el.dataset.html !== html) { el.dataset.html = html; el.innerHTML = html; } };
  fill(part('errors'), tour.errors.length ? `<div class="empty tour-errors"><b>The tour has problems</b><ul>${tour.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>` : '');
  fill(part('chapters'), tour.chapters.map((c, i) => `<a href="#Tour/${c.slug}" data-chapter="${i}">${i + 1}. ${esc(c.name)}</a>`).join(''));
  part('chapters').querySelectorAll('a').forEach(a => a.classList.toggle('active', Number(a.dataset.chapter) === s?.chapter));

  const play = document.querySelector('[data-tour-go="play"]');
  play.textContent = tour.timer ? '❚❚' : '▶';
  play.setAttribute('aria-label', tour.timer ? 'Pause (Space)' : 'Play (Space)');
  document.querySelector('[data-tour-go="edit"]').setAttribute('aria-pressed', editorOn());
  const voice = document.querySelector('[data-tour-go="voice"]'), clips = Object.keys(tour.audio ?? {}).length;
  voice.setAttribute('aria-pressed', voiceOn());
  voice.disabled = !clips;
  if (!clips) voice.title = 'No clips yet: run npm run narrate in tools/tour-video';

  // The editor marks the texts shown so far, and the one on show.
  document.querySelectorAll('#tour-editor .ed-cue').forEach((el, j) => {
    const cue = s?.cues[j], active = !!cue && cue === tour.active;
    el.classList.toggle('shown', tour.shown.includes(cue));
    if (active && !el.classList.contains('active') && tour.timer) el.scrollIntoView({ block: 'nearest' });
    el.classList.toggle('active', active);
  });
}

// One beat of a playing tour: the next text once the one on show has been read, else the next candle, else the next section.
function tourTick() {
  if (currentPage !== 'Tour' || !tour.sections.length) return pauseTour();
  const s = tourSection(), ex = tour.ex, now = performance.now(), t = cursorOf(ex);
  const reading = tour.active && now < tour.activeUntil;
  if (!reading && tour.queue.length) { showNextCue(); return refreshTour(); }
  if (t < s.until) {
    // The replay waits at a cue that has a candle; text with no candle is read while the replay runs.
    const waiting = (reading && tour.active.at != null) || tour.queue.some(c => c.at != null);
    if (waiting || now < tour.nextCandle) return;
    if (!timelineAt(ex, t + 1)) return prefetch(ex, t + 1);
    const gap = 1000 / s.speed;
    tour.nextCandle = (now - tour.nextCandle < gap ? tour.nextCandle : now) + gap;
    advanceTo(t + 1);
    return refreshTour();
  }
  if (reading) return;
  if (tour.index + 1 < tour.sections.length) return enterSection(tour.index + 1);
  pauseTour();
  tour.onEnd?.();
  tour.onEnd = null;
}

function playTour() {
  const s = tourSection();
  if (tour.index === tour.sections.length - 1 && cursorOf(tour.ex) >= s.until && !tour.queue.length) enterSection(0);
  // The text on show gets its reading time again.
  if (tour.active) tour.activeUntil = performance.now() + tour.active.hold * 1000;
  tour.timer = setInterval(tourTick, TOUR_TICK);
  updateTourPanel();
}

function pauseTour() {
  if (!tour?.timer) return;
  clearInterval(tour.timer);
  tour.timer = null;
  tour.player?.pause();
  updateTourPanel();
}

// Stepping by hand: back to the start of the section (or of the one before), or on to the next text, candle with a cue, or section.
function tourGo(action) {
  if (!tour?.sections.length) return;
  if (action === 'play') return tour.timer ? pauseTour() : playTour();
  pauseTour();
  const s = tourSection(), t = cursorOf(tour.ex);
  if (action === 'prev') return enterSection(t > s.from || tour.shown.length > 1 ? tour.index : Math.max(0, tour.index - 1));
  if (action === 'first') return enterSection(0);
  if (action === 'last') return enterSection(tour.sections.length - 1);
  if (!tour.queue.length && t >= s.until) {
    if (tour.index + 1 < tour.sections.length) enterSection(tour.index + 1);
    return;
  }
  if (!tour.queue.length) advanceTo(Math.min(s.until, ...s.cues.filter(c => !tour.fired.has(c)).map(c => c.at)));
  showNextCue();
  refreshTour();
}

async function renderTourPage(chapter) {
  const main = document.getElementById('main');
  selected.clear();
  currentPage = 'Tour';
  const show = body => {
    main.innerHTML = `<section class="term-head"><h2 data-tour="title">${esc(tour?.def.title || 'Tour')}</h2>
      <p class="remarks">A scripted replay, read from <code>tour.json</code> and changed with the editor beside the chart. Candles are numbered
      from the tour's start: the crosshair shows a candle's number.</p></section>${body}`;
    renderLayers(); wireReplayExamples(main); drawAll(currentPage);
  };

  if (!serverOn) {
    show(`<div class="empty" data-server-check>Checking for the local server…</div>`);
    return checkLocalServer();
  }
  if (!tour) {
    show('<div class="empty">Loading the tour…</div>');
    try { tour = await (tourLoading ??= loadTour()); }
    catch (e) {
      tourLoading = null;
      if (currentPage === 'Tour') show(`<div class="empty">The tour could not be loaded: ${esc(e.message)}.</div>`);
      return;
    }
    if (currentPage !== 'Tour') return;
  }

  const ex = tour.ex;
  show(`<div data-tour="errors"></div>
    <nav class="tour-chapters" aria-label="Chapters" data-tour="chapters"></nav>
    <article class="example replay-big" id="ex-${esc(ex.id)}">
      <header><h3 data-tour="chapter"></h3><span class="id" data-tour="where"></span></header>
      ${chartRow(ex)}
      <div class="tour-caption" data-tour="caption" aria-live="polite"></div>
      <div class="tour-controls" role="group" aria-label="Tour controls">
        <button type="button" data-tour-go="prev" title="Back to the start of this section, or of the one before (←)" aria-label="Back">⏮</button>
        <button type="button" class="play" data-tour-go="play" title="Play or pause (Space)">▶</button>
        <button type="button" data-tour-go="next" title="On to the next text, candle with a cue, or section (→)" aria-label="Next">⏭</button>
        <span class="readout" data-tour="readout"></span>
        <span class="keys">Keys: ← → step · Home End first last · Space play</span>
        <button type="button" data-tour-go="voice" title="Read each text aloud from its clip in tour-audio, made by tools/tour-video">Voice</button>
        <button type="button" class="edit" data-tour-go="edit" title="Show or hide the editor">Editor</button>
      </div>
      <div class="tour-warning" data-tour="warning" hidden></div>
    </article>`);
  main.querySelectorAll('[data-tour-go]').forEach(b => b.addEventListener('click', () =>
    b.dataset.tourGo === 'edit' ? toggleTourEditor() : b.dataset.tourGo === 'voice' ? toggleTourVoice() : tourGo(b.dataset.tourGo)));
  editorSection = -1;
  const wanted = tour.chapters.find(c => c.slug === chapter), first = wanted ? wanted.section : tour.index;
  // Opening the page shows its section's view at once, with no zoom to it.
  tour.view = tour.sections[first]?.view ?? tour.view;
  tour.zoom = null;
  seekTour(first);
  if (tour.wanted.length) resolveTour();
}

// ---- Tour editor -----------------------------------------------------------------------------------------------------
// Beside the chart, where the event log is on other pages: the tour's definition as a form. It shows the section the tour
// is at, so what is edited is what is on the chart, and every change is applied at once. The layer buttons set the layers
// of that section. Save writes tour.json back through the local server.
// The section the tour is at is open in the editor unless it has been folded away, which lasts until a section is picked.
let editorSection = -1, editorFolded = false;
const editorOn = () => state.tourEditor !== false && !videoMode;
const tourDirty = () => !!tour && JSON.stringify(tour.def) !== tour.saved;
const TOUR_KEYS = { tour: ['title', 'dataset', 'start', 'sections'], start: ['time', 'view', 'speed', 'layers'],
  section: ['chapter', 'layers', 'add', 'remove', 'from', 'until', 'view', 'speed', 'cues'], cue: ['at', 'on', 'place', 'text', 'hold', 'keep'] };

// tour.json as text: a line for each text and for each of a section's settings, so a change shows as a small diff.
function formatTour(def) {
  const ordered = (o, keys) => [...keys.filter(k => k in o), ...Object.keys(o).filter(k => !keys.includes(k))].map(k => [k, o[k]]);
  const inline = (v, keys = []) => Array.isArray(v) ? `[${v.map(x => inline(x)).join(', ')}]`
    : v && typeof v === 'object' ? (Object.keys(v).length ? `{ ${ordered(v, keys).map(([k, x]) => `${JSON.stringify(k)}: ${inline(x)}`).join(', ')} }` : '{}')
    : JSON.stringify(v);
  const lines = (entries, pad) => entries.map(([k, text]) => `${pad}${JSON.stringify(k)}: ${text}`).join(',\n');
  const list = (items, pad, each) => items.length ? `[\n${items.map(each).join(',\n')}\n${pad}]` : '[]';
  const section = s => `    {\n${lines(ordered(s, TOUR_KEYS.section).map(([k, v]) =>
    [k, k === 'cues' && Array.isArray(v) ? list(v, '      ', c => `        ${inline(c, TOUR_KEYS.cue)}`) : inline(v)]), '      ')}\n    }`;
  return `{\n${lines(ordered(def, TOUR_KEYS.tour).map(([k, v]) =>
    [k, k === 'sections' && Array.isArray(v) ? list(v, '  ', section) : inline(v, k === 'start' ? TOUR_KEYS.start : [])]), '  ')}\n}\n`;
}

// How long a section takes to play: the replay waits at each text that has a candle, and the rest is read while it runs.
function sectionSeconds(s) {
  const sum = cues => cues.reduce((n, c) => n + c.hold, 0);
  return sum(s.cues.filter(c => c.at != null)) + Math.max((s.until - s.from) / s.speed, sum(s.cues.filter(c => c.at == null)));
}

function renderTourEditor() {
  const box = document.getElementById('tour-editor');
  if (!tour || currentPage !== 'Tour' || !editorOn()) { box.innerHTML = ''; editorSection = -1; return; }
  const { def, sections } = tour, start = def.start ?? {};
  editorSection = tour.index;
  const value = v => esc(v ?? '');
  const options = (list, current) => list.map(([v, label]) => `<option value="${esc(v)}" ${String(current ?? '') === String(v) ? 'selected' : ''}>${esc(label)}</option>`).join('');
  // The first and last candle shown. Left empty, the view is as before, which the boxes then say.
  const viewBoxes = (scope, view, before, otherwise = 'as before') => [['View from candle', 0], ['View to candle', 1]].map(([label, k]) =>
    `<label>${label}<input type="number" min="0" step="1" data-scope="${scope}" data-field="view${k}" placeholder="#${before[k]}, ${otherwise}" value="${value(view?.[k])}"></label>`).join('');
  const ops = (kind, what) => `<span class="ed-ops">${kind === 'cue' ? `<button type="button" data-ed="cue-copy" title="Add a copy of this text after it">Copy</button>` : ''}` +
    `<button type="button" data-ed="${kind}-up" title="Move this ${what} up" aria-label="Move this ${what} up">↑</button>` +
    `<button type="button" data-ed="${kind}-down" title="Move this ${what} down" aria-label="Move this ${what} down">↓</button>` +
    `<button type="button" data-ed="${kind}-delete" title="Delete this ${what}" aria-label="Delete this ${what}">✕</button></span>`;
  const pick = (field, what) => `<button type="button" data-ed="pick" data-pick="${field}" title="Pick ${what} on the chart">Pick</button>`;
  const head = i => `<span class="ed-num">${i + 1}</span><span class="ed-name" data-ed-name></span><span class="ed-meta" data-ed-meta></span>`;
  const layerName = id => { const l = LAYERS.find(x => x.id === id); return l?.level !== undefined ? `level ${l.level}` : l?.label ?? id; };

  // A candle given as an event shows the candle it was found at, and says so; typing a number replaces the event.
  const numberOr = v => typeof v === 'number' ? v : '';
  const eventBox = spec => spec ? ` class="ed-event" title="${esc(spec)}"` : '';
  const cueCard = (c, j, compiled) => {
    const pinned = c.on != null;
    return `<div class="ed-cue" data-cue="${j}">
      <div class="ed-meta" data-ed-cue></div>
      <textarea data-scope="cue" data-field="text" placeholder="Text" aria-label="Text ${j + 1}">${value(c.text)}</textarea>
      <div class="ed-row">
        <label>At candle<span class="ed-pick"><input type="number" min="0" step="1" data-scope="cue" data-field="at" data-type="number" placeholder="${esc(compiled?.atSpec ?? 'start')}" value="${numberOr(c.at)}"${eventBox(compiled?.atSpec)}>${pick('at', 'the candle')}</span></label>
        <label>Pinned to<select data-scope="cue" data-field="on" data-type="auto" data-render>${options([['', 'not pinned'], ['open', 'open'], ['high', 'high'], ['low', 'low'], ['close', 'close'],
          ...(typeof c.on === 'number' ? [[c.on, `price ${c.on}`]] : [])], c.on)}</select></label>
        <label>Side<select data-scope="cue" data-field="place" ${pinned ? '' : 'disabled'}>${options([['', 'auto'], ['above', 'above'], ['below', 'below'], ['left', 'left'], ['right', 'right']], c.place)}</select></label>
        <label>Seconds<input type="number" min="0" step="0.5" data-scope="cue" data-field="hold" data-type="number" placeholder="${readingSeconds(c.text ?? '').toFixed(1)}" value="${value(c.hold)}"></label>
        <label>Pin stays<select data-scope="cue" data-field="keep" ${pinned ? '' : 'disabled'}>${options([['', 'this section'], ['chapter', 'this chapter'], ['always', 'to the end']], c.keep === 'section' ? '' : c.keep)}</select></label>
        ${ops('cue', 'text')}
        ${j ? `<span class="ed-split"><button type="button" data-ed="cue-split" title="Start a new section with this text and those after it, so it can have layers of its own">Split the section here</button></span>` : ''}
      </div>
    </div>`;
  };

  const openCard = (d, i) => {
    const s = sections[i], before = i ? sections[i - 1] : null, was = before?.layers ?? tour.startLayers;
    const chips = [...s.layers.map(id => `<span class="ed-chip${was.includes(id) ? '' : ' added'}">${was.includes(id) ? '' : '+ '}${esc(layerName(id))}</span>`),
      ...was.filter(id => !s.layers.includes(id)).map(id => `<span class="ed-chip removed">${esc(layerName(id))}</span>`)];
    return `<section class="ed-card open" data-section="${i}">
      <header><button type="button" class="ed-fold" data-ed="section-fold" aria-expanded="true" title="Fold this section away">${head(i)}</button>${ops('section', 'section')}</header>
      <div class="ed-grid">
        <label class="wide">Chapter<input data-scope="section" data-field="chapter" placeholder="${before ? `continues ${esc(tour.chapters[before.chapter]?.name ?? 'the section before')}` : 'Name a chapter to start one'}" value="${value(d.chapter)}"></label>
        <label>Runs from candle<span class="ed-pick"><input type="number" min="0" step="1" data-scope="section" data-field="from" data-type="number" placeholder="${esc(s.fromSpec ?? `#${before?.until ?? 0}, as before`)}" value="${numberOr(d.from)}"${eventBox(s.fromSpec)}>${pick('from', 'the first candle')}</span></label>
        <label>Runs to candle<span class="ed-pick"><input type="number" min="0" step="1" data-scope="section" data-field="until" data-type="number" placeholder="${esc(s.untilSpec ?? `stays at #${s.from}`)}" value="${numberOr(d.until)}"${eventBox(s.untilSpec)}>${pick('until', 'the last candle')}</span></label>
        ${viewBoxes('section', d.view, before?.view ?? tour.startView)}
        <label>Candles a second<input type="number" min="0.5" step="0.5" data-scope="section" data-field="speed" data-type="number" placeholder="${before?.speed ?? start.speed ?? 4}" value="${value(d.speed)}"></label>
        <span class="ed-use"><button type="button" data-ed="view-chart" title="Zoom or pan the chart to what this section should show, then press this">Use the chart's view</button></span>
      </div>
      <div class="ed-layers"><span>Layers</span>${chips.join('') || '<span class="ed-chip">none</span>'}<span class="ed-hint">Set with the layer buttons on the left.</span></div>
      ${(d.cues ?? []).map((c, j) => cueCard(c, j, s.cues[j])).join('')}
      <div class="ed-foot"><button type="button" data-ed="add-cue">+ Text</button><button type="button" data-ed="add-section">+ Section after</button>
        <button type="button" data-ed="section-copy" title="Add a copy of this section after it">Duplicate</button>
        <button type="button" data-ed="play-here" title="Play from the start of this section">▶ From here</button></div>
    </section>`;
  };

  // The tour's own settings fold away like a section, as they are seldom changed.
  const tourHead = `<span class="ed-num">Tour</span><span class="ed-name chapter" data-ed-title></span><span class="ed-meta" data-ed-total></span>`;
  const tourCard = state.tourCardOpen
    ? `<section class="ed-card">
        <button type="button" class="ed-fold" data-ed="tour-card" aria-expanded="true" title="Fold the tour's settings away">${tourHead}</button>
        <div class="ed-grid">
          <label class="wide">Title<input data-scope="tour" data-field="title" value="${value(def.title)}"></label>
          <label class="wide">Starts at (candle #0, UTC)<input type="datetime-local" step="3600" data-scope="start" data-field="time" data-commit value="${value(start.time)}"></label>
          ${viewBoxes('start', start.view, DEFAULT_VIEW, 'if left empty')}
          <label>Candles a second<input type="number" min="0.5" step="0.5" data-scope="start" data-field="speed" data-type="number" placeholder="4" value="${value(start.speed)}"></label>
        </div></section>`
    : `<button type="button" class="ed-section" data-ed="tour-card" aria-expanded="false" title="Show the tour's settings">${tourHead}</button>`;

  box.innerHTML = `<div class="ed-head"><h4>Tour editor</h4>
      <button type="button" data-ed="undo" title="Undo the last change">Undo</button>
      <button type="button" data-ed="revert" title="Load tour.json again, dropping what is not saved (Undo brings it back)">Revert</button>
      <button type="button" data-ed="save" title="Save to tour.json (Ctrl+S)">Save</button></div>
    <div class="ed-status" data-ed-status aria-live="polite"></div>
    <div class="ed-body">
      ${tourCard}
      ${(def.sections ?? []).map((d, i) => i === tour.index && !editorFolded ? openCard(d, i)
        : `<button type="button" class="ed-section${i === tour.index ? ' current' : ''}" data-ed="go" data-section="${i}" aria-expanded="false" title="${i === tour.index ? 'Open this section' : 'Go to this section'}">${head(i)}</button>`).join('')}
      ${sections.length ? '' : '<button type="button" data-ed="add-section">+ Section</button>'}
    </div>`;
  updateEditorMeta();
  updateEditorStatus();
  updateTourPanel();
}

// The names, candles and running times shown on the section cards, which change as the tour is edited.
function updateEditorMeta() {
  document.querySelectorAll('#tour-editor [data-section]').forEach(card => {
    const i = Number(card.dataset.section), d = tour.def.sections[i], s = tour.sections[i];
    if (!d || !s) return;
    const name = card.querySelector('[data-ed-name]');
    name.textContent = d.chapter || `↳ ${d.cues?.find(c => c.on == null && c.text)?.text ?? 'no text yet'}`;
    name.classList.toggle('chapter', !!d.chapter);
    card.querySelector('[data-ed-meta]').textContent = `#${s.from}${s.until > s.from ? ` → #${s.until}` : ''} · ${Math.round(sectionSeconds(s))}s`;
  });
  // A text's settings are folded away until it is being edited, so each says when it appears and for how long.
  document.querySelectorAll('#tour-editor [data-ed-cue]').forEach((el, j) => {
    const c = tourSection()?.cues[j];
    if (c) el.textContent = `${j + 1} · ${c.at != null ? `at #${c.at}` : 'as the section begins'}${c.on != null ? ` · pinned to ${typeof c.on === 'number' ? c.on : `the ${c.on}`}` : ''} · ${c.hold.toFixed(1)}s`;
  });
  const total = document.querySelector('[data-ed-total]'), seconds = Math.round(tour.sections.reduce((n, s) => n + sectionSeconds(s), 0));
  if (total) total.textContent = `${tour.sections.length} section${tour.sections.length === 1 ? '' : 's'} · ${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
  const title = document.querySelector('[data-ed-title]');
  if (title) title.textContent = tour.def.title || 'no title yet';
}

function updateEditorStatus() {
  document.body.classList.toggle('picking', !!tour?.picking);
  const status = document.querySelector('[data-ed-status]');
  if (!status) return;
  const problems = tour.errors.length, dirty = tourDirty();
  status.textContent = tour.picking ? 'Click a candle on the chart. Esc cancels.'
    : tour.resolving ? 'Looking up the events the tour waits for…'
    : tour.note || (problems ? `${problems} problem${problems === 1 ? '' : 's'}, listed above the chart` : dirty ? 'Changes not saved' : 'Saved in tour.json');
  status.classList.toggle('warn', !tour.picking && (!!tour.note || problems > 0));
  const save = document.querySelector('[data-ed="save"]');
  save.disabled = !dirty;
  save.classList.toggle('dirty', dirty);
  document.querySelector('[data-ed="undo"]').disabled = !tour.history.length;
  document.querySelectorAll('[data-ed="pick"]').forEach(b => b.setAttribute('aria-pressed',
    tour.picking?.field === b.dataset.pick && (b.dataset.pick !== 'at' || tour.picking.cue === Number(b.closest('.ed-cue')?.dataset.cue))));
}

function toggleTourVoice() {
  state.tourVoice = !voiceOn();
  save(state);
  if (!voiceOn()) tour?.player?.pause();
  updateTourPanel();
}

function toggleTourEditor() {
  state.tourEditor = !editorOn();
  save(state);
  document.body.classList.toggle('editing', editorOn());
  renderTourEditor();
  drawAll('Tour');
  updateTourPanel();
}

// Keeps the definition as it is before a change, for Undo. Typing in one box is one change.
function rememberTour(key = null) {
  if (key && key === tour.lastEdit) return;
  tour.history.push(JSON.stringify(tour.def));
  if (tour.history.length > 200) tour.history.shift();
  tour.lastEdit = key;
}

// Applies the definition as it now is: works the sections out again, then puts the tour back where it was, at the start or
// end of its section, or where one of the section's texts appears.
function applyTour({ render = false, cue = null, end = false, start = false } = {}) {
  pauseTour();
  const was = { t: cursorOf(tour.ex), shown: tour.shown.length };
  tour.note = '';
  anchorTour();
  Object.assign(tour, compileTour(tour.def, tour.ex.prices.t.length, tour.resolved, tour.audio));
  if (render) editorSection = -1;
  seekTour(tour.index, start ? {} : end ? { t: Infinity, shown: Infinity } : cue != null ? { cue } : was);
  updateEditorMeta();
  updateEditorStatus();
  if (tour.wanted.length) resolveTour();
}

function editTourField(el) {
  const cueEl = el.closest('.ed-cue'), j = cueEl ? Number(cueEl.dataset.cue) : null, { scope, field, type } = el.dataset, def = tour.def;
  rememberTour(`${scope}|${tour.index}|${j}|${field}`);
  const target = scope === 'tour' ? def : scope === 'start' ? (def.start ??= {}) : scope === 'cue' ? def.sections[tour.index].cues[j] : def.sections[tour.index];
  const raw = el.value, value = raw !== '' && (type === 'number' || (type === 'auto' && /^\d+(\.\d+)?$/.test(raw))) ? Number(raw) : raw;
  if (field === 'view0' || field === 'view1') {
    // The two boxes of a view are one setting: with both empty it is left out, and with one empty that end is as before.
    const read = k => { const v = el.closest('.ed-grid').querySelector(`[data-field="view${k}"]`).value; return v === '' ? null : Number(v); };
    const first = read(0), last = read(1), before = scope === 'start' ? DEFAULT_VIEW : tour.index ? tour.sections[tour.index - 1].view : tour.startView;
    if (first == null && last == null) delete target.view; else target.view = [first ?? before[0], last ?? before[1]];
  }
  // An empty box leaves the setting out, so it is as before; a text stays, empty, until it is written.
  else if ((value === '' && field !== 'text') || Number.isNaN(value)) delete target[field]; else target[field] = value;
  if (field === 'text') cueEl.querySelector('[data-field="hold"]').placeholder = readingSeconds(value).toFixed(1);
  applyTour(scope === 'cue' ? { cue: j, render: el.hasAttribute('data-render') } : { end: field === 'until', start: field === 'from' });
  // Where the change redrew the editor, the box that was being used is found again: a text's settings only show once
  // the text has the focus.
  if (!el.isConnected && cueEl) focusCue(j);
  if (!el.isConnected) document.querySelector(`#tour-editor ${cueEl ? `.ed-cue[data-cue="${j}"] ` : ''}[data-scope="${scope}"][data-field="${field}"]`)?.focus();
}

// The layer buttons, while the editor is open, set the layers of the section the tour is at: written as what the section
// adds to the layers before it and what it takes away.
function recordTourLayers() {
  const s = tour?.sections[tour.index];
  if (!s || !editorOn() || tour.picking) return;
  const wanted = tourLayers.filter(id => id !== 'replay'), before = tour.index ? tour.sections[tour.index - 1].layers : tour.startLayers;
  if (wanted.length === s.layers.length && wanted.every(id => s.layers.includes(id))) return;
  const d = tour.def.sections[tour.index], name = id => LAYER_NAMES[id] ?? id;
  const add = wanted.filter(id => !before.includes(id)).map(name), remove = before.filter(id => !wanted.includes(id)).map(name);
  rememberTour(`layers|${tour.index}`);
  delete d.layers;
  if (add.length) d.add = add; else delete d.add;
  if (remove.length) d.remove = remove; else delete d.remove;
  applyTour({ render: true });
}

// Picking a candle on the chart for a section's first or last candle or a text's candle, in place of typing its number.
function pickFromChart(field, cue = null) {
  pauseTour();
  const same = tour.picking?.field === field && tour.picking.cue === cue;
  tour.picking = same ? null : { field, cue };
  seekTour(tour.index, { t: cursorOf(tour.ex), shown: tour.shown.length });
  updateEditorStatus();
}

function pickCandle(i) {
  const { field, cue } = tour.picking, d = tour.def.sections[tour.index];
  tour.picking = null;
  rememberTour();
  if (field === 'at') d.cues[cue].at = i; else d[field] = i;
  applyTour(field === 'at' ? { render: true, cue } : { render: true, end: field === 'until', start: field === 'from' });
  if (cue != null) focusCue(cue);
}

const focusCue = j => document.querySelectorAll('#tour-editor .ed-cue textarea')[j]?.focus();

// The candle under the pointer, by its number in the tour.
function candleAt(el, e) {
  const p = plotPoint(el, e), view = views.get(el.dataset.id);
  if (!p?.onPlot || !view) return null;
  const [from, to] = el._fullLayout.xaxis.range.map(axisTime), at = from + (to - from) * p.x / p.w;
  return view.from + view.t.reduce((best, v, i) => Math.abs(v - at) < Math.abs(view.t[best] - at) ? i : best, 0);
}

async function saveTour() {
  if (!tourDirty()) return;
  const def = JSON.stringify(tour.def);
  const response = await fetch('api/tour', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: formatTour(tour.def) }).catch(() => null);
  if (response?.ok) tour.saved = def;
  tour.note = response?.ok ? '' : response?.status === 404 || response?.status === 405
    ? 'Not saved: the local server was started before the editor existed. Restart ./build-site.ps1 -Serve.' : 'Not saved: the local server did not take it.';
  updateEditorStatus();
}

async function revertTour() {
  const def = await fetch('tour.json', { cache: 'no-store' }).then(r => r.json()).catch(() => null);
  if (!def) { tour.note = 'tour.json could not be loaded.'; return updateEditorStatus(); }
  rememberTour();
  tour.def = def;
  tour.saved = JSON.stringify(def);
  applyTour({ render: true, start: true });
}

function tourAction(action, el) {
  const def = tour.def, i = tour.index, sections = def.sections ??= [], d = sections[i];
  const cueEl = el.closest('.ed-cue'), j = cueEl ? Number(cueEl.dataset.cue) : null;
  // Swaps two neighbours of a list, when both are there.
  const swap = (list, a, b) => b >= 0 && b < list.length && ([list[a], list[b]] = [list[b], list[a]]);
  switch (action) {
    case 'go': {
      const to = Number(el.dataset.section), here = to === tour.index;
      editorFolded = false;
      if (here) return renderTourEditor();
      pauseTour();
      return enterSection(to);
    }
    case 'section-fold':
      editorFolded = true;
      return renderTourEditor();
    case 'play-here': pauseTour(); enterSection(i); return playTour();
    case 'save': return saveTour();
    case 'revert': return revertTour();
    case 'undo': {
      const before = tour.history.pop();
      if (!before) return;
      tour.def = JSON.parse(before);
      tour.lastEdit = null;
      return applyTour({ render: true });
    }
    case 'pick': return pickFromChart(el.dataset.pick, j);
    case 'tour-card':
      state.tourCardOpen = !state.tourCardOpen;
      save(state);
      return renderTourEditor();
    case 'view-chart': {
      // The candles across the chart as it has been zoomed or panned to become the section's view.
      const ex = tour.ex, chart = document.querySelector('#main .chart'), view = views.get(ex.id);
      if (!d || !view || !chart?._fullLayout) return;
      const [from, to] = chart._fullLayout.xaxis.range.map(axisTime);
      const first = indexAtOrAfter(ex, from + view.candle / 2), last = Math.max(first + 1, indexAtOrBefore(ex, to - view.candle / 2));
      rememberTour();
      d.view = [first, last];
      zooms.delete(ex.id);
      return applyTour({ render: true });
    }
    case 'add-section':
      rememberTour();
      sections.splice(sections.length ? i + 1 : 0, 0, { cues: [{ text: '' }] });
      tour.index = sections.length === 1 ? 0 : i + 1;
      applyTour({ render: true, start: true });
      return document.querySelector('#tour-editor .ed-cue textarea')?.focus();
    case 'section-delete':
      rememberTour();
      sections.splice(i, 1);
      tour.index = Math.max(0, Math.min(i, sections.length - 1));
      return applyTour({ render: true, start: true });
    case 'section-up': case 'section-down': {
      const to = i + (action === 'section-up' ? -1 : 1);
      if (to < 0 || to >= sections.length) return;
      rememberTour();
      swap(sections, i, to);
      tour.index = to;
      return applyTour({ render: true, start: true });
    }
    case 'add-cue':
      rememberTour();
      (d.cues ??= []).push({ text: '' });
      applyTour({ render: true, cue: d.cues.length - 1 });
      return focusCue(d.cues.length - 1);
    case 'section-copy': {
      // The copy carries on the chapter, rather than starting another of the same name.
      rememberTour();
      const { chapter, ...copy } = JSON.parse(JSON.stringify(d));
      sections.splice(i + 1, 0, copy);
      tour.index = i + 1;
      return applyTour({ render: true, start: true });
    }
    case 'cue-split': {
      // The text and those after it become a section of their own, straight after this one. It has the same layers, view
      // and speed until they are changed. A text at a candle inside the section's run splits the run there as well.
      rememberTour();
      const next = { cues: d.cues.splice(j) }, at = next.cues[0].at, s = tourSection();
      if (at != null && at > s.from && at < s.until) { next.until = d.until; d.until = at; }
      sections.splice(i + 1, 0, next);
      tour.index = i + 1;
      applyTour({ render: true, start: true });
      return focusCue(0);
    }
    case 'cue-copy':
      rememberTour();
      d.cues.splice(j + 1, 0, JSON.parse(JSON.stringify(d.cues[j])));
      applyTour({ render: true, cue: j + 1 });
      return focusCue(j + 1);
    case 'cue-delete':
      rememberTour();
      d.cues.splice(j, 1);
      return applyTour({ render: true });
    case 'cue-up': case 'cue-down': {
      const to = j + (action === 'cue-up' ? -1 : 1);
      if (to < 0 || to >= d.cues.length) return;
      rememberTour();
      swap(d.cues, j, to);
      applyTour({ render: true, cue: to });
      return focusCue(to);
    }
  }
}

{
  const box = document.getElementById('tour-editor');
  // A box is applied as it is typed in; the start time only once it is complete.
  box.addEventListener('input', e => { const el = e.target.closest('[data-field]'); if (el && !el.hasAttribute('data-commit')) editTourField(el); });
  box.addEventListener('change', e => { const el = e.target.closest('[data-field][data-commit]'); if (el) editTourField(el); });
  box.addEventListener('click', e => { const b = e.target.closest('[data-ed]'); if (b && !b.disabled) tourAction(b.dataset.ed, b); });
  // Going into one of a text's boxes shows that text on the chart.
  box.addEventListener('focusin', e => {
    const cueEl = e.target.closest('.ed-cue'), cue = cueEl && tourSection()?.cues[Number(cueEl.dataset.cue)];
    if (!cue || !e.target.matches('[data-field]') || cue === tour.active) return;
    pauseTour();
    seekTour(tour.index, { cue: Number(cueEl.dataset.cue) });
  });

  // A click on the chart picks a candle; a drag still pans. Plotly covers the page while the button is down, so the
  // release is caught on the window.
  let down = null;
  window.addEventListener('pointerdown', e => { down = tour?.picking && e.target.closest?.('.chart') ? [e.clientX, e.clientY] : null; }, true);
  window.addEventListener('pointerup', e => {
    const chart = document.querySelector('#main .chart'), from = down;
    down = null;
    if (!from || !tour?.picking || !chart || currentPage !== 'Tour' || Math.hypot(e.clientX - from[0], e.clientY - from[1]) > 4) return;
    const i = candleAt(chart, e);
    if (i != null) pickCandle(i);
  }, true);

  document.addEventListener('keydown', e => {
    if (currentPage !== 'Tour' || !tour) return;
    if (e.key === 'Escape' && tour.picking) { e.preventDefault(); pickFromChart(tour.picking.field, tour.picking.cue); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && editorOn()) { e.preventDefault(); saveTour(); }
  });
  window.addEventListener('beforeunload', e => { if (tourDirty()) e.preventDefault(); });
}

function renderStructure() {
  const main = document.getElementById('main');
  const examples = DATA.structure?.examples ?? [];
  selected.clear();

  currentPage = 'Sawtooth';
  let html = `<section class="term-head">
    <h2>Sawtooth levels</h2>
    ${DATA.structure?.summary ? `<p>${prose(DATA.structure.summary)}</p>` : ''}
    <p class="remarks">The dashed line is the incomplete final leg, ending at the latest price. Until a new high breaks structure, it is treated as a presumed downleg.
    Labels compare each pivot with the previous one of the same kind: HH or LH for highs, HL or LL for lows, EQH or EQL when equal.</p>
  </section>`;

  if (!examples.length) html += '<div class="empty">No sawtooth examples.</div>';
  for (const ex of examples) {
    html += `<article class="example" id="ex-${esc(ex.id)}">
      <header><h3>${esc(ex.title)}</h3><span class="id">${esc(ex.id)} · ${ex.sawtooth.length} levels</span></header>
      ${ex.description ? `<p>${prose(ex.description)}</p>` : ''}
      ${chartRow(ex)}
    </article>`;
  }
  main.innerHTML = html;
  renderLayers();
  wireReplayExamples(main);
  drawAll('Sawtooth');
}

const swingKey = s => `swing|${s.level}|${s.direction}|${s.start}`;
const swingId = s => `${swingKey(s)}|${s.break}|${s.parent ?? ''}`;

function swingTreeTable(ex) {
  const detected = new Set(ex.detected.map(swingId));
  const expected = new Set(ex.expected.map(swingId));
  const rows = [
    ...ex.detected.map(s => ({ s, status: expected.has(swingId(s)) ? 'matched' : 'extra' })),
    ...ex.expected.filter(s => !detected.has(swingId(s))).map(s => ({ s, status: 'missing' })),
  ];
  const interims = s => ex.detected.filter(x => x.level === s.level + 1 && x.parent === s.start).length;
  return `<details open><summary>Expected swing tree (${ex.expected.length}) · asserted by the example test · click a row to pick out a swing and its interims</summary>
    <table><tr><th>Swing</th><th>Start (UTC)</th><th>Break (UTC)</th><th>Interims</th><th>Status</th></tr>
    ${rows.map(({ s, status }) => `<tr class="pick" tabindex="0" data-ex="${esc(ex.id)}" data-key="${esc(swingKey(s))}">
      <td style="padding-left:${(s.level - ex.level) * 22}px">${s.level > ex.level ? '└ ' : ''}${s.direction === 'Up' ? 'Upswing ↑' : 'Downswing ↓'} <span class="id">level ${s.level}</span></td>
      <td>${esc(fmtTime(s.start))}</td><td>${esc(fmtTime(s.break))}</td><td>${interims(s) || ''}</td>
      <td class="${status === 'matched' ? '' : 'miss'}">${status}</td></tr>`).join('')}
    </table></details>`;
}

function renderInterims() {
  const main = document.getElementById('main');
  const examples = DATA.interims?.examples ?? [];
  selected.clear();

  currentPage = 'InterimSwings';
  let html = `<section class="term-head">
    <h2>Interim swings</h2>
    ${DATA.interims?.summary ? `<p>${prose(DATA.interims.summary)}</p>` : ''}
    <p class="remarks">A swing at one sawtooth level is built from swings one level finer: its interim swings, drawn lighter inside it.
    Click a row to pick out a swing and its interims. Each sawtooth level shown brings its own swings, so turn on a finer level to see the next generation.</p>
  </section>`;

  if (!examples.length) html += '<div class="empty">No interim swing examples. Add a CSV and sidecar under <code>TestData/Structure/InterimSwings/</code>.</div>';
  for (const ex of examples) {
    const badges = [
      ex.reviewed ? '<span class="badge ok">Reviewed</span>' : '<span class="badge warn" title="Expected values were captured from the detector and not yet checked by a human">Unreviewed</span>',
      ex.matches ? '' : '<span class="badge bad">Detector differs from expected</span>',
    ].join('');
    html += `<article class="example" id="ex-${esc(ex.id)}">
      <header><h3>${esc(ex.title)}</h3>${badges}<span class="id">${esc(ex.id)} · level ${ex.level} · depth ${ex.depth}</span></header>
      ${ex.description ? `<p>${prose(ex.description)}</p>` : ''}
      ${chartRow(ex)}
      ${swingTreeTable(ex)}
    </article>`;
  }
  main.innerHTML = html;

  renderLayers();
  wireReplayExamples(main);
  main.querySelectorAll('tr.pick').forEach(row => {
    row.addEventListener('click', () => toggleSelection(row, currentPage));
    row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSelection(row, currentPage); } });
  });
  drawAll(currentPage);
}

function route() {
  stopPlaying();
  pauseTour();
  let type = decodeURIComponent(location.hash.slice(1));
  // The tour's chapters have links of their own: #Tour/<chapter>.
  const [page, chapter] = type.split('/');
  document.body.classList.toggle('touring', page === 'Tour');
  document.body.classList.toggle('video', page === 'Tour' && videoMode);
  document.body.classList.toggle('editing', page === 'Tour' && editorOn());
  if (page === 'Tour') {
    renderNav('Tour');
    renderTourPage(chapter);
    window.scrollTo(0, 0);
    return;
  }
  if (STRUCTURE_PAGES.includes(type)) {
    renderNav(type);
    if (type === 'Sawtooth') renderStructure(); else if (type === 'Replay') renderReplayPage(); else renderInterims();
    window.scrollTo(0, 0);
    return;
  }
  if (!TERMS.has(type)) type = (DATA.terms.find(t => examplesFor(t.type).length) || DATA.terms[0] || {}).type;
  renderNav(type);
  renderTerm(type);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => route());
route();
</script>
