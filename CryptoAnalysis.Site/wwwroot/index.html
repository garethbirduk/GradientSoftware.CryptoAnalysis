function wirePlayerPanel(root) {
  const panel = root.querySelector('[data-player]');
  panel.addEventListener('click', e => {
    const write = e.target.closest('[data-player-write]')?.dataset.playerWrite;
    if (write) return toggleKind(write === 'education');
    const go = e.target.closest('[data-tour-go]')?.dataset.tourGo;
    if (!go) return;
    if (go === 'edit') toggleTourEditor();
    else if (go === 'voice') toggleTourVoice();
    else if (go === 'glossary') toggleTourGlossary();
    else if (go === 'video') generateTour();
    else if (go === 'similar') { pauseTour(); openSimilar(); }
    // Close closes the tab the Replay page opened; a tab opened by hand cannot be closed from within, and goes to Replay.
    else if (go === 'close') { pauseTour(); window.close(); setTimeout(() => { location.hash = '#Replay'; }, 300); }
    else tourGo(go);
  });
  panel.querySelector('[data-tour="pace"]').addEventListener('input', e => setTourPace(e.target.value));
  panel.querySelector('[data-tour="caption"]').addEventListener('click', nextText);
  const scrub = panel.querySelector('[data-tour="scrub"]');
  scrub.addEventListener('input', e => scrubTour(Number(e.target.value)));
  // Let go, or a key pressed on it: the player plays on if it was playing.
  scrub.addEventListener('change', () => { if (tour?.playAfterScrub) { tour.playAfterScrub = false; playTour(); } });
  // While it is held, the slider is where the hand puts it, not where the player is.
  scrub.addEventListener('pointerdown', () => { scrubbing = true; });
  panel.querySelector('[data-tour="autonext"]').addEventListener('change', e => { state.tourAutoNext = e.target.checked; save(state); });
  // The chapters: in the panel on the Analysis page, above the chart on the Tour page.
  const chapters = root.querySelector('[data-tour="chapters"]');
  chapters?.addEventListener('change', e => { const box = e.target.closest('[data-chapter-on]'); if (box) toggleChapter(Number(box.dataset.chapterOn), box.checked); });
  chapters?.addEventListener('click', e => {
    const add = e.target.closest('[data-add]'), jump = e.target.closest('a[data-chapter]');
    if (add) return addThing(add.dataset.add);
    if (!jump || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
    e.preventDefault();
    jumpToChapter(Number(jump.dataset.chapter));
  });
  const glossary = panel.querySelector('[data-tour="glossary"]');
  glossary?.addEventListener('input', e => { const row = e.target.closest('.gl-row'); if (row) readGlossary(`glossary|${[...row.parentElement.children].indexOf(row)}|${e.target.dataset.gl}`); });
  glossary?.addEventListener('click', e => { const b = e.target.closest('button[data-gl]'); if (b && !b.disabled) glossaryAction(b.dataset.gl, b); });
}

// Whether a chapter that has ended plays the next one, or the player pauses there.
const autoNext = () => state.tourAutoNext !== false;

// ---- Analysis -------------------------------------------------------------------------------------------------------
// An analysis is a tour the local server writes (see Explain in CryptoAnalysis.Site) of the things ticked at a candle, a
// chapter each from the candle outwards, played by the tour's own player on a chart of the Analysis page's own. A few of
// the tour's options are off: no editor, glossary or video, and no pins, as the layers mark the same places. The chart
// draws the structure as known at the Replay cursor it was seen from, a part at a time as the run reaches it (see
// liveView). Analyse tells what each thing is (Summary); Explain also what a thing of its kind is and how it works
// (Education). Unticking a thing in the checklist leaves its chapter out at once; Analyse or Explain there writes it again.
// The page's address says which analysis it is, so it can be copied and opens the same one: the dataset, the candle, the
// Replay cursor it was seen from, the things told of and the detail. An older address naming one thing by explain and
// level opens that thing.
let wantedAnalysis = null;
const analysisHash = p => `#Analysis?${new URLSearchParams({ dataset: p.dataset, at: p.at, ...(p.seen ? { seen: p.seen } : {}), things: p.things.join(','), detail: p.detail })}`;
// The level of the Trend an analysis tells of, for Find similar.
const trendLevel = t => Number(t?.params?.things.find(id => id.startsWith('Trend:'))?.split(':')[1]) || null;
// Whether an analysis has the cursor: from when it starts until it has ended. The replay controls are hidden for that long,
// and come back at its end to step on or back from there.
const analysisRuns = () => currentPage === 'Analysis' && tour?.page === 'Analysis' && !tour.ended;

async function renderAnalysisPage(query) {
  const main = document.getElementById('main');
  const explain = query?.get('explain'), things = query?.get('things')?.split(',').filter(Boolean)
    ?? (explain ? [explain === 'Candle' ? 'Candle' : `${explain}:${Number(query.get('level')) || 1}`] : null);
  if (things?.length && query.get('dataset') && query.get('at')) {
    const detail = DETAILS.includes(query.get('detail')) ? query.get('detail') : detailOf('Analysis');
    const asked = { dataset: query.get('dataset'), at: query.get('at'), ...(query.get('seen') ? { seen: query.get('seen') } : {}), things, detail };
    if (!wantedAnalysis || analysisHash(wantedAnalysis) !== analysisHash(asked)) wantedAnalysis = asked;
    if (`#Analysis?${query}` !== analysisHash(asked)) history.replaceState(null, '', analysisHash(asked));
  } else if (wantedAnalysis) history.replaceState(null, '', analysisHash(wantedAnalysis));
  const params = wantedAnalysis;
  selected.clear();
  pauseTour();
  currentPage = 'Analysis';
  const head = `<section class="term-head"><h2>Analysis</h2>
    <p>The things at a candle picked on the Replay page, a chapter each, on a chart of its own. The layers and the view here are this page's; the Replay page keeps its own.</p></section>`;
  const show = body => { main.innerHTML = head + body; renderLayers(); wireReplayExamples(main); drawAll(currentPage); };
  if (!serverOn) {
    show(`<div class="empty" data-server-check>Checking for the local server…</div>`);
    return checkLocalServer();
  }
  if (!params) return show('<div class="empty">Nothing to analyse yet. On the <a href="#Replay">Replay</a> page, click a candle, tick what to tell of, and choose Analyse or Explain.</div>');
  // The same analysis comes back as it was left; another is written afresh.
  if (tours.Analysis?.hash !== analysisHash(params)) {
    show('<div class="empty">Writing the analysis…</div>');
    let loaded;
    try { loaded = await loadAnalysis(params); }
    catch (e) {
      if (currentPage === 'Analysis' && wantedAnalysis === params) show(`<div class="empty warn">The analysis could not be written: ${esc(e.message.replace(/\.$/, ''))}.</div>`);
      return;
    }
    if (currentPage !== 'Analysis' || wantedAnalysis !== params) return;
    tours.Analysis = loaded;
  }
  tour = tours.Analysis;
  // The mode asked for is the one the next analysis opens in.
  state.detail = { ...state.detail, Analysis: params.detail };
  save(state);
  show(`<article class="example replay-big" id="ex-${esc(tour.ex.id)}">
      <header><h3 data-tour="chapter"></h3><span class="id" data-tour="where"></span></header>
      ${playerPanel('Analysis')}
      ${chartRow(tour.ex)}
    </article>`);
  wirePlayerPanel(main);
  renderAnalysisWrite();
  // Written again to add a thing, or at the other detail, it opens at that thing's chapter.
  const jumped = params.jump ? tour.sections.findIndex((s, i) => s.thing === params.jump && sectionOn(i)) : -1;
  const first = jumped >= 0 ? jumped : sectionAfter(-1, 1) ?? 0;
  tour.view = tour.sections[first]?.view ?? tour.view;
  tour.zoom = null;
  seekTour(first);
  main.querySelector('[data-player]').scrollIntoView({ block: 'start' });
  playTour();
}

// The written tour of an analysis, ready to play: the things at the candle for its checklist, the clips read so far, its
// scene on the dataset from its first candle, and the structure as known at the cursor it was seen from, fetched.
async function loadAnalysis(params) {
  // The page's Successive Candles settings say how long a run must be to count.
  const runs = { greenRuns: runMin('SuccessiveGreenCandles'), redRuns: runMin('SuccessiveRedCandles') };
  const where = { dataset: params.dataset, at: params.at, ...(params.seen ? { seen: params.seen } : {}) };
  const [r, list, audio] = await Promise.all([
    fetch(`api/explain/tour?${new URLSearchParams({ ...where, things: params.things.join(','), expanded: true, ...runs })}`, { cache: 'no-store' }),
    fetch(`api/explain/at?${new URLSearchParams({ ...where, ...runs })}`, { cache: 'no-store' }).then(x => x.ok ? x.json() : null).catch(() => null),
    fetch('tour-audio/index.json', { cache: 'no-store' }).then(x => x.ok ? x.json() : {}).catch(() => ({})),
  ]);
  const text = await r.text();
  if (!r.ok) throw new Error(r.status === 404 ? `the server has no dataset "${params.dataset}"` : text.replace(/^"|"$/g, '') || `the server answered ${r.status}`);
  const def = splitExplanations(JSON.parse(text));
  // Every text is kept at its own level: an explanation's at Education, an analysis's at Summary.
  const loaded = newPlayer(def, audio, { page: 'Analysis', idPrefix: 'Analysis', detail: 'education', params, hash: analysisHash(params), list, missing: def.missing ?? [],
    pins: false, waitForClips: true, extraLayers: (state.pages.Analysis ?? defaultsFor('Analysis')).filter(id => id !== 'replay' && !/^level\d+$/.test(id)) });
  await loadTourDatasets(loaded);
  anchorTour(loaded);
  Object.assign(loaded, compileTour(def, loaded.scenes, loaded.resolved, loaded.audio, loaded.detail));
  // The explanations are on when the analysis was asked for with Explain.
  loaded.chapters.forEach((c, i) => { if (loaded.sections[c.section].explains && params.detail !== 'education') loaded.chaptersOff.add(i); });
  // With no pins shown, a pinned text is left out altogether, so it does not hold the run for its seconds either.
  for (const s of loaded.sections) for (const c of s.cues) if (c.on != null) c.skipped = true;
  if (!loaded.sections.some(s => s.cues.some(c => !c.skipped))) throw new Error('the server wrote no texts for it');
  if (Number.isInteger(def.known)) { loaded.known = def.known; await fetchBatch(loaded.ex, loaded.known); }
  return loaded;
}

// ---- Chapters --------------------------------------------------------------------------------------------------------
// The chapters are a row of pills, the same on both pages: the name jumps to the chapter, and the tick box beside it turns
// the chapter on or off, a chapter that is off being skipped by the player and its steps. An analysis has a chapter for
// each thing it tells of, and lists the other things at its candle in their places, faded, each to add.

// An analysis's sections, each thing's in two chapters: what a thing of its kind is, from its texts at Education, then
// what this one is, from its texts at Summary. Both run through the same candles.
function splitExplanations(def) {
  const at = (cues, level) => cues.filter(c => c.texts?.[level]).map(c => ({ ...c, texts: { [level]: c.texts[level] } }));
  const word = s => s.thing?.startsWith('SuccessiveCandles') ? 'Successive Candles' : (s.chapter ?? '').split(' ').pop();
  const named = s => { const w = word(s); return w === 'Successive Candles' ? 'What are Successive Candles?' : `What is ${/^[AEIOU]|^(HH|HL|LH|LL|MSB)$/.test(w) ? 'an' : 'a'} ${w}?`; };
  def.sections = (def.sections ?? []).flatMap(s => {
    const explained = at(s.cues ?? [], 'education');
    return [...(explained.length ? [{ ...s, chapter: named(s), explains: true, cues: explained }] : []), { ...s, cues: at(s.cues ?? [], 'summary') }];
  });
  return def;
}

// The things an analysis tells of, as those with a chapter on.
const thingsOn = () => [...new Set(tour.sections.filter((s, i) => s.thing && sectionOn(i)).map(s => s.thing))];
// Whether any explanation is on: the detail the analysis is at, in its address.
const explainsOn = () => tour.chapters.some((c, i) => tour.sections[c.section].explains && !tour.chaptersOff.has(i));

// Analyse turns every analysis chapter on or off, and Explain every explanation, on only for the things whose analysis is
// on. The address then says the detail the explanations make it.
function toggleKind(explains) {
  if (tour?.page !== 'Analysis') return;
  const of = tour.chapters.map((c, i) => ({ i, s: tour.sections[c.section] })).filter(x => x.s.explains === explains);
  const analysed = new Set(tour.chapters.flatMap((c, i) => !tour.sections[c.section].explains && !tour.chaptersOff.has(i) ? [tour.sections[c.section].thing] : []));
  const anyOn = of.some(x => !tour.chaptersOff.has(x.i));
  for (const x of of) {
    if (anyOn) tour.chaptersOff.add(x.i);
    else if (!explains || analysed.has(x.s.thing)) tour.chaptersOff.delete(x.i);
  }
  const detail = explainsOn() ? 'education' : 'summary';
  wantedAnalysis = tour.params = { ...tour.params, detail };
  tour.hash = analysisHash(tour.params);
  state.detail = { ...state.detail, Analysis: detail };
  save(state);
  history.replaceState(null, '', tour.hash);
  chaptersChanged();
}

// A thing at the candle the analysis does not tell of yet: it is written again with it, and opens at its chapter.
function addThing(id) {
  if (tour?.page !== 'Analysis') return;
  wantedAnalysis = { ...tour.params, things: [...new Set([...thingsOn(), id])], detail: explainsOn() ? 'education' : 'summary', jump: id };
  history.replaceState(null, '', analysisHash(wantedAnalysis));
  renderAnalysisPage();
}

// Under an analysis's chapters: Analyse and Explain, pressed while any of their chapters is on, and what was asked for
// that is not at the candle.
function analysisWriteHtml() {
  const on = explains => tour.chapters.some((c, i) => tour.sections[c.section].explains === explains && !tour.chaptersOff.has(i));
  return `<span class="write">${ANALYSE_BUTTONS.map(([detail, label]) => `<button type="button" data-player-write="${detail}" aria-pressed="${on(detail === 'education')}"
      title="${detail === 'education' ? 'Turn on or off the explanations: what a thing of each kind is and how it works' : 'Turn on or off the analysis of each thing'}">${label}</button>`).join('')}</span>
    ${tour.missing.length ? `<span class="warn">Not at this candle as the chart had it: ${esc(tour.missing.join(', '))}</span>` : ''}`;
}

function renderAnalysisWrite() {
  const box = document.querySelector('[data-tour="things"]');
  if (box && tour?.page === 'Analysis') box.innerHTML = analysisWriteHtml();
}

// The pills: a chapter's tick box and name, the one on show marked; for an analysis, the things at the candle in their
// order, those it does not tell of faded, to add.
function chapterPills() {
  const s = tourSection(), pill = (c, i) => {
    const on = !tour.chaptersOff.has(i), explains = tour.sections[c.section]?.explains;
    return `<span class="chapter-pill${explains ? ' explains' : ''}${i === s?.chapter ? ' active' : ''}${on ? '' : ' off'}"><input type="checkbox" data-chapter-on="${i}" ${on ? 'checked' : ''} title="Play this chapter, or leave it out" aria-label="Play ${esc(c.name)}">` +
      `<a href="#Tour/${c.slug}" data-chapter="${i}" title="Go to this chapter">${tour.page === 'Tour' ? `${i + 1}. ` : ''}${esc(c.name)}</a></span>`;
  };
  if (tour.page !== 'Analysis' || !tour.list) return tour.chapters.map(pill).join('');
  return tour.list.map(t => {
    // A thing's explanation, then its analysis.
    const own = tour.chapters.flatMap((c, i) => tour.sections[c.section]?.thing === t.id ? [i] : []);
    return own.length ? own.map(i => pill(tour.chapters[i], i)).join('') : `<button type="button" class="chapter-pill add" data-add="${esc(t.id)}" title="Add this to the analysis, and go to it">+ ${esc(t.name)}</button>`;
  }).join('');
}

// Turning a chapter on or off. The chapter on show, turned off, gives way to the next that is on, playing on if it was.
function toggleChapter(i, on) {
  if (!tour) return;
  if (on) tour.chaptersOff.delete(i); else tour.chaptersOff.add(i);
  chaptersChanged();
}

function chaptersChanged() {
  if (sectionOn(tour.index) || tour.ended) return updateTourPanel();
  const was = !!tour.timer, next = sectionAfter(tour.index, 1);
  pauseTour();
  if (next == null) return tourGo('end');
  enterSection(next);
  if (was) playTour();
}

// Going to a chapter, which is turned on if it was off, playing on if it was playing.
function jumpToChapter(i) {
  const c = tour?.chapters[i];
  if (!c) return;
  const was = !!tour.timer;
  pauseTour();
  if (tour.journey) endJourney();
  tour.chaptersOff.delete(i);
  enterSection(c.section);
  if (was) playTour();
}

// A section is played while its chapter is on.
const sectionOn = i => !!tour?.sections[i] && !tour.chaptersOff?.has(tour.sections[i].chapter);

// The next section played after i going forward (by 1) or back (by -1), or null when there is none.
function sectionAfter(i, by) {
  for (let j = i + by; j >= 0 && j < (tour?.sections.length ?? 0); j += by) if (sectionOn(j)) return j;
  return null;
}

function findExample(id) {
  return DATA.examples.find(e => e.id === id) ?? DATA.structure?.examples?.find(e => e.id === id) ?? DATA.interims?.examples?.find(e => e.id === id)
    ?? replayDatasets.find(e => e.id === id) ?? tour?.scenes?.find(sc => sc.ex?.id === id)?.ex ?? (tour?.ex.id === id ? tour.ex : undefined);
}

// ---- Tour ------------------------------------------------------------------------------------------------------------
// A scripted walk through a dataset, read from tour.json: a start state, then sections that each say which layers are on,
// how far the replay runs and what text appears. A section begins where the one before it ended, so the tour plays as one
// continuous replay. Candles are numbered from the tour's start time (#0), and the structure is anchored there too.
//   start    time (the dataset time of #0), view (the first and last candle the chart shows, as [0, 168]), speed (candles
//            a second) and layers.
//   section  chapter (starts a chapter, which has a link of its own), layers (replaces the layers) or add and remove,
//            from (the candle the section starts at; without it, where the section before ended: an earlier candle takes
//            the replay back), until (the candle the replay runs to; without it the replay stays where it is), view
//            (without it, the view as before), speed, cues. A section can be come to by a journey in place of from:
//            fastForward { to, speed, draw } or rewind { to, speed, erase }. The view eases out to hold the whole way,
//            the replay runs to the candle "to" at that many candles a second, drawing or erasing as it goes, and the view
//            eases in to the section's own. With draw or erase false the replay stays where it is and only the view moves.
//            A section with explain ("Candle", "Swing" or "Trend"), at (the candle) and level (the sawtooth level, 1 unless
//            given) has its view, layers, until and texts written by the local server from the prices (see Explain in
//            CryptoAnalysis.Site); what it says for itself wins, and texts of its own follow the written ones.
//   cue      texts, a text for each level of detail it is written at ({ "summary", "education" }); the one shown is for
//            the highest level at or below the page's Detail setting, and a cue with none that low is left out. Shown
//            under the chart as the section begins; with at, when the replay reaches that candle, which waits
//            there while the text is read; with on as well ('open', 'high', 'low', 'close' or a price), pinned to that
//            point of the candle (place: 'above', 'below', 'left' or 'right'). hold is the seconds the text stays before
//            the next, by default the time it takes to read (0 moves straight on, leaving the caption up while pins show); keep is how long a pin stays: 'section', 'chapter' or 'always'.
const DEFAULT_VIEW = [0, 168];
// Candles a second of a fast forward or rewind that does not say.
const JOURNEY_SPEED = 50;
const LAYER_ALIASES = { candles: 'price', closes: 'close' };
// How the editor writes a layer whose id is not what it is called on the page.
const LAYER_NAMES = { price: 'candles' };
const PIN_PRICES = { open: 'o', high: 'h', low: 'l', close: 'c' };
const PIN_PLACES = { above: [0, -55], below: [0, 55], left: [-70, 0], right: [70, 0] };
const TOUR_TICK = 40;
// The Speed slider's paces: how fast the voice reads (its clips are played that much faster or slower, at the same pitch),
// how fast a text is read without the voice (against about 240 words a minute), how fast the candles run against the
// section's speed, and the seconds a text stays after it has been read.
const TOUR_PACES = [{ name: 'Slowest', voice: 0.8, reading: 0.6, candles: 0.35, gap: 0.8 }, { name: 'Slower', voice: 0.9, reading: 0.8, candles: 0.6, gap: 0.4 },
  { name: 'Normal', voice: 1, reading: 1, candles: 1, gap: 0.15 }, { name: 'Faster', voice: 1.1, reading: 1.3, candles: 1.6, gap: 0.05 },
  { name: 'Fastest', voice: 1.2, reading: 1.7, candles: 2.6, gap: 0 }];
const NORMAL_PACE = TOUR_PACES.find(p => p.name === 'Normal');
// The player on the page shown, and each page's own, kept while another page is shown.
let tour = null, tourLoading = null;
const tours = { Tour: null, Analysis: null };
// Opened with ?video, the page shows the tour alone, for tools/tour-video to record.
const videoMode = new URLSearchParams(location.search).has('video');

// How much a text tells, from least to most, the same names as EnumDetail in CryptoAnalysis.Site. A cue has a text for
// each level it is written at and shows the one for the highest level at or below the page's Detail setting; a cue with
// none that low is left out. The tour always tells at Education; an analysis at the detail it was written with, Analyse
// at Summary and Explain at Education, the last of which the next analysis opens in.
const DETAILS = ['summary', 'education'];
const DETAIL_NAMES = { summary: 'Summary', education: 'Education' };
const detailOf = page => page === 'Analysis' ? state.detail?.Analysis ?? 'summary' : 'education';
const textAt = (texts, detail) => { for (let i = DETAILS.indexOf(detail); i >= 0; i--) if (texts?.[DETAILS[i]]) return texts[DETAILS[i]]; return null; };
// A cue's text at the most detail it has: how the editor names the cue.
const cueText = c => textAt(c?.texts, DETAILS[DETAILS.length - 1]);

// The short hash of a text that names its narration clip in tour-audio (FNV-1a, 32 bits; the same as tools/tour-video).
function textKey(text) {
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}

// What the voice says in place of what is written, from the tour's glossary (the same as tools/tour-video): an entry stands
// for a whole word in the case it is written in, and the longest entry that fits is used. Where an entry starts or ends
// with punctuation, as ":00" does, that side may touch a word.
function spokenText(def) {
  const entries = Object.entries(def.glossary ?? {}).map(([from, to]) => [from.trim(), String(to)]).filter(([from]) => from)
    .sort((a, b) => b[0].length - a[0].length);
  if (!entries.length) return text => text;
  const lookup = new Map(entries), escaped = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const wordy = /[\p{L}\p{N}_]/u, whole = from => `${wordy.test(from[0]) ? '(?<![\\p{L}\\p{N}_])' : ''}${escaped(from)}${wordy.test(from.at(-1)) ? '(?![\\p{L}\\p{N}_])' : ''}`;
  const words = new RegExp(entries.map(([from]) => whole(from)).join('|'), 'gu');
  const said = (match, at, text) => {
    const to = lookup.get(match);
    return to && wordy.test(to[0]) && wordy.test(text[at - 1] ?? '') ? ` ${to}` : to;
  };
  return text => text.replace(words, said).replace(/\s+([.,;:!?])/g, '$1').replace(/ {2,}/g, ' ').trim();
}

const slugOf = name => name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
// The seconds a text takes to read to oneself at Normal: about 240 words a minute, two seconds at least.
const readingSeconds = text => Math.max(2, text.length / 20);
const tourSection = () => tour.sections[tour.index];

// Every section's full state, worked out from the start state and the sections before it, so any section can be entered
// directly. Whatever the tour gets wrong is listed rather than guessed at.
// A candle in the file is a number, or an event to wait for from a candle on: { "event": "BullishBreakOfStructure",
// "level": 1, "nth": 1 }, the nth time that becomes known at that level. The local server looks those up, one lookup for
// each event and starting candle (see resolveTour), and until it has, the section is listed as waiting.
const eventKey = (spec, from, scene = 0) => `${scene}|${spec.event}|${spec.level ?? 1}|${spec.nth ?? 1}|${from}`;
const eventName = (spec, from) => `${{ 1: 'the first', 2: 'the second', 3: 'the third' }[spec.nth ?? 1] ?? `the ${spec.nth}th`} ${TERMS.get(spec.event)?.name ?? spec.event} at level ${spec.level ?? 1} after #${from}`;

// A text stays for its narration clip's length when there is one (plus a breath), else for the time it takes to read.
function compileTour(def, scenes, resolved = new Map(), audio = {}, detail = 'education') {
  const errors = [], known = new Set(LAYERS.map(l => l.id)), chapters = [], wanted = [];
  // The scene the sections are in, and how many candles it has.
  let scene = 0, candles = scenes[0]?.ex.prices.t.length ?? 0;
  // A candle number as given, or looked up for an event; null when it is not known (yet).
  const candle = (v, from, where, field) => {
    if (v == null || typeof v === 'number') return { index: v ?? null, spec: null };
    if (typeof v !== 'object' || !TERMS.has(v.event)) { errors.push(`${where}: ${field} must be a candle number or a known event`); return { index: null, spec: null }; }
    const key = eventKey(v, from, scene), spec = eventName(v, from);
    if (!resolved.has(key)) { wanted.push({ key, spec: v, from, scene }); errors.push(`${where}: ${field} is being looked up: ${spec}`); return { index: null, spec }; }
    if (resolved.get(key) == null) errors.push(`${where}: ${field} waits for ${spec}, which does not happen`);
    return { index: resolved.get(key), spec: `${spec} → #${resolved.get(key)}` };
  };
  const ids = (list, where) => (list ?? []).map(id => LAYER_ALIASES[id] ?? id).filter(id => known.has(id) || void errors.push(`${where}: unknown layer "${id}"`));
  const range = (v, where) => Array.isArray(v) && v.length === 2 && v.every(Number.isInteger) && v[0] >= 0 && v[1] > v[0] ? v
    : (errors.push(`${where}: the view is the first and last candle shown, the last after the first`), null);
  const renamed = (o, where) => { if (o.window != null) errors.push(`${where}: "window" is now "view", the first and last candle shown`); };
  const rate = (s, where) => s > 0 ? s : (errors.push(`${where}: speed must be more than 0`), 4);
  const start = def.start ?? {}, startLayers = ids(start.layers, 'start');
  const startView = (start.view != null ? range(start.view, 'start') : null) ?? DEFAULT_VIEW;
  let layers = startLayers, view = startView, speed = rate(start.speed ?? 4, 'start'), at = 0;
  renamed(start, 'start');

  const sections = (def.sections ?? []).map((given, i) => {
    const where = `section ${i + 1}`;
    let s = given;
    if (s.chapter) chapters.push({ name: s.chapter, slug: slugOf(s.chapter), section: i });
    // A section that begins a scene starts a replay of its own: the candles count from #0 again and the view starts afresh.
    if (s.scene != null) {
      scene++;
      const sc = scenes[scene];
      if (typeof s.scene !== 'object' || !s.scene.time) errors.push(`${where}: a scene is { "dataset", "time" }, on the tour's dataset unless one is given`);
      else if (!sc) errors.push(`${where}: the scene could not be set up`);
      else if (sc.missing) errors.push(`${where}: the server has no dataset "${sc.dataset}", so the scene plays on the tour's own`);
      else if (sc.ex.prices.t.length < 2) errors.push(`${where}: the scene's time is past the end of its dataset`);
      candles = sc?.ex.prices.t.length ?? candles;
      at = 0;
      view = DEFAULT_VIEW;
    }
    // A section that explains something is written out by the local server from the prices of its scene (see resolveTour),
    // one writing for each section and the candle it starts from; until it has been, the section is listed as waiting.
    if (s.explain != null) {
      const from = Number.isInteger(s.from) ? s.from : at, key = `explain|${scene}|${from}|${JSON.stringify(s)}`;
      if (!resolved.has(key)) { wanted.push({ key, explain: s, from, scene, where }); errors.push(`${where}: the texts explaining ${s.explain} are being written`); }
      else errors.push(...resolved.get(key).errors);
      s = resolved.get(key)?.section ?? { ...s, cues: [] };
    }
    if (s.layers) layers = ids(s.layers, where);
    const removed = ids(s.remove, where);
    layers = [...new Set([...layers, ...ids(s.add, where)])].filter(id => !removed.includes(id));
    const viewBefore = view;
    if (s.view != null) view = range(s.view, where) ?? view;
    renamed(s, where);
    if (s.speed != null) speed = rate(s.speed, where);
    // A journey takes the tour to where the section starts (see journeyTick): one that runs sets the section's first candle.
    const forward = s.fastForward != null, trip = s.fastForward ?? s.rewind ?? null, tripName = forward ? 'fast forward' : 'rewind';
    let journey = null;
    if (s.fastForward != null && s.rewind != null) errors.push(`${where}: a section fast forwards or rewinds, not both`);
    if (trip != null && s.scene != null) errors.push(`${where}: a section that begins a scene has no journey: the scene starts a new replay`);
    if (trip != null && typeof trip !== 'object') errors.push(`${where}: a ${tripName} is { "to", "speed", "${forward ? 'draw' : 'erase'}" }`);
    else if (trip) {
      const runs = trip[forward ? 'draw' : 'erase'] !== false, there = Number.isInteger(trip.to) && trip.to >= 0 && trip.to < candles && (forward ? trip.to > at : trip.to < at);
      if (runs && !there) errors.push(`${where}: the ${tripName} needs "to", a candle ${forward ? 'after' : 'before'} #${at}, where the section before ends`);
      if (runs && s.from != null) errors.push(`${where}: the ${tripName} takes the replay to where the section starts, so the section has no "from"`);
      const run = runs && there, ends = run ? [at, trip.to] : [];
      journey = { forward, run, start: at, to: run ? trip.to : null, speed: trip.speed != null ? rate(trip.speed, where) : JOURNEY_SPEED,
        wide: [Math.min(viewBefore[0], view[0], ...ends), Math.max(viewBefore[1], view[1], ...ends)] };
    }
    const fromGiven = journey?.run ? { index: journey.to, spec: `${tripName} → #${journey.to}` } : candle(s.from, at, where, 'from'), from =Number.isInteger(fromGiven.index) && fromGiven.index >= 0 && fromGiven.index < candles ? fromGiven.index : at;
    if (fromGiven.index != null && fromGiven.index !== from) errors.push(`${where}: from #${fromGiven.index} is not a candle of the tour, which has #0 to #${candles - 1}`);
    const untilGiven = candle(s.until, from, where, 'until'), until = untilGiven.index ?? from;
    if (until < from) errors.push(`${where}: until #${until} is before the section's start, #${from}`);
    if (until >= candles) errors.push(`${where}: until #${until} is past the last candle, #${candles - 1}`);
    at = Math.max(from, Math.min(until, candles - 1));

    const cues = (s.cues ?? []).map((c, j) => {
      const what = `${where}, text ${j + 1}`, texts = c.texts ?? {}, text = textAt(texts, detail);
      if (c.text != null) errors.push(`${what}: "text" is now "texts", a text for each level of detail: { "summary", "education" }`);
      else if (!Object.values(texts).some(Boolean)) errors.push(`${what}: no text`);
      for (const level of Object.keys(texts)) if (!DETAILS.includes(level)) errors.push(`${what}: unknown detail "${level}": ${DETAILS.join(', ')}`);
      const atGiven = candle(c.at, from, what, 'at');
      if (atGiven.index != null && (atGiven.index < 0 || atGiven.index > at)) errors.push(`${what}: at #${atGiven.index} is not reached, as the section ends at #${at}`);
      if (c.on != null && c.at == null) errors.push(`${what}: a pin needs a candle`);
      if (c.on != null && typeof c.on !== 'number' && !PIN_PRICES[c.on]) errors.push(`${what}: unknown "on" "${c.on}"`);
      if (c.place != null && !PIN_PLACES[c.place]) errors.push(`${what}: unknown place "${c.place}"`);
      if (!['section', 'chapter', 'always'].includes(c.keep ?? 'section')) errors.push(`${what}: unknown keep "${c.keep}"`);
      if (c.voice != null && typeof c.voice !== 'boolean') errors.push(`${what}: voice is true or false`);
      // A line: from the pinned point to another candle's point, shown when the replay reaches the line's end.
      let to = null;
      if (c.to != null) {
        const toGiven = typeof c.to === 'object' ? candle(c.to.at, from, what, 'to') : { index: null, spec: null };
        if (typeof c.to !== 'object' || c.to.at == null || c.on == null) errors.push(`${what}: a line needs a pinned candle and "to": { "at", "on" }, the candle and point it runs to`);
        else if (toGiven.index != null && (toGiven.index < 0 || toGiven.index > at)) errors.push(`${what}: the line's end, #${toGiven.index}, is not reached, as the section ends at #${at}`);
        if (c.to?.on != null && typeof c.to.on !== 'number' && !PIN_PRICES[c.to.on]) errors.push(`${what}: unknown "on" "${c.to.on}" for the line's end`);
        to = { at: toGiven.index, atSpec: toGiven.spec, on: c.to?.on ?? c.on ?? 'close' };
      }
      if (c.heads != null && (typeof c.heads !== 'object' || Object.keys(c.heads).some(k => k !== 'start' && k !== 'end'))) errors.push(`${what}: heads is { "start", "end" }, true or false each`);
      // A text with "voice": false is shown but not read aloud, so it stays for the time it takes to read. A cue with no
      // text at the page's detail is skipped: kept in its place for the editor, never queued.
      const silent = c.voice === false, clip = silent || !text ? null : audio[textKey(text)];
      return { texts, text, skipped: !text, at: atGiven.index, atSpec: atGiven.spec, on: c.on ?? null, place: c.place ?? null, keep: c.keep ?? 'section', silent,
        to, heads: { start: c.heads?.start === true, end: c.heads?.end !== false }, color: c.color ?? null,
        clip: !(c.hold >= 0) && clip?.seconds > 0 ? clip.seconds : 0, given: c.hold >= 0 ? c.hold : null,
        hold: c.hold >= 0 ? c.hold : clip?.seconds > 0 ? clip.seconds + NORMAL_PACE.gap : readingSeconds(text ?? '') };
    });
    return { index: i, chapter: chapters.length - 1, scene, thing: given.thing ?? null, explains: given.explains === true, layers, view, speed, journey, from, fromSpec: fromGiven.spec, until: at, untilSpec: untilGiven.spec, cues };
  });

}

// Looks up the events a compiled tour is waiting for, then compiles again, until nothing is waiting: a lookup can move a
// section's start, and with it what the next section waits from.
async function resolveTour(retry = 0) {
  const scenes = tour.scenes, pending = tour.wanted;
  if (!pending.length || retry > 12) return;
  tour.resolving = true;
  updateEditorStatus();
  for (const { key, spec, explain, from, scene, where } of pending) {
    if (tour.resolved.has(key)) continue;
    const ex = scenes[scene ?? 0]?.ex ?? scenes[0].ex;
    if (explain) {
      // The section as the tour has it goes to the server, which sends back the section to play, texts written.
      const body = JSON.stringify({ dataset: ex.dataset, anchor: ex.anchor, from, where, section: explain });
      const got = await fetch('api/explain', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body }).then(r => r.ok ? r.json() : null).catch(() => null);
      tour.resolved.set(key, got ? { section: got.section, errors: got.errors ?? [] } : { section: null, errors: [`${where}: the local server could not write the texts explaining ${explain.explain}`] });
      continue;
    }
    const query = `dataset=${encodeURIComponent(ex.dataset)}&anchor=${ex.anchor}&from=${from}&type=${encodeURIComponent(spec.event)}&level=${spec.level ?? 1}&nth=${spec.nth ?? 1}`;
    const found = await fetch(`api/event?${query}`).then(r => r.ok ? r.json() : null).catch(() => null);
    tour.resolved.set(key, found?.index ?? null);
  }
  tour.resolving = false;
  if (tour.scenes !== scenes || currentPage !== 'Tour') return;
  Object.assign(tour, compileTour(tour.def, scenes, tour.resolved, tour.audio, tour.detail));
  if (tour.wanted.length) return resolveTour(retry + 1);
  editorSection = -1;
  seekTour(tour.index, { t: cursorOf(tour.ex), shown: tour.shown.length });
  updateEditorMeta();
  updateEditorStatus();
}

// tour.json as it is on disk, with the short hash that names that version of it: Save sends the hash of the version the
// page started from, and the local server refuses to write over a file that is no longer that version.
const readTourFile = () => fetch('tour.json', { cache: 'no-store' }).then(r => r.text()).then(text => ({ def: JSON.parse(text), base: textKey(text) }));

// tour.json can change on disk while the page is open, as when it is edited by hand. Coming back to the page, the newer
// file is loaded at once when nothing here is unsaved (Undo brings back what was here); otherwise the editor says so.
async function checkTourFile() {
  if (currentPage !== 'Tour' || tour?.page !== 'Tour' || tour.checking || tour.recording || videoMode) return;
  tour.checking = true;
  const file = await readTourFile().catch(() => null);
  tour.checking = false;
  if (!file || file.base === tour.base) return;
  if (tourDirty()) {
    tour.note = 'tour.json has changed on disk since this page loaded it, so Save will not write over it. Revert loads the newer version.';
    return updateEditorStatus();
  }
  rememberTour();
  Object.assign(tour, { def: file.def, base: file.base, saved: JSON.stringify(file.def) });
  applyTour({ render: true });
}
window.addEventListener('focus', checkTourFile);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkTourFile(); });

// The tour's scenes: the start state is the first, and each section with "scene": { "dataset", "time" } begins another, a
// replay of its own on that dataset (the tour's unless given) from that time, with its candles numbered from #0 again.
function sceneSpecs(def) {
  const own = def.dataset ?? null;
  return [{ dataset: own, time: def.start?.time, section: -1 },
    ...(def.sections ?? []).flatMap((s, i) => s.scene != null ? [{ dataset: (typeof s.scene === 'object' && s.scene.dataset) || own, time: typeof s.scene === 'object' ? s.scene.time : undefined, section: i }] : [])];
}

// The player's state for a tour, on the page it plays on. A tour from tour.json plays on the Tour page at Education; an
// analysis on the Analysis page (see loadAnalysis), with the options that page sets.
function newPlayer(def, audio, options = {}) {
  return { page: 'Tour', detail: 'education', idPrefix: 'Tour', def, base: '', audio, wholes: new Map(), scenes: [], ex: null, saved: JSON.stringify(def), history: [], lastEdit: null,
    picking: null, note: '', resolved: new Map(), resolving: false, index: 0, view: DEFAULT_VIEW, queue: [], shown: [], fired: new Set(), kept: [], active: null, activeUntil: 0,
    nextCandle: 0, timer: null, ended: false, chaptersOff: new Set(), voice: { now: null, waiting: [] }, ...options };
}

async function loadTour() {
  const { def, base } = await readTourFile();
  const list = await loadDatasets();
  if (!list.length) throw new Error('the server has no datasets');
  const audio = await fetch('tour-audio/index.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  const loaded = newPlayer(def, audio, { base });
  await loadTourDatasets(loaded);
  anchorTour(loaded);
  return Object.assign(loaded, compileTour(def, loaded.scenes, loaded.resolved, loaded.audio, loaded.detail));
}

// Every dataset the tour's scenes name is loaded once; the tour's own falls back to the server's first dataset.
async function loadTourDatasets(t = tour) {
  const list = await loadDatasets();
  for (const spec of sceneSpecs(t.def)) {
    const key = spec.dataset ?? '', info = list.find(d => d.id === spec.dataset) ?? (spec.dataset === (t.def.dataset ?? null) ? list[0] : null);
    if (info && !t.wholes.has(key)) t.wholes.set(key, await loadDataset(info));
  }
}

// A scene's candles are its dataset's from its start time on, so a candle's number is its place in them. A new start time
// makes them anew, and what the server worked out from the old one is dropped. A scene whose dataset the server does not
// have plays on the tour's own, and the tour says so.
function anchorTour(t = tour) {
  const scenes = [], ids = new Set();
  let changed = false;
  for (const spec of sceneSpecs(t.def)) {
    const whole = t.wholes.get(spec.dataset ?? '') ?? t.wholes.get(t.def.dataset ?? '') ?? [...t.wholes.values()][0], missing = !t.wholes.has(spec.dataset ?? '');
    const time = axisTime(spec.time ?? ''), anchor = Number.isNaN(time) ? 0 : indexAtOrAfter(whole, time);
    const was = (t.scenes ?? []).find(sc => sc.ex?.dataset === whole.dataset && sc.ex.anchor === anchor && !ids.has(sc.ex.id));
    if (was) { ids.add(was.ex.id); scenes.push({ ...spec, missing, ex: was.ex }); continue; }
    changed = true;
    let id = scenes.length ? `${t.idPrefix}/${whole.dataset}@${anchor}` : `${t.idPrefix}/${whole.dataset}`;
    while (ids.has(id)) id += '+';
    ids.add(id);
    const cut = a => a.slice(anchor), p = whole.prices;
    remote.delete(id);
    zooms.delete(id);
    cursors.set(id, 0);
    scenes.push({ ...spec, missing, ex: { id, dataset: whole.dataset, anchor, tour: true, title: t.page === 'Tour' ? 'Tour' : t.def.title ?? t.page, level: 1, expected: [], annotations: [],
      prices: { t: cut(p.t), o: cut(p.o), h: cut(p.h), l: cut(p.l), c: cut(p.c) } } });
  }
  // Events were looked up from the old starts, so they are looked up again.
  if (changed || scenes.length !== (t.scenes ?? []).length) { t.resolved?.clear(); eventCache.clear(); }
  t.scenes = scenes;
  if (!scenes.some(sc => sc.ex === t.ex)) t.ex = scenes[0].ex;
}

// The tour shows one scene's chart at a time: moving to a section of another scene swaps the chart's example for that
// scene's, where it was left.
function showScene(ex) {
  if (tour.ex === ex) return;
  const was = tour.ex;
  tour.ex = ex;
  tour.zoom = null;
  const el = document.querySelector(`.chart[data-id="${CSS.escape(was.id)}"]`);
  if (el) { el.dataset.id = ex.id; el.closest('article').id = `ex-${ex.id}`; }
  if (activeId === was.id) activeId = ex.id;
}

// The candles a section shows are its view, which is what the chart shows as the section begins, wherever the replay is.
// A replay that then runs past the end of the view takes the view along with it.
function sectionView(t) {
  const [first, last] = tour.view, moved = Math.max(0, t - Math.max(last, tourSection()?.from ?? 0));
  return [first + moved, last + moved];
}

// A view that is not the one on show is not cut to: the chart eases from the one to the other, so it reads as the same
// chart zooming or moving.
const TOUR_ZOOM_MS = 1500;

function tourView(t) {
  const view = sectionView(t), zoom = tour.zoom;
  if (!zoom) return view;
  const k = Math.min(1, (performance.now() - zoom.start) / TOUR_ZOOM_MS), eased = k < 0.5 ? 2 * k * k : 1 - (2 - 2 * k) ** 2 / 2;
  return view.map((v, i) => Math.round(zoom.from[i] + (v - zoom.from[i]) * eased));
}

function tourWindow(ex, t) {
  const [from, to] = tourView(t), last = ex.prices.t.length - 1;
  return { from: Math.min(from, last - 1), to: Math.min(Math.max(to, from + 1), last) };
}

function zoomTour(from) {
  tour.zoom = { from, start: performance.now() };
  if (tour.zooming) return;
  // The next frame is asked for before this one is drawn, so a frame that fails does not leave the view part way.
  const step = () => {
    tour.zooming = !!tour.zoom && performance.now() - tour.zoom.start < TOUR_ZOOM_MS;
    if (tour.zooming) requestAnimationFrame(step); else tour.zoom = null;
    if (currentPage === 'Tour') redrawExample(tour.ex);
  };
  tour.zooming = true;
  requestAnimationFrame(step);
}

// A drawn line: from the cue's pinned point to the point its "to" names, with the text in a box along it.
function lineOf(ex, cue) {
  const point = (at, on) => ({ time: ex.prices.t[at], price: typeof on === 'number' ? on : ex.prices[PIN_PRICES[on]]?.[at] });
  return { from: point(cue.at, cue.on), to: point(cue.to.at, cue.to.on), text: cue.text, heads: cue.heads, color: cue.color };
}

function pinOf(ex, cue) {
  return { time: ex.prices.t[cue.at], price: typeof cue.on === 'number' ? cue.on : ex.prices[PIN_PRICES[cue.on]]?.[cue.at], text: cue.text,
    place: cue.place ?? { high: 'above', low: 'below', open: 'left' }[cue.on] ?? 'right' };
}

// A pinned cue: its text in a box beside the point, with an arrow to it.
const pinLines = text => text.split(' ').reduce((out, word) => {
  if (out.length && `${out[out.length - 1]} ${word}`.length <= 30) out[out.length - 1] += ` ${word}`; else out.push(word);
  return out;
}, []);

// The room a pinned text's box needs above and below its point, in pixels, to be inside the chart.
function pinRoom(pin) {
  const box = pinLines(pin.text).length * 17 + 14, [, ay] = PIN_PLACES[pin.place] ?? PIN_PLACES.above, clear = 8;
  const beside = box / 2 + clear, beyond = Math.abs(ay) + box + clear;
  return { time: Date.parse(pin.time), price: pin.price, up: ay < 0 ? beyond : ay > 0 ? clear : beside, down: ay > 0 ? beyond : ay < 0 ? clear : beside };
}

function pinLabel(pin) {
  const accent = css('--accent'), [ax, ay] = PIN_PLACES[pin.place] ?? PIN_PLACES.above;
  return { x: pin.time, y: pin.price, text: pinLines(pin.text).join('<br>'), showarrow: true, arrowhead: 2, arrowwidth: 1.5, arrowcolor: accent, ax, ay,
    xanchor: { left: 'right', right: 'left' }[pin.place] ?? 'center', yanchor: { above: 'bottom', below: 'top' }[pin.place] ?? 'middle', align: 'left',
    bgcolor: css('--panel'), bordercolor: accent, borderpad: 5, font: { color: css('--text'), size: 13 } };
}

// The candle a cue is reached at: a line's end, a pin's candle, or none for a text shown as the section begins.
const cueAt = c => c.to?.at ?? c.at;

// Moves the replay to a candle and queues the cues it has reached: text with no candle is reached as the section begins.
function advanceTo(t) {
  const s = tourSection(), ex = tour.ex;
  cursors.set(ex.id, t);
  prefetch(ex, t);
  for (const c of s.cues) if (!tour.fired.has(c) && (cueAt(c) ?? s.from) <= t) { tour.fired.add(c); if (!c.skipped) tour.queue.push(c); }
}

// The cues of a section still to come at the page's detail: the ones that stop the replay at their candle.
const pendingCues = s => s.cues.filter(c => !tour.fired.has(c) && !c.skipped);

function showNextCue() {
  const cue = tour.queue.shift();
  if (!cue) return;
  // A clip read since the tour was compiled gives the text its length, as one there from the start does.
  const clip = !cue.silent && cue.clip === 0 && !(cue.given >= 0) ? tour.audio[textKey(cue.text)] : null;
  if (clip?.seconds > 0) Object.assign(cue, { clip: clip.seconds, hold: clip.seconds + NORMAL_PACE.gap });
  Object.assign(tour, { activeAt: performance.now(), pausedElapsed: 0 });
  tour.active = cue;
  tour.activeUntil = performance.now() + holdOf(cue) * 1000;
  tour.shown.push(cue);
  speak(cue);
}

// Reads a text aloud from its clip in tour-audio, when the Voice button is on and the tour is playing. One text is read at
// a time: a text shown while another is being read waits for it rather than cutting it off, and its time on show starts
// as its reading does. A recording makes no sound but keeps the same time, and notes when each reading began, which is
// where tools/tour-video lays the clip.
function speak(cue) {
  if (!tour.timer || !(voiceOn() || tour.recording)) return hush();
  if (cue.silent || !tour.audio[textKey(cue.text)]) return;
  if (tour.voice.now) tour.voice.waiting.push(cue); else readAloud(cue);
}

function readAloud(cue) {
  const clip = tour.audio[textKey(cue.text)], turn = tour.voice.now = { timer: null };
  const done = () => {
    if (tour.voice.now !== turn) return;
    tour.voice.now = null;
    if (tour.voice.waiting.length) readAloud(tour.voice.waiting.shift());
  };
  // Its time on show, at the slider's pace, starts as its reading does.
  if (cue === tour.active) Object.assign(tour, { activeAt: performance.now(), activeUntil: performance.now() + holdOf(cue) * 1000 });
  if (tour.recording) {
    tour.recording.cues.push({ key: textKey(cue.text), at: Date.now() });
    turn.timer = setTimeout(done, clip.seconds * 1000);
    return;
  }
  tour.player = new Audio(`tour-audio/${clip.file}`);
  tour.player.playbackRate = tourPace().voice;
  tour.player.addEventListener('ended', done);
  tour.player.addEventListener('error', done);
  tour.player.play().catch(done);
}

function hush() {
  tour.player?.pause();
  clearTimeout(tour.voice.now?.timer);
  tour.voice = { now: null, waiting: [] };
}

const voiceOn = () => state.tourVoice === true;

// The pace the Speed slider is set to. A recording is always made at Normal, as its clips are laid at their own length.
const tourPace = () => tour?.recording || videoMode ? NORMAL_PACE : TOUR_PACES.find(p => p.name === state.tourPaceName) ?? NORMAL_PACE;
// Whether a text is read aloud: Voice is on, or a recording is being made, and it has a clip.
const voiced = cue => !!cue.clip && !cue.silent && (voiceOn() || !!tour?.recording);
// The seconds a text stays at the slider's pace. Read aloud, the length of its clip as played and the gap after it.
// Otherwise its own seconds when the tour gives it some, else the time it takes to read at the slider's reading rate.
const holdOf = cue => {
  const pace = tourPace();
  if (voiced(cue)) return cue.clip / pace.voice + pace.gap;
  return cue.given != null ? cue.given / pace.voice : readingSeconds(cue.text ?? '') / pace.reading;
};

function setTourPace(value) {
  state.tourPaceName = TOUR_PACES[Number(value)]?.name ?? NORMAL_PACE.name;
  save(state);
  if (tour?.player) tour.player.playbackRate = tourPace().voice;
  updateTourPanel();
}

// What tools/tour-video drives: plays the whole tour once and reports when each text and chapter appeared.
window.tourVideo = {
  ready: () => currentPage === 'Tour' && tour?.page === 'Tour' && !!tour.sections.length && !tour.wanted.length && !viewFor(tour.ex).loading,
  play: () => new Promise(resolve => {
    pauseTour();
    tour.recording = { started: Date.now(), cues: [], chapters: [] };
    tour.onEnd = () => { const done = { ...tour.recording, ended: Date.now() }; tour.recording = null; resolve(done); };
    enterSection(0);
    playTour();
  }),
};

// Sets the tour at the start of a section, with nothing of it shown yet. A section that has a journey is set at the end of
// it, unless the journey is to be played: then the tour is left where the journey starts, with the view easing out.
function openSection(i, { journey = false } = {}) {
  const s = tour.sections[i], switched = (tour.scenes[s.scene] ?? tour.scenes[0]).ex !== tour.ex;
  // Another scene is a cut, not a move: its chart comes up at the section's view with nothing to ease from.
  if (switched) showScene((tour.scenes[s.scene] ?? tour.scenes[0]).ex);
  const ex = tour.ex, shown = switched ? s.view : tourView(cursorOf(ex)), moved = i !== tour.index;
  Object.assign(tour, { index: i, view: s.view, queue: [], shown: [], fired: new Set(), active: null, activeUntil: 0, nextCandle: 0, journey: null, ended: false });
  // Pins kept from earlier sections belong to this scene's chart only.
  tour.kept = tour.sections.slice(0, i).filter(earlier => earlier.scene === s.scene).flatMap(earlier => earlier.cues.filter(c => c.on != null && !c.skipped
    && (c.keep === 'always' || (c.keep === 'chapter' && earlier.chapter === s.chapter))));
  // While a candle is being picked, the candles still to come are shown, to pick from.
  // An analysis keeps the page's own layers on beside the section's, all but its levels.
  tourLayers = [...new Set(['replay', ...(tour.extraLayers ?? []), ...s.layers, ...(tour.picking ? ['future'] : [])])];
  const chapter = tour.chapters[s.chapter];
  if (chapter?.section === i) tour.recording?.chapters.push({ name: chapter.name, at: Date.now() });
  // The Tour page's address names the chapter; an analysis keeps its own.
  if (tour.page === 'Tour') history.replaceState(null, '', chapter ? `#Tour/${chapter.slug}` : '#Tour');
  if (journey && s.journey) {
    const t = s.journey.run ? s.journey.start : s.from;
    cursors.set(ex.id, t);
    prefetch(ex, t);
    // Only the texts with no candle are read on the way: the others wait for the journey's end.
    for (const c of s.cues) if (c.at == null) { tour.fired.add(c); if (!c.skipped) tour.queue.push(c); }
    Object.assign(tour, { view: s.journey.wide, journey: { ...s.journey, phase: 'out' } });
    zooms.delete(ex.id);
    // A view that already holds the whole way has no easing out to do.
    if (shown[0] !== tour.view[0] || shown[1] !== tour.view[1]) zoomTour(shown);
    return;
  }
  advanceTo(s.from);
  // The section sets the view: the chart eases to it, and a zoom or pan made by hand goes.
  const view = sectionView(s.from), changed = view[0] !== shown[0] || view[1] !== shown[1];
  if (moved || changed) zooms.delete(ex.id);
  if (changed) zoomTour(shown);
}

function enterSection(i, how) {
  openSection(i, how);
  showNextCue();
  refreshTour();
}

// One beat of a journey. The view has eased out to hold the whole way. A journey that runs sets off as the last of the
// section's texts with no candle comes on show, so that text is read over it, and takes as many candles in a beat as its
// speed asks; a journey of the view alone waits for its texts to be read. Then the view eases in to the section's own and
// the section carries on from there.
function journeyTick(s, ex, now, reading) {
  const j = tour.journey, t = cursorOf(ex);
  if (tour.zoom) return;
  if (j.phase === 'in') return endJourney();
  if (j.phase === 'out') Object.assign(j, { phase: 'wide', since: now });
  if (tour.queue.length) return;
  if (j.run && t !== j.to) {
    const step = j.forward ? 1 : -1;
    if (!timelineAt(ex, t + step)) { tour.nextCandle = 0; return prefetch(ex, t + step); }
    if (now < tour.nextCandle) return;
    const gap = 1000 / (j.speed * tourPace().candles), late = now - tour.nextCandle, inStep = tour.nextCandle > 0 && late < 1000;
    const due = Math.min(Math.abs(j.to - t), inStep ? 1 + Math.floor(late / gap) : 1);
    let n = 1;
    while (n < due && timelineAt(ex, t + (n + 1) * step)) n++;
    tour.nextCandle = inStep && n === due ? tour.nextCandle + due * gap : now + gap;
    cursors.set(ex.id, t + n * step);
    prefetch(ex, t + n * step);
    return refreshTour();
  }
  // With nothing to run, the wider view stays for its texts, or for a moment when there are none.
  if (!j.run && (reading || now - j.since < 1000)) return;
  j.phase = 'in';
  tour.view = s.view;
  if (j.wide[0] !== s.view[0] || j.wide[1] !== s.view[1]) zoomTour(j.wide);
}

// The end of a journey, or of one cut short by a step made by hand: the section as it starts.
function endJourney() {
  const s = tourSection();
  Object.assign(tour, { journey: null, view: s.view, nextCandle: 0 });
  advanceTo(s.from);
  refreshTour();
}

// Puts the tour at a place in a section: a candle and how many of the section's texts have been shown, or the point at
// which one of its texts appears. An edit uses this to leave the tour where it was, or to show what was edited.
function seekTour(i, { t = 0, shown = 1, cue = null } = {}) {
  if (!tour.sections.length) {
    Object.assign(tour, { index: 0, queue: [], shown: [], fired: new Set(), kept: [], active: null });
    tourLayers = ['replay', ...tour.startLayers];
    cursors.set(tour.ex.id, 0);
    return refreshTour();
  }
  openSection(Math.max(0, Math.min(i, tour.sections.length - 1)));
  const s = tourSection(), target = cue == null ? null : s.cues[cue];
  const pending = () => pendingCues(s).map(cueAt);
  if (target) {
    while (!tour.shown.includes(target)) {
      if (!tour.queue.length) {
        if (cursorOf(tour.ex) >= s.until) break;
        advanceTo(Math.min(s.until, ...pending()));
      }
      showNextCue();
    }
  } else {
    advanceTo(Math.max(s.from, Math.min(t, s.until)));
    while (tour.queue.length && tour.shown.length < shown) showNextCue();
  }
  refreshTour();
}

function refreshTour() {
  const ex = tour.ex;
  // A cue skipped at the page's detail has no text to pin.
  const pins = cues => cues.filter(c => !c.skipped && c.on != null && c.at != null && c.to == null).map(c => pinOf(ex, c)).filter(p => p.time && Number.isFinite(p.price));
  const lines = cues => cues.filter(c => !c.skipped && c.to != null && c.at != null && c.to.at != null).map(c => lineOf(ex, c)).filter(l => l.from.time && l.to.time && Number.isFinite(l.from.price) && Number.isFinite(l.to.price));
  // An analysis shows no pins: the layers it turns on mark the same places.
  const marks = tour.pins === false ? [] : [...tour.kept, ...tour.shown];
  ex.pins = pins(marks);
  ex.lines = lines(marks);
  // Room is kept for all of the section's pins from its start, so the prices do not move each time one appears.
  ex.pinRoom = tour.pins === false ? [] : pins([...tour.kept, ...(tourSection()?.cues ?? [])]);
  syncLayerButtons();
  if (tour.page === 'Tour' && editorSection !== tour.index) renderTourEditor();
  drawAll(tour.page);
  updateTourPanel();
}

function updateTourPanel() {
  const part = name => document.querySelector(`[data-tour="${name}"]`), go = name => document.querySelector(`[data-tour-go="${name}"]`);
  document.body.classList.toggle('analysing', analysisRuns());
  if (!playerHere(currentPage) || !part('caption')) return;
  const s = tourSection(), ex = tour.ex, t = cursorOf(ex);
  if (part('title')) part('title').textContent = tour.def.title || 'Tour';
  part('chapter').textContent = tour.chapters[s?.chapter]?.name ?? tour.def.title ?? 'Tour';
  const scene = tour.scenes.length > 1 && s ? ` · scene ${s.scene + 1}: ${datasetList?.find(d => d.id === ex.dataset)?.name ?? ex.dataset} from ${fmtTime(ex.prices.t[0])}` : '';
  // An analysis counts its chapters, a section each; a tour its sections, several to a chapter.
  const where = tour.page === 'Analysis' ? `${tour.def.title} · chapter ${(s?.chapter ?? 0) + 1} of ${tour.chapters.length}`
    : `section ${(s?.index ?? 0) + 1} of ${tour.sections.length} · #${s?.from}${s?.until > s?.from ? ` to #${s.until}` : ''}`;
  part('where').textContent = s ? `${where}${tour.ended ? ' · ended' : ''}${scene}` : 'no sections yet';
  showCaption();
  part('readout').textContent = `#${t} · ${fmtTime(ex.prices.t[t])} UTC`;
  const warning = part('warning');
  if (warning) {
    warning.hidden = !ex.unanchored;
    warning.textContent = ex.unanchored ? 'The local server was started before the tour existed, so it cannot work out the structure from the tour\'s start: only candles and closes are shown. Restart ./build-site.ps1 -Serve.' : '';
  }

  // The chapters and the problems change as the tour is edited, so they are redrawn when they differ.
  const fill = (el, html) => { if (el && el.dataset.html !== html) { el.dataset.html = html; el.innerHTML = html; } };
  fill(part('errors'), tour.errors.length ? `<div class="empty tour-errors"><b>The tour has problems</b><ul>${tour.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>` : '');
  fill(part('chapters'), chapterPills());
  if (tour.page === 'Analysis') fill(part('things'), analysisWriteHtml());

  const play = go('play');
  play.textContent = tour.timer ? '❚❚' : '▶';
  play.setAttribute('aria-label', tour.timer ? 'Pause (Space)' : 'Play (Space)');
  go('next').disabled = tour.ended;
  go('edit')?.setAttribute('aria-pressed', editorOn());
  go('glossary')?.setAttribute('aria-pressed', glossaryOn());
  if (go('similar')) go('similar').hidden = !trendLevel(tour);
  const voice = go('voice'), clips = Object.keys(tour.audio ?? {}).length;
  voice.setAttribute('aria-pressed', voiceOn());
  if (!clips) voice.title = 'No clips yet: the local server reads the texts aloud when Voice is on';
  const pace = TOUR_PACES.indexOf(tourPace());
  part('pace').value = pace;
  part('pace-name').textContent = TOUR_PACES[pace].name;
  part('autonext').checked = autoNext();
  showScrub();

  // The editor marks the texts shown so far, and the one on show.
  document.querySelectorAll('#tour-editor .ed-cue').forEach((el, j) => {
    const cue = s?.cues[j], active = !!cue && cue === tour.active;
    el.classList.toggle('shown', tour.shown.includes(cue));
    if (active && !el.classList.contains('active') && tour.timer) el.scrollIntoView({ block: 'nearest' });
    el.classList.toggle('active', active);
  });
}

// One beat of a playing tour: the next text once the one on show has been read, else the next candle, else the next section.
function tourTick() {
  if (!playerHere(currentPage) || !tour.sections.length) return pauseTour();
  // The slider and the caption move on while a text is read, as well as while the candles run.
  showScrub();
  showCaption();
  const s = tourSection(), ex = tour.ex, now = performance.now(), t = cursorOf(ex);
  // A text still waiting for the voice has not begun its time on show.
  const reading = tour.active && (now < tour.activeUntil || tour.voice.waiting.includes(tour.active));
  if (!reading && tour.queue.length) {
    // An analysis's texts are read aloud by the server as it is written: with Voice on, a text waits for its clip,
    // twenty seconds at most, looking for it again every second.
    const next = tour.queue[0];
    if (tour.waitForClips && voiceOn() && !next.silent && !tour.audio[textKey(next.text)] && now - (tour.waitingSince ??= now) < 20000) {
      if (now - (tour.audioAt ?? 0) > 1000) loadPlayerAudio();
      return;
    }
    tour.waitingSince = null;
    showNextCue();
    return refreshTour();
  }
  if (tour.journey) return journeyTick(s, ex, now, reading);
  if (t < s.until) {
    // The replay waits at a cue that has a candle; text with no candle is read while the replay runs.
    const waiting = (reading && tour.active.at != null) || tour.queue.some(c => c.at != null);
    if (waiting || !timelineAt(ex, t + 1)) tour.nextCandle = 0;
    if (waiting || now < tour.nextCandle) return;
    if (!timelineAt(ex, t + 1)) return prefetch(ex, t + 1);
    // A beat takes every candle that has come due since the last one, so a section faster than the beat, or than the chart
    // can be redrawn, still keeps its speed: but never past a text's candle, the section's end or what is loaded. After a
    // wait the count starts again, so the replay does not leap to make up the time.
    const gap = 1000 / (s.speed * tourPace().candles), late = now - tour.nextCandle, inStep = tour.nextCandle > 0 && late < 1000;
    const due = inStep ? 1 + Math.floor(late / gap) : 1;
    const stop = Math.min(s.until, t + due, ...pendingCues(s).filter(c => cueAt(c) > t).map(cueAt));
    let to = t + 1;
    while (to < stop && timelineAt(ex, to + 1)) to++;
    tour.nextCandle = inStep && to - t === due ? tour.nextCandle + due * gap : now + gap;
    advanceTo(to);
    return refreshTour();
  }
  if (reading) return;
  // On to the next section played; at the start of a new chapter, only with Play the next chapter ticked.
  const next = sectionAfter(tour.index, 1);
  if (next != null) {
    if (!autoNext() && tour.chapters[tour.sections[next].chapter]?.section === next) return pauseTour();
    return enterSection(next, { journey: true });
  }
  tour.ended = true;
  pauseTour();
  tour.onEnd?.();
  tour.onEnd = null;
}

// The clips the local server has read so far, looked for again while an analysis's texts are still being read.
async function loadPlayerAudio() {
  const mine = tour;
  mine.audioAt = performance.now();
  const audio = await fetch('tour-audio/index.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
  if (audio) mine.audio = audio;
}

// ---- The slider: a chapter in seconds ---------------------------------------------------------------------------------
// The slider spans the chapter on show in the seconds it takes to play at the pace set: the candles run and the texts read.
// Its time line is worked out by the rules tourTick plays by: a journey into a section takes its easing and its run; the
// candles run at the section's speed; a text with no candle is read while they run; the run waits at a text that has a
// candle until it has been read; and a section ends once its candles have run and its texts been read. Where the player
// is, it is placed by the candle it is at or the text on show, whichever is further on, so the voice and the time line
// cannot drift far apart.

// One section's time line from its start: when each text comes on show and for how long, and the candles the run is at,
// as [candle, seconds] points to read between. A journey's texts with no candle are read over it.
function sectionPlan(s) {
  const pace = tourPace(), gap = 1 / (s.speed * pace.candles), j = s.journey;
  const journey = j ? 2 * TOUR_ZOOM_MS / 1000 + (j.run ? Math.abs(j.to - j.start) / (j.speed * pace.candles) : 0) : 0;
  let reader = 0, clock = journey, at = s.from;
  const texts = [], runs = [[s.from, 0], [s.from, journey]];
  const cues = s.cues.map((c, k) => ({ c, k, when: cueAt(c) ?? s.from })).filter(x => !x.c.skipped).sort((a, b) => a.when - b.when || a.k - b.k);
  for (const { c, when } of cues) {
    const hold = holdOf(c);
    if (c.at == null) { texts.push({ cue: c, start: reader, seconds: hold }); reader += hold; continue; }
    if (when > at) { clock += (when - at) * gap; at = when; runs.push([at, clock]); }
    const start = Math.max(clock, reader);
    texts.push({ cue: c, start, seconds: hold });
    reader = clock = start + hold;
    runs.push([at, clock]);
  }
  if (s.until > at) { clock += (s.until - at) * gap; runs.push([s.until, clock]); }
  return { texts, runs, seconds: Math.max(clock, reader) };
}

// The chapter's time line: its sections that are played, one after another. It is worked out again when the pace, the
// sections played, the tour or the clips change.
function chapterPlan() {
  const chapter = tourSection()?.chapter, ids = tour.sections.flatMap((s, i) => s.chapter === chapter && sectionOn(i) ? [i] : []);
  const key = `${chapter}|${tourPace().name}|${voiceOn()}|${ids.join(',')}|${Object.keys(tour.audio ?? {}).length}`;
  if (tour.plan?.key === key && tour.plan.sections === tour.sections) return tour.plan;
  let offset = 0;
  const parts = ids.map(i => { const plan = sectionPlan(tour.sections[i]), part = { i, offset, ...plan }; offset += plan.seconds; return part; });
  return tour.plan = { key, sections: tour.sections, parts, seconds: offset };
}

// The seconds into a section at which the run is at a candle, and the candle it is at a number of seconds in.
function secondsAtCandle(part, t) {
  const runs = part.runs, next = runs.findIndex(([c]) => c >= t);
  if (next < 0) return runs[runs.length - 1][1];
  if (next === 0 || runs[next][0] === t) return runs[next][1];
  const [c0, s0] = runs[next - 1], [c1, s1] = runs[next];
  return s0 + (s1 - s0) * (t - c0) / (c1 - c0);
}

function candleAtSeconds(part, seconds) {
  const runs = part.runs;
  let k = 0;
  while (k + 1 < runs.length && runs[k + 1][1] <= seconds) k++;
  const [c0, s0] = runs[k], [c1, s1] = runs[k + 1] ?? runs[k];
  return c1 > c0 && s1 > s0 ? c0 + Math.floor((c1 - c0) * (seconds - s0) / (s1 - s0)) : c0;
}

// Where the player is in the chapter, in seconds: the candle the run is at, or as far into the text on show as it has
// been read, whichever is further on. Paused, a text is at its start, as Play reads it again from there.
function planPosition(plan) {
  const part = plan.parts.find(p => p.i === tour.index);
  if (!part) return 0;
  let at = secondsAtCandle(part, cursorOf(tour.ex));
  const text = part.texts.find(x => x.cue === tour.active);
  if (text) at = Math.max(at, text.start + Math.min(text.seconds, activeElapsed()));
  return part.offset + Math.min(at, part.seconds);
}

// The seconds the text on show has been read for: while playing, since its reading began; paused, as far as it had got.
const activeElapsed = () => !tour?.active ? 0 : tour.timer ? Math.max(0, (performance.now() - (tour.activeAt ?? performance.now())) / 1000) : tour.pausedElapsed ?? 0;

// How many of a text's characters have been read after a number of seconds. Read aloud, by its clip: sentence by
// sentence where the narration tool says how long each sentence is, and by characters within one; otherwise by
// characters over the clip. Read to oneself, by characters over the time it is given.
function readChars(cue, elapsed) {
  const text = cue.text ?? '', n = text.length, pace = tourPace();
  if (voiced(cue)) {
    const clip = tour.audio[textKey(text)], at = elapsed * pace.voice, parts = clip?.sentences, written = text.split(/(?<=[.!?])\s+/);
    if (parts?.length && parts.length === written.length) {
      const pause = parts.length > 1 ? Math.max(0, (clip.seconds - parts.reduce((a, b) => a + b, 0)) / (parts.length - 1)) : 0;
      let time = 0, chars = 0;
      for (let i = 0; i < parts.length; i++) {
        if (at < time + parts[i]) return chars + Math.round(written[i].length * (at - time) / parts[i]);
        time += parts[i] + pause;
        chars += written[i].length + 1;
      }
      return n;
    }
    return Math.round(n * Math.min(1, at / cue.clip));
  }
  return Math.round(n * Math.min(1, elapsed / holdOf(cue)));
}

// The caption: the last text shown that is not pinned, read up to where the reading has got in black and the rest in
// grey, word by word. A text no longer on show has been read; a recording shows it whole.
function showCaption() {
  const box = document.querySelector('[data-tour="caption"]');
  if (!box) return;
  const cue = [...tour.shown].reverse().find(c => c.on == null), text = cue?.text ?? '';
  let read = cue && cue === tour.active && !videoMode && !tour.recording ? readChars(cue, activeElapsed()) : text.length;
  if (read < text.length) { const space = text.indexOf(' ', read); read = space < 0 ? text.length : space; }
  const key = `${text}|${read}`;
  if (box.dataset.key === key) return;
  box.dataset.key = key;
  box.innerHTML = read >= text.length ? esc(text) : `${esc(text.slice(0, read))}<span class="unread">${esc(text.slice(read))}</span>`;
}

// Clicking the caption moves on to the next text at once, as when it has been read: on to the next candle with a text,
// or the next section when this one has none left. Playing, the voice moves on with it.
function nextText() {
  if (!tour?.sections.length) return;
  if (tour.journey) endJourney();
  const s = tourSection();
  if (!tour.queue.length && cursorOf(tour.ex) >= s.until) {
    const next = sectionAfter(tour.index, 1);
    if (next != null) enterSection(next);
    return;
  }
  hush();
  if (!tour.queue.length) advanceTo(Math.min(s.until, ...pendingCues(s).map(cueAt)));
  showNextCue();
  refreshTour();
}

const clockOf = seconds => `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;
let scrubbing = false;
window.addEventListener('pointerup', () => { scrubbing = false; }, { passive: true });

// The slider and its readout at where the player is, with a mark at each text that is read.
function showScrub() {
  const scrub = document.querySelector('[data-tour="scrub"]');
  if (!scrub || !tourSection()) return;
  const plan = chapterPlan(), at = planPosition(plan);
  scrub.min = 0;
  scrub.max = Math.max(plan.seconds, 0.1);
  scrub.step = 0.1;
  scrub.disabled = plan.seconds <= 0;
  if (!scrubbing) scrub.value = at;
  const marks = document.getElementById('player-marks');
  if (marks && marks.dataset.key !== plan.key) {
    marks.dataset.key = plan.key;
    marks.innerHTML = plan.parts.flatMap(p => p.texts.filter(x => x.cue.on == null).map(x => `<option value="${(p.offset + x.start).toFixed(1)}"></option>`)).join('');
  }
  document.querySelector('[data-tour="where-in"]').textContent = `${clockOf(scrubbing ? Number(scrub.value) : at)} of ${clockOf(plan.seconds)}`;
}

// Moving the slider puts the player at that many seconds into the chapter. On a text it is the start of that text, on
// show; between texts it is the candle the run is at then, with the texts before it taken as read. It holds still while
// the slider moves, and once it is let go it plays on from there if it was playing, and stays paused if it was not.
function scrubTour(seconds) {
  if (!tour?.sections.length) return;
  const plan = chapterPlan(), part = [...plan.parts].reverse().find(p => p.offset <= seconds) ?? plan.parts[0];
  if (!part) return;
  tour.playAfterScrub ||= !!tour.timer;
  pauseTour();
  if (tour.journey) endJourney();
  const local = seconds - part.offset, s = tour.sections[part.i];
  const text = [...part.texts].reverse().find(x => x.start <= local && local < x.start + x.seconds && x.cue.on == null);
  if (text) seekTour(part.i, { cue: s.cues.indexOf(text.cue) });
  else seekTour(part.i, { t: candleAtSeconds(part, local), shown: part.texts.filter(x => x.start <= local).length });
  showScrub();
}

function playTour() {
  if (!tour?.sections.length) return;
  stopPlaying();
  // A section is at its end once its candles have run, its texts have come and the one on show has been read through:
  // one just entered, its first text on show, is not, even when it stays on one candle.
  const read = !tour.active || (tour.pausedElapsed ?? 0) >= holdOf(tour.active) - 0.05;
  const s = tourSection(), atEnd = cursorOf(tour.ex) >= s.until && !tour.queue.length && !tour.journey && read, next = sectionAfter(tour.index, 1);
  // At the end it starts again; at the end of a chapter it is paused at, the next chapter plays; in a section since left
  // out, the next played one does.
  if (tour.ended || (atEnd && next == null)) enterSection(sectionAfter(-1, 1) ?? 0);
  else if ((atEnd || !sectionOn(tour.index)) && next != null) enterSection(next, { journey: true });
  // The text on show gets its reading time again, and is read aloud from its start: it was shown while the tour was not playing.
  if (tour.active) Object.assign(tour, { activeAt: performance.now(), activeUntil: performance.now() + holdOf(tour.active) * 1000, pausedElapsed: 0 });
  tour.nextCandle = 0;
  tour.timer = setInterval(tourTick, TOUR_TICK);
  if (tour.active) speak(tour.active);
  updateTourPanel();
}

function pauseTour() {
  if (!tour?.timer) return;
  // The text on show keeps how far it had been read, to show while paused.
  tour.pausedElapsed = activeElapsed();
  clearInterval(tour.timer);
  tour.timer = null;
  hush();
  updateTourPanel();
}

// Stepping by hand, a section at a time, over the sections left out: back to the start of the section, or of the one before
// when it has not got past its first text; on to the start of the next, or from the last to its end, every text read.
function tourGo(action) {
  if (!tour?.sections.length) return;
  if (action === 'play') return tour.timer ? pauseTour() : playTour();
  // A step keeps the player as it was: playing on from where it lands, or paused there.
  const was = !!tour.timer;
  pauseTour();
  if (tour.journey) endJourney();
  const s = tourSection(), t = cursorOf(tour.ex), first = sectionAfter(-1, 1) ?? 0, last = sectionAfter(tour.sections.length, -1) ?? tour.sections.length - 1;
  const land = i => { enterSection(i); if (was) playTour(); };
  if (action === 'prev') return land((t > s.from || tour.shown.length > 1 || tour.ended) && sectionOn(tour.index) ? tour.index : sectionAfter(tour.index, -1) ?? first);
  if (action === 'first') return land(first);
  if (action === 'last') return land(last);
  const next = sectionAfter(tour.index, 1);
  if (action === 'next' && next != null) return land(next);
  // The end: the last section played, at its last candle, every text read.
  seekTour(last, { t: Infinity, shown: Infinity });
  tour.ended = true;
  updateTourPanel();
}

async function renderTourPage(chapter) {
  const main = document.getElementById('main');
  selected.clear();
  pauseTour();
  currentPage = 'Tour';
  if (tours.Tour) tour = tours.Tour;
  const show = body => {
    main.innerHTML = `<section class="term-head"><h2 data-tour="title">${esc(tours.Tour?.def.title || 'Tour')}</h2>
      <p class="remarks">A scripted replay, read from <code>tour.json</code> and changed with the editor beside the chart. Candles are numbered
      from the tour's start: the crosshair shows a candle's number.</p></section>${body}`;
    renderLayers(); wireReplayExamples(main); drawAll(currentPage);
  };

  if (!serverOn) {
    show(`<div class="empty" data-server-check>Checking for the local server…</div>`);
    return checkLocalServer();
  }
  if (!tours.Tour) {
    show('<div class="empty">Loading the tour…</div>');
    try { tour = tours.Tour = await (tourLoading ??= loadTour()); }
    catch (e) {
      tourLoading = null;
      if (currentPage === 'Tour') show(`<div class="empty">The tour could not be loaded: ${esc(e.message)}.</div>`);
      return;
    }
    if (currentPage !== 'Tour') return;
  }

  const ex = tour.ex;
  show(`<div data-tour="errors"></div>
    <nav class="tour-chapters" aria-label="Chapters" data-tour="chapters"></nav>
    <article class="example replay-big" id="ex-${esc(ex.id)}">
      <header><h3 data-tour="chapter"></h3><span class="id" data-tour="where"></span></header>
      ${playerPanel('Tour')}
      ${chartRow(ex)}
      <div class="tour-warning" data-tour="warning" hidden></div>
    </article>`);
  wirePlayerPanel(main);
  renderTourGlossary();
  if (!videoMode) requestNarration();
  editorSection = -1;
  const wanted = tour.chapters.find(c => c.slug === chapter), first = wanted ? wanted.section : tour.index;
  // Opening the page shows its section's view at once, with no zoom to it.
  tour.view = tour.sections[first]?.view ?? tour.view;
  tour.zoom = null;
  seekTour(first);
  if (tour.wanted.length) resolveTour();
}

// The tour's audio and video are made by the local server, which runs tools/tour-video. The texts are read aloud without
// being asked: when the tour is saved, when the Tour page opens and when Voice is turned on, the server reads whichever
// have no clip yet or were changed, which is all that Voice needs. Generate video does that and then records the tour, for
// Download video to fetch. The page asks how it is going until it is done, then loads the clips again.
let tourExport = null, tourExportNote = '', tourExportPoll = null;

async function refreshTourExport(start = false) {
  const response = await fetch('api/video', { method: start ? 'POST' : 'GET' }).catch(() => null), was = tourExport;
  tourExport = response?.ok ? await response.json() : null;
  if (start && !tourExport) tourExportNote = 'The local server was started before it could make the video. Restart ./build-site.ps1 -Serve.';
  clearTimeout(tourExportPoll);
  if (tourExport?.running && currentPage === 'Tour') tourExportPoll = setTimeout(refreshTourExport, 2000);
