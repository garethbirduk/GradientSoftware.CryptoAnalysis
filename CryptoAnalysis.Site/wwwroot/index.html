    Object.assign(a, { queue: [], shown: [], fired: new Set(), active: null, activeUntil: 0, done: false });
  } else if (t !== a.t) {
    const before = a.cues.filter(c => c.when < t);
    Object.assign(a, { queue: [], shown: before, fired: new Set(before), active: null, activeUntil: 0 });
  }
  Object.assign(a, { t, playing: true, nextCandle: 0 });
  a.ex.pins = analysisPins(a, a.shown);
  moveTo(a.ex, t);
  for (const c of a.cues) if (!a.fired.has(c) && c.when <= t) { a.fired.add(c); a.queue.push(c); }
  // The text on show gets its reading time again, and is read aloud from its start.
  if (a.active) { a.activeUntil = performance.now() + holdOf(a.active) * 1000; speakAnalysis(a.active); }
  a.timer = setInterval(analysisTick, TOUR_TICK);
  updateAnalysisBar();
}

// Straight to the end: the cursor on the last candle and every text taken as read, so the replay controls are there.
function skipAnalysis() {
  const a = analysis;
  if (!a?.cues) return;
  pauseAnalysis();
  a.player?.pause();
  Object.assign(a, { t: a.until, queue: [], shown: [...a.cues], fired: new Set(a.cues), active: null, activeUntil: 0, done: true, speaking: false });
  moveTo(a.ex, a.until);
  updateAnalysisBar();
}

// Whether an analysis has the cursor: from when it is asked for until it has ended. The replay controls are hidden for
// that long, as on a tour, and come back at its end to step on or back from there.
const analysisRuns = () => currentPage === 'Analysis' && !!analysis && !analysis.done && !analysis.error;

function pauseAnalysis() {
  const a = analysis;
  if (!a?.playing) return;
  clearInterval(a.timer);
  a.player?.pause();
  Object.assign(a, { playing: false, timer: null, speaking: false });
  updateAnalysisBar();
}

function closeAnalysis() {
  const a = analysis;
  if (!a) return;
  pauseAnalysis();
  delete a.ex.pins;
  delete a.ex.pinRoom;
  if (a.zoomBefore !== undefined) { if (a.zoomBefore) zooms.set(a.ex.id, a.zoomBefore); else zooms.delete(a.ex.id); }
  analysis = null;
  document.body.classList.remove('analysing');
  const bar = document.querySelector('[data-analysis]');
  if (bar) bar.hidden = true;
  if (currentPage === 'Analysis') { syncLayerButtons(); drawAll('Analysis'); }
}

const analysisSpeaks = (a, cue) => voiceOn() && !cue.silent && !!a.audio[textKey(cue.text)];

function speakAnalysis(cue) {
  const a = analysis;
  if (!analysisSpeaks(a, cue)) {
    if (voiceOn() && !cue.silent && performance.now() - a.audioAt > 2000) loadAnalysisAudio(a);
    return;
  }
  a.player?.pause();
  const player = a.player = new Audio(`tour-audio/${a.audio[textKey(cue.text)].file}`), done = () => { if (a.player === player) a.speaking = false; };
  player.playbackRate = tourPace().voice;
  player.addEventListener('ended', done);
  player.addEventListener('error', done);
  a.speaking = true;
  player.play().catch(done);
}

function toggleAnalysisVoice() {
  state.tourVoice = !voiceOn();
  save(state);
  if (analysis && !voiceOn()) { analysis.player?.pause(); analysis.speaking = false; }
  if (analysis && voiceOn()) loadAnalysisAudio(analysis);
  updateAnalysisBar();
}

// One beat of a playing analysis: the next text once the one on show has been read, else the next candle, else it ends.
// A text that is read aloud waits for the voice to finish the one before; the candles wait for both.
function analysisTick() {
  const a = analysis;
  if (!a?.playing) return;
  if (currentPage !== 'Analysis') return closeAnalysis();
  const ex = a.ex, t = cursorOf(ex), now = performance.now();
  // The cursor moved by hand: the analysis waits, and Play carries on from there.
  if (t !== a.t) return pauseAnalysis();
  const holding = a.active && now < a.activeUntil;
  if (a.queue.length) {
    if (holding || (a.speaking && analysisSpeaks(a, a.queue[0]))) return;
    // With Voice on, a text waits for its clip, which the server may still be reading: twenty seconds at most.
    if (voiceOn() && !a.queue[0].silent && !a.audio[textKey(a.queue[0].text)] && now - (a.waitingSince ??= now) < 20000) {
      if (now - a.audioAt > 500) loadAnalysisAudio(a);
      return;
    }
    a.waitingSince = null;
    const cue = a.queue.shift(), clip = cue.silent ? null : a.audio[textKey(cue.text)];
    // The same seconds as on the Tour page: its own, else the length of its clip, else the time it takes to read.
    cue.clip = cue.given == null && clip?.seconds > 0 ? clip.seconds : 0;
    cue.hold = cue.given ?? (clip?.seconds > 0 ? clip.seconds + TOUR_PACES[1].gap : readingSeconds(cue.text));
    Object.assign(a, { active: cue, activeUntil: now + holdOf(cue) * 1000, nextCandle: 0 });
    a.shown.push(cue);
    speakAnalysis(cue);
    if (cue.on != null) { ex.pins = analysisPins(a, a.shown); redrawExample(ex); }
    return updateAnalysisBar();
  }
  if (holding || a.speaking) return;
  if (t >= a.until) {
    a.done = true;
    return pauseAnalysis();
  }
  if (!timelineAt(ex, t + 1)) { a.nextCandle = 0; return prefetch(ex, t + 1); }
  if (now < a.nextCandle) return;
  // A beat takes every candle that has come due since the last, but never past a text's candle or the end.
  const gap = 1000 / (a.speed * tourPace().candles), late = now - a.nextCandle, inStep = a.nextCandle > 0 && late < 1000;
  const due = inStep ? 1 + Math.floor(late / gap) : 1;
  const stop = Math.min(a.until, t + due, ...a.cues.filter(c => c.when > t && !a.fired.has(c)).map(c => c.when));
  let to = t + 1;
  while (to < stop && timelineAt(ex, to + 1)) to++;
  a.nextCandle = inStep && to - t === due ? a.nextCandle + due * gap : now + gap;
  a.t = to;
  moveTo(ex, to);
  for (const c of a.cues) if (!a.fired.has(c) && c.when <= to) { a.fired.add(c); a.queue.push(c); }
}

function updateAnalysisBar() {
  const bar = document.querySelector('[data-analysis]'), a = analysis;
  document.body.classList.toggle('analysing', analysisRuns());
  if (!bar || !a) return;
  const part = name => bar.querySelector(`[data-an="${name}"]`), button = name => bar.querySelector(`[data-an-go="${name}"]`);
  const caption = [...a.shown].reverse().find(c => c.on == null);
  part('caption').textContent = a.error ? `The analysis could not be written: ${a.error.replace(/\.$/, '')}.` : !a.cues ? (a.reading ? 'Reading the first text aloud…' : 'Writing the analysis…') : caption?.text ?? '';
  part('caption').classList.toggle('warn', !!a.error);
  part('title').textContent = a.cues ? `${a.title}${a.done ? ' · ended' : ''}` : '';
  button('play').textContent = a.playing ? '❚❚' : '▶';
  button('play').setAttribute('aria-label', a.playing ? 'Pause (Space)' : 'Play (Space)');
  button('play').disabled = button('restart').disabled = !a.cues;
  button('skip').disabled = !a.cues || a.done;
  button('voice').setAttribute('aria-pressed', voiceOn());
  button('similar').hidden = a.params.explain !== 'Trend' || !a.cues;
  const pace = TOUR_PACES.indexOf(tourPace());
  part('pace').value = pace;
  part('pace-name').textContent = TOUR_PACES[pace].name;
}

function findExample(id) {
  return DATA.examples.find(e => e.id === id) ?? DATA.structure?.examples?.find(e => e.id === id) ?? DATA.interims?.examples?.find(e => e.id === id)
    ?? replayDatasets.find(e => e.id === id) ?? analysisDatasets.find(e => e.id === id) ?? tour?.scenes?.find(sc => sc.ex?.id === id)?.ex ?? (tour?.ex.id === id ? tour.ex : undefined);
}

// ---- Tour ------------------------------------------------------------------------------------------------------------
// A scripted walk through a dataset, read from tour.json: a start state, then sections that each say which layers are on,
// how far the replay runs and what text appears. A section begins where the one before it ended, so the tour plays as one
// continuous replay. Candles are numbered from the tour's start time (#0), and the structure is anchored there too.
//   start    time (the dataset time of #0), view (the first and last candle the chart shows, as [0, 168]), speed (candles
//            a second) and layers.
//   section  chapter (starts a chapter, which has a link of its own), layers (replaces the layers) or add and remove,
//            from (the candle the section starts at; without it, where the section before ended: an earlier candle takes
//            the replay back), until (the candle the replay runs to; without it the replay stays where it is), view
//            (without it, the view as before), speed, cues. A section can be come to by a journey in place of from:
//            fastForward { to, speed, draw } or rewind { to, speed, erase }. The view eases out to hold the whole way,
//            the replay runs to the candle "to" at that many candles a second, drawing or erasing as it goes, and the view
//            eases in to the section's own. With draw or erase false the replay stays where it is and only the view moves.
//            A section with explain ("Candle", "Swing" or "Trend"), at (the candle) and level (the sawtooth level, 1 unless
//            given) has its view, layers, until and texts written by the local server from the prices (see Explain in
//            CryptoAnalysis.Site); what it says for itself wins, and texts of its own follow the written ones.
//   cue      text, shown under the chart as the section begins; with at, when the replay reaches that candle, which waits
//            there while the text is read; with on as well ('open', 'high', 'low', 'close' or a price), pinned to that
//            point of the candle (place: 'above', 'below', 'left' or 'right'). hold is the seconds the text stays before
//            the next, by default the time it takes to read (0 moves straight on, leaving the caption up while pins show); keep is how long a pin stays: 'section', 'chapter' or 'always'.
const DEFAULT_VIEW = [0, 168];
// Candles a second of a fast forward or rewind that does not say.
const JOURNEY_SPEED = 50;
const LAYER_ALIASES = { candles: 'price', closes: 'close' };
// How the editor writes a layer whose id is not what it is called on the page.
const LAYER_NAMES = { price: 'candles' };
const PIN_PRICES = { open: 'o', high: 'h', low: 'l', close: 'c' };
const PIN_PLACES = { above: [0, -55], below: [0, 55], left: [-70, 0], right: [70, 0] };
const TOUR_TICK = 40;
// The Speed slider's three paces: how fast the voice reads (its clips are played that much faster or slower, at the same
// pitch), how fast the candles run against the section's speed, and the seconds a text stays after it has been read.
const TOUR_PACES = [{ name: 'Slower', voice: 0.9, candles: 0.6, gap: 0.4 }, { name: 'Normal', voice: 1, candles: 1, gap: 0.15 }, { name: 'Faster', voice: 1.1, candles: 1.6, gap: 0.05 }];
let tour = null, tourLoading = null;
// Opened with ?video, the page shows the tour alone, for tools/tour-video to record.
const videoMode = new URLSearchParams(location.search).has('video');
// Opened with ?explain=Swing&dataset=btc-1h&at=2023-01-03T00:00&level=1, the Tour page plays a tour written by the local
// server around that one thing (a Candle, or the Swing or Trend at that level the candle is in) instead of tour.json (see
// Explain in CryptoAnalysis.Site); it can be edited here but not saved.
const writtenTour = (q => q.has('explain') ? { explain: q.get('explain'), dataset: q.get('dataset') ?? '', at: q.get('at') ?? '', level: q.get('level') ?? '1', ...(q.has('seen') ? { seen: q.get('seen') } : {}) } : null)(new URLSearchParams(location.search));

// The short hash of a text that names its narration clip in tour-audio (FNV-1a, 32 bits; the same as tools/tour-video).
function textKey(text) {
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}

// What the voice says in place of what is written, from the tour's glossary (the same as tools/tour-video): an entry stands
// for a whole word in the case it is written in, and the longest entry that fits is used. Where an entry starts or ends
// with punctuation, as ":00" does, that side may touch a word.
function spokenText(def) {
  const entries = Object.entries(def.glossary ?? {}).map(([from, to]) => [from.trim(), String(to)]).filter(([from]) => from)
    .sort((a, b) => b[0].length - a[0].length);
  if (!entries.length) return text => text;
  const lookup = new Map(entries), escaped = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const wordy = /[\p{L}\p{N}_]/u, whole = from => `${wordy.test(from[0]) ? '(?<![\\p{L}\\p{N}_])' : ''}${escaped(from)}${wordy.test(from.at(-1)) ? '(?![\\p{L}\\p{N}_])' : ''}`;
  const words = new RegExp(entries.map(([from]) => whole(from)).join('|'), 'gu');
  const said = (match, at, text) => {
    const to = lookup.get(match);
    return to && wordy.test(to[0]) && wordy.test(text[at - 1] ?? '') ? ` ${to}` : to;
  };
  return text => text.replace(words, said).replace(/\s+([.,;:!?])/g, '$1').replace(/ {2,}/g, ' ').trim();
}

const slugOf = name => name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const readingSeconds = text => Math.max(2.5, text.length / 14);
const tourSection = () => tour.sections[tour.index];

// Every section's full state, worked out from the start state and the sections before it, so any section can be entered
// directly. Whatever the tour gets wrong is listed rather than guessed at.
// A candle in the file is a number, or an event to wait for from a candle on: { "event": "BullishBreakOfStructure",
// "level": 1, "nth": 1 }, the nth time that becomes known at that level. The local server looks those up, one lookup for
// each event and starting candle (see resolveTour), and until it has, the section is listed as waiting.
const eventKey = (spec, from, scene = 0) => `${scene}|${spec.event}|${spec.level ?? 1}|${spec.nth ?? 1}|${from}`;
const eventName = (spec, from) => `${{ 1: 'the first', 2: 'the second', 3: 'the third' }[spec.nth ?? 1] ?? `the ${spec.nth}th`} ${TERMS.get(spec.event)?.name ?? spec.event} at level ${spec.level ?? 1} after #${from}`;

// A text stays for its narration clip's length when there is one (plus a breath), else for the time it takes to read.
function compileTour(def, scenes, resolved = new Map(), audio = {}) {
  const errors = [], known = new Set(LAYERS.map(l => l.id)), chapters = [], wanted = [];
  // The scene the sections are in, and how many candles it has.
  let scene = 0, candles = scenes[0]?.ex.prices.t.length ?? 0;
  // A candle number as given, or looked up for an event; null when it is not known (yet).
  const candle = (v, from, where, field) => {
    if (v == null || typeof v === 'number') return { index: v ?? null, spec: null };
    if (typeof v !== 'object' || !TERMS.has(v.event)) { errors.push(`${where}: ${field} must be a candle number or a known event`); return { index: null, spec: null }; }
    const key = eventKey(v, from, scene), spec = eventName(v, from);
    if (!resolved.has(key)) { wanted.push({ key, spec: v, from, scene }); errors.push(`${where}: ${field} is being looked up: ${spec}`); return { index: null, spec }; }
    if (resolved.get(key) == null) errors.push(`${where}: ${field} waits for ${spec}, which does not happen`);
    return { index: resolved.get(key), spec: `${spec} → #${resolved.get(key)}` };
  };
  const ids = (list, where) => (list ?? []).map(id => LAYER_ALIASES[id] ?? id).filter(id => known.has(id) || void errors.push(`${where}: unknown layer "${id}"`));
  const range = (v, where) => Array.isArray(v) && v.length === 2 && v.every(Number.isInteger) && v[0] >= 0 && v[1] > v[0] ? v
    : (errors.push(`${where}: the view is the first and last candle shown, the last after the first`), null);
  const renamed = (o, where) => { if (o.window != null) errors.push(`${where}: "window" is now "view", the first and last candle shown`); };
  const rate = (s, where) => s > 0 ? s : (errors.push(`${where}: speed must be more than 0`), 4);
  const start = def.start ?? {}, startLayers = ids(start.layers, 'start');
  const startView = (start.view != null ? range(start.view, 'start') : null) ?? DEFAULT_VIEW;
  let layers = startLayers, view = startView, speed = rate(start.speed ?? 4, 'start'), at = 0;
  renamed(start, 'start');

  const sections = (def.sections ?? []).map((given, i) => {
    const where = `section ${i + 1}`;
    let s = given;
    if (s.chapter) chapters.push({ name: s.chapter, slug: slugOf(s.chapter), section: i });
    // A section that begins a scene starts a replay of its own: the candles count from #0 again and the view starts afresh.
    if (s.scene != null) {
      scene++;
      const sc = scenes[scene];
      if (typeof s.scene !== 'object' || !s.scene.time) errors.push(`${where}: a scene is { "dataset", "time" }, on the tour's dataset unless one is given`);
      else if (!sc) errors.push(`${where}: the scene could not be set up`);
      else if (sc.missing) errors.push(`${where}: the server has no dataset "${sc.dataset}", so the scene plays on the tour's own`);
      else if (sc.ex.prices.t.length < 2) errors.push(`${where}: the scene's time is past the end of its dataset`);
      candles = sc?.ex.prices.t.length ?? candles;
      at = 0;
      view = DEFAULT_VIEW;
    }
    // A section that explains something is written out by the local server from the prices of its scene (see resolveTour),
    // one writing for each section and the candle it starts from; until it has been, the section is listed as waiting.
    if (s.explain != null) {
      const from = Number.isInteger(s.from) ? s.from : at, key = `explain|${scene}|${from}|${JSON.stringify(s)}`;
      if (!resolved.has(key)) { wanted.push({ key, explain: s, from, scene, where }); errors.push(`${where}: the texts explaining ${s.explain} are being written`); }
      else errors.push(...resolved.get(key).errors);
      s = resolved.get(key)?.section ?? { ...s, cues: [] };
    }
    if (s.layers) layers = ids(s.layers, where);
    const removed = ids(s.remove, where);
    layers = [...new Set([...layers, ...ids(s.add, where)])].filter(id => !removed.includes(id));
    const viewBefore = view;
    if (s.view != null) view = range(s.view, where) ?? view;
    renamed(s, where);
    if (s.speed != null) speed = rate(s.speed, where);
    // A journey takes the tour to where the section starts (see journeyTick): one that runs sets the section's first candle.
    const forward = s.fastForward != null, trip = s.fastForward ?? s.rewind ?? null, tripName = forward ? 'fast forward' : 'rewind';
    let journey = null;
    if (s.fastForward != null && s.rewind != null) errors.push(`${where}: a section fast forwards or rewinds, not both`);
    if (trip != null && s.scene != null) errors.push(`${where}: a section that begins a scene has no journey: the scene starts a new replay`);
    if (trip != null && typeof trip !== 'object') errors.push(`${where}: a ${tripName} is { "to", "speed", "${forward ? 'draw' : 'erase'}" }`);
    else if (trip) {
      const runs = trip[forward ? 'draw' : 'erase'] !== false, there = Number.isInteger(trip.to) && trip.to >= 0 && trip.to < candles && (forward ? trip.to > at : trip.to < at);
      if (runs && !there) errors.push(`${where}: the ${tripName} needs "to", a candle ${forward ? 'after' : 'before'} #${at}, where the section before ends`);
      if (runs && s.from != null) errors.push(`${where}: the ${tripName} takes the replay to where the section starts, so the section has no "from"`);
      const run = runs && there, ends = run ? [at, trip.to] : [];
      journey = { forward, run, start: at, to: run ? trip.to : null, speed: trip.speed != null ? rate(trip.speed, where) : JOURNEY_SPEED,
        wide: [Math.min(viewBefore[0], view[0], ...ends), Math.max(viewBefore[1], view[1], ...ends)] };
    }
    const fromGiven = journey?.run ? { index: journey.to, spec: `${tripName} → #${journey.to}` } : candle(s.from, at, where, 'from'), from =Number.isInteger(fromGiven.index) && fromGiven.index >= 0 && fromGiven.index < candles ? fromGiven.index : at;
    if (fromGiven.index != null && fromGiven.index !== from) errors.push(`${where}: from #${fromGiven.index} is not a candle of the tour, which has #0 to #${candles - 1}`);
    const untilGiven = candle(s.until, from, where, 'until'), until = untilGiven.index ?? from;
    if (until < from) errors.push(`${where}: until #${until} is before the section's start, #${from}`);
    if (until >= candles) errors.push(`${where}: until #${until} is past the last candle, #${candles - 1}`);
    at = Math.max(from, Math.min(until, candles - 1));

    const cues = (s.cues ?? []).map((c, j) => {
      const what = `${where}, text ${j + 1}`, text = c.text ?? '';
      if (!text) errors.push(`${what}: no text`);
      const atGiven = candle(c.at, from, what, 'at');
      if (atGiven.index != null && (atGiven.index < 0 || atGiven.index > at)) errors.push(`${what}: at #${atGiven.index} is not reached, as the section ends at #${at}`);
      if (c.on != null && c.at == null) errors.push(`${what}: a pin needs a candle`);
      if (c.on != null && typeof c.on !== 'number' && !PIN_PRICES[c.on]) errors.push(`${what}: unknown "on" "${c.on}"`);
      if (c.place != null && !PIN_PLACES[c.place]) errors.push(`${what}: unknown place "${c.place}"`);
      if (!['section', 'chapter', 'always'].includes(c.keep ?? 'section')) errors.push(`${what}: unknown keep "${c.keep}"`);
      if (c.voice != null && typeof c.voice !== 'boolean') errors.push(`${what}: voice is true or false`);
      // A line: from the pinned point to another candle's point, shown when the replay reaches the line's end.
      let to = null;
      if (c.to != null) {
        const toGiven = typeof c.to === 'object' ? candle(c.to.at, from, what, 'to') : { index: null, spec: null };
        if (typeof c.to !== 'object' || c.to.at == null || c.on == null) errors.push(`${what}: a line needs a pinned candle and "to": { "at", "on" }, the candle and point it runs to`);
        else if (toGiven.index != null && (toGiven.index < 0 || toGiven.index > at)) errors.push(`${what}: the line's end, #${toGiven.index}, is not reached, as the section ends at #${at}`);
        if (c.to?.on != null && typeof c.to.on !== 'number' && !PIN_PRICES[c.to.on]) errors.push(`${what}: unknown "on" "${c.to.on}" for the line's end`);
        to = { at: toGiven.index, atSpec: toGiven.spec, on: c.to?.on ?? c.on ?? 'close' };
      }
      if (c.heads != null && (typeof c.heads !== 'object' || Object.keys(c.heads).some(k => k !== 'start' && k !== 'end'))) errors.push(`${what}: heads is { "start", "end" }, true or false each`);
      // A text with "voice": false is shown but not read aloud, so it stays for the time it takes to read.
      const silent = c.voice === false, clip = silent ? null : audio[textKey(text)];
      return { text, at: atGiven.index, atSpec: atGiven.spec, on: c.on ?? null, place: c.place ?? null, keep: c.keep ?? 'section', silent,
        to, heads: { start: c.heads?.start === true, end: c.heads?.end !== false }, color: c.color ?? null,
        clip: !(c.hold >= 0) && clip?.seconds > 0 ? clip.seconds : 0,
        hold: c.hold >= 0 ? c.hold : clip?.seconds > 0 ? clip.seconds + TOUR_PACES[1].gap : readingSeconds(text) };
    });
    return { index: i, chapter: chapters.length - 1, scene, layers, view, speed, journey, from, fromSpec: fromGiven.spec, until: at, untilSpec: untilGiven.spec, cues };
  });
  return { chapters, sections, errors, startLayers, startView, wanted };
}

// Looks up the events a compiled tour is waiting for, then compiles again, until nothing is waiting: a lookup can move a
// section's start, and with it what the next section waits from.
async function resolveTour(retry = 0) {
  const scenes = tour.scenes, pending = tour.wanted;
  if (!pending.length || retry > 12) return;
  tour.resolving = true;
  updateEditorStatus();
  for (const { key, spec, explain, from, scene, where } of pending) {
    if (tour.resolved.has(key)) continue;
    const ex = scenes[scene ?? 0]?.ex ?? scenes[0].ex;
    if (explain) {
      // The section as the tour has it goes to the server, which sends back the section to play, texts written.
      const body = JSON.stringify({ dataset: ex.dataset, anchor: ex.anchor, from, where, section: explain });
      const got = await fetch('api/explain', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body }).then(r => r.ok ? r.json() : null).catch(() => null);
      tour.resolved.set(key, got ? { section: got.section, errors: got.errors ?? [] } : { section: null, errors: [`${where}: the local server could not write the texts explaining ${explain.explain}`] });
      continue;
    }
    const query = `dataset=${encodeURIComponent(ex.dataset)}&anchor=${ex.anchor}&from=${from}&type=${encodeURIComponent(spec.event)}&level=${spec.level ?? 1}&nth=${spec.nth ?? 1}`;
    const found = await fetch(`api/event?${query}`).then(r => r.ok ? r.json() : null).catch(() => null);
    tour.resolved.set(key, found?.index ?? null);
  }
  tour.resolving = false;
  if (tour.scenes !== scenes || currentPage !== 'Tour') return;
  Object.assign(tour, compileTour(tour.def, scenes, tour.resolved, tour.audio));
  if (tour.wanted.length) return resolveTour(retry + 1);
  editorSection = -1;
  seekTour(tour.index, { t: cursorOf(tour.ex), shown: tour.shown.length });
  updateEditorMeta();
  updateEditorStatus();
}

// tour.json as it is on disk, with the short hash that names that version of it: Save sends the hash of the version the
// page started from, and the local server refuses to write over a file that is no longer that version.
const readTourFile = () => fetch('tour.json', { cache: 'no-store' }).then(r => r.text()).then(text => ({ def: JSON.parse(text), base: textKey(text) }));
// A written tour comes from the server instead, which says what is wrong with the request when it cannot write one.
const readWrittenTour = async () => {
  const r = await fetch(`api/explain/tour?${new URLSearchParams(writtenTour)}`, { cache: 'no-store' });
  const text = await r.text();
  if (!r.ok) throw new Error(r.status === 404 ? `the server has no dataset "${writtenTour.dataset}"` : text || `the server answered ${r.status}`);
  return { def: JSON.parse(text), base: textKey(text) };
};

// tour.json can change on disk while the page is open, as when it is edited by hand. Coming back to the page, the newer
// file is loaded at once when nothing here is unsaved (Undo brings back what was here); otherwise the editor says so.
async function checkTourFile() {
  if (currentPage !== 'Tour' || !tour || tour.checking || tour.recording || videoMode || writtenTour) return;
  tour.checking = true;
  const file = await readTourFile().catch(() => null);
  tour.checking = false;
  if (!file || file.base === tour.base) return;
  if (tourDirty()) {
    tour.note = 'tour.json has changed on disk since this page loaded it, so Save will not write over it. Revert loads the newer version.';
    return updateEditorStatus();
  }
  rememberTour();
  Object.assign(tour, { def: file.def, base: file.base, saved: JSON.stringify(file.def) });
  applyTour({ render: true });
}
window.addEventListener('focus', checkTourFile);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkTourFile(); });

// The tour's scenes: the start state is the first, and each section with "scene": { "dataset", "time" } begins another, a
// replay of its own on that dataset (the tour's unless given) from that time, with its candles numbered from #0 again.
function sceneSpecs(def) {
  const own = def.dataset ?? null;
  return [{ dataset: own, time: def.start?.time, section: -1 },
    ...(def.sections ?? []).flatMap((s, i) => s.scene != null ? [{ dataset: (typeof s.scene === 'object' && s.scene.dataset) || own, time: typeof s.scene === 'object' ? s.scene.time : undefined, section: i }] : [])];
}

async function loadTour() {
  const { def, base } = await (writtenTour ? readWrittenTour() : readTourFile());
  const list = await loadDatasets();
  if (!list.length) throw new Error('the server has no datasets');
  const audio = await fetch('tour-audio/index.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  const loaded = { def, base, audio, wholes: new Map(), scenes: [], ex: null, saved: JSON.stringify(def), history: [], lastEdit: null, picking: null, note: '', resolved: new Map(), resolving: false,
    index: 0, view: DEFAULT_VIEW, queue: [], shown: [], fired: new Set(), kept: [], active: null, activeUntil: 0, nextCandle: 0, timer: null,
    voice: { now: null, waiting: [] } };
  await loadTourDatasets(loaded);
  anchorTour(loaded);
  return Object.assign(loaded, compileTour(def, loaded.scenes, loaded.resolved, loaded.audio));
}

// Every dataset the tour's scenes name is loaded once; the tour's own falls back to the server's first dataset.
async function loadTourDatasets(t = tour) {
  const list = await loadDatasets();
  for (const spec of sceneSpecs(t.def)) {
    const key = spec.dataset ?? '', info = list.find(d => d.id === spec.dataset) ?? (spec.dataset === (t.def.dataset ?? null) ? list[0] : null);
    if (info && !t.wholes.has(key)) t.wholes.set(key, await loadDataset(info));
  }
}

// A scene's candles are its dataset's from its start time on, so a candle's number is its place in them. A new start time
// makes them anew, and what the server worked out from the old one is dropped. A scene whose dataset the server does not
// have plays on the tour's own, and the tour says so.
function anchorTour(t = tour) {
  const scenes = [], ids = new Set();
  let changed = false;
  for (const spec of sceneSpecs(t.def)) {
    const whole = t.wholes.get(spec.dataset ?? '') ?? t.wholes.get(t.def.dataset ?? '') ?? [...t.wholes.values()][0], missing = !t.wholes.has(spec.dataset ?? '');
    const time = axisTime(spec.time ?? ''), anchor = Number.isNaN(time) ? 0 : indexAtOrAfter(whole, time);
    const was = (t.scenes ?? []).find(sc => sc.ex?.dataset === whole.dataset && sc.ex.anchor === anchor && !ids.has(sc.ex.id));
    if (was) { ids.add(was.ex.id); scenes.push({ ...spec, missing, ex: was.ex }); continue; }
    changed = true;
    let id = scenes.length ? `Tour/${whole.dataset}@${anchor}` : `Tour/${whole.dataset}`;
    while (ids.has(id)) id += '+';
    ids.add(id);
    const cut = a => a.slice(anchor), p = whole.prices;
    remote.delete(id);
    zooms.delete(id);
    cursors.set(id, 0);
    scenes.push({ ...spec, missing, ex: { id, dataset: whole.dataset, anchor, tour: true, title: 'Tour', level: 1, expected: [], annotations: [],
      prices: { t: cut(p.t), o: cut(p.o), h: cut(p.h), l: cut(p.l), c: cut(p.c) } } });
  }
  // Events were looked up from the old starts, so they are looked up again.
  if (changed || scenes.length !== (t.scenes ?? []).length) { t.resolved?.clear(); eventCache.clear(); }
  t.scenes = scenes;
  if (!scenes.some(sc => sc.ex === t.ex)) t.ex = scenes[0].ex;
}

// The tour shows one scene's chart at a time: moving to a section of another scene swaps the chart's example for that
// scene's, where it was left.
function showScene(ex) {
  if (tour.ex === ex) return;
  const was = tour.ex;
  tour.ex = ex;
  tour.zoom = null;
  const el = document.querySelector(`.chart[data-id="${CSS.escape(was.id)}"]`);
  if (el) { el.dataset.id = ex.id; el.closest('article').id = `ex-${ex.id}`; }
  if (activeId === was.id) activeId = ex.id;
}

// The candles a section shows are its view, which is what the chart shows as the section begins, wherever the replay is.
// A replay that then runs past the end of the view takes the view along with it.
function sectionView(t) {
  const [first, last] = tour.view, moved = Math.max(0, t - Math.max(last, tourSection()?.from ?? 0));
  return [first + moved, last + moved];
}

// A view that is not the one on show is not cut to: the chart eases from the one to the other, so it reads as the same
// chart zooming or moving.
const TOUR_ZOOM_MS = 1500;

function tourView(t) {
  const view = sectionView(t), zoom = tour.zoom;
  if (!zoom) return view;
  const k = Math.min(1, (performance.now() - zoom.start) / TOUR_ZOOM_MS), eased = k < 0.5 ? 2 * k * k : 1 - (2 - 2 * k) ** 2 / 2;
  return view.map((v, i) => Math.round(zoom.from[i] + (v - zoom.from[i]) * eased));
}

function tourWindow(ex, t) {
  const [from, to] = tourView(t), last = ex.prices.t.length - 1;
  return { from: Math.min(from, last - 1), to: Math.min(Math.max(to, from + 1), last) };
}

function zoomTour(from) {
  tour.zoom = { from, start: performance.now() };
  if (tour.zooming) return;
  // The next frame is asked for before this one is drawn, so a frame that fails does not leave the view part way.
  const step = () => {
    tour.zooming = !!tour.zoom && performance.now() - tour.zoom.start < TOUR_ZOOM_MS;
    if (tour.zooming) requestAnimationFrame(step); else tour.zoom = null;
    if (currentPage === 'Tour') redrawExample(tour.ex);
  };
  tour.zooming = true;
  requestAnimationFrame(step);
}

// A drawn line: from the cue's pinned point to the point its "to" names, with the text in a box along it.
function lineOf(ex, cue) {
  const point = (at, on) => ({ time: ex.prices.t[at], price: typeof on === 'number' ? on : ex.prices[PIN_PRICES[on]]?.[at] });
  return { from: point(cue.at, cue.on), to: point(cue.to.at, cue.to.on), text: cue.text, heads: cue.heads, color: cue.color };
}

function pinOf(ex, cue) {
  return { time: ex.prices.t[cue.at], price: typeof cue.on === 'number' ? cue.on : ex.prices[PIN_PRICES[cue.on]]?.[cue.at], text: cue.text,
    place: cue.place ?? { high: 'above', low: 'below', open: 'left' }[cue.on] ?? 'right' };
}

// A pinned cue: its text in a box beside the point, with an arrow to it.
const pinLines = text => text.split(' ').reduce((out, word) => {
  if (out.length && `${out[out.length - 1]} ${word}`.length <= 30) out[out.length - 1] += ` ${word}`; else out.push(word);
  return out;
}, []);

// The room a pinned text's box needs above and below its point, in pixels, to be inside the chart.
function pinRoom(pin) {
  const box = pinLines(pin.text).length * 17 + 14, [, ay] = PIN_PLACES[pin.place] ?? PIN_PLACES.above, clear = 8;
  const beside = box / 2 + clear, beyond = Math.abs(ay) + box + clear;
  return { time: Date.parse(pin.time), price: pin.price, up: ay < 0 ? beyond : ay > 0 ? clear : beside, down: ay > 0 ? beyond : ay < 0 ? clear : beside };
}

function pinLabel(pin) {
  const accent = css('--accent'), [ax, ay] = PIN_PLACES[pin.place] ?? PIN_PLACES.above;
  return { x: pin.time, y: pin.price, text: pinLines(pin.text).join('<br>'), showarrow: true, arrowhead: 2, arrowwidth: 1.5, arrowcolor: accent, ax, ay,
    xanchor: { left: 'right', right: 'left' }[pin.place] ?? 'center', yanchor: { above: 'bottom', below: 'top' }[pin.place] ?? 'middle', align: 'left',
    bgcolor: css('--panel'), bordercolor: accent, borderpad: 5, font: { color: css('--text'), size: 13 } };
}

// The candle a cue is reached at: a line's end, a pin's candle, or none for a text shown as the section begins.
const cueAt = c => c.to?.at ?? c.at;

// Moves the replay to a candle and queues the cues it has reached: text with no candle is reached as the section begins.
function advanceTo(t) {
  const s = tourSection(), ex = tour.ex;
  cursors.set(ex.id, t);
  prefetch(ex, t);
  for (const c of s.cues) if (!tour.fired.has(c) && (cueAt(c) ?? s.from) <= t) { tour.fired.add(c); tour.queue.push(c); }
}

function showNextCue() {
  const cue = tour.queue.shift();
  if (!cue) return;
  tour.active = cue;
  tour.activeUntil = performance.now() + holdOf(cue) * 1000;
  tour.shown.push(cue);
  speak(cue);
}

// Reads a text aloud from its clip in tour-audio, when the Voice button is on and the tour is playing. One text is read at
// a time: a text shown while another is being read waits for it rather than cutting it off, and its time on show starts
// as its reading does. A recording makes no sound but keeps the same time, and notes when each reading began, which is
// where tools/tour-video lays the clip.
function speak(cue) {
  if (!tour.timer || !(voiceOn() || tour.recording)) return hush();
  if (cue.silent || !tour.audio[textKey(cue.text)]) return;
  if (tour.voice.now) tour.voice.waiting.push(cue); else readAloud(cue);
}

function readAloud(cue) {
  const clip = tour.audio[textKey(cue.text)], turn = tour.voice.now = { timer: null };
  const done = () => {
    if (tour.voice.now !== turn) return;
    tour.voice.now = null;
    if (tour.voice.waiting.length) readAloud(tour.voice.waiting.shift());
  };
  if (cue === tour.active) tour.activeUntil = performance.now() + cue.hold * 1000;
  if (tour.recording) {
    tour.recording.cues.push({ key: textKey(cue.text), at: Date.now() });
    turn.timer = setTimeout(done, clip.seconds * 1000);
    return;
  }
  tour.player = new Audio(`tour-audio/${clip.file}`);
  tour.player.playbackRate = tourPace().voice;
  tour.player.addEventListener('ended', done);
  tour.player.addEventListener('error', done);
  tour.player.play().catch(done);
}

function hush() {
  tour.player?.pause();
  clearTimeout(tour.voice.now?.timer);
  tour.voice = { now: null, waiting: [] };
}

const voiceOn = () => state.tourVoice === true;

// The pace the Speed slider is set to. A recording is always made at Normal, as its clips are laid at their own length.
const tourPace = () => tour?.recording || videoMode ? TOUR_PACES[1] : TOUR_PACES[state.tourPace] ?? TOUR_PACES[1];
// The seconds a text stays at the slider's pace: the length of its clip as played and the gap after it, else its own
// seconds, which are a reading time and go with the voice.
const holdOf = cue => { const pace = tourPace(); return cue.clip ? cue.clip / pace.voice + pace.gap : cue.hold / pace.voice; };

function setTourPace(value) {
  state.tourPace = Number(value);
  save(state);
  if (tour?.player) tour.player.playbackRate = tourPace().voice;
  if (analysis?.player) analysis.player.playbackRate = tourPace().voice;
  updateTourPanel();
  updateAnalysisBar();
}

// What tools/tour-video drives: plays the whole tour once and reports when each text and chapter appeared.
window.tourVideo = {
  ready: () => currentPage === 'Tour' && !!tour?.sections.length && !tour.wanted.length && !viewFor(tour.ex).loading,
  play: () => new Promise(resolve => {
    pauseTour();
    tour.recording = { started: Date.now(), cues: [], chapters: [] };
    tour.onEnd = () => { const done = { ...tour.recording, ended: Date.now() }; tour.recording = null; resolve(done); };
    enterSection(0);
    playTour();
  }),
};

// Sets the tour at the start of a section, with nothing of it shown yet. A section that has a journey is set at the end of
// it, unless the journey is to be played: then the tour is left where the journey starts, with the view easing out.
function openSection(i, { journey = false } = {}) {
  const s = tour.sections[i], switched = (tour.scenes[s.scene] ?? tour.scenes[0]).ex !== tour.ex;
  // Another scene is a cut, not a move: its chart comes up at the section's view with nothing to ease from.
  if (switched) showScene((tour.scenes[s.scene] ?? tour.scenes[0]).ex);
  const ex = tour.ex, shown = switched ? s.view : tourView(cursorOf(ex)), moved = i !== tour.index;
  Object.assign(tour, { index: i, view: s.view, queue: [], shown: [], fired: new Set(), active: null, activeUntil: 0, nextCandle: 0, journey: null });
  // Pins kept from earlier sections belong to this scene's chart only.
  tour.kept = tour.sections.slice(0, i).filter(earlier => earlier.scene === s.scene).flatMap(earlier => earlier.cues.filter(c => c.on != null
    && (c.keep === 'always' || (c.keep === 'chapter' && earlier.chapter === s.chapter))));
  // While a candle is being picked, the candles still to come are shown, to pick from.
  tourLayers = ['replay', ...s.layers, ...(tour.picking ? ['future'] : [])];
  const chapter = tour.chapters[s.chapter];
  if (chapter?.section === i) tour.recording?.chapters.push({ name: chapter.name, at: Date.now() });
  history.replaceState(null, '', chapter ? `#Tour/${chapter.slug}` : '#Tour');
  if (journey && s.journey) {
    const t = s.journey.run ? s.journey.start : s.from;
    cursors.set(ex.id, t);
    prefetch(ex, t);
    // Only the texts with no candle are read on the way: the others wait for the journey's end.
    for (const c of s.cues) if (c.at == null) { tour.fired.add(c); tour.queue.push(c); }
    Object.assign(tour, { view: s.journey.wide, journey: { ...s.journey, phase: 'out' } });
    zooms.delete(ex.id);
    // A view that already holds the whole way has no easing out to do.
    if (shown[0] !== tour.view[0] || shown[1] !== tour.view[1]) zoomTour(shown);
    return;
  }
  advanceTo(s.from);
  // The section sets the view: the chart eases to it, and a zoom or pan made by hand goes.
  const view = sectionView(s.from), changed = view[0] !== shown[0] || view[1] !== shown[1];
  if (moved || changed) zooms.delete(ex.id);
  if (changed) zoomTour(shown);
}

function enterSection(i, how) {
  openSection(i, how);
  showNextCue();
  refreshTour();
}

// One beat of a journey. The view has eased out to hold the whole way. A journey that runs sets off as the last of the
// section's texts with no candle comes on show, so that text is read over it, and takes as many candles in a beat as its
// speed asks; a journey of the view alone waits for its texts to be read. Then the view eases in to the section's own and
// the section carries on from there.
function journeyTick(s, ex, now, reading) {
  const j = tour.journey, t = cursorOf(ex);
  if (tour.zoom) return;
  if (j.phase === 'in') return endJourney();
  if (j.phase === 'out') Object.assign(j, { phase: 'wide', since: now });
  if (tour.queue.length) return;
  if (j.run && t !== j.to) {
    const step = j.forward ? 1 : -1;
    if (!timelineAt(ex, t + step)) { tour.nextCandle = 0; return prefetch(ex, t + step); }
    if (now < tour.nextCandle) return;
    const gap = 1000 / (j.speed * tourPace().candles), late = now - tour.nextCandle, inStep = tour.nextCandle > 0 && late < 1000;
    const due = Math.min(Math.abs(j.to - t), inStep ? 1 + Math.floor(late / gap) : 1);
    let n = 1;
    while (n < due && timelineAt(ex, t + (n + 1) * step)) n++;
    tour.nextCandle = inStep && n === due ? tour.nextCandle + due * gap : now + gap;
    cursors.set(ex.id, t + n * step);
    prefetch(ex, t + n * step);
    return refreshTour();
  }
  // With nothing to run, the wider view stays for its texts, or for a moment when there are none.
  if (!j.run && (reading || now - j.since < 1000)) return;
  j.phase = 'in';
  tour.view = s.view;
  if (j.wide[0] !== s.view[0] || j.wide[1] !== s.view[1]) zoomTour(j.wide);
}

// The end of a journey, or of one cut short by a step made by hand: the section as it starts.
function endJourney() {
  const s = tourSection();
  Object.assign(tour, { journey: null, view: s.view, nextCandle: 0 });
  advanceTo(s.from);
  refreshTour();
}

// Puts the tour at a place in a section: a candle and how many of the section's texts have been shown, or the point at
// which one of its texts appears. An edit uses this to leave the tour where it was, or to show what was edited.
function seekTour(i, { t = 0, shown = 1, cue = null } = {}) {
  if (!tour.sections.length) {
    Object.assign(tour, { index: 0, queue: [], shown: [], fired: new Set(), kept: [], active: null });
    tourLayers = ['replay', ...tour.startLayers];
    cursors.set(tour.ex.id, 0);
    return refreshTour();
  }
  openSection(Math.max(0, Math.min(i, tour.sections.length - 1)));
  const s = tourSection(), target = cue == null ? null : s.cues[cue];
  const pending = () => s.cues.filter(c => !tour.fired.has(c)).map(cueAt);
  if (target) {
    while (!tour.shown.includes(target)) {
      if (!tour.queue.length) {
        if (cursorOf(tour.ex) >= s.until) break;
        advanceTo(Math.min(s.until, ...pending()));
      }
      showNextCue();
    }
  } else {
    advanceTo(Math.max(s.from, Math.min(t, s.until)));
    while (tour.queue.length && tour.shown.length < shown) showNextCue();
  }
  refreshTour();
}

function refreshTour() {
  const ex = tour.ex;
  const pins = cues => cues.filter(c => c.on != null && c.at != null && c.to == null).map(c => pinOf(ex, c)).filter(p => p.time && Number.isFinite(p.price));
  const lines = cues => cues.filter(c => c.to != null && c.at != null && c.to.at != null).map(c => lineOf(ex, c)).filter(l => l.from.time && l.to.time && Number.isFinite(l.from.price) && Number.isFinite(l.to.price));
  ex.pins = pins([...tour.kept, ...tour.shown]);
  ex.lines = lines([...tour.kept, ...tour.shown]);
  // Room is kept for all of the section's pins from its start, so the prices do not move each time one appears.
  ex.pinRoom = pins([...tour.kept, ...(tourSection()?.cues ?? [])]);
  syncLayerButtons();
  if (editorSection !== tour.index) renderTourEditor();
  drawAll('Tour');
  updateTourPanel();
}

function updateTourPanel() {
  const part = name => document.querySelector(`[data-tour="${name}"]`);
  if (currentPage !== 'Tour' || !part('caption')) return;
  const s = tourSection(), ex = tour.ex, t = cursorOf(ex);
  // Text pinned to a candle is on the chart; the caption keeps the last text that was not.
  const caption = [...tour.shown].reverse().find(c => c.on == null);
  part('title').textContent = tour.def.title || 'Tour';
  part('chapter').textContent = tour.chapters[s?.chapter]?.name ?? tour.def.title ?? 'Tour';
  const scene = tour.scenes.length > 1 && s ? ` · scene ${s.scene + 1}: ${datasetList?.find(d => d.id === ex.dataset)?.name ?? ex.dataset} from ${fmtTime(ex.prices.t[0])}` : '';
  part('where').textContent = s ? `section ${s.index + 1} of ${tour.sections.length} · #${s.from}${s.until > s.from ? ` to #${s.until}` : ''}${scene}` : 'no sections yet';
  part('caption').textContent = caption?.text ?? '';
  part('readout').textContent = `#${t} · ${fmtTime(ex.prices.t[t])} UTC`;
  const warning = part('warning');
  warning.hidden = !ex.unanchored;
  warning.textContent = ex.unanchored ? 'The local server was started before the tour existed, so it cannot work out the structure from the tour\'s start: only candles and closes are shown. Restart ./build-site.ps1 -Serve.' : '';

  // The chapters and the problems change as the tour is edited, so they are redrawn when they differ.
  const fill = (el, html) => { if (el.dataset.html !== html) { el.dataset.html = html; el.innerHTML = html; } };
  fill(part('errors'), tour.errors.length ? `<div class="empty tour-errors"><b>The tour has problems</b><ul>${tour.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>` : '');
  fill(part('chapters'), tour.chapters.map((c, i) => `<a href="#Tour/${c.slug}" data-chapter="${i}">${i + 1}. ${esc(c.name)}</a>`).join(''));
  part('chapters').querySelectorAll('a').forEach(a => a.classList.toggle('active', Number(a.dataset.chapter) === s?.chapter));

  const play = document.querySelector('[data-tour-go="play"]');
  play.textContent = tour.timer ? '❚❚' : '▶';
  play.setAttribute('aria-label', tour.timer ? 'Pause (Space)' : 'Play (Space)');
  document.querySelector('[data-tour-go="edit"]').setAttribute('aria-pressed', editorOn());
  document.querySelector('[data-tour-go="glossary"]').setAttribute('aria-pressed', glossaryOn());
  const voice = document.querySelector('[data-tour-go="voice"]'), clips = Object.keys(tour.audio ?? {}).length;
  voice.setAttribute('aria-pressed', voiceOn());
  if (!clips) voice.title = 'No clips yet: the local server reads the texts aloud when Voice is on';
  const pace = TOUR_PACES.indexOf(tourPace());
  document.querySelector('[data-tour="pace"]').value = pace;
  document.querySelector('[data-tour="pace-name"]').textContent = TOUR_PACES[pace].name;

  // The editor marks the texts shown so far, and the one on show.
  document.querySelectorAll('#tour-editor .ed-cue').forEach((el, j) => {
    const cue = s?.cues[j], active = !!cue && cue === tour.active;
    el.classList.toggle('shown', tour.shown.includes(cue));
    if (active && !el.classList.contains('active') && tour.timer) el.scrollIntoView({ block: 'nearest' });
    el.classList.toggle('active', active);
  });
}

// One beat of a playing tour: the next text once the one on show has been read, else the next candle, else the next section.
function tourTick() {
  if (currentPage !== 'Tour' || !tour.sections.length) return pauseTour();
  const s = tourSection(), ex = tour.ex, now = performance.now(), t = cursorOf(ex);
  // A text still waiting for the voice has not begun its time on show.
  const reading = tour.active && (now < tour.activeUntil || tour.voice.waiting.includes(tour.active));
  if (!reading && tour.queue.length) { showNextCue(); return refreshTour(); }
  if (tour.journey) return journeyTick(s, ex, now, reading);
  if (t < s.until) {
    // The replay waits at a cue that has a candle; text with no candle is read while the replay runs.
    const waiting = (reading && tour.active.at != null) || tour.queue.some(c => c.at != null);
    if (waiting || !timelineAt(ex, t + 1)) tour.nextCandle = 0;
    if (waiting || now < tour.nextCandle) return;
    if (!timelineAt(ex, t + 1)) return prefetch(ex, t + 1);
    // A beat takes every candle that has come due since the last one, so a section faster than the beat, or than the chart
    // can be redrawn, still keeps its speed: but never past a text's candle, the section's end or what is loaded. After a
    // wait the count starts again, so the replay does not leap to make up the time.
    const gap = 1000 / (s.speed * tourPace().candles), late = now - tour.nextCandle, inStep = tour.nextCandle > 0 && late < 1000;
    const due = inStep ? 1 + Math.floor(late / gap) : 1;
    const stop = Math.min(s.until, t + due, ...s.cues.filter(c => cueAt(c) > t && !tour.fired.has(c)).map(cueAt));
    let to = t + 1;
    while (to < stop && timelineAt(ex, to + 1)) to++;
    tour.nextCandle = inStep && to - t === due ? tour.nextCandle + due * gap : now + gap;
    advanceTo(to);
    return refreshTour();
  }
  if (reading) return;
  if (tour.index + 1 < tour.sections.length) return enterSection(tour.index + 1, { journey: true });
  pauseTour();
  tour.onEnd?.();
  tour.onEnd = null;
}

function playTour() {
  const s = tourSection();
  if (tour.index === tour.sections.length - 1 && cursorOf(tour.ex) >= s.until && !tour.queue.length && !tour.journey) enterSection(0);
  // The text on show gets its reading time again, and is read aloud from its start: it was shown while the tour was not playing.
  if (tour.active) tour.activeUntil = performance.now() + holdOf(tour.active) * 1000;
  tour.nextCandle = 0;
  tour.timer = setInterval(tourTick, TOUR_TICK);
  if (tour.active) speak(tour.active);
  updateTourPanel();
}

function pauseTour() {
  if (!tour?.timer) return;
  clearInterval(tour.timer);
  tour.timer = null;
  hush();
  updateTourPanel();
}

// Stepping by hand: back to the start of the section (or of the one before), or on to the next text, candle with a cue, or section.
function tourGo(action) {
  if (!tour?.sections.length) return;
  if (action === 'play') return tour.timer ? pauseTour() : playTour();
  pauseTour();
  if (tour.journey) endJourney();
  const s = tourSection(), t = cursorOf(tour.ex);
  if (action === 'prev') return enterSection(t > s.from || tour.shown.length > 1 ? tour.index : Math.max(0, tour.index - 1));
  if (action === 'first') return enterSection(0);
  if (action === 'last') return enterSection(tour.sections.length - 1);
  if (!tour.queue.length && t >= s.until) {
    if (tour.index + 1 < tour.sections.length) enterSection(tour.index + 1);
    return;
  }
  if (!tour.queue.length) advanceTo(Math.min(s.until, ...s.cues.filter(c => !tour.fired.has(c)).map(cueAt)));
  showNextCue();
  refreshTour();
}

async function renderTourPage(chapter) {
  const main = document.getElementById('main');
  selected.clear();
  currentPage = 'Tour';
  const show = body => {
    main.innerHTML = `<section class="term-head"><h2 data-tour="title">${esc(tour?.def.title || 'Tour')}</h2>
      <p class="remarks">${writtenTour
        ? `A tour written by the local server around one ${esc(writtenTour.explain)}, from the prices. The editor beside the chart changes it here only. <a href="./#Tour">The tour itself</a>.`
        : `A scripted replay, read from <code>tour.json</code> and changed with the editor beside the chart. Candles are numbered
      from the tour's start: the crosshair shows a candle's number.`}</p></section>${body}`;
    renderLayers(); wireReplayExamples(main); drawAll(currentPage);
  };

  if (!serverOn) {
    show(`<div class="empty" data-server-check>Checking for the local server…</div>`);
    return checkLocalServer();
  }
  if (!tour) {
    show('<div class="empty">Loading the tour…</div>');
    try { tour = await (tourLoading ??= loadTour()); }
    catch (e) {
      tourLoading = null;
      if (currentPage === 'Tour') show(`<div class="empty">The tour could not be loaded: ${esc(e.message)}.</div>`);
      return;
    }
    if (currentPage !== 'Tour') return;
  }

  const ex = tour.ex;
  show(`<div data-tour="errors"></div>
    <nav class="tour-chapters" aria-label="Chapters" data-tour="chapters"></nav>
    <article class="example replay-big" id="ex-${esc(ex.id)}">
      <header><h3 data-tour="chapter"></h3><span class="id" data-tour="where"></span></header>
      ${chartRow(ex)}
      <div class="tour-caption" data-tour="caption" aria-live="polite"></div>
      <div class="tour-controls" role="group" aria-label="Tour controls">
        <button type="button" data-tour-go="prev" title="Back to the start of this section, or of the one before (←)" aria-label="Back">⏮</button>
        <button type="button" class="play" data-tour-go="play" title="Play or pause (Space)">▶</button>
        <button type="button" data-tour-go="next" title="On to the next text, candle with a cue, or section (→)" aria-label="Next">⏭</button>
        <span class="readout" data-tour="readout"></span>
        <span class="keys">Keys: ← → step · Home End first last · Space play</span>
        <button type="button" data-tour-go="voice" title="Read each text aloud from its clip in tour-audio, made by tools/tour-video">Voice</button>
        <label class="pace" title="How fast the tour plays: the candles, the wait after each text, and the voice by a tenth either way">Speed
          <input type="range" min="0" max="${TOUR_PACES.length - 1}" step="1" data-tour="pace"><span data-tour="pace-name"></span></label>
        ${writtenTour?.explain === 'Trend' ? '<button type="button" data-tour-go="similar" title="Find the other Trends like this one: the same level, direction, count of Swings and Strength, or any of those">Find similar</button>' : ''}
        <button type="button" data-tour-go="glossary" title="Show or hide the glossary: what the voice says in place of what is written, such as Break of Structure for BoS">Glossary</button>
        ${writtenTour ? '' : `<button type="button" data-tour-go="video" title="Make the video of the tour as saved in tour.json, to download: the texts are read aloud, then the tour is recorded with the clips, which takes as long as the tour">Generate video</button>
        <a class="button" data-tour="download" href="api/video/file" download="tour.mp4" hidden>Download video</a>`}
        <span data-tour="video" aria-live="polite"></span>
        <button type="button" class="edit" data-tour-go="edit" title="Show or hide the editor">Editor</button>
      </div>
      <div class="tour-glossary" data-tour="glossary" role="group" aria-label="Glossary" hidden></div>
      <div class="tour-warning" data-tour="warning" hidden></div>
    </article>`);
  main.querySelectorAll('[data-tour-go]').forEach(b => b.addEventListener('click', () =>
    b.dataset.tourGo === 'edit' ? toggleTourEditor() : b.dataset.tourGo === 'voice' ? toggleTourVoice() : b.dataset.tourGo === 'glossary' ? toggleTourGlossary()
      : b.dataset.tourGo === 'video' ? generateTour() : b.dataset.tourGo === 'similar' ? openSimilar() : tourGo(b.dataset.tourGo)));
  main.querySelector('[data-tour="pace"]').addEventListener('input', e => setTourPace(e.target.value));
  const glossary = main.querySelector('[data-tour="glossary"]');
  glossary.addEventListener('input', e => { const row = e.target.closest('.gl-row'); if (row) readGlossary(`glossary|${[...row.parentElement.children].indexOf(row)}|${e.target.dataset.gl}`); });
  glossary.addEventListener('click', e => { const b = e.target.closest('button[data-gl]'); if (b && !b.disabled) glossaryAction(b.dataset.gl, b); });
  renderTourGlossary();
  if (!videoMode) requestNarration();
  editorSection = -1;
  const wanted = tour.chapters.find(c => c.slug === chapter), first = wanted ? wanted.section : tour.index;
  // Opening the page shows its section's view at once, with no zoom to it.
  tour.view = tour.sections[first]?.view ?? tour.view;
  tour.zoom = null;
  seekTour(first);
  if (tour.wanted.length) resolveTour();
}

// The tour's audio and video are made by the local server, which runs tools/tour-video. The texts are read aloud without
// being asked: when the tour is saved, when the Tour page opens and when Voice is turned on, the server reads whichever
// have no clip yet or were changed, which is all that Voice needs. Generate video does that and then records the tour, for
// Download video to fetch. The page asks how it is going until it is done, then loads the clips again.
let tourExport = null, tourExportNote = '', tourExportPoll = null;

async function refreshTourExport(start = false) {
  const response = await fetch('api/video', { method: start ? 'POST' : 'GET' }).catch(() => null), was = tourExport;
  tourExport = response?.ok ? await response.json() : null;
  if (start && !tourExport) tourExportNote = 'The local server was started before it could make the video. Restart ./build-site.ps1 -Serve.';
  clearTimeout(tourExportPoll);
  if (tourExport?.running && currentPage === 'Tour') tourExportPoll = setTimeout(refreshTourExport, 2000);
  // The clips are looked for once a reading is done, whether it was still going at the first asking or already over.
  const finished = tourExport && !tourExport.running && (was?.running || !was);
  updateTourExport();
  if (finished && tour) await reloadTourAudio();
}

// The texts read aloud again have new clips, with new lengths, so the clips are loaded again.
async function reloadTourAudio() {
  const audio = await fetch('tour-audio/index.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
  if (audio && JSON.stringify(audio) !== JSON.stringify(tour.audio)) { tour.audio = audio; applyTour(); }
}

// Has the server read the tour's texts that have no clip yet, then follows the reading. A written tour's texts are read
// as soon as the tour is asked for, so for one only the following is needed.
async function requestNarration() {
  if (videoMode) return;
  if (!writtenTour) await fetch('api/narrate', { method: 'POST' }).catch(() => null);
  tourExport = null;
  refreshTourExport();
}

function generateTour() {
  if (tourExport?.running) return;
  tourExportNote = tourDirty() ? 'Save the tour first: the video is made from tour.json.' : '';
  if (tourExportNote) return updateTourExport();
  refreshTourExport(true);
}

function updateTourExport() {
  const status = document.querySelector('[data-tour="video"]');
  if (!status) return;
  const v = tourExport ?? {}, clock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const made = v.made ? new Date(v.made).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  document.querySelectorAll('[data-tour-go="video"]').forEach(b => { b.disabled = !!v.running; });
  const download = document.querySelector('[data-tour="download"]');
  if (download) download.hidden = !v.made;
  status.classList.toggle('warn', !v.running && !!(tourExportNote || v.error));
  // A written tour's status says only how the reading of its texts is going.
  status.textContent = v.running ? `${v.stage}… ${clock(v.seconds)}`
    : v.error ? `The ${v.audioOnly ? 'texts were not read aloud' : 'video was not made'}: ${v.error}`
    : writtenTour ? '' : tourExportNote || (made ? `Video made ${made}${v.stale ? ', before the tour was last saved' : ''}` : '');
}

// ---- Find similar ----------------------------------------------------------------------------------------------------
// The other Trends like the one a written tour explains. The dialog lists what the tour says of its Trend, each a tick:
// its direction, its level, its count of Swings and its Strength. Search lists the Trends of the dataset as a whole that
// match what is ticked, by the candle they begin at, each a link to a written tour of its own, with this one marked.
const SIMILAR_SHOWN = 500;
const orderOf = n => `${n}${n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] ?? 'th'} order`;
const trendName = t => t.direction === 'Up' ? 'Uptrend' : 'Downtrend';
const swingsOf = t => `${t.swings} ${t.direction === 'Up' ? 'Upswings' : 'Downswings'}`;
let similar = null;

async function openSimilar() {
  let dialog = document.getElementById('similar');
  if (!dialog) {
    dialog = document.createElement('dialog');
    dialog.id = 'similar';
    dialog.setAttribute('aria-label', 'Find similar Trends');
    document.body.append(dialog);
    dialog.addEventListener('click', e => {
      if (e.target === dialog || e.target.closest('[data-sim="close"]')) dialog.close();
      else if (e.target.closest('[data-sim="search"]')) searchSimilar(dialog);
      // On the Replay page a Trend found is explained there, in place; on the Tour page its link opens a tour of its own.
      const found = e.target.closest('a[data-sim-at]');
      if (found && currentPage === 'Analysis' && !(e.ctrlKey || e.metaKey || e.shiftKey || e.button)) {
        e.preventDefault();
        dialog.close();
        startAnalysis(wantedAnalysis = { explain: 'Trend', dataset: similar.params.dataset, at: found.dataset.simAt, level: found.dataset.simLevel });
      }
    });
  }
  dialog.innerHTML = '<h4>Find similar Trends</h4><p>Reading the Trends…</p>';
  dialog.showModal();
  // The Trend is the one being explained: on the Replay page by the analysis open there, else by the written tour.
  const params = currentPage === 'Analysis' && analysis ? analysis.params : writtenTour, wanted = JSON.stringify(params);
  try {
    if (similar?.wanted !== wanted) {
      const r = await fetch(`api/explain/similar?${new URLSearchParams({ dataset: params.dataset, at: params.at, level: params.level, ...(params.seen ? { seen: params.seen } : {}), ...(currentPage === 'Analysis' ? { inPlace: true } : {}) })}`, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status === 404 ? 'the local server is older than this page: restart ./build-site.ps1 -Serve' : await r.text() || `the server answered ${r.status}`);
      similar = { ...await r.json(), params, wanted };
    }
  } catch (e) {
    dialog.innerHTML = `<h4>Find similar Trends</h4><p class="warn">${esc(e.message)}</p><div class="sim-foot"><button type="button" data-sim="close">Close</button></div>`;
    return;
  }
  const s = similar.shown, check = (key, label) => `<label><input type="checkbox" data-sim-check="${key}" checked>${esc(label)}</label>`;
  dialog.innerHTML = `<h4>Find similar Trends</h4><p>Untick what need not be the same, then search.</p>
    <div class="sim-checks">${check('direction', trendName(s))}${check('level', orderOf(s.level))}${check('swings', swingsOf(s))}${check('strength', `${s.strength}% Strength`)}</div>
    <div class="sim-foot"><button type="button" class="go" data-sim="search">Search</button><button type="button" data-sim="close">Close</button></div>
    <div data-sim="results"></div>`;
}

function searchSimilar(dialog) {
  const s = similar.shown, keys = [...dialog.querySelectorAll('[data-sim-check]')].filter(c => c.checked).map(c => c.dataset.simCheck);
  const same = t => t.level === s.level && t.start === s.start && t.direction === s.direction;
  const found = similar.trends.filter(t => keys.every(k => t[k] === s[k]));
  const link = t => `?${new URLSearchParams({ explain: 'Trend', dataset: similar.params.dataset, at: t.at, level: t.level })}#Tour/trend`;
  // A Trend the chart had otherwise at the time has no tour to open, as a tour shows the chart as it was.
  const row = t => `<li${same(t) ? ' class="current"' : ''}><${t.tour ? `a href="${esc(link(t))}" data-sim-at="${esc(t.at)}" data-sim-level="${t.level}"` :'a title="The chart had this otherwise at the time, so there is no tour of it"'}${same(t) ? ' aria-current="true"' : ''}><span>#${t.index}</span><span>${esc(fmtTime(t.start))}</span>
    <span>${esc(`${orderOf(t.level)} ${trendName(t)} · ${swingsOf(t)} · ${t.strength}%${same(t) ? ' · this one' : ''}${t.tour ? '' : ' · no tour'}`)}</span></a></li>`;
  // The tour shows its Trend as the chart had it where the tour ends; the list has the Trends as the whole dataset does.
  const whole = similar.trends.find(same), differs = whole && (whole.swings !== s.swings || whole.strength !== s.strength);
  const note = !whole ? ' This one is not among them: with the candles since, it is a Ghost.' : differs ? ` With the candles since, this one is ${swingsOf(whole)} at ${whole.strength}%.` : '';
  dialog.querySelector('[data-sim="results"]').innerHTML = `<div class="sim-count">${found.length} Trend${found.length === 1 ? '' : 's'} in the dataset as a whole, by the candle they begin at${found.length > SIMILAR_SHOWN ? `: the first ${SIMILAR_SHOWN} are listed` : ''}.${esc(note)}</div>
    <ol>${found.slice(0, SIMILAR_SHOWN).map(row).join('')}</ol>`;
  dialog.querySelector('li.current')?.scrollIntoView({ block: 'nearest' });
}

// ---- Tour glossary ---------------------------------------------------------------------------------------------------
// What the voice says in place of what is written, edited in a panel of its own under the controls, which the Glossary
// button opens. The boxes are the glossary as it is being written, and the tour's definition follows them: an entry with
// nothing written yet is only in its boxes. The clips are read with it when the audio is next updated.
const glossaryOn = () => state.tourGlossary === true && !videoMode;
const glossaryRow = ([from, to]) => `<div class="gl-row"><input data-gl="from" placeholder="Written, as BoS" aria-label="Written" value="${esc(from)}"><span aria-hidden="true">→</span>` +
  `<input data-gl="to" placeholder="Said, as Break of Structure" aria-label="Said" value="${esc(to)}"><button type="button" data-gl="delete" title="Delete this entry" aria-label="Delete this entry">✕</button></div>`;

function toggleTourGlossary() {
  state.tourGlossary = !glossaryOn();
  save(state);
  renderTourGlossary();
  updateTourPanel();
}

function renderTourGlossary() {
  const box = document.querySelector('[data-tour="glossary"]');
  if (!box || !tour) return;
  box.hidden = !glossaryOn();
  box.innerHTML = box.hidden ? '' : `<div class="gl-head"><h4>Glossary</h4><span>What the voice says in place of what is written. An entry stands for a whole word,
      in the case it is written in, and the longest entry that fits is used.</span></div>
    <div class="gl-rows">${Object.entries(tour.def.glossary ?? {}).map(glossaryRow).join('')}</div>
    <div class="gl-foot"><button type="button" data-gl="add">+ Entry</button><button type="button" data-gl="save" title="Save to tour.json (Ctrl+S)">Save</button>
      <span data-gl-status aria-live="polite"></span></div>`;
  updateGlossaryStatus();
}

// Writes the boxes into the tour's definition. Typing in one box is one change to undo.
function readGlossary(key = null) {
  const entries = [...document.querySelectorAll('[data-tour="glossary"] .gl-row')]
    .map(row => [row.querySelector('[data-gl="from"]').value.trim(), row.querySelector('[data-gl="to"]').value]).filter(([from]) => from);
  rememberTour(key);
  if (entries.length) tour.def.glossary = Object.fromEntries(entries); else delete tour.def.glossary;
  tour.note = '';
  updateEditorStatus();
}

function glossaryAction(action, el) {
  if (action === 'save') return saveTour();
  if (action === 'delete') { el.closest('.gl-row').remove(); return readGlossary(); }
  const rows = document.querySelector('[data-tour="glossary"] .gl-rows');
  rows.insertAdjacentHTML('beforeend', glossaryRow(['', '']));
  rows.lastElementChild.querySelector('input').focus();
}

// Says whether the glossary is saved, and how many of the clips were read before it was as it is now.
function updateGlossaryStatus() {
  const status = document.querySelector('[data-gl-status]');
  if (!status) return;
  const dirty = tourDirty(), said = spokenText(tour.def), old = Object.values(tour.audio ?? {}).filter(c => (c.spoken ?? c.text) !== said(c.text)).length;
  document.querySelector('button[data-gl="save"]').disabled = !dirty;
  status.textContent = tour.note || [dirty ? 'Changes not saved' : 'Saved in tour.json',
    old ? `${old} text${old === 1 ? ' is' : 's are'} still read as before, until the audio is updated` : ''].filter(Boolean).join(' · ');
  status.classList.toggle('warn', !!tour.note);
}

// ---- Tour editor -----------------------------------------------------------------------------------------------------
// Beside the chart, where the event log is on other pages: the tour's definition as a form. It shows the section the tour
// is at, so what is edited is what is on the chart, and every change is applied at once. The layer buttons set the layers
// of that section. Save writes tour.json back through the local server.
// The section the tour is at is open in the editor unless it has been folded away, which lasts until a section is picked.
let editorSection = -1, editorFolded = false;
const editorOn = () => state.tourEditor !== false && !videoMode;
const tourDirty = () => !!tour && JSON.stringify(tour.def) !== tour.saved;
const TOUR_KEYS = { tour: ['title', 'dataset', 'glossary', 'start', 'sections'], start: ['time', 'view', 'speed', 'layers'],
  section: ['chapter', 'scene', 'layers', 'add', 'remove', 'fastForward', 'rewind', 'from', 'until', 'view', 'speed', 'cues'], cue: ['at', 'on', 'place', 'to', 'heads', 'color', 'text', 'hold', 'keep', 'voice'] };

// tour.json as text: a line for each text and for each of a section's settings, so a change shows as a small diff.
function formatTour(def) {
  const ordered = (o, keys) => [...keys.filter(k => k in o), ...Object.keys(o).filter(k => !keys.includes(k))].map(k => [k, o[k]]);
  const inline = (v, keys = []) => Array.isArray(v) ? `[${v.map(x => inline(x)).join(', ')}]`
    : v && typeof v === 'object' ? (Object.keys(v).length ? `{ ${ordered(v, keys).map(([k, x]) => `${JSON.stringify(k)}: ${inline(x)}`).join(', ')} }` : '{}')
    : JSON.stringify(v);
  const lines = (entries, pad) => entries.map(([k, text]) => `${pad}${JSON.stringify(k)}: ${text}`).join(',\n');
  const list = (items, pad, each) => items.length ? `[\n${items.map(each).join(',\n')}\n${pad}]` : '[]';
  const section = s => `    {\n${lines(ordered(s, TOUR_KEYS.section).map(([k, v]) =>
    [k, k === 'cues' && Array.isArray(v) ? list(v, '      ', c => `        ${inline(c, TOUR_KEYS.cue)}`) : inline(v)]), '      ')}\n    }`;
  return `{\n${lines(ordered(def, TOUR_KEYS.tour).map(([k, v]) =>
    [k, k === 'sections' && Array.isArray(v) ? list(v, '  ', section) : inline(v, k === 'start' ? TOUR_KEYS.start : [])]), '  ')}\n}\n`;
}

// How long a section takes to play: the replay waits at each text that has a candle, and the rest is read while it runs.
function sectionSeconds(s) {
  const sum = cues => cues.reduce((n, c) => n + c.hold, 0), j = s.journey;
  // A journey is the view easing out and in, and the run between when it has one.
  const journey = j ? 2 * TOUR_ZOOM_MS / 1000 + (j.run ? Math.abs(j.to - j.start) / j.speed : 0) : 0;
  return sum(s.cues.filter(c => c.at != null)) + Math.max(journey + (s.until - s.from) / s.speed, sum(s.cues.filter(c => c.at == null)));
}

// The list is drawn anew each time, so it is put back where it was rather than at its top: the section the tour is at stays
// where it was in view, or the tour's own card when that is the anchor, as it is when that card is folded or unfolded.
function renderTourEditor(anchor = 'section') {
  const box = document.getElementById('tour-editor');
  if (!tour || currentPage !== 'Tour' || !editorOn()) { box.innerHTML = ''; editorSection = -1; return; }
  const spot = body => {
    const el = body && (anchor === 'tour' ? body.firstElementChild : body.querySelector(`:scope > [data-section="${tour.index}"]`));
    return el ? { top: el.getBoundingClientRect().top - body.getBoundingClientRect().top, height: el.offsetHeight } : null;
  };
  const before = box.querySelector('.ed-body'), scrolled = before?.scrollTop ?? 0, was = spot(before);
  const seen = !!was && was.top + was.height > 0 && was.top < before.clientHeight;
  const { def, sections } = tour, start = def.start ?? {};
  editorSection = tour.index;
  const value = v => esc(v ?? '');
  const options = (list, current) => list.map(([v, label]) => `<option value="${esc(v)}" ${String(current ?? '') === String(v) ? 'selected' : ''}>${esc(label)}</option>`).join('');
  // The first and last candle shown. Left empty, the view is as before, which the boxes then say.
  const viewBoxes = (scope, view, before, otherwise = 'as before') => [['View from candle', 0], ['View to candle', 1]].map(([label, k]) =>
    `<label>${label}<input type="number" min="0" step="1" data-scope="${scope}" data-field="view${k}" placeholder="#${before[k]}, ${otherwise}" value="${value(view?.[k])}"></label>`).join('');
  const ops = (kind, what) => `<span class="ed-ops">${kind === 'cue' ? `<button type="button" data-ed="cue-copy" title="Add a copy of this text after it">Copy</button>` : ''}` +
    `<button type="button" data-ed="${kind}-up" title="Move this ${what} up" aria-label="Move this ${what} up">↑</button>` +
    `<button type="button" data-ed="${kind}-down" title="Move this ${what} down" aria-label="Move this ${what} down">↓</button>` +
    `<button type="button" data-ed="${kind}-delete" title="Delete this ${what}" aria-label="Delete this ${what}">✕</button></span>`;
  const pick = (field, what) => `<button type="button" data-ed="pick" data-pick="${field}" title="Pick ${what} on the chart">Pick</button>`;
  const head = i => `<span class="ed-num">${i + 1}</span><span class="ed-name" data-ed-name></span><span class="ed-meta" data-ed-meta></span>`;
  const layerName = id => { const l = LAYERS.find(x => x.id === id); return l?.level !== undefined ? `level ${l.level}` : l?.label ?? id; };

  // A candle given as an event shows the candle it was found at, and says so; typing a number replaces the event.
  const numberOr = v => typeof v === 'number' ? v : '';
  const eventBox = spec => spec ? ` class="ed-event" title="${esc(spec)}"` : '';
  const cueCard = (c, j, compiled) => {
    const pinned = c.on != null;
    return `<div class="ed-cue" data-cue="${j}">
      <div class="ed-meta" data-ed-cue></div>
      <textarea data-scope="cue" data-field="text" placeholder="Text" aria-label="Text ${j + 1}">${value(c.text)}</textarea>
      <div class="ed-row">
        <label>At candle<span class="ed-pick"><input type="number" min="0" step="1" data-scope="cue" data-field="at" data-type="number" placeholder="${esc(compiled?.atSpec ?? 'start')}" value="${numberOr(c.at)}"${eventBox(compiled?.atSpec)}>${pick('at', 'the candle')}</span></label>
        <label>Pinned to<select data-scope="cue" data-field="on" data-type="auto" data-render>${options([['', 'not pinned'], ['open', 'open'], ['high', 'high'], ['low', 'low'], ['close', 'close'],
          ...(typeof c.on === 'number' ? [[c.on, `price ${c.on}`]] : [])], c.on)}</select></label>
        <label>Side<select data-scope="cue" data-field="place" ${pinned ? '' : 'disabled'}>${options([['', 'auto'], ['above', 'above'], ['below', 'below'], ['left', 'left'], ['right', 'right']], c.place)}</select></label>
        <label>Seconds<input type="number" min="0" step="0.5" data-scope="cue" data-field="hold" data-type="number" placeholder="${readingSeconds(c.text ?? '').toFixed(1)}" value="${value(c.hold)}"></label>
        <label>Pin stays<select data-scope="cue" data-field="keep" ${pinned ? '' : 'disabled'}>${options([['', 'this section'], ['chapter', 'this chapter'], ['always', 'to the end']], c.keep === 'section' ? '' : c.keep)}</select></label>
        <label class="ed-check" title="Shown but not read aloud by the voice, in the page or in the video"><input type="checkbox" data-scope="cue" data-field="voice" ${c.voice === false ? 'checked' : ''}>Silent</label>
        <label title="Draws a line from the pinned point to a point on another candle, with the text in a box along it; it appears when the replay reaches the line's end">Line to candle<span class="ed-pick"><input type="number" min="0" step="1" data-scope="cue" data-field="lineTo" data-type="number" data-render ${pinned ? '' : 'disabled'} placeholder="${esc(compiled?.to?.atSpec ?? 'no line')}" value="${numberOr(c.to?.at)}"${eventBox(compiled?.to?.atSpec)}></span></label>
        <label>Line ends on<select data-scope="cue" data-field="lineOn" data-type="auto" ${c.to ? '' : 'disabled'}>${options([['', 'same as the pin'], ['open', 'open'], ['high', 'high'], ['low', 'low'], ['close', 'close'],
          ...(typeof c.to?.on === 'number' ? [[c.to.on, `price ${c.to.on}`]] : [])], c.to?.on)}</select></label>
        <label class="ed-check" title="An arrow head where the line starts"><input type="checkbox" data-scope="cue" data-field="headStart" ${c.to ? '' : 'disabled'} ${c.heads?.start === true ? 'checked' : ''}>Head at start</label>
        <label class="ed-check" title="An arrow head where the line ends"><input type="checkbox" data-scope="cue" data-field="headEnd" ${c.to ? '' : 'disabled'} ${c.heads?.end !== false ? 'checked' : ''}>Head at end</label>
        <label title="The line's colour: up (green), down (red), accent, or any CSS colour">Line colour<input data-scope="cue" data-field="color" ${c.to ? '' : 'disabled'} placeholder="accent" value="${value(c.color)}"></label>
        ${ops('cue', 'text')}
        ${j ? `<span class="ed-split"><button type="button" data-ed="cue-split" title="Start a new section with this text and those after it, so it can have layers of its own">Split the section here</button></span>` : ''}
      </div>
    </div>`;
  };

  const openCard = (d, i) => {
    const s = sections[i], before = i ? sections[i - 1] : null, was = before?.layers ?? tour.startLayers;
    // The texts written for a section that explains something come before any of its own.
    const written = s.cues.slice(0, s.cues.length - (d.cues ?? []).length);
    // A journey to the section: which way, and whether the replay runs there or only the view moves.
    const tripKind = d.fastForward != null ? 'fastForward' : d.rewind != null ? 'rewind' : '', trip = d[tripKind], back = tripKind === 'rewind';
    const runs = !!trip && trip[back ? 'erase' : 'draw'] !== false;
    const chips = [...s.layers.map(id => `<span class="ed-chip${was.includes(id) ? '' : ' added'}">${was.includes(id) ? '' : '+ '}${esc(layerName(id))}</span>`),
      ...was.filter(id => !s.layers.includes(id)).map(id => `<span class="ed-chip removed">${esc(layerName(id))}</span>`)];
    return `<section class="ed-card open" data-section="${i}">
      <header><button type="button" class="ed-fold" data-ed="section-fold" aria-expanded="true" title="Fold this section away">${head(i)}</button>${ops('section', 'section')}</header>
      <div class="ed-grid">
        <label class="wide">Chapter<input data-scope="section" data-field="chapter" placeholder="${before ? `continues ${esc(tour.chapters[before.chapter]?.name ?? 'the section before')}` : 'Name a chapter to start one'}" value="${value(d.chapter)}"></label>
