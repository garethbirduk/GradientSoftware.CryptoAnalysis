        <label>Candles a second<input type="number" min="0.5" step="0.5" data-scope="section" data-field="speed" data-type="number" placeholder="${before?.speed ?? start.speed ?? 4}" value="${value(d.speed)}"></label>
        <span class="ed-use"><button type="button" data-ed="view-chart" title="Zoom or pan the chart to what this section should show, then press this">Use the chart's view</button></span>
        <label title="How the tour gets to this section: the view eases out to hold the whole way, then in to the section's view">Gets here by<select data-scope="section" data-field="journey" data-render>${options([['', 'no journey'], ['fastForward', 'a fast forward'], ['rewind', 'a rewind']], tripKind)}</select></label>
        <label>${back ? 'Rewinds' : 'Fast forwards'} to candle<input type="number" min="0" step="1" data-scope="section" data-field="journeyTo" ${runs ? '' : 'disabled'} value="${numberOr(trip?.to)}"></label>
        <label>Candles a second on the way<input type="number" min="1" step="5" data-scope="section" data-field="journeySpeed" placeholder="${JOURNEY_SPEED}" ${runs ? '' : 'disabled'} value="${value(trip?.speed)}"></label>
        <label class="ed-check" title="Ticked, the replay runs there, ${back ? 'erasing' : 'drawing'} the closes and the rest as it goes. Unticked, the replay stays where it is and only the view moves"><input type="checkbox" data-scope="section" data-field="journeyRun" data-render ${tripKind ? '' : 'disabled'} ${runs ? 'checked' : ''}>${back ? 'Erases' : 'Draws'} as it goes</label>
        ${fixed ? '' : `<label title="Begins a new scene here: a replay of its own on a dataset from a time, with its candles numbered from #0 again. A cut, not a journey">Begins a scene on<select data-scope="section" data-field="sceneDataset" data-render>${options([['', 'no scene: carries on'], ...(datasetList ?? []).map(x => [x.id, x.name])], d.scene ? (d.scene.dataset ?? def.dataset ?? datasetList?.[0]?.id) : '')}</select></label>
        <label>Scene starts at (candle #0, UTC)<input type="datetime-local" step="3600" data-scope="section" data-field="sceneTime" data-commit data-render ${d.scene ? '' : 'disabled'} value="${value(d.scene?.time)}"></label>`}
      </div>
      <div class="ed-layers"><span>Layers</span>${chips.join('') || '<span class="ed-chip">none</span>'}<span class="ed-hint">${fixed ? 'Those the thing told of is drawn with, beside the page\'s own.' : 'Set with the layer buttons on the left.'}</span></div>
      ${d.explain == null ? '' : `<div class="ed-layers"><span>Explains</span><span class="ed-chip">${esc(String(d.explain))}${d.level > 1 ? ` at level ${d.level}` : ''} at #${esc(String(d.at ?? '?'))}${d.detail ? `, at ${esc(DETAIL_NAMES[d.detail] ?? d.detail)}` : ''}${d.blocks ? `: ${esc(d.blocks.join(', '))}` : ''}</span><span class="ed-hint">The texts are written from the prices: their wording can be changed here, and texts added here follow them.</span></div>`}
      ${written.map((c, k) => writtenCard(d, c, k)).join('')}
      ${(d.cues ?? []).map((c, j) => cueCard(c, j, s.cues[written.length + j])).join('')}
      <div class="ed-foot"><button type="button" data-ed="add-cue">+ Text</button>${fixed ? '' : `<button type="button" data-ed="add-section">+ Section after</button>
        <button type="button" data-ed="section-copy" title="Add a copy of this section after it">Duplicate</button>`}
        <button type="button" data-ed="play-here" title="Play from the start of this section">▶ From here</button></div>
    </section>`;
  };

  const sectionCard = i => i === tour.index && !editorFolded ? openCard(def.sections[i], i)
    : `<button type="button" class="ed-section${i === tour.index ? ' current' : ''}" data-ed="go" data-section="${i}" aria-expanded="false" title="${i === tour.index ? 'Open this section' : 'Go to this section'}">${head(i)}</button>`;
  return { value, viewBoxes, sectionCard };
}

// The list is drawn anew each time, so it is put back where it was rather than at its top: the section the tour is at stays
// where it was in view, or the tour's own card when that is the anchor, as it is when that card is folded or unfolded.
// Being edited, the tour's chapters are rows (see chapterRow), the one on show open to its sections unless folded, and any
// other opened by hand.
function renderTourEditor(anchor = 'section') {
  const box = document.getElementById('tour-editor');
  if (!tour || currentPage !== 'Tour') { box.innerHTML = ''; editorSection = -1; return; }
  if (!editorOn()) return renderTourContents(box);
  const spot = body => {
    const el = body && (anchor === 'tour' ? body.firstElementChild : body.querySelector(`[data-section="${tour.index}"]`));
    return el ? { top: el.getBoundingClientRect().top - body.getBoundingClientRect().top, height: el.offsetHeight } : null;
  };
  const before = box.querySelector('.ed-body'), scrolled = before?.scrollTop ?? 0, was = spot(before);
  const seen = !!was && was.top + was.height > 0 && was.top < before.clientHeight;
  const { def, sections } = tour, start = def.start ?? {};
  editorSection = tour.index;
  const { value, viewBoxes, sectionCard } = editorCards();

  // The tour's own settings fold away like a section, as they are seldom changed.
  const tourHead = `<span class="ed-num">Tour</span><span class="ed-name chapter" data-ed-title></span><span class="ed-meta" data-ed-total></span>`;
  const tourCard = state.tourCardOpen
    ? `<section class="ed-card">
        <button type="button" class="ed-fold" data-ed="tour-card" aria-expanded="true" title="Fold the tour's settings away">${tourHead}</button>
        <div class="ed-grid">
          <label class="wide">Title<input data-scope="tour" data-field="title" value="${value(def.title)}"></label>
          <label class="wide">Starts at (candle #0, UTC)<input type="datetime-local" step="3600" data-scope="start" data-field="time" data-commit value="${value(start.time)}"></label>
          ${viewBoxes('start', start.view, DEFAULT_VIEW, 'if left empty')}
          <label>Candles a second<input type="number" min="0.5" step="0.5" data-scope="start" data-field="speed" data-type="number" placeholder="4" value="${value(start.speed)}"></label>
        </div></section>`
    : `<button type="button" class="ed-section" data-ed="tour-card" aria-expanded="false" title="Show the tour's settings">${tourHead}</button>`;
  const range = (from, to) => Array.from({ length: Math.max(0, to - from) }, (_, k) => from + k);
  // Sections before the first chapter, then each chapter with its sections when it is open.
  const lead = tour.chapters[0]?.section ?? (def.sections ?? []).length;
  const chapters = tour.chapters.map((c, k) => {
    const open = tourChapterOpen(k), to = tour.chapters[k + 1]?.section ?? (def.sections ?? []).length;
    return chapterRow(k, { number: true, open }) + (open ? `<div class="ct-sections">${range(c.section, to).map(sectionCard).join('')}</div>` : '');
  });
  box.innerHTML = `<div class="ed-head"><h4>Contents</h4>
      <button type="button" data-ed="undo" title="Undo the last change">Undo</button>
      <button type="button" data-ed="revert" title="Load tour.json again, dropping what is not saved (Undo brings it back)">Revert</button>
      <button type="button" data-ed="save" title="Save to tour.json (Ctrl+S)">Save</button>
      <button type="button" data-ed="edit" aria-pressed="true" title="Close the editor, leaving the chapters">Edit</button></div>
    <div class="ed-status" data-ed-status aria-live="polite"></div>
    <div class="ed-body">
      ${tourCard}
      ${range(0, lead).map(sectionCard).join('')}
      ${chapters.join('')}
      ${sections.length ? '' : '<button type="button" data-ed="add-section">+ Section</button>'}
    </div>`;
  updateEditorMeta();
  updateEditorStatus();
  updateTourPanel();
  const body = box.querySelector('.ed-body');
  body.scrollTop = scrolled;
  const now = spot(body);
  if (now && seen) body.scrollTop += now.top - was.top;
  // An editor just opened, or a tour playing on to a section that was out of view, brings the section into view.
  else if (now && (!before || tour.timer) && (now.top < 0 || now.top > body.clientHeight - 80)) body.scrollTop += now.top - 8;
}

// The names, candles and running times shown on the section cards, which change as the tour is edited.
function updateEditorMeta() {
  document.querySelectorAll('#tour-editor [data-section]').forEach(card => {
    const i = Number(card.dataset.section), d = tour.def.sections[i], s = tour.sections[i];
    if (!d || !s) return;
    const name = card.querySelector('[data-ed-name]');
    name.textContent = d.chapter || `↳ ${cueText(d.cues?.find(c => c.on == null && cueText(c))) ?? (d.explain != null ? `${d.explain} at #${d.at ?? '?'}` : 'no text yet')}`;
    name.classList.toggle('chapter', !!d.chapter);
    card.querySelector('[data-ed-meta]').textContent = `#${s.from}${s.until > s.from ? ` → #${s.until}` : ''} · ${Math.round(sectionSeconds(s))}s`;
  });
  // A text's settings are folded away until it is being edited, so each says when it appears and for how long; a written
  // text says it is written, and a pin that an analysis does not show, that it is left out.
  document.querySelectorAll('#tour-editor .ed-card.open [data-ed-cue]').forEach((el, j) => {
    const c = tourSection()?.cues[j];
    if (c) el.textContent = `${j + 1}${c.written ? ' · written' : ''} · ${c.at != null ? `at #${c.at}` : 'as the section begins'}${c.on != null ? ` · pinned to ${typeof c.on === 'number' ? c.on : `the ${c.on}`}` : ''}${c.skipped ? ' · not shown here' : ` · ${c.hold.toFixed(1)}s`}${c.silent ? ' · silent' : ''}`;
  });
  const total = document.querySelector('[data-ed-total]'), seconds = Math.round(tour.sections.reduce((n, s) => n + sectionSeconds(s), 0));
  if (total) total.textContent = `${tour.sections.length} section${tour.sections.length === 1 ? '' : 's'} · ${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
  const title = document.querySelector('[data-ed-title]');
  if (title) title.textContent = tour.def.title || 'no title yet';
}

// What the editor says of the tour or analysis on show: being picked from, looked up, its problems, or whether it is saved,
// in tour.json or, for an analysis, against that analysis alone.
function updateEditorStatus() {
  if (!tour) return;
  const analysis = tour.page === 'Analysis';
  if (!analysis) updateGlossaryStatus();
  document.body.classList.toggle('picking', !!tour.picking);
  const status = document.querySelector('#tour-editor [data-ed-status]');
  if (!status) return;
  const problems = tour.errors.length, dirty = analysis ? analysisDirty() : tourDirty(), changed = analysis ? Object.keys(JSON.parse(tour.changesSaved)).length : 0;
  status.textContent = tour.picking ? 'Click a candle on the chart. Esc cancels.'
    : tour.resolving ? `Looking up what the ${analysis ? 'analysis' : 'tour'} waits for…`
    : tour.note || [dirty ? 'Changes not saved'
      : !analysis ? 'Saved in tour.json'
      : changed ? `${changed} section${changed === 1 ? '' : 's'} changed for this analysis alone, saved` : 'As written from the prices: a change is kept for this analysis alone',
      problems ? `${problems} problem${problems === 1 ? '' : 's'}${analysis ? `: ${tour.errors[0]}${problems > 1 ? ' …' : ''}` : ', listed above the chart'}` : ''].filter(Boolean).join(' · ');
  status.classList.toggle('warn', !tour.picking && (!!tour.note || problems > 0));
  const save = document.querySelector('#tour-editor [data-ed="save"]');
  if (!save) return;
  save.disabled = !dirty;
  save.classList.toggle('dirty', dirty);
  document.querySelector('#tour-editor [data-ed="undo"]').disabled = !tour.history.length;
  const revert = document.querySelector('#tour-editor [data-ed="revert"]');
  if (analysis && revert) revert.disabled = !dirty;
  document.querySelectorAll('[data-ed="pick"]').forEach(b => b.setAttribute('aria-pressed',
    tour.picking?.field === b.dataset.pick && (b.dataset.pick !== 'at' || tour.picking.cue === Number(b.closest('.ed-cue')?.dataset.cue))));
}

function toggleTourVoice() {
  state.tourVoice = !voiceOn();
  save(state);
  if (!voiceOn() && tour) hush();
  if (voiceOn()) requestNarration();
  updateTourPanel();
}

function toggleTourEditor() {
  state.tourEditor = !editorOn();
  save(state);
  document.body.classList.toggle('editing', editorOn());
  renderTourEditor();
  drawAll('Tour');
  updateTourPanel();
}

// Keeps the definition as it is before a change, for Undo. Typing in one box is one change.
function rememberTour(key = null) {
  if (key && key === tour.lastEdit) return;
  // The definitions go with the tour, so Undo takes back an edit to either.
  tour.history.push(JSON.stringify({ def: tour.def, definitions: DEFINITIONS }));
  if (tour.history.length > 200) tour.history.shift();
  tour.lastEdit = key;
}

// Applies the definition as it now is: works the sections out again, then puts the tour back where it was, at the start or
// end of its section, or where one of the section's texts appears.
function applyTour({ render = false, cue = null, end = false, start = false } = {}) {
  pauseTour();
  const was = { t: cursorOf(tour.ex), shown: tour.shown.length };
  tour.note = '';
  anchorTour();
  // In an analysis a setting left empty is as written from the prices, not as the section before has it.
  if (tour.page === 'Analysis') tour.def.sections.forEach((d, i) => {
    const w = tour.writtenDef.sections[i] ?? {};
    for (const k of Object.keys(w)) if (!(k in d)) d[k] = JSON.parse(JSON.stringify(w[k]));
  });
  recompile();
  if (render) { editorSection = -1; renderTourGlossary(); }
  seekTour(tour.index, start ? {} : end ? { t: Infinity, shown: Infinity } : cue != null ? { cue } : was);
  updateEditorMeta();
  updateEditorStatus();
  if (tour.wanted.length) resolveTour();
}

// How many of a section's texts are written from the prices, ahead of its own.
const writtenCount = i => Math.max(0, (tour.sections[i]?.cues.length ?? 0) - (tour.def.sections[i]?.cues ?? []).length);

function editTourField(el) {
  const cueEl = el.closest('.ed-cue'), j = cueEl ? Number(cueEl.dataset.cue ?? cueEl.dataset.written) : null, { scope, field, type } = el.dataset, def = tour.def;
  rememberTour(`${scope}|${tour.index}|${j}|${field}`);
  // A written text's wording at a level: kept in the section's edits by the text's id while it differs from the wording
  // written, dropped when it is the same or empty.
  if (scope === 'written') {
    const d = def.sections[tour.index], id = cueEl.dataset.id, was = tourSection().cues[j]?.written?.[field] ?? '';
    const own = { ...d.edits?.[id] };
    if (!el.value.trim() || el.value === was) delete own[field]; else own[field] = el.value;
    const edits = { ...d.edits, [id]: own };
    if (!Object.keys(own).length) delete edits[id];
    if (Object.keys(edits).length) d.edits = edits; else delete d.edits;
    cueEl.classList.toggle('edited', !!d.edits?.[id]);
    return applyTour({ cue: j });
  }
  // A definition's wording: one for every cue that cites it, saved to definitions.json with the tour.
  if (scope === 'definition') {
    DEFINITIONS = { ...DEFINITIONS, [el.dataset.key]: el.value };
    return applyTour({ cue: cueEl?.dataset.written != null ? j : writtenCount(tour.index) + j });
  }
  const target = scope === 'tour' ? def : scope === 'start' ? (def.start ??= {}) : scope === 'cue' ? def.sections[tour.index].cues[j] : def.sections[tour.index];
  const raw = el.value, value = raw !== '' && (type === 'number' || (type === 'auto' && /^\d+(\.\d+)?$/.test(raw))) ? Number(raw) : raw;
  if (field.startsWith('journey')) {
    // A journey's boxes are one setting, written as fastForward or rewind: where to, how fast, and whether the replay
    // runs there. One just chosen runs, as that is what it is mostly for.
    const box = f => el.closest('.ed-grid').querySelector(`[data-field="${f}"]`), kind = box('journey').value, had = target.fastForward ?? target.rewind;
    delete target.fastForward;
    delete target.rewind;
    if (kind) {
      const to = box('journeyTo').value, rate = box('journeySpeed').value, runs = had ? box('journeyRun').checked : true;
      target[kind] = { ...(to !== '' ? { to: Number(to) } : {}), ...(rate !== '' ? { speed: Number(rate) } : {}), [kind === 'rewind' ? 'erase' : 'draw']: runs };
    }
  }
  // A line's boxes are one setting: no end candle means no line; the end's point is the pin's unless given.
  else if (field === 'lineTo' || field === 'lineOn') {
    const box = f => el.closest('.ed-cue').querySelector(`[data-field="${f}"]`), to = box('lineTo').value, onRaw = box('lineOn').value;
    if (to === '') delete target.to;
    else target.to = { at: Number(to), ...(onRaw !== '' ? { on: /^\d+(\.\d+)?$/.test(onRaw) ? Number(onRaw) : onRaw } : {}) };
  }
  else if (field === 'headStart' || field === 'headEnd') {
    const heads = { ...target.heads, [field === 'headStart' ? 'start' : 'end']: el.checked };
    // Only what differs from the default, a head at the end alone, is written.
    const written = { ...(heads.start === true ? { start: true } : {}), ...(heads.end === false ? { end: false } : {}) };
    if (Object.keys(written).length) target.heads = written; else delete target.heads;
  }
  // A scene's two boxes are one setting: no dataset chosen means no scene; the tour's own dataset is not written.
  else if (field.startsWith('scene')) {
    const box = f => el.closest('.ed-grid').querySelector(`[data-field="${f}"]`), dataset = box('sceneDataset').value, time = box('sceneTime').value;
    if (!dataset) delete target.scene;
    else target.scene = { ...(dataset !== (def.dataset ?? datasetList?.[0]?.id) ? { dataset } : {}), ...(time ? { time } : {}) };
  }
  // Where a text comes from: written here, or a definition. Cited, it has no texts of its own, and a direction when the
  // definition has slots; written here again, it starts from what the definition read.
  else if (field === 'define') {
    if (value === '') {
      if (target.define) target.texts = { education: defineText(target.define, target.direction) };
      delete target.define;
      delete target.direction;
    } else {
      target.define = value;
      delete target.texts;
      if (needsDirection(value)) target.direction ??= 'Up'; else delete target.direction;
    }
  }
  // A text for one level of detail; an empty box leaves that level out.
  else if (field.startsWith('texts.')) {
    const level = field.slice('texts.'.length);
    target.texts ??= {};
    if (value === '') delete target.texts[level]; else target.texts[level] = value;
  }
  // Silent is the one tick box: ticked, the text has "voice": false, and otherwise it has no "voice" at all.
  else if (el.type === 'checkbox') { if (el.checked) target[field] = false; else delete target[field]; }
  else if (field === 'view0' || field === 'view1') {
    // The two boxes of a view are one setting: with both empty it is left out, and with one empty that end is as before.
    const read = k => { const v = el.closest('.ed-grid').querySelector(`[data-field="view${k}"]`).value; return v === '' ? null : Number(v); };
    const first = read(0), last = read(1), before = scope === 'start' ? DEFAULT_VIEW : tour.index ? tour.sections[tour.index - 1].view : tour.startView;
    if (first == null && last == null) delete target.view; else target.view = [first ?? before[0], last ?? before[1]];
  }
  // An empty box leaves the setting out, so it is as before.
  else if (value === '' || Number.isNaN(value)) delete target[field]; else target[field] = value;
  if (field.startsWith('texts.')) cueEl.querySelector('[data-field="hold"]').placeholder = readingSeconds(textAt(target.texts, detailOf('Tour')) ?? '').toFixed(1);
  applyTour(scope === 'cue' ? { cue: writtenCount(tour.index) + j, render: el.hasAttribute('data-render') } : { end: field === 'until', start: field === 'from', render: el.hasAttribute('data-render') });
  // Where the change redrew the editor, the box that was being used is found again: a text's settings only show once
  // the text has the focus.
  if (!el.isConnected && cueEl) focusCue(j);
  if (!el.isConnected) document.querySelector(`#tour-editor ${cueEl ? `.ed-cue[data-cue="${j}"] ` : ''}[data-scope="${scope}"][data-field="${field}"]`)?.focus();
}

// The number an empty box stands for: the setting as it is with nothing written, as its placeholder says.
function inheritedOf(el) {
  const { scope, field } = el.dataset, s = tourSection(), cueEl = el.closest('.ed-cue'), cue = cueEl && s?.cues[Number(cueEl.dataset.cue)];
  const view = field === 'view0' ? 0 : field === 'view1' ? 1 : null;
  if (scope === 'start') return view != null ? DEFAULT_VIEW[view] : field === 'speed' ? 4 : null;
  if (scope === 'cue') return field === 'at' ? cue?.at ?? s?.from : field === 'lineTo' ? cue?.at ?? s?.from : field === 'hold' ? cue?.hold : null;
  if (field === 'journeySpeed' || field === 'journeyTo') return field === 'journeySpeed' ? JOURNEY_SPEED : s?.from;
  return scope !== 'section' ? null : view != null ? s?.view[view] : ['from', 'until', 'speed'].includes(field) ? s?.[field] : null;
}

// An empty number box steps from the number it stands for, not from 0: it is given that number just before the arrow keys
// or the box's own arrows step it, and emptied again when no step follows.
function stepFromInherited(el) {
  if (el?.type !== 'number' || el.value !== '') return;
  const base = inheritedOf(el);
  if (!Number.isFinite(base)) return;
  const seeded = el.value = String(Math.round(base * 10) / 10);
  setTimeout(() => { if (el.value === seeded) el.value = ''; });
}

// The layer buttons, while the editor is open, set the layers of the section the tour is at: written as what the section
// adds to the layers before it and what it takes away.
function recordTourLayers() {
  const s = tour?.sections[tour.index];
  if (!s || tour.page !== 'Tour' || !editorOn() || tour.picking) return;
  const wanted = tourLayers.filter(id => id !== 'replay'), before = tour.index ? tour.sections[tour.index - 1].layers : tour.startLayers;
  if (wanted.length === s.layers.length && wanted.every(id => s.layers.includes(id))) return;
  const d = tour.def.sections[tour.index], name = id => LAYER_NAMES[id] ?? id;
  const add = wanted.filter(id => !before.includes(id)).map(name), remove = before.filter(id => !wanted.includes(id)).map(name);
  rememberTour(`layers|${tour.index}`);
  delete d.layers;
  if (add.length) d.add = add; else delete d.add;
  if (remove.length) d.remove = remove; else delete d.remove;
  applyTour({ render: true });
}

// Picking a candle on the chart for a section's first or last candle or a text's candle, in place of typing its number.
function pickFromChart(field, cue = null) {
  pauseTour();
  const same = tour.picking?.field === field && tour.picking.cue === cue;
  tour.picking = same ? null : { field, cue };
  seekTour(tour.index, { t: cursorOf(tour.ex), shown: tour.shown.length });
  updateEditorStatus();
}

function pickCandle(i) {
  const { field, cue } = tour.picking, d = tour.def.sections[tour.index];
  tour.picking = null;
  rememberTour();
  if (field === 'at') d.cues[cue].at = i; else d[field] = i;
  applyTour(field === 'at' ? { render: true, cue: writtenCount(tour.index) + cue } : { render: true, end: field === 'until', start: field === 'from' });
  if (cue != null) focusCue(cue);
}

// A section's own text j, by its place among the section's own texts.
const focusCue = j => document.querySelector(`#tour-editor .ed-cue[data-cue="${j}"]`)?.querySelector('textarea')?.focus();

// The candle under the pointer, by its number in the tour.
function candleAt(el, e) {
  const p = plotPoint(el, e), view = views.get(el.dataset.id);
  if (!p?.onPlot || !view) return null;
  const [from, to] = el._fullLayout.xaxis.range.map(axisTime), at = from + (to - from) * p.x / p.w;
  return view.from + view.t.reduce((best, v, i) => Math.abs(v - at) < Math.abs(view.t[best] - at) ? i : best, 0);
}

// Save writes what has changed: tour.json, definitions.json, or both, each refused when its file has changed on disk since
// the page loaded it.
async function saveTour() {
  if (!tourDirty() || tour?.page !== 'Tour') return;
  const notes = [], put = (url, header, base, body) => fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json', [header]: base }, body }).catch(() => null);
  const failed = (response, name) => response?.status === 404 || response?.status === 405
    ? 'Not saved: the local server was started before the editor could save this. Restart ./build-site.ps1 -Serve.'
    : response?.status === 409 ? `Not saved: ${name} has changed on disk since this page loaded it. Revert loads the newer version; Undo then brings back what was here.`
    : `Not saved: the local server did not take ${name}.`;
  if (JSON.stringify(tour.def) !== tour.saved) {
    const def = JSON.stringify(tour.def), body = formatTour(tour.def), response = await put('api/tour', 'X-Tour-Base', tour.base, body);
    if (response?.ok) Object.assign(tour, { saved: def, base: textKey(body) }); else notes.push(failed(response, 'tour.json'));
  }
  const definitions = await saveDefinitions();
  if (definitions) notes.push(definitions);
  // The server reads the changed texts aloud on saving; the page follows that and loads the clips when it is done.
  if (!notes.length) { tourExport = null; refreshTourExport(); }
  tour.note = notes.join(' ');
  updateEditorStatus();
}

// definitions.json saved when it has changed, refused when the file has changed on disk since the page loaded it; what
// went wrong, or nothing.
async function saveDefinitions() {
  if (!definitionsDirty()) return '';
  const saved = JSON.stringify(DEFINITIONS), body = formatDefinitions(DEFINITIONS);
  const response = await fetch('api/definitions', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Definitions-Base': definitionsBase }, body }).catch(() => null);
  if (response?.ok) { definitionsSaved = saved; definitionsBase = textKey(body); return ''; }
  return response?.status === 409 ? 'Not saved: definitions.json has changed on disk since this page loaded it.'
    : response?.status === 404 || response?.status === 405 ? 'Not saved: the local server was started before the editor could save this. Restart ./build-site.ps1 -Serve.'
    : 'Not saved: the local server did not take definitions.json.';
}

async function revertTour() {
  const file = await readTourFile().catch(() => null);
  if (!file) { tour.note = 'tour.json could not be loaded.'; return updateEditorStatus(); }
  rememberTour();
  Object.assign(tour, { def: file.def, base: file.base, saved: JSON.stringify(file.def) });
  await loadDefinitions();
  applyTour({ render: true, start: true });
}

function tourAction(action, el) {
  const def = tour.def, i = tour.index, sections = def.sections ??= [], d = sections[i];
  const cueEl = el.closest('.ed-cue'), j = cueEl ? Number(cueEl.dataset.cue) : null;
  // Swaps two neighbours of a list, when both are there.
  const swap = (list, a, b) => b >= 0 && b < list.length && ([list[a], list[b]] = [list[b], list[a]]);
  switch (action) {
    case 'go': {
      const to = Number(el.dataset.section), here = to === tour.index;
      editorFolded = false;
      if (here) return renderContents();
      pauseTour();
      return enterSection(to);
    }
    case 'section-fold':
      editorFolded = true;
      return renderContents();
    case 'play-here': pauseTour(); enterSection(i, { journey: true }); return playTour();
    case 'save': return tour.page === 'Tour' ? saveTour() : saveAnalysisEdits();
    case 'revert': return tour.page === 'Tour' ? revertTour() : revertAnalysisEdits();
    case 'written-promote': {
      // A change to a written definition becomes the definition's wording, wherever it is told, and the change goes.
      rememberTour();
      const key = el.dataset.key;
      DEFINITIONS = { ...DEFINITIONS, [key]: d.edits[cueEl.dataset.id].education };
      delete d.edits[cueEl.dataset.id].education;
      if (!Object.keys(d.edits[cueEl.dataset.id]).length) delete d.edits[cueEl.dataset.id];
      if (!Object.keys(d.edits).length) delete d.edits;
      return applyTour({ render: true, cue: Number(cueEl.dataset.written) });
    }
    case 'written-default':
      rememberTour();
      if (d.edits) delete d.edits[cueEl.dataset.id];
      if (d.edits && !Object.keys(d.edits).length) delete d.edits;
      return applyTour({ render: true, cue: Number(cueEl.dataset.written) });
    case 'undo': {
      const before = tour.history.pop();
      if (!before) return;
      ({ def: tour.def, definitions: DEFINITIONS } = JSON.parse(before));
      tour.lastEdit = null;
      return applyTour({ render: true });
    }
    case 'pick': return pickFromChart(el.dataset.pick, j);
    case 'tour-card':
      state.tourCardOpen = !state.tourCardOpen;
      save(state);
      return renderTourEditor('tour');
    case 'view-chart': {
      // The candles across the chart as it has been zoomed or panned to become the section's view.
      const ex = tour.ex, chart = document.querySelector('#main .chart'), view = views.get(ex.id);
      if (!d || !view || !chart?._fullLayout) return;
      const [from, to] = chart._fullLayout.xaxis.range.map(axisTime);
      const first = indexAtOrAfter(ex, from + view.candle / 2), last = Math.max(first + 1, indexAtOrBefore(ex, to - view.candle / 2));
      rememberTour();
      d.view = [first, last];
      zooms.delete(ex.id);
      return applyTour({ render: true });
    }
    case 'add-section':
      rememberTour();
      sections.splice(sections.length ? i + 1 : 0, 0, { cues: [{ texts: {} }] });
      tour.index = sections.length === 1 ? 0 : i + 1;
      applyTour({ render: true, start: true });
      return document.querySelector('#tour-editor .ed-cue textarea')?.focus();
    case 'section-delete':
      rememberTour();
      sections.splice(i, 1);
      tour.index = Math.max(0, Math.min(i, sections.length - 1));
      return applyTour({ render: true, start: true });
    case 'section-up': case 'section-down': {
      const to = i + (action === 'section-up' ? -1 : 1);
      if (to < 0 || to >= sections.length) return;
      rememberTour();
      swap(sections, i, to);
      tour.index = to;
      return applyTour({ render: true, start: true });
    }
    case 'add-cue':
      rememberTour();
      (d.cues ??= []).push({ texts: {} });
      applyTour({ render: true, cue: writtenCount(i) + d.cues.length - 1 });
      return focusCue(d.cues.length - 1);
    case 'section-copy': {
      // The copy carries on the chapter, rather than starting another of the same name.
      rememberTour();
      const { chapter, ...copy } = JSON.parse(JSON.stringify(d));
      sections.splice(i + 1, 0, copy);
      tour.index = i + 1;
      return applyTour({ render: true, start: true });
    }
    case 'cue-split': {
      // The text and those after it become a section of their own, straight after this one. It has the same layers, view
      // and speed until they are changed. A text at a candle inside the section's run splits the run there as well.
      rememberTour();
      const next = { cues: d.cues.splice(j) }, at = next.cues[0].at, s = tourSection();
      if (at != null && at > s.from && at < s.until) { next.until = d.until; d.until = at; }
      sections.splice(i + 1, 0, next);
      tour.index = i + 1;
      applyTour({ render: true, start: true });
      return focusCue(0);
    }
    case 'cue-copy':
      rememberTour();
      d.cues.splice(j + 1, 0, JSON.parse(JSON.stringify(d.cues[j])));
      applyTour({ render: true, cue: writtenCount(i) + j + 1 });
      return focusCue(j + 1);
    case 'cue-delete':
      rememberTour();
      d.cues.splice(j, 1);
      return applyTour({ render: true });
    case 'cue-up': case 'cue-down': {
      const to = j + (action === 'cue-up' ? -1 : 1);
      if (to < 0 || to >= d.cues.length) return;
      rememberTour();
      swap(d.cues, j, to);
      applyTour({ render: true, cue: writtenCount(i) + to });
      return focusCue(to);
    }
  }
}

const swingKey = s => `swing|${s.level}|${s.direction}|${s.start}`;
const swingId = s => `${swingKey(s)}|${s.break}|${s.parent ?? ''}`;

function swingTreeTable(ex) {
  const detected = new Set(ex.detected.map(swingId));
  const expected = new Set(ex.expected.map(swingId));
  const rows = [
    ...ex.detected.map(s => ({ s, status: expected.has(swingId(s)) ? 'matched' : 'extra' })),
    ...ex.expected.filter(s => !detected.has(swingId(s))).map(s => ({ s, status: 'missing' })),
  ];
  const interims = s => ex.detected.filter(x => x.level === s.level + 1 && x.parent === s.start).length;
  return `<details open><summary>Expected swing tree (${ex.expected.length}) · asserted by the example test · click a row to pick out a swing and its interims</summary>
    <table><tr><th>Swing</th><th>Start (UTC)</th><th>Break (UTC)</th><th>Interims</th><th>Status</th></tr>
    ${rows.map(({ s, status }) => `<tr class="pick" tabindex="0" data-ex="${esc(ex.id)}" data-key="${esc(swingKey(s))}">
      <td style="padding-left:${(s.level - ex.level) * 22}px">${s.level > ex.level ? '└ ' : ''}${s.direction === 'Up' ? 'Upswing ↑' : 'Downswing ↓'} <span class="id">level ${s.level}</span></td>
      <td>${esc(fmtTime(s.start))}</td><td>${esc(fmtTime(s.break))}</td><td>${interims(s) || ''}</td>
      <td class="${status === 'matched' ? '' : 'miss'}">${status}</td></tr>`).join('')}
    </table></details>`;
}

// Strategies: strategies.json edited on the Strategies page and saved through the local server as the tour is, each one run
// over a whole dataset there (POST api/backtest), which keeps every trade in artifacts/backtests. A strategy is made of parts,
// each of a type; STRATEGY_TYPES says what each type's fields are and how it reads, so a new type is added there and in
// the server's Strategy.cs. The entry condition can be a chain: the steps of "after", in order, then "entry", each looked
// for once the one before it is met, within its "within" candles of it when that is set.
const STRATEGY_TYPES = {
  entry: {
    SuccessiveCandles: {
      label: 'Successive Candles',
      defaults: { colour: 'Green', length: 4 },
      fields: [{ key: 'colour', label: 'Colour', options: ['Green', 'Red'] }, { key: 'length', label: 'Length', number: true, min: 1, step: 1 }],
      says: e => `${e.length} Successive ${e.colour} Candles`,
    },
  },
  target: {
    AverageCandle: {
      label: 'Average candle',
      defaults: { percent: 100, candles: 4, measure: 'Body' },
      fields: [{ key: 'percent', label: '%', number: true, min: 0, step: 5 }, { key: 'candles', label: 'Of the last', number: true, min: 1, step: 1 },
        { key: 'measure', label: 'Measured by', options: ['Body', 'Range'] }],
      says: t => `${t.percent}% of the average ${t.measure === 'Range' ? 'range (high to low)' : 'body (open to close)'} of the last ${t.candles} candles`,
    },
    Percent: {
      label: 'Percent of entry',
      defaults: { percent: 2 },
      fields: [{ key: 'percent', label: '%', number: true, min: 0, step: 0.5 }],
      says: t => `${t.percent}% of the entry price`,
    },
    // A level of its own rather than a distance from the entry: no trade where it is not beyond the entry on its side.
    HighestWick: {
      label: 'Highest wick',
      level: true,
      defaults: { candles: 10 },
      fields: [{ key: 'candles', label: 'Of the last', number: true, min: 1, step: 1 }],
      says: t => `the highest high of the last ${t.candles} candles`,
    },
    LowestWick: {
      label: 'Lowest wick',
      level: true,
      defaults: { candles: 10 },
      fields: [{ key: 'candles', label: 'Of the last', number: true, min: 1, step: 1 }],
      says: t => `the lowest low of the last ${t.candles} candles`,
    },
    // Set from the Take Profit, so for the Stop Loss alone: the Take Profit is a target of so many R, and the Stop Loss is 1R,
    // the reward divided by that, on the other side of the entry.
    RiskRatio: {
      label: 'For a target in R',
      only: 'stopLoss',
      defaults: { ratio: 1 },
      fields: [{ key: 'ratio', label: 'Target (R)', number: true, min: 0, step: 0.5 }],
      says: t => `${Number(t.ratio) === 1 ? 'as far as the Take Profit' : `the Take Profit's distance divided by ${t.ratio}`} (a ${t.ratio}R target)`,
    },
  },
};
const STRATEGY_PARTS = [{ key: 'entry', title: 'Entry', kind: 'entry' }, { key: 'takeProfit', title: 'Take Profit', kind: 'target' }, { key: 'stopLoss', title: 'Stop Loss', kind: 'target' }];
const TRADE_SHOWN = 1000;
let strategies = null;

const strategyKey = book => JSON.stringify(book);
const strategiesDirty = () => !!strategies && strategyKey(strategies.book) !== strategies.saved;
// A value on one line, as strategies.json keeps each part of a strategy: { "a": 1 } and [ { … }, { … } ].
const inlineJson = v => Array.isArray(v) ? (v.length ? `[ ${v.map(inlineJson).join(', ')} ]` : '[]')
  : v && typeof v === 'object' ? `{ ${Object.entries(v).map(([a, b]) => `${JSON.stringify(a)}: ${inlineJson(b)}`).join(', ')} }` : JSON.stringify(v);
// The order a strategy's keys are saved in: the steps of a chain before its entry; any others after these.
const STRATEGY_KEYS = ['id', 'name', 'direction', 'after', 'entry', 'takeProfit', 'stopLoss', 'onePositionAtATime', 'countFees', 'feePercent', 'countSlippage', 'slippagePercent', 'vary'];
const keyOrder = k => (i => i < 0 ? STRATEGY_KEYS.length : i)(STRATEGY_KEYS.indexOf(k));
const formatStrategies = book => `{\n${book.defaults ? `  "defaults": ${inlineJson(book.defaults)},\n` : ''}  "strategies": [\n${book.strategies.map(s => `    {\n${Object.entries(s).sort(([a], [b]) => keyOrder(a) - keyOrder(b)).map(([k, v]) =>
  `      ${JSON.stringify(k)}: ${inlineJson(v)}`).join(',\n')}\n    }`).join(',\n')}\n  ]\n}\n`;
window.addEventListener('beforeunload', e => { if (strategiesDirty()) e.preventDefault(); });

// strategies.json is kept locally, not in git; without one, the page starts from strategies.example.json, and the first
// save writes strategies.json (base '' as there is no file yet to have changed).
async function loadStrategies() {
  const read = async name => { const r = await fetch(name, { cache: 'no-cache' }).catch(() => null); return r?.ok ? r.text() : ''; };
  const own = await read('strategies.json'), text = own || await read('strategies.example.json');
  const base = own ? textKey(own) : '';
  const book = text ? JSON.parse(text) : { strategies: [] };
  book.strategies ??= [];
  // The costs a strategy is given when it has none of its own, as one kept before strategies had costs.
  book.defaults ??= { ...FIRST_DEFAULT_COSTS };
  book.strategies.forEach(s => { s.feePercent ??= book.defaults.feePercent; s.slippagePercent ??= book.defaults.slippagePercent; });
  strategies = { book, base, saved: strategyKey(book), selected: strategies?.selected ?? book.strategies[0]?.id, note: '', runs: strategies?.runs ?? new Map(), running: false,
    sweeps: strategies?.sweeps, markets: strategies?.markets, included: strategies?.included, cell: strategies?.cell ?? new Map() };
}

// The page's address names the strategy shown, the periods ticked and the one whose results are shown,
// #Strategies?id=green-run-4&cells=btc-coinbase-1h:2021,btc-coinbase-1h:2022&cell=btc-coinbase-1h:2021, so a reload or a
// link opens the same. It is kept up to date in place as they change, without a page of history each.
function strategiesHash() {
  const q = new URLSearchParams(), id = strategies?.selected ?? strategies?.missing, cell = strategies?.selected && strategies.cell?.get(strategies.selected);
  if (id) q.set('id', id);
  if (strategies?.included?.size) q.set('cells', [...strategies.included].join(','));
  if (cell) q.set('cell', cell);
  return `#Strategies${q.size ? `?${q}` : ''}`;
}

// ---- Markets and periods -------------------------------------------------------------------------------------------
// The markets strategies are tested on (GET api/markets, see Markets), each with its years: their candles, their role
// (search, test or locked) and how often a Test year has been looked at. A cell is a market's year, keyed "market:year";
// a strategy's runs are kept by cell, and the cells ticked are run together.
const cellKey = (market, year) => `${market}:${year}`;
const cellOf = key => { const [market, year] = String(key).split(':'); return { market, year: Number(year) }; };
const cellWindow = key => { const { year } = cellOf(key); return { from: `${year}-01-01T00:00:00Z`, to: `${year + 1}-01-01T00:00:00Z` }; };
const marketOf = id => strategies.markets?.find(m => m.id === id);
const yearOf = key => { const { market, year } = cellOf(key); return marketOf(market)?.years.find(y => y.year === year); };
const cellName = key => { const { market, year } = cellOf(key); return `${marketOf(market)?.name ?? market}, ${year}`; };
const runnable = key => yearOf(key) && yearOf(key).role !== 'locked';
const ROLE_NAMES = { search: 'Search', test: 'Test', locked: 'Locked' };

// A strategy's runs, by cell.
function strategyCells(s) {
  if (!strategies.runs.has(s.id)) strategies.runs.set(s.id, new Map());
  return strategies.runs.get(s.id);
}

const fetchMarkets = () => fetch('api/markets', { cache: 'no-cache' }).then(r => r.ok ? r.json() : []).catch(() => []);

async function loadMarkets() {
  strategies.markets = await fetchMarkets();
}

function syncStrategiesHash() {
  if (currentPage === 'Strategies' && location.hash !== strategiesHash()) history.replaceState(null, '', strategiesHash());
}

// The steps of a strategy's entry condition in order: those of "after", then "entry".
const strategySteps = s => [...(s.after ?? []), s.entry];

// A strategy's entry condition in words: "3 Successive Red Candles, then 4 Successive Green Candles within 10 candles".
function conditionSays(s) {
  const step = e => STRATEGY_TYPES.entry[e?.type]?.says(e) ?? `an unknown entry type "${e?.type}"`;
  return strategySteps(s).map((e, k) => k ? `then ${step(e)}${e.within ? ` within ${e.within} candles` : ''}` : step(e)).join(', ');
}

// A strategy in words, as the trades will be read.
function strategySays(s) {
  const part = (kind, p) => STRATEGY_TYPES[kind][p?.type]?.says(p) ?? `an unknown ${kind} type "${p?.type}"`;
  const long = s.direction !== 'Short';
  // A level is where the target is; a distance is how far it is from the entry, and on which side.
  const where = (t, side) => STRATEGY_TYPES.target[t?.type]?.level ? `at ${part('target', t)}, when that is ${side} the entry` : `${part('target', t)} ${side} the entry`;
  const fee = s.countFees !== false ? s.feePercent || 0 : 0, slip = s.countSlippage !== false ? s.slippagePercent || 0 : 0;
  const costs = fee && slip ? ` Costs: ${fee}% fee a side and ${slip}% slippage on the entry and a Stop Loss.`
    : fee ? ` Costs: ${fee}% fee a side; no slippage is counted.`
    : slip ? ` Costs: ${slip}% slippage on the entry and a Stop Loss; no fees are counted.` : ' No fees or slippage are counted.';
  return `${long ? 'Buy' : 'Sell'} at the close of the candle that makes ${conditionSays(s)}. Take Profit ${where(s.takeProfit, long ? 'above' : 'below')}; Stop Loss ${where(s.stopLoss, long ? 'below' : 'above')}.${s.onePositionAtATime ? ' One trade at a time.' : ''}${costs}`;
}

// The default costs strategies.json starts with when it has none: about an exchange's taker fee and a liquid market's
// slippage. Set as default on a strategy changes them, kept in strategies.json's "defaults".
const FIRST_DEFAULT_COSTS = { feePercent: 0.1, slippagePercent: 0.05 };
const defaultCosts = () => ({ feePercent: strategies.book.defaults.feePercent, slippagePercent: strategies.book.defaults.slippagePercent });

function newStrategyId(name) {
  const base = String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'strategy';
  const ids = new Set(strategies.book.strategies.map(s => s.id));
  let id = base;
  for (let n = 2; ids.has(id); n++) id = `${base}-${n}`;
  return id;
}

async function renderStrategiesPage(asked = new URLSearchParams()) {
  const main = document.getElementById('main');
  currentPage = 'Strategies';
  const head = `<section class="term-head"><h2>Strategies</h2>
    <p>Build a strategy from an entry, a take profit and a stop loss, then run it on years of markets for every trade it would have made.</p>
    <p class="remarks">A trade is entered at the close of the candle that calls for it and watched from the next candle: a candle that opens
    beyond a target fills at its open, otherwise one whose high or low reaches it fills at the target. A candle that reaches both counts as
    the Stop Loss. Profits are per unit traded, after the strategy's fees and slippage. Each run is saved, with all its trades, to artifacts/backtests.</p></section>`;
  if (!serverOn) {
    main.innerHTML = head + `<div class="empty" data-server-check>Checking for the local server…</div>`;
    return checkLocalServer();
  }
  if (!strategies) {
    main.innerHTML = head + '<div class="empty">Loading strategies…</div>';
    try { await loadStrategies(); } catch (e) { main.innerHTML = head + `<div class="empty">strategies.json could not be read: ${esc(e.message)}.</div>`; return; }
  }
  await loadDatasets();
  if (!strategies.markets?.length) await loadMarkets();
  if (currentPage !== 'Strategies') return;
  // An id the address asks for that strategies.json does not have is said so, with none shown, rather than another put in its place.
  const id = asked.get('id');
  if (id) {
    const found = strategies.book.strategies.some(s => s.id === id);
    [strategies.selected, strategies.missing] = found ? [id, null] : [null, id];
  }
  // The periods ticked: the address's, else those ticked before, else the first market's Search years.
  const cells = asked.get('cells')?.split(',').filter(k => yearOf(k));
  const first = strategies.markets?.[0];
  strategies.included = new Set(cells?.length ? cells : strategies.included?.size ? strategies.included
    : (first?.years ?? []).filter(y => y.role === 'search').map(y => cellKey(first.id, y.year)));
  if (asked.get('cell') && yearOf(asked.get('cell')) && strategies.selected) strategies.cell.set(strategies.selected, asked.get('cell'));
  main.innerHTML = head + `<div class="strat"><nav class="strat-list" aria-label="Strategies"></nav><div class="strat-body"></div></div>`;
  renderStrategyList();
  renderStrategy();
}

function renderStrategyList() {
  const box = document.querySelector('.strat-list');
  if (!box) return;
  box.innerHTML = strategies.book.strategies.map(s => `<button type="button" data-pick="${esc(s.id)}" aria-current="${s.id === strategies.selected}">${esc(s.name || s.id)}</button>`).join('')
    + `<button type="button" class="add" data-add>+ New strategy</button>`;
  box.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => { strategies.selected = b.dataset.pick; renderStrategyList(); renderStrategy(); }));
  box.querySelector('[data-add]').addEventListener('click', () => {
    const name = 'New strategy', s = { id: newStrategyId(name), name, direction: 'Long', entry: { type: 'SuccessiveCandles', ...STRATEGY_TYPES.entry.SuccessiveCandles.defaults },
      takeProfit: { type: 'AverageCandle', ...STRATEGY_TYPES.target.AverageCandle.defaults }, stopLoss: { type: 'AverageCandle', ...STRATEGY_TYPES.target.AverageCandle.defaults }, onePositionAtATime: true,
      ...defaultCosts() };
    strategies.book.strategies.push(s);
    strategies.selected = s.id;
    renderStrategyList();
    renderStrategy();
    document.querySelector('.strat-body [data-field="name"]')?.select();
  });
}

const selectedStrategy = () => strategies.book.strategies.find(s => s.id === strategies.selected);

// A number's variations in a sweep, beside it: up To, in steps of Step, from the number's own value. Both blank, it is not
// varied. They are kept in the strategy's "vary", by the number's path, as the server's StrategySweep reads them.
function varyInputs(s, path, step, off = false) {
  const v = s.vary?.[path] ?? {}, dis = off ? 'disabled' : '';
  const tip = 'title="Sweeps this from the value beside it up to To in steps of Step. Leave both blank for no variations."';
  return `<label class="strat-vary" ${tip}>to<input type="number" data-vary="${path}" data-vary-key="to" step="${step}" value="${esc(v.to ?? '')}" placeholder="–" ${dis}></label>
    <label class="strat-vary" ${tip}>step<input type="number" data-vary="${path}" data-vary-key="step" min="0" step="${step}" value="${esc(v.step ?? '')}" placeholder="–" ${dis}></label>`;
}

function setVary(s, path, to, step) {
  if (to === undefined && step === undefined) delete s.vary?.[path];
  else (s.vary ??= {})[path] = { ...(to !== undefined ? { to } : {}), ...(step !== undefined ? { step } : {}) };
  if (s.vary && !Object.keys(s.vary).length) delete s.vary;
}

// Beside a strategy's costs: Clear (none), Defaults (the book's) and Set as default (the book's become these), each
// unavailable when it would change nothing, with the defaults as they are. Set as default is saved with Save.
function costButtons(s) {
  const d = strategies.book.defaults, fee = s.feePercent ?? 0, slip = s.slippagePercent ?? 0;
  const isDefault = fee === d.feePercent && slip === d.slippagePercent;
  return `<div class="strat-costs">
    <button type="button" data-costs="clear" ${!fee && !slip ? 'disabled' : ''} title="No fees or slippage for this strategy">Clear</button>
    <button type="button" data-costs="defaults" ${isDefault ? 'disabled' : ''} title="This strategy takes the default costs">Defaults</button>
    <button type="button" data-costs="set" ${isDefault ? 'disabled' : ''} title="This strategy's costs become the defaults, for new strategies and those without costs of their own">Set as default</button>
    <span class="strat-note">Default: ${d.feePercent}% fee a side, ${d.slippagePercent}% slippage.</span></div>`;
}

function wireCostButtons(box, s) {
  box.querySelectorAll('[data-costs]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.costs === 'clear') Object.assign(s, { feePercent: 0, slippagePercent: 0 });
    else if (b.dataset.costs === 'defaults') Object.assign(s, defaultCosts());
    else strategies.book.defaults = { feePercent: s.feePercent ?? 0, slippagePercent: s.slippagePercent ?? 0 };
    renderStrategy();
    updateStrategyStatus();
    if (b.dataset.costs !== 'set') rerunForCosts(s);
  }));
}

// Drops the variations of the numbers whose paths pass the test, as when the part they are in changes type or the steps move.
function dropVary(s, test) {
  Object.keys(s.vary ?? {}).filter(test).forEach(k => delete s.vary[k]);
  if (s.vary && !Object.keys(s.vary).length) delete s.vary;
}

// A varied number as the editor names it: "Stop Loss Target (R)", "Step 2 Length".
function varyLabel(s, path) {
  if (path === 'feePercent') return 'Fee %';
  if (path === 'slippagePercent') return 'Slippage %';
  const parts = path.split('.'), key = parts.pop(), at = parts.join('.'), p = parts.reduce((o, k) => o?.[k], s);
  const steps = strategySteps(s), k = steps.indexOf(p);
  const part = k >= 0 ? (steps.length > 1 ? `Step ${k + 1}` : 'Entry') : at === 'takeProfit' ? 'Take Profit' : at === 'stopLoss' ? 'Stop Loss' : at;
  const field = key === 'within' ? 'Within' : STRATEGY_TYPES[k >= 0 ? 'entry' : 'target'][p?.type]?.fields?.find(f => f.key === key)?.label ?? key;
  return `${part} ${field}`;
}

// What a sweep of the strategy varies and how many variations that makes, counted as the server's StrategySweep counts them:
// { parts, count }, or { error } when it cannot be run.
const SWEEP_MOST = 1000;
function varyPlan(s) {
  const entries = Object.entries(s.vary ?? {});
  if (!entries.length) return { error: 'Nothing varied: give a number a To and a Step to sweep it.' };
  let count = 1;
  const parts = [];
  for (const [path, r] of entries) {
    const from = path.split('.').reduce((o, k) => o?.[k], s), label = varyLabel(s, path);
    if (r.to === undefined || r.step === undefined) return { error: `${label}: give both a To and a Step, or neither.` };
    if (typeof from !== 'number') return { error: `${label} has no value to vary from.` };
    if (!(r.step > 0)) return { error: `${label}: the Step must be more than 0.` };
    if (r.to < from) return { error: `${label}: To must be at least ${from}.` };
    const n = Math.floor((r.to - from) / r.step + 1e-9) + 1;
    count *= n;
    parts.push(`${label} from ${from} to ${r.to} in steps of ${r.step} (${n})`);
  }
  return count > SWEEP_MOST ? { error: `${count.toLocaleString()} variations: more than the ${SWEEP_MOST.toLocaleString()} a sweep can run.` } : { parts, count };
}

function varySays(s) {
  const plan = varyPlan(s);
  return plan.error ?? `Varies ${plan.parts.join('; ')}: ${plan.count.toLocaleString()} variation${plan.count === 1 ? '' : 's'}.`;
}

function renderStrategy() {
  const box = document.querySelector('.strat-body'), s = selectedStrategy();
  if (!box) return;
  if (s) strategies.missing = null;
  syncStrategiesHash();
  if (!s && strategies.missing) {
    box.innerHTML = `<div class="strat-card">No strategy has the id "${esc(strategies.missing)}" in strategies.json. It may have been renamed or deleted,
      or the link may come from another machine's strategies. Pick one from the list.</div>${strategyActions()}`;
    return wireStrategyActions(box);
  }
  if (!s) { box.innerHTML = `<div class="strat-card">No strategies yet: add one with New strategy.</div>${strategyActions()}`; return wireStrategyActions(box); }
  const input = (path, f, value) => f.options
    ? `<label>${esc(f.label)}<select data-path="${path}">${f.options.map(o => `<option ${o === value ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`
    : `<label>${esc(f.label)}<input type="number" data-path="${path}" data-number min="${f.min}" step="${f.step}" value="${esc(value)}"></label>${varyInputs(s, path, f.step)}`;
  const steps = strategySteps(s);
  const part = ({ key, title, kind }) => {
    const p = key.split('.').reduce((o, k) => o?.[k], s), type = STRATEGY_TYPES[kind][p.type], step = kind === 'entry' ? steps.indexOf(p) : -1;
    return `<fieldset${step >= 0 ? ' class="step"' : ''}><legend>${title}</legend>
      ${step >= 0 && steps.length > 1 ? `<button type="button" class="step-remove" data-step-remove="${step}" title="Take this step out of the chain" aria-label="Remove ${esc(title)}">×</button>` : ''}
      <label>Type<select data-type="${key}" data-kind="${kind}">${Object.entries(STRATEGY_TYPES[kind]).filter(([, t]) => !t.only || t.only === key).map(([id, t]) => `<option value="${id}" ${id === p.type ? 'selected' : ''}>${esc(t.label)}</option>`).join('')}</select></label>
      ${(type?.fields ?? []).map(f => input(`${key}.${f.key}`, f, p[f.key])).join('')}
      ${step > 0 ? `<label title="The most candles from the candle that met the step before to the one that meets this. Blank for no limit.">Within (candles)<input type="number" data-path="${key}.within" data-number data-blank min="1" step="1" value="${esc(p.within ?? '')}" placeholder="no limit"></label>${varyInputs(s, `${key}.within`, 1)}` : ''}</fieldset>`;
  };
  // The steps of the entry condition, top to bottom, with a + above, between and below them to add a step there.
  const stepParts = steps.map((_, k) => ({ key: k < steps.length - 1 ? `after.${k}` : 'entry', title: steps.length > 1 ? `Step ${k + 1}${k === steps.length - 1 ? ': Entry' : ''}` : 'Entry', kind: 'entry' }));
  const addAt = k => `<button type="button" class="step-add" data-step-insert="${k}" title="${k === 0 ? 'Add a step before the first' : k === steps.length ? 'Add a step after the entry: it becomes the entry' : `Add a step between steps ${k} and ${k + 1}`}" aria-label="Add a step here">+</button>`;
  const stepsHtml = stepParts.map((x, k) => addAt(k) + part(x)).join('') + addAt(steps.length);
  box.innerHTML = `<div class="strat-card">
      <div class="strat-fields">
        <label>Name<input type="text" data-field="name" data-path="name" value="${esc(s.name)}"></label>
        <label>Id (names the saved trades)<input type="text" data-path="id" value="${esc(s.id)}"></label>
        <label>Direction<select data-path="direction">${['Long', 'Short'].map(o => `<option ${o === s.direction ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
        <label class="check"><input type="checkbox" data-path="onePositionAtATime" ${s.onePositionAtATime ? 'checked' : ''}>One trade at a time</label>
      </div>
      <div class="strat-fields strat-cost">
        <label class="check" title="Whether the fee is counted; off, the strategy keeps its fee but pays none"><input type="checkbox" data-count="countFees" ${s.countFees !== false ? 'checked' : ''}>Fees</label>
        <label title="The fee on each side of a trade, entry and exit, as a percentage of its value">Fee % a side<input type="number" data-path="feePercent" data-number min="0" step="0.01" value="${esc(s.feePercent ?? 0)}" ${s.countFees !== false ? '' : 'disabled'}></label>${varyInputs(s, 'feePercent', 0.01, s.countFees === false)}
      </div>
      <div class="strat-fields strat-cost">
        <label class="check" title="Whether slippage is counted; off, the strategy keeps its slippage but none is taken"><input type="checkbox" data-count="countSlippage" ${s.countSlippage !== false ? 'checked' : ''}>Slippage</label>
        <label title="How far a market order fills against the trade: the entry and a Stop Loss. A Take Profit is a limit order and does not slip.">Slippage %<input type="number" data-path="slippagePercent" data-number min="0" step="0.01" value="${esc(s.slippagePercent ?? 0)}" ${s.countSlippage !== false ? '' : 'disabled'}></label>${varyInputs(s, 'slippagePercent', 0.01, s.countSlippage === false)}
      </div>
      <div class="strat-fields">${costButtons(s)}</div>
      <div class="strat-fields strat-steps">${stepsHtml}</div>
      <div class="strat-fields">${STRATEGY_PARTS.filter(x => x.kind !== 'entry').map(part).join('')}</div>
      <p class="strat-says">${esc(strategySays(s))}</p>
      <p class="strat-vary-says">${esc(varySays(s))}</p>
      ${strategyActions()}
    </div>
    <div class="strat-card"><h3>Run</h3><div class="strat-run-body"></div></div>`;

  box.querySelectorAll('[data-path]').forEach(el => el.addEventListener(el.dataset.path === 'name' ? 'input' : 'change', () => {
    const path = el.dataset.path.split('.'), key = path.pop(), target = path.reduce((o, k) => o[k], s);
    const value = el.type === 'checkbox' ? el.checked : el.dataset.blank !== undefined && el.value === '' ? undefined : el.dataset.number !== undefined ? Number(el.value) : el.value;
    if (key === 'id') {
      const id = String(value).trim();
      if (!id || strategies.book.strategies.some(x => x !== s && x.id === id)) { el.setCustomValidity('Each strategy needs an id of its own.'); el.reportValidity(); return; }
      el.setCustomValidity('');
      strategies.runs.delete(s.id);
      s.id = strategies.selected = id;
    } else if (value === undefined) delete target[key];
    else target[key] = value;
    box.querySelector('.strat-says').textContent = strategySays(s);
    box.querySelector('.strat-vary-says').textContent = varySays(s);
    if (key === 'name' || key === 'id') renderStrategyList();
    if (key === 'id') syncStrategiesHash();
    updateStrategyStatus();
    // The cost buttons are available by how the costs stand against the defaults.
    if (key === 'feePercent' || key === 'slippagePercent') {
      box.querySelector('.strat-costs').outerHTML = costButtons(s);
      wireCostButtons(box, s);
      rerunForCosts(s);
    }
  }));
  wireCostButtons(box, s);
  // On is the default, so only a cost turned off is kept, as false.
  box.querySelectorAll('[data-count]').forEach(el => el.addEventListener('change', () => {
    if (el.checked) delete s[el.dataset.count];
    else s[el.dataset.count] = false;
    renderStrategy();
    updateStrategyStatus();
    rerunForCosts(s);
  }));
  box.querySelectorAll('[data-vary]').forEach(el => el.addEventListener('change', () => {
    const path = el.dataset.vary, [to, step] = ['to', 'step'].map(k => box.querySelector(`[data-vary="${path}"][data-vary-key="${k}"]`).value);
    setVary(s, path, to === '' ? undefined : Number(to), step === '' ? undefined : Number(step));
    box.querySelector('.strat-vary-says').textContent = varySays(s);
    updateStrategyStatus();
  }));
  box.querySelectorAll('[data-type]').forEach(el => el.addEventListener('change', () => {
    const path = el.dataset.type.split('.'), key = path.pop(), target = path.reduce((o, k) => o[k], s), within = target[key]?.within;
    target[key] = { type: el.value, ...STRATEGY_TYPES[el.dataset.kind][el.value].defaults, ...(within ? { within } : {}) };
    // The new type's numbers are not the old one's, all but Within.
    dropVary(s, k => k.startsWith(`${el.dataset.type}.`) && k !== `${el.dataset.type}.within`);
    renderStrategy();
    updateStrategyStatus();
  }));
  // Steps are added and removed as one list, whose last is the entry: a step added after the entry becomes it, and with the
  // entry removed the step before it does. The first step of a chain has nothing before it to be within.
  const changeSteps = change => {
    const all = [...strategySteps(s)];
    change(all);
    // A step's numbers are varied by its place in the chain, which this changes.
    dropVary(s, k => k.startsWith('after.') || k.startsWith('entry.'));
    s.entry = all.pop();
    if (all.length) s.after = all;
    else delete s.after;
    delete strategySteps(s)[0].within;
    renderStrategy();
    updateStrategyStatus();
  };
  box.querySelectorAll('[data-step-insert]').forEach(b => b.addEventListener('click', () =>
    changeSteps(all => all.splice(Number(b.dataset.stepInsert), 0, { type: 'SuccessiveCandles', ...STRATEGY_TYPES.entry.SuccessiveCandles.defaults }))));
  box.querySelectorAll('[data-step-remove]').forEach(b => b.addEventListener('click', () => changeSteps(all => all.splice(Number(b.dataset.stepRemove), 1))));
  wireStrategyActions(box);
  renderStrategyRun();
}

const strategyActions = () => `<div class="strat-actions">
    <button type="button" data-act="save">Save</button><button type="button" data-act="revert">Revert</button>
    <button type="button" data-act="copy">Duplicate</button><button type="button" data-act="delete">Delete</button>
    <span class="strat-note" role="status"></span></div>`;

function wireStrategyActions(box) {
  box.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => strategyAction(b.dataset.act)));
  updateStrategyStatus();
}

function updateStrategyStatus() {
  const box = document.querySelector('.strat-actions'), s = selectedStrategy();
  if (!box) return;
  const dirty = strategiesDirty();
  box.querySelector('[data-act="save"]').disabled = !dirty;
  box.querySelector('[data-act="revert"]').disabled = !dirty;
  box.querySelector('[data-act="copy"]').disabled = !s;
  box.querySelector('[data-act="delete"]').disabled = !s;
  const note = box.querySelector('.strat-note');
  note.textContent = strategies.note || (dirty ? 'Unsaved changes.' : 'Saved.');
  note.classList.toggle('bad', strategies.note.startsWith('Not saved'));
}

async function strategyAction(act) {
  const list = strategies.book.strategies, s = selectedStrategy();
  strategies.note = '';
  if (act === 'save') {
    const body = formatStrategies(strategies.book);
    const response = await fetch('api/strategies', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Strategies-Base': strategies.base }, body }).catch(() => null);
    if (response?.ok) Object.assign(strategies, { saved: strategyKey(strategies.book), base: textKey(body) });
    else strategies.note = response?.status === 409 ? 'Not saved: strategies.json has changed on disk since this page loaded it. Revert loads the newer version.'
      : response?.status === 404 || response?.status === 405 ? 'Not saved: the local server was started before strategies could be saved. Restart ./build-site.ps1 -Serve.'
      : `Not saved: ${response ? await response.text() : 'the local server did not answer.'}`;
    return updateStrategyStatus();
  }
  if (act === 'revert') {
    if (!confirm('Revert to strategies.json as saved, losing the changes here?')) return;
    await loadStrategies();
    if (!selectedStrategy()) strategies.selected = strategies.book.strategies[0]?.id;
  } else if (act === 'copy' && s) {
    const copy = { ...structuredClone(s), name: `${s.name} (copy)` };
    copy.id = newStrategyId(copy.name);
    list.splice(list.indexOf(s) + 1, 0, copy);
    strategies.selected = copy.id;
  } else if (act === 'delete' && s) {
    if (!confirm(`Delete "${s.name || s.id}"? It goes from strategies.json when saved.`)) return;
    list.splice(list.indexOf(s), 1);
    strategies.selected = list[0]?.id;
  }
  renderStrategyList();
  renderStrategy();
}

function renderStrategyRun() {
  const box = document.querySelector('.strat-run-body'), s = selectedStrategy();
  if (!box || !s) return;
  const key = strategies.cell.get(s.id), run = strategyCells(s).get(key);
  const ticked = [...strategies.included].filter(runnable);
  box.innerHTML = `<div class="strat-run">
      <button type="button" data-run ${strategies.running || !ticked.length ? 'disabled' : ''} title="Runs the strategy as it is here, saved or not, with a random baseline, on each period ticked">${strategies.running ? esc(strategies.running) : `Run on ${ticked.length} period${ticked.length === 1 ? '' : 's'}`}</button>
      <button type="button" data-periods title="Choose the periods to run on, and set each year's role">Periods…</button>
      <button type="button" data-sweep ${strategies.sweeping ? 'disabled' : ''} title="Runs every variation of the numbers given a To and a Step on the period shown, each against its own random baseline; on a Search period only">${strategies.sweeping ? 'Sweeping…' : 'Run sweep'}</button>
    </div>
    ${periodChips(s)}
    <form class="strat-run" data-chart-add><input class="strat-chart-name" data-chart-name aria-label="Name on the charts" value="${esc(chartStrategyName(s))}">
      <button type="submit">Add to strategies on charts</button><span class="strat-note" data-chart-note>Adds the strategy as it is here, under this name, to the Strategies section beside the charts.</span></form>
    ${key ? `<h3 class="strat-cell-head">${esc(cellName(key))}</h3>` : ''}
    <div class="strat-run">
      ${run?.trades ? '<button type="button" data-csv>Download CSV</button>' : ''}
      ${run?.trades && (!run.baseline || run.baseline.error) ? `<button type="button" data-baseline ${run.baselining ? 'disabled' : ''} title="Runs the same exits from random entries, as often as the strategy enters, to see what the entry adds">${run.baselining ? 'Running baseline…' : 'Random baseline'}</button>` : ''}
      <span class="strat-note${run?.error ? ' bad' : ''}">${esc(run?.error ?? (run?.saved ? `Saved to ${run.saved}` : key ? 'Not run on this period yet.' : 'Click a period to see its results.'))}</span>
    </div>
    <div class="strat-sweep"></div>
    ${run?.baseline ? baselineResults(run.baseline) : ''}
    <div class="strat-results">${run?.trades ? strategyResults(run) : ''}</div>`;
  if (run?.baseline?.curve) baselinePlot(box.querySelector('[data-baseline-plot]'), run.baseline, run);
  renderSweep(box.querySelector('.strat-sweep'), strategies.sweeps?.get(s.id));
  box.querySelector('[data-chart-add]').addEventListener('submit', e => {
    e.preventDefault();
    const label = box.querySelector('[data-chart-name]').value.trim() || chartStrategyName(s), like = chartStrategyLike(s, label);
    const c = like ? null : addChartStrategy(s, label);
    box.querySelector('[data-chart-note]').textContent = c ? `Added as "${c.label}": turn it on in the Strategies section on the Chart, Replay, Tour or Analysis page.`
      : strategyRules(like.strategy) === strategyRules(s) ? `Not added: it is on the charts already, as "${like.label}".` : `Not added: "${like.label}" is already the name of another on the charts.`;
  });
  box.querySelector('[data-periods]').addEventListener('click', () => openPeriodsDialog(s));
  box.querySelectorAll('[data-chip-cell]').forEach(el => el.addEventListener('click', () => {
    strategies.cell.set(s.id, el.dataset.chipCell);
    syncStrategiesHash();
    renderStrategyRun();
  }));
  renderPeriodsDialog(s);
  box.querySelector('[data-run]').addEventListener('click', () => runStrategy(s));
  box.querySelector('[data-csv]')?.addEventListener('click', () => downloadTrades(run));
  box.querySelector('[data-baseline]')?.addEventListener('click', () => runBaseline(s, run));
  box.querySelector('[data-sweep]').addEventListener('click', () => runSweep(s));
  // The results' own clicks: Analyse a trade, count a trade in or out of the totals, or the * trades all at once. The
  // results are drawn again in place, the table kept where it was scrolled to.
  const results = box.querySelector('.strat-results');
  results.addEventListener('click', e => {
    const analyse = e.target.closest('[data-trade-row]'), one = e.target.closest('[data-include]'), both = e.target.closest('[data-include-both]'), all = e.target.closest('[data-include-all]');
    const order = e.target.closest('[data-sort]');
    if (order) {
      run.sort = nextTradeSort(run.sort, order.dataset.sort);
      results.innerHTML = strategyResults(run);
      return;
    }
    if (analyse) {
      const t = run.trades.find(x => x.entryIndex === Number(analyse.dataset.tradeRow));
      if (t) window.open(`./${tradeAnalysisHash(run.dataset, run.strategy, t)}`, '_blank');
      return;
    }
    if (!one && !both && !all) return;
    const off = run.leftOut ??= new Set();
    if (one) {
      const i = Number(one.dataset.include);
      if (!off.delete(i)) off.add(i);
    } else if (both) {
      const starred = run.trades.filter(t => t.bothTouched).map(t => t.entryIndex), anyIn = starred.some(i => !off.has(i));
      starred.forEach(i => anyIn ? off.add(i) : off.delete(i));
    } else off.clear();
    const table = results.querySelector('.strat-trades'), top = table?.scrollTop ?? 0, left = table?.scrollLeft ?? 0;
    results.innerHTML = strategyResults(run);
    const again = results.querySelector('.strat-trades');
    if (again) [again.scrollTop, again.scrollLeft] = [top, left];
    if (run.baseline?.curve) baselinePlot(box.querySelector('[data-baseline-plot]'), run.baseline, run);
  });
}

// The totals of a list of trades, as the server's StrategyBacktest.Summarise makes them, for the trades left counted.
function summariseTrades(trades) {
  const closed = trades.filter(t => t.outcome !== 'Open'), wins = closed.filter(t => t.profit > 0), losses = closed.filter(t => t.profit < 0);
  const sum = (list, key) => list.reduce((a, t) => a + t[key], 0), grossLoss = -sum(losses, 'profit');
  return {
    trades: closed.length, won: wins.length, lost: losses.length, stillOpen: trades.length - closed.length,
    winRate: closed.length ? 100 * wins.length / closed.length : 0, totalProfit: sum(closed, 'profit'), totalProfitPercent: sum(closed, 'profitPercent'),
    averageWin: wins.length ? sum(wins, 'profit') / wins.length : 0, averageLoss: losses.length ? sum(losses, 'profit') / losses.length : 0,
    largestWin: wins.length ? Math.max(...wins.map(t => t.profit)) : 0, largestLoss: losses.length ? Math.min(...losses.map(t => t.profit)) : 0,
    profitFactor: grossLoss > 0 ? sum(wins, 'profit') / grossLoss : null, bothTouched: closed.filter(t => t.bothTouched).length,
    fees: sum(closed, 'fees'), slippage: sum(closed, 'slippage'),
  };
}

// A POST to one of the backtest endpoints, its answer as JSON, or { error } saying why there is none.
async function postBacktest(path, body, what) {
  const response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).catch(() => null);
  return response?.ok ? response.json()
    : { error: response?.status === 404 || response?.status === 405 ? `The local server was started before ${what} could be run. Restart ./build-site.ps1 -Serve.`
      : `Not run: ${response ? await response.text() : 'the local server did not answer.'}` };
}

// Runs the strategy as it is here on each period ticked, one after another, each with its random baseline, and shows the
// first of them when none is shown. With again, it is run again for a change of costs: costs do not change which trades
// are made, so a period's trades left out stay left out, and its order stays.
async function runStrategy(s, again = false) {
  const cells = strategyCells(s), keys = [...strategies.included].filter(runnable);
  if (!keys.length) return;
  if (!keys.includes(strategies.cell.get(s.id)) && !cells.has(strategies.cell.get(s.id))) strategies.cell.set(s.id, keys[0]);
  syncStrategiesHash();
  const shown = () => currentPage === 'Strategies' && selectedStrategy() === s;
  for (const [n, key] of keys.entries()) {
    strategies.running = `Running ${n + 1} of ${keys.length}…`;
    const before = cells.get(key), { market } = cellOf(key), window = cellWindow(key);
    cells.set(key, { running: true });
    if (shown()) renderStrategyRun();
    const result = await postBacktest('api/backtest', { dataset: market, ...window, strategy: s }, 'strategies');
    const run = result.error ? result : { saved: result.saved, ...result.run, window };
    if (again && before?.trades && run.trades) Object.assign(run, { leftOut: before.leftOut, sort: before.sort });
    if (run.trades) {
      const b = await postBacktest('api/backtest/baseline', { dataset: market, ...window, strategy: run.strategy }, 'baselines');
      run.baseline = b.error ? b : { saved: b.saved, ...b.baseline };
    }
    cells.set(key, run);
  }
  strategies.running = false;
  // A run on a Test period is counted, so the counts are fetched again.
  await loadMarkets();
  if (shown()) renderStrategyRun();
}

// A strategy's costs changed: a strategy run on any period is run again on those ticked, so their results and graphs have them.
function rerunForCosts(s) {
  if (strategyCells(s).size && !strategies.running) runStrategy(s, true);
}

// The random-entry baseline of a run (POST api/backtest/baseline, see StrategyBaseline) when it has none, as when it
// failed: the run's own strategy, as it was when run, on its period, with its entry swapped for random candles.
async function runBaseline(s, run) {
  run.baselining = true;
  renderStrategyRun();
  const result = await postBacktest('api/backtest/baseline', { dataset: run.dataset, ...run.window, strategy: run.strategy }, 'baselines');
  run.baselining = false;
  run.baseline = result.error ? result : { saved: result.saved, ...result.baseline };
  if (currentPage === 'Strategies' && selectedStrategy() === s && strategyCells(s).get(strategies.cell.get(s.id)) === run) renderStrategyRun();
}

// A period's result for a strategy, as its cell and chip show it: its score (the share of its random runs it beats on
// Total %) · its total after costs · its trades, and a tone by the score.
function cellResult(s, key) {
  const y = yearOf(key), run = strategyCells(s).get(key), total = run?.baseline?.measures?.find(x => x.name === 'Total %');
  const result = y?.role === 'locked' ? 'Kept back'
    : run?.running ? 'Running…'
    : run?.error ? `<span class="bad" title="${esc(run.error)}">Not run</span>`
    : total ? `<b>${Math.round(total.percentile ?? 0)}%</b> · ${fmtPercent(total.strategy)} · ${run.baseline.trades}`
    : run?.trades ? `${fmtPercent(run.summary.totalProfitPercent)} · ${run.summary.trades}` : '';
  const tone = total?.percentile == null ? '' : total.percentile >= 95 ? ' good' : total.percentile >= 90 ? ' fair' : total.percentile <= 5 ? ' poor' : '';
  return { result, tone };
}

// The periods ticked, and any run before, as a chip each under its market: click one for its results below.
function periodChips(s) {
  const cells = strategyCells(s), selected = strategies.cell.get(s.id);
  const rows = (strategies.markets ?? []).map(m => {
    const keys = m.years.map(y => cellKey(m.id, y.year)).filter(k => (strategies.included.has(k) && runnable(k)) || cells.has(k));
    return keys.length ? `<div class="strat-chip-row"><span class="strat-chip-market">${esc(m.name)}</span>${keys.map(k => {
      const { result, tone } = cellResult(s, k);
      return `<button type="button" class="strat-chip role-${yearOf(k)?.role}${tone}${k === selected ? ' sel' : ''}${strategies.included.has(k) ? '' : ' off'}" data-chip-cell="${k}"
        title="${esc(cellName(k))}${strategies.included.has(k) ? '' : ': not ticked, so not run again'}">${cellOf(k).year}${result ? ` · ${result}` : ''}</button>`;
    }).join('')}</div>` : '';
  }).join('');
  return rows ? `<div class="strat-chips">${rows}</div>` : '<p class="remarks strat-note">No periods ticked: choose them with Periods.</p>';
}

// The periods dialog: the grid of market years, to tick the periods to run on and set each year's role.
function openPeriodsDialog(s) {
  let dialog = document.getElementById('strat-periods');
  if (!dialog) {
    dialog = document.createElement('dialog');
    dialog.id = 'strat-periods';
    dialog.setAttribute('aria-label', 'Periods to run on');
    document.body.append(dialog);
    // Closed by Done, or a click outside it on the backdrop.
    dialog.addEventListener('click', e => {
      const r = dialog.getBoundingClientRect(), outside = e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
      if (e.target.closest('[data-periods-close]') || (e.target === dialog && outside)) dialog.close();
    });
  }
  dialog.showModal();
  renderPeriodsDialog(s);
}

function renderPeriodsDialog(s) {
  const dialog = document.getElementById('strat-periods');
  if (!dialog?.open) return;
  dialog.innerHTML = `<h4>Periods: ${esc(s.name || s.id)}</h4>
    <p>Tick the periods to run on. Each run opens its trades in the period, reading the candles before it, and may close them after it.</p>
    ${strategyGrid(s)}
    <div class="sim-foot"><button type="button" class="go" data-periods-close>Done</button></div>`;
  wireStrategyGrid(dialog, s);
}

// The periods to run on: a row a year, a column a market, each cell with a tick to run on it, its role, and the strategy's
// result there once run: its score (how much of its random runs it beats on Total %), its total after costs and its trades.
// A year's role is its market group's, shared by its candle lengths.
function strategyGrid(s) {
  const markets = strategies.markets ?? [];
  if (!markets.length) return '<p class="remarks strat-note bad">The local server has no markets: restart ./build-site.ps1 -Serve.</p>';
  const years = [...new Set(markets.flatMap(m => m.years.map(y => y.year)))].sort((a, b) => a - b);
  const selected = strategies.cell.get(s.id);
  const cell = (m, year) => {
    const y = m.years.find(x => x.year === year);
    if (!y) return '<td class="strat-cell none"></td>';
    const key = cellKey(m.id, year), { result, tone } = cellResult(s, key);
    return `<td class="strat-cell role-${y.role}${tone}${key === selected ? ' sel' : ''}" data-cell="${key}" title="${esc(`${cellName(key)}: ${fmtTime(y.first)} to ${fmtTime(y.last)} UTC, ${y.candles.toLocaleString()} candles`)}">
      <div class="strat-cell-top"><input type="checkbox" data-cell-tick="${key}" ${strategies.included.has(key) && y.role !== 'locked' ? 'checked' : ''} ${y.role === 'locked' ? 'disabled' : ''} aria-label="Run on ${esc(cellName(key))}">
