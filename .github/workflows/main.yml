name: workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Reading the GradientSoftware packages, and publishing this one.
permissions:
  contents: read
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Print .NET SDK version
      run: dotnet --version

    - name: NuGet source for the GradientSoftware packages
      run: dotnet nuget add source --username ${{ github.actor }} --password ${{ github.token }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/garethbirduk/index.json"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --configuration Release --no-build CryptoAnalysis.Test/CryptoAnalysis.Test.csproj --verbosity normal

    - name: Nuget deploy Package
      if: github.ref == 'refs/heads/main'
      run:
        dotnet nuget push ./CryptoAnalysis/bin/Release/**/*.nupkg --source "github" --api-key ${{ github.token }} --skip-duplicate
